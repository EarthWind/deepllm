<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah_2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah_1F2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="ah_EA580C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="62" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#2563EB" font-weight="700" text-anchor="start">方法总览</text><text x="60" y="102" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" fill="#1F2937" font-weight="700" text-anchor="start">方法总览：先在无标注文本上学语言模型，再把整个网络微调到下游任务</text><text x="60" y="134" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6B7280" font-weight="400" text-anchor="start">两个阶段共用同一个 12 层 Transformer 解码器；第 ② 阶段只新增 W<tspan dy="5.0" font-size="12.2">y</tspan><tspan dy="-5.0">​</tspan> 和分隔符嵌入（Section 3）</text><line x1="60" y1="152" x2="1540" y2="152" stroke="#D1D5DB" stroke-width="1.2"/><rect x="60" y="178" width="640" height="500" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><text x="84" y="216" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#2563EB" font-weight="700" text-anchor="start">① 无监督预训练</text><text x="84" y="242" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">目标：最大化语料的对数似然 L<tspan dy="3.9" font-size="9.5">1</tspan><tspan dy="-3.9">​</tspan>（Eq. 1–2）</text><rect x="100" y="266" width="560" height="62" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="380.0" y="292.3" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#1F2937" font-weight="600" text-anchor="middle">BooksCorpus：7,000+ 本未出版图书</text><text x="380.0" y="314.7" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">含大段连续文本，能学到长距离依赖；BPE 词表（40,000 次合并）</text><path d="M380.0,330 L380.0,350" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_2563EB)"/><rect x="126.0" y="354" width="92" height="34" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="172.0" y="376.4" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="500" text-anchor="middle">u<tspan dy="4.2" font-size="10.2">i-k</tspan><tspan dy="-4.2">​</tspan></text><rect x="230.0" y="354" width="92" height="34" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="276.0" y="376.4" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="500" text-anchor="middle">…</text><rect x="334.0" y="354" width="92" height="34" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="380.0" y="376.4" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="500" text-anchor="middle">u<tspan dy="4.2" font-size="10.2">i-2</tspan><tspan dy="-4.2">​</tspan></text><rect x="438.0" y="354" width="92" height="34" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="484.0" y="376.4" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="500" text-anchor="middle">u<tspan dy="4.2" font-size="10.2">i-1</tspan><tspan dy="-4.2">​</tspan></text><rect x="542.0" y="354" width="92" height="34" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/><text x="588.0" y="376.4" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#EA580C" font-weight="500" text-anchor="middle">u<tspan dy="4.2" font-size="10.2">i</tspan><tspan dy="-4.2">​</tspan></text><rect x="120.0" y="348" width="416" height="46" rx="8" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="5 4"/><text x="120.0" y="412" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2563EB" font-weight="600" text-anchor="start">上下文窗口 k 个 token（训练时序列长 512）</text><text x="588.0" y="412" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#EA580C" font-weight="600" text-anchor="middle">要预测的下一个</text><path d="M380.0,422 L380.0,444" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_2563EB)"/><rect x="180" y="446" width="400" height="62" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="380.0" y="472.7" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#2563EB" font-weight="600" text-anchor="middle">12 层 Transformer 解码器  Θ</text><text x="380.0" y="495.4" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" font-weight="400" text-anchor="middle">Masked Self-Attention：只能看左侧 token</text><path d="M380.0,510 L380.0,532" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_2563EB)"/><rect x="180" y="534" width="400" height="44" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="380.0" y="562.1" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#1F2937" font-weight="600" text-anchor="middle">P(u<tspan dy="4.8" font-size="11.6">i</tspan><tspan dy="-4.8">​</tspan> | u<tspan dy="4.8" font-size="11.6">i-k</tspan><tspan dy="-4.8">​</tspan>, …, u<tspan dy="4.8" font-size="11.6">i-1</tspan><tspan dy="-4.8">​</tspan>; Θ)</text><rect x="100" y="596" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="380.0" y="632.8" font-family="DejaVu Serif, Times New Roman, serif" font-size="19" fill="#1F2937" font-weight="600" text-anchor="middle">L<tspan dy="5.3" font-size="12.9">1</tspan><tspan dy="-5.3">​</tspan>(U) = Σ<tspan dy="5.3" font-size="12.9">i</tspan><tspan dy="-5.3">​</tspan> log P(u<tspan dy="5.3" font-size="12.9">i</tspan><tspan dy="-5.3">​</tspan> | u<tspan dy="5.3" font-size="12.9">i-k</tspan><tspan dy="-5.3">​</tspan>, …, u<tspan dy="5.3" font-size="12.9">i-1</tspan><tspan dy="-5.3">​</tspan>; Θ)</text><path d="M720,477 L880,477" fill="none" stroke="#1F2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><text x="800" y="453.8" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#1F2937" font-weight="700" text-anchor="middle">全部参数 Θ</text><text x="800" y="503.6" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="400" text-anchor="middle"><tspan x="800" dy="0.0">作为微调起点</tspan><tspan x="800" dy="18.9">（不冻结）</tspan></text><rect x="900" y="178" width="640" height="500" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/><text x="924" y="216" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#EA580C" font-weight="700" text-anchor="start">② 有监督微调</text><text x="924" y="242" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">目标：L<tspan dy="3.9" font-size="9.5">3</tspan><tspan dy="-3.9">​</tspan> = L<tspan dy="3.9" font-size="9.5">2</tspan><tspan dy="-3.9">​</tspan> + λ·L<tspan dy="3.9" font-size="9.5">1</tspan><tspan dy="-3.9">​</tspan>，λ = 0.5（Eq. 3–5）</text><rect x="940" y="266" width="560" height="62" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.6"/><text x="1220.0" y="292.3" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#1F2937" font-weight="600" text-anchor="middle">有标注数据 C：(x<tspan dy="-6.8" font-size="11.6">1</tspan><tspan dy="6.8">​</tspan>, …, x<tspan dy="-6.8" font-size="11.6">m</tspan><tspan dy="6.8">​</tspan>, y)</text><text x="1220.0" y="314.7" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">推理 / 问答 / 相似度 / 分类，共 12 个数据集</text><path d="M1220.0,330 L1220.0,350" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_EA580C)"/><rect x="967.0" y="354" width="70" height="34" rx="6" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="1.2"/><text x="1002.0" y="376.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">Start</text><rect x="1045.0" y="354" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="1105.0" y="376.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">Premise</text><rect x="1173.0" y="354" width="70" height="34" rx="6" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="1.2"/><text x="1208.0" y="376.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">Delim</text><rect x="1251.0" y="354" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="1316.0" y="376.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">Hypothesis</text><rect x="1389.0" y="354" width="84" height="34" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/><text x="1431.0" y="376.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#EA580C" font-weight="500" text-anchor="middle">Extract</text><text x="1220.0" y="412" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#EA580C" font-weight="600" text-anchor="middle">任务输入改写成一条 token 序列（见第 04 页）</text><path d="M1220.0,422 L1220.0,444" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_EA580C)"/><rect x="1020" y="446" width="400" height="62" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="1220.0" y="472.7" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#2563EB" font-weight="600" text-anchor="middle">同一个 Transformer  Θ（继承）</text><text x="1220.0" y="495.4" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1F2937" font-weight="400" text-anchor="middle">取最后一个 token（Extract）的顶层激活 h<tspan dy="3.6" font-size="8.8">l</tspan><tspan dy="-3.6">​</tspan><tspan dy="-5.2" font-size="8.8">m</tspan><tspan dy="5.2">​</tspan></text><path d="M1220.0,510 L1220.0,532" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_EA580C)"/><rect x="1020" y="534" width="400" height="44" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/><text x="1220.0" y="562.1" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#EA580C" font-weight="700" text-anchor="middle">softmax(h<tspan dy="4.8" font-size="11.6">l</tspan><tspan dy="-4.8">​</tspan><tspan dy="-6.8" font-size="11.6">m</tspan><tspan dy="6.8">​</tspan> W<tspan dy="4.8" font-size="11.6">y</tspan><tspan dy="-4.8">​</tspan>) → ŷ</text><rect x="940" y="596" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="1220.0" y="632.8" font-family="DejaVu Serif, Times New Roman, serif" font-size="19" fill="#1F2937" font-weight="600" text-anchor="middle">L<tspan dy="5.3" font-size="12.9">2</tspan><tspan dy="-5.3">​</tspan>(C) = Σ<tspan dy="5.3" font-size="12.9">(x,y)</tspan><tspan dy="-5.3">​</tspan> log P(y | x<tspan dy="-7.6" font-size="12.9">1</tspan><tspan dy="7.6">​</tspan>, …, x<tspan dy="-7.6" font-size="12.9">m</tspan><tspan dy="7.6">​</tspan>)</text><rect x="60.0" y="700" width="480.0" height="150" rx="12" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="1.3"/><text x="82.0" y="734" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#1F2937" font-weight="700" text-anchor="start">此前的迁移方式</text><text x="82.0" y="768" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="82.0" dy="0.0">预训练词向量只迁移词级信息；</tspan><tspan x="82.0" dy="24.0">ELMo 等把预训练表示当作特征，</tspan><tspan x="82.0" dy="24.0">仍要为每个任务设计专用模型</tspan></text><rect x="560.0" y="700" width="480.0" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/><text x="582.0" y="734" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#2563EB" font-weight="700" text-anchor="start">GPT 的做法</text><text x="582.0" y="768" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="582.0" dy="0.0">整个网络一起迁移，所有层都参与微调；</tspan><tspan x="582.0" dy="24.0">结构化输入改写成序列，</tspan><tspan x="582.0" dy="24.0">模型结构几乎不改</tspan></text><rect x="1060.0" y="700" width="480.0" height="150" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/><text x="1082.0" y="734" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#EA580C" font-weight="700" text-anchor="start">微调新增的参数</text><text x="1082.0" y="768" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="1082.0" dy="0.0">只有输出层 W<tspan dy="4.2" font-size="10.2">y</tspan><tspan dy="-4.2">​</tspan></tspan><tspan x="1082.0" dy="24.0">和分隔符 / 起止 token 的嵌入；</tspan><tspan x="1082.0" dy="24.0">通常 3 个 epoch 即可收敛</tspan></text><text x="60" y="878" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#9CA3AF" font-weight="400" text-anchor="start">Radford et al., Improving Language Understanding by Generative Pre-Training, OpenAI 2018 · 数值取自原文</text><text x="1540" y="878" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280" font-weight="600" text-anchor="end">01 / 06</text></svg>