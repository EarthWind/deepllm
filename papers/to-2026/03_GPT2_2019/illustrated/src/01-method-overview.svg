<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah_1F2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="ah_2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="62" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#6B7280" font-weight="700" text-anchor="start">方法总览</text><text x="60" y="102" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" fill="#1F2937" font-weight="700" text-anchor="start">方法总览：任务也是一段文字，语言模型只管续写</text><text x="60" y="134" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6B7280" font-weight="400" text-anchor="start">训练只做一件事：在 WebText 上预测下一个 token；做任务时不改参数、不改结构，只在输入里写提示（Section 2）</text><line x1="60" y1="152" x2="1540" y2="152" stroke="#D1D5DB" stroke-width="1.2"/><text x="1431.06" y="67" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="start">数据 / baseline</text><rect x="1409.06" y="55" width="15" height="15" rx="3" fill="#F1F5F9" stroke="#6B7280" stroke-width="1.4"/><text x="1335.06" y="67" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#EA580C" font-weight="600" text-anchor="start">任务提示</text><rect x="1313.06" y="55" width="15" height="15" rx="3" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/><text x="1193.82" y="67" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2563EB" font-weight="600" text-anchor="start">语言模型 GPT-2</text><rect x="1171.82" y="55" width="15" height="15" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><rect x="60" y="178" width="1480" height="250" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="84" y="212" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280" font-weight="700" text-anchor="start">训练：只做一次</text><text x="1000" y="212" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280" font-weight="700" text-anchor="start">使用：每个任务换一段提示</text><line x1="975" y1="198" x2="975" y2="408" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="84" y="248" width="190" height="120" rx="10" fill="#F1F5F9" stroke="#6B7280" stroke-width="1.6"/><text x="179.0" y="294.9" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#1F2937" font-weight="600" text-anchor="middle">WebText</text><text x="179.0" y="317.6" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle"><tspan x="179.0" dy="0.0">Reddit 高赞外链</tspan><tspan x="179.0" dy="17.6">800 万篇 · 40GB</tspan></text><path d="M278,308.0 L310,308.0" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><rect x="314" y="248" width="190" height="120" rx="10" fill="#F1F5F9" stroke="#6B7280" stroke-width="1.6"/><text x="409.0" y="294.9" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#1F2937" font-weight="600" text-anchor="middle">字节级 BPE</text><text x="409.0" y="317.6" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle"><tspan x="409.0" dy="0.0">任意字符串都能编码</tspan><tspan x="409.0" dy="17.6">词表 50,257</tspan></text><path d="M508,308.0 L540,308.0" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><rect x="544" y="248" width="400" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="744.0" y="293.9" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#2563EB" font-weight="600" text-anchor="middle">Transformer 语言模型</text><text x="744.0" y="317.9" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="400" text-anchor="middle"><tspan x="744.0" dy="0.0">最大化 Σ log p(s<tspan dy="3.9" font-size="9.5">n</tspan><tspan dy="-3.9">​</tspan> | s<tspan dy="3.9" font-size="9.5">1</tspan><tspan dy="-3.9">​</tspan>, …, s<tspan dy="3.9" font-size="9.5">n−1</tspan><tspan dy="-3.9">​</tspan>)</tspan><tspan x="744.0" dy="18.9">117M → 1.5B 四种规模</tspan></text><rect x="1000" y="258" width="94.24000000000001" height="36" rx="6" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="1.2"/><text x="1047.12" y="281.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">输入文本 …</text><rect x="1100.24" y="258" width="70.72" height="36" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/><text x="1135.6" y="281.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#EA580C" font-weight="700" text-anchor="middle">TL;DR:</text><path d="M1178.96,276 L1216.96,276" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><rect x="1220.96" y="252" width="120" height="48" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="1280.96" y="282.1" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#2563EB" font-weight="600" text-anchor="middle">GPT-2</text><path d="M1344.96,276 L1372.96,276" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_2563EB)"/><rect x="1376.96" y="258" width="96" height="36" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3"/><text x="1424.96" y="281.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#2563EB" font-weight="700" text-anchor="middle">生成答案</text><text x="1000" y="334" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="1000" dy="0.0">同一组参数，换提示就换任务：</tspan><tspan x="1000" dy="21.0"><tspan font-weight="700">不加输出层、不做梯度更新、</tspan></tspan><tspan x="1000" dy="21.0"><tspan font-weight="700">不看任务的训练集</tspan></tspan></text><path d="M744,372 L744.0,392.0 Q744,402 754.0,402.0 L1271.0,402.0 Q1280.96,402 1281.0,392.0 L1280.96,304" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_2563EB)" stroke-dasharray="6 4"/><text x="764" y="396" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2563EB" font-weight="600" text-anchor="start">训练好的参数原样拿来用</text><rect x="60" y="450" width="760" height="388" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><circle cx="84" cy="478" r="14" fill="#1F2937" stroke="#1F2937" stroke-width="1"/><text x="84" y="483.5" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15.400000000000002" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="106" y="484" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#1F2937" font-weight="700" text-anchor="start">为什么语言模型能学会任务</text><text x="84" y="530" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" text-anchor="start"><tspan fill="#1F2937" font-weight="700">单任务：</tspan><tspan fill="#1F2937" font-weight="400">p(output | input)</tspan></text><text x="440" y="530" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" text-anchor="start"><tspan fill="#1F2937" font-weight="700">通用系统：</tspan><tspan fill="#1F2937" font-weight="400">p(output | input, </tspan><tspan fill="#EA580C" font-weight="700">task</tspan><tspan fill="#1F2937" font-weight="400">)</tspan></text><path d="M360,524 L420,524" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><text x="84" y="570" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">语言本身就能把任务、输入、输出写成同一条序列（McCann et al. 2018 的例子）：</text><rect x="84" y="586" width="176.28000000000003" height="34" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/><text x="172.14000000000001" y="608.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#EA580C" font-weight="700" text-anchor="middle">translate to french</text><rect x="266.28000000000003" y="586" width="119.44000000000001" height="34" rx="6" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="1.2"/><text x="326.00000000000006" y="608.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">english text</text><rect x="391.72" y="586" width="111.32000000000001" height="34" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 3"/><text x="447.38000000000005" y="608.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="middle">french text</text><rect x="84" y="632" width="176.28000000000003" height="34" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/><text x="172.14000000000001" y="654.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#EA580C" font-weight="700" text-anchor="middle">answer the question</text><rect x="266.28000000000003" y="632" width="86.96" height="34" rx="6" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="1.2"/><text x="309.76000000000005" y="654.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">document</text><rect x="359.24" y="632" width="86.96" height="34" rx="6" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="1.2"/><text x="402.72" y="654.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="500" text-anchor="middle">question</text><rect x="452.2" y="632" width="70.72" height="34" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 3"/><text x="487.56" y="654.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="middle">answer</text><rect x="84" y="688" width="712" height="130" rx="10" fill="#F8FAFC" stroke="#D1D5DB" stroke-width="1.2"/><text x="104" y="718" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start"><tspan x="104" dy="0.0">监督目标 = 只在序列<tspan font-weight="700">一部分</tspan>（答案那段）上计算的无监督目标，</tspan><tspan x="104" dy="23.8">所以语言模型的全局最优，也是这些监督任务的全局最优。</tspan><tspan x="104" dy="23.8">剩下的问题只有一个：<tspan font-weight="700">能不能真的把语言模型训练到足够好？</tspan></tspan><tspan x="104" dy="23.8">论文的赌注：模型够大、数据够杂，它就会为了预测得更准而顺带学会任务。</tspan></text><rect x="840" y="450" width="700" height="388" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><circle cx="864" cy="478" r="14" fill="#1F2937" stroke="#1F2937" stroke-width="1"/><text x="864" y="483.5" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15.400000000000002" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="886" y="484" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#1F2937" font-weight="700" text-anchor="start">和 GPT-1 比：去掉了微调这一步</text><text x="864" y="544" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="700" text-anchor="start">GPT-1 · 2018</text><rect x="980" y="520" width="106" height="38" rx="6" fill="#F1F5F9" stroke="#6B7280" stroke-width="1.2"/><text x="1033.0" y="544.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="middle">预训练</text><rect x="1110" y="520" width="106" height="38" rx="6" fill="#F1F5F9" stroke="#6B7280" stroke-width="1.2"/><text x="1163.0" y="544.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="middle">加线性头</text><path d="M1086,539 L1106,539" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><rect x="1240" y="520" width="106" height="38" rx="6" fill="#F1F5F9" stroke="#6B7280" stroke-width="1.2"/><text x="1293.0" y="544.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="middle">逐任务微调</text><path d="M1216,539 L1236,539" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><text x="1516" y="544" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">每个任务一份参数</text><text x="864" y="610" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#1F2937" font-weight="700" text-anchor="start">GPT-2 · 2019</text><rect x="980" y="586" width="106" height="38" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/><text x="1033.0" y="610.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#2563EB" font-weight="600" text-anchor="middle">预训练</text><rect x="1110" y="586" width="106" height="38" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/><text x="1163.0" y="610.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#EA580C" font-weight="600" text-anchor="middle">写提示</text><path d="M1086,605 L1106,605" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><rect x="1240" y="586" width="106" height="38" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3"/><text x="1293" y="610.0" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#2563EB" font-weight="600" text-anchor="middle">直接生成</text><path d="M1216,605 L1236,605" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_1F2937)"/><text x="1516" y="610" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">所有任务共用一份参数</text><rect x="860" y="664" width="660" height="30" rx="6" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="1"/><text x="876" y="685" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="start"></text><text x="1030" y="685" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="start">GPT-1</text><text x="1290" y="685" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="600" text-anchor="start">GPT-2</text><text x="876" y="717" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="700" text-anchor="start">训练数据</text><text x="1030" y="717" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">BooksCorpus（7000+ 本书）</text><text x="1290" y="717" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="700" text-anchor="start">WebText（40GB 网页）</text><line x1="860" y1="728" x2="1520" y2="728" stroke="#EEF2F7" stroke-width="1"/><text x="876" y="749" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="700" text-anchor="start">最大参数量</text><text x="1030" y="749" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">117M</text><text x="1290" y="749" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="700" text-anchor="start">1.5B（48 层）</text><line x1="860" y1="760" x2="1520" y2="760" stroke="#EEF2F7" stroke-width="1"/><text x="876" y="781" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="700" text-anchor="start">上下文长度</text><text x="1030" y="781" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">512</text><text x="1290" y="781" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="700" text-anchor="start">1024</text><line x1="860" y1="792" x2="1520" y2="792" stroke="#EEF2F7" stroke-width="1"/><text x="876" y="813" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280" font-weight="700" text-anchor="start">下游怎么用</text><text x="1030" y="813" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">有监督微调</text><text x="1290" y="813" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#1F2937" font-weight="700" text-anchor="start">zero-shot 提示</text><line x1="860" y1="824" x2="1520" y2="824" stroke="#EEF2F7" stroke-width="1"/><text x="60" y="878" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#9CA3AF" font-weight="400" text-anchor="start">Radford et al., Language Models are Unsupervised Multitask Learners, OpenAI 2019 · 数值取自原文</text><text x="1540" y="878" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280" font-weight="600" text-anchor="end">01 / 06</text></svg>