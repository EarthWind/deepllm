<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">HELM 七类通用指标</title><desc id="desc">准确性、校准、鲁棒性、公平性、偏见、毒性和效率的含义与方向。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="1" stop-color="#171127"/></linearGradient></defs><rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <text x="70" y="80" fill="#f6f8ff" font-family="Inter, PingFang SC, sans-serif" font-size="38" font-weight="700">七类指标不是七个可直接相加的数字</text><text x="70" y="122" fill="#95a9c3" font-family="Inter, PingFang SC, sans-serif" font-size="20">方向、量纲、适用场景与测量误差都不同；先保留向量，再谈决策权重</text>
  <g font-family="Inter, PingFang SC, sans-serif">
    <g transform="translate(70 190)"><rect width="390" height="185" rx="26" fill="#102d3b" stroke="#40d8fb"/><circle cx="56" cy="55" r="28" fill="#1a4354"/><path d="M43 55l9 9 18-23" fill="none" stroke="#5be3ff" stroke-width="6"/><text x="104" y="49" fill="#e9fbff" font-size="25" font-weight="700">准确性 Accuracy ↑</text><text x="32" y="105" fill="#b6d3df" font-size="17">EM / F1 / MRR / NDCG / ROUGE</text><text x="32" y="142" fill="#78d8ef" font-size="16">任务指标不同，不宜无脑平均</text></g>
    <g transform="translate(525 190)"><rect width="390" height="185" rx="26" fill="#25203d" stroke="#a98eff"/><circle cx="56" cy="55" r="28" fill="#392f5c"/><path d="M39 66a20 20 0 0140 0M59 66l12-17" fill="none" stroke="#c2afff" stroke-width="5"/><text x="104" y="49" fill="#f5f0ff" font-size="25" font-weight="700">校准 Calibration ↓</text><text x="32" y="105" fill="#d4c9e7" font-size="17">ECE = Σ |B|/N · |acc − conf|</text><text x="32" y="142" fill="#beaaff" font-size="16">另看 coverage–accuracy 曲线</text></g>
    <g transform="translate(980 190)"><rect width="390" height="185" rx="26" fill="#302414" stroke="#ffb75d"/><circle cx="56" cy="55" r="28" fill="#49351d"/><path d="M58 33l20 9v17c0 13-9 23-20 28-11-5-20-15-20-28V42z" fill="none" stroke="#ffc77e" stroke-width="4"/><text x="104" y="49" fill="#fff5e8" font-size="25" font-weight="700">鲁棒性 Robustness ↑</text><text x="32" y="105" fill="#dfcbb2" font-size="17">每例在扰动集合上的最坏得分</text><text x="32" y="142" fill="#ffc77e" font-size="16">局部 invariance / equivariance</text></g>
    <g transform="translate(70 420)"><rect width="390" height="185" rx="26" fill="#17302b" stroke="#50dfa9"/><circle cx="56" cy="55" r="28" fill="#21483f"/><path d="M56 36v35M39 48h34M43 72h26" stroke="#73ecc2" stroke-width="4"/><text x="104" y="49" fill="#eafff7" font-size="25" font-weight="700">公平性 Fairness ↑</text><text x="32" y="105" fill="#bce0d2" font-size="17">反事实最坏情况 / 群体性能差异</text><text x="32" y="142" fill="#72e6bb" font-size="16">窄操作化不等于“公平已解决”</text></g>
    <g transform="translate(525 420)"><rect width="390" height="185" rx="26" fill="#2f1c34" stroke="#e681ff"/><circle cx="56" cy="55" r="28" fill="#47264e"/><circle cx="47" cy="51" r="7" fill="#f0a6ff"/><circle cx="68" cy="41" r="7" fill="#f0a6ff"/><circle cx="68" cy="67" r="7" fill="#f0a6ff"/><path d="M52 48l10-5M52 55l10 9" stroke="#f0a6ff" stroke-width="3"/><text x="104" y="49" fill="#fff0ff" font-size="25" font-weight="700">偏见 Bias ↓</text><text x="32" y="105" fill="#e0c3e4" font-size="17">群体表征与刻板关联的偏离</text><text x="32" y="142" fill="#e89af7" font-size="16">依赖词表、类别与社会假设</text></g>
    <g transform="translate(980 420)"><rect width="390" height="185" rx="26" fill="#381a24" stroke="#ff6e8f"/><circle cx="56" cy="55" r="28" fill="#502532"/><path d="M56 32l23 41H33z" fill="none" stroke="#ff91aa" stroke-width="4"/><text x="56" y="65" text-anchor="middle" fill="#ffb5c5" font-size="23">!</text><text x="104" y="49" fill="#fff0f3" font-size="25" font-weight="700">毒性 Toxicity ↓</text><text x="32" y="105" fill="#e6c0ca" font-size="17">Perspective API 的毒性概率/比例</text><text x="32" y="142" fill="#ff9eb4" font-size="16">检测器本身也有偏差与误差</text></g>
    <g transform="translate(295 650)"><rect width="850" height="150" rx="28" fill="#172b31" stroke="#75e0ca"/><circle cx="74" cy="75" r="39" fill="#214249"/><path d="M75 42L56 78h17l-8 30 29-42H77z" fill="#86f2d3"/><text x="140" y="57" fill="#edfff9" font-size="27" font-weight="700">效率 Efficiency：越少资源越好，但量测条件必须公开</text><text x="140" y="99" fill="#b9d9d2" font-size="18">训练能耗 e = nGPU · WGPU · t · PUE　；　排放 eCO₂ = e · c_region</text><text x="140" y="129" fill="#83d9c7" font-size="16">推理延迟混合了硬件、软件栈、排队与服务商噪声，不是纯模型属性</text></g>
    <text x="720" y="860" text-anchor="middle" fill="#8fa2bb" font-size="17">↑ / ↓ 只表示偏好方向；不表示这些构念可被一个数字完全代表</text>
  </g>
</svg>
