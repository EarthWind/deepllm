<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Selective Copying 解释 Mamba 的选择机制</title><desc id="desc">固定间隔复制可由 LTI 卷积解决，随机间隔要求按内容记住彩色 token 并忽略噪声，选择性 SSM 获得接近满分。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#142039"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:21px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d3deec}.small{font-size:14px;fill:#9fb2cc}.score{font-size:22px;font-weight:800;fill:#fff}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/><text x="64" y="72" class="title">为什么固定卷积不够？看 Selective Copying</text><text x="64" y="107" class="sub">白色表示噪声，彩色表示必须记住的 token；难点不是序列长，而是相关 token 的位置不固定</text>
  <g transform="translate(64 156)"><rect width="620" height="250" rx="24" fill="#132841" stroke="#38bdf8"/><text x="28" y="43" class="h">普通 Copying：间隔固定</text><g transform="translate(28 76)"><g fill="#33455b"><rect width="42" height="42" rx="8"/><rect x="52" width="42" height="42" rx="8"/><rect x="104" width="42" height="42" rx="8"/><rect x="156" width="42" height="42" rx="8"/><rect x="208" width="42" height="42" rx="8"/><rect x="260" width="42" height="42" rx="8"/><rect x="312" width="42" height="42" rx="8"/><rect x="364" width="42" height="42" rx="8"/><rect x="416" width="42" height="42" rx="8"/><rect x="468" width="42" height="42" rx="8"/><rect x="520" width="42" height="42" rx="8"/></g><rect width="42" height="42" rx="8" fill="#f59e0b"/><rect x="52" width="42" height="42" rx="8" fill="#34d399"/><rect x="104" width="42" height="42" rx="8" fill="#38bdf8"/><rect x="416" width="42" height="42" rx="8" fill="#f59e0b"/><rect x="468" width="42" height="42" rx="8" fill="#34d399"/><rect x="520" width="42" height="42" rx="8" fill="#38bdf8"/></g><path d="M49 138 C49 181 441 181 441 138M101 138 C101 203 493 203 493 138M153 138 C153 225 545 225 545 138" stroke="#67e8f9" stroke-width="2" fill="none"/><text x="28" y="231" class="body">固定 kernel 只需学会“延迟 K 步复制”</text></g>
  <g transform="translate(756 156)"><rect width="620" height="250" rx="24" fill="#252449" stroke="#a78bfa"/><text x="28" y="43" class="h">Selective Copying：间隔随机</text><g transform="translate(28 76)"><g fill="#334154"><rect width="42" height="42" rx="8"/><rect x="52" width="42" height="42" rx="8"/><rect x="104" width="42" height="42" rx="8"/><rect x="156" width="42" height="42" rx="8"/><rect x="208" width="42" height="42" rx="8"/><rect x="260" width="42" height="42" rx="8"/><rect x="312" width="42" height="42" rx="8"/><rect x="364" width="42" height="42" rx="8"/><rect x="416" width="42" height="42" rx="8"/><rect x="468" width="42" height="42" rx="8"/><rect x="520" width="42" height="42" rx="8"/></g><rect x="52" width="42" height="42" rx="8" fill="#f59e0b"/><rect x="208" width="42" height="42" rx="8" fill="#34d399"/><rect x="364" width="42" height="42" rx="8" fill="#38bdf8"/></g><g transform="translate(28 154)"><rect width="94" height="50" rx="12" fill="#3b2b12"/><text x="47" y="31" class="body" text-anchor="middle">记住</text><rect x="112" width="94" height="50" rx="12" fill="#142d3b"/><text x="159" y="31" class="body" text-anchor="middle">忽略</text><rect x="224" width="94" height="50" rx="12" fill="#17352f"/><text x="271" y="31" class="body" text-anchor="middle">记住</text><rect x="336" width="94" height="50" rx="12" fill="#142d3b"/><text x="383" y="31" class="body" text-anchor="middle">忽略</text><rect x="448" width="114" height="50" rx="12" fill="#1e3151"/><text x="505" y="31" class="body" text-anchor="middle">按序读出</text></g><text x="28" y="231" class="body">必须看内容决定状态更新，固定卷积会失配</text></g>
  <g transform="translate(64 458)"><rect width="1312" height="346" rx="24" fill="#0d1a2c" stroke="#354962"/><text x="28" y="47" class="h">论文 Table 1：架构门控不等于沿序列选择</text><text x="28" y="78" class="small">Selective Copying accuracy（%）；同一个 Mamba 外壳，换掉内部序列层就会大幅变化</text>
    <g transform="translate(286 108)"><line x1="0" y1="0" x2="0" y2="194" stroke="#3a4c64"/><line x1="250" y1="0" x2="250" y2="194" stroke="#263b52"/><line x1="500" y1="0" x2="500" y2="194" stroke="#263b52"/><line x1="750" y1="0" x2="750" y2="194" stroke="#263b52"/><text x="0" y="-13" class="small">0</text><text x="250" y="-13" class="small">25</text><text x="500" y="-13" class="small">50</text><text x="750" y="-13" class="small">75</text><text x="1000" y="-13" class="small" text-anchor="end">100</text></g>
    <g transform="translate(28 116)"><text y="22" class="body">S4 外壳 + S4</text><rect x="258" width="183" height="30" rx="7" fill="#475569"/><text x="450" y="22" class="score">18.3</text><text y="70" class="body">Mamba + Hyena</text><rect x="258" y="48" width="284" height="30" rx="7" fill="#64748b"/><text x="551" y="70" class="score">28.4</text><text y="118" class="body">Mamba + S4</text><rect x="258" y="96" width="564" height="30" rx="7" fill="#6366f1"/><text x="831" y="118" class="score">56.4</text><text y="166" class="body">Mamba + S6</text><rect x="258" y="144" width="998" height="30" rx="7" fill="#10b981"/><text x="1264" y="166" class="score">99.8</text></g>
    <text x="28" y="322" class="small">结论：外部乘法门只能调输出幅度；让 Δ、B、C 沿序列依赖输入，才能改变信息如何进入、保留和读出状态。</text>
  </g><text x="64" y="858" class="small">这是一项合成机制实验，不应直接解读为真实语言任务准确率；它用于隔离“选择性”是否存在。</text>
</svg>
