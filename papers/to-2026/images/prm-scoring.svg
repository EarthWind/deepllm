<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">过程奖励模型的步骤概率与轨迹聚合</title>
  <desc id="desc">PRM 在每个步骤边界输出负面、中性、正面三类概率。论文最佳配置把中性视为正确，将每一步正确概率相乘得到完整解答分数。乘积在实现中应转为对数求和，并会轻微偏向较短解答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafafa"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>.title{font:700 31px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 20px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 15px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.mono{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#312e81}.white{fill:#fff}.green{fill:#047857}.red{fill:#b91c1c}</style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <text x="60" y="54" class="title">从三分类步骤预测，到一个可排序的解答分数</text>
  <text x="60" y="84" class="sub">分数不是“逐步奖励求和”；论文默认把“整条解答每一步都正确”的概率写成乘积。</text>

  <g transform="translate(60 125)" filter="url(#shadow)">
    <rect width="1280" height="315" rx="26" fill="#fff" stroke="#cbd5e1"/>
    <text x="30" y="44" class="h">一次前向传播，在每个 step boundary 读出分类分布</text>
    <g transform="translate(30 75)">
      <rect width="260" height="180" rx="18" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="20" y="34" class="h">Step 1</text><text x="20" y="64" class="body">整理条件并定义变量</text>
      <rect x="20" y="89" width="220" height="18" rx="9" fill="#e2e8f0"/><rect x="20" y="89" width="209" height="18" rx="9" fill="#10b981"/>
      <text x="20" y="132" class="mono">p₁ = 0.95</text><text x="20" y="158" class="small">P(+1) + P(0)</text>
      <path d="M268 90H319" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(360 75)">
      <rect width="260" height="180" rx="18" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="20" y="34" class="h">Step 2</text><text x="20" y="64" class="body">执行关键代数变换</text>
      <rect x="20" y="89" width="220" height="18" rx="9" fill="#e2e8f0"/><rect x="20" y="89" width="191" height="18" rx="9" fill="#8b5cf6"/>
      <text x="20" y="132" class="mono">p₂ = 0.87</text><text x="20" y="158" class="small">条件包含题目和 step ≤ 2</text>
      <path d="M268 90H319" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(690 75)">
      <rect width="260" height="180" rx="18" fill="#fff7ed" stroke="#fb923c"/>
      <text x="20" y="34" class="h">Step 3</text><text x="20" y="64" class="body">代回并给出答案</text>
      <rect x="20" y="89" width="220" height="18" rx="9" fill="#e2e8f0"/><rect x="20" y="89" width="202" height="18" rx="9" fill="#f59e0b"/>
      <text x="20" y="132" class="mono">p₃ = 0.92</text><text x="20" y="158" class="small">只在步骤末尾计算监督</text>
      <path d="M268 90H319" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(1020 75)">
      <rect width="230" height="180" rx="18" fill="#ecfdf5" stroke="#34d399"/>
      <text x="115" y="35" text-anchor="middle" class="h">解答总分</text>
      <text x="115" y="76" text-anchor="middle" class="mono">0.95 × 0.87 × 0.92</text>
      <text x="115" y="114" text-anchor="middle" class="title green">0.760</text>
      <text x="115" y="151" text-anchor="middle" class="small">用于 best-of-N 排序</text>
    </g>
  </g>

  <g transform="translate(60 480)">
    <rect width="610" height="190" rx="22" fill="#fff" stroke="#a5b4fc"/>
    <text x="28" y="39" class="h">数值稳定实现</text>
    <text x="28" y="80" class="mono">log S(y) = Σₜ log(max(pₜ, ε))</text>
    <text x="28" y="118" class="body">比较 log-score 与比较乘积完全等价，长链不会下溢到 0。</text>
    <rect x="28" y="140" width="554" height="30" rx="9" fill="#eef2ff"/>
    <text x="305" y="161" text-anchor="middle" class="small">训练：三分类交叉熵；推理：正确概率的轨迹聚合</text>
    <rect x="730" width="610" height="190" rx="22" fill="#fff" stroke="#fbbf24"/>
    <text x="758" y="39" class="h">乘积的长度偏置</text>
    <text x="758" y="80" class="mono">0 &lt; pₜ &lt; 1 ⇒ 步骤越多，乘积通常越小</text>
    <text x="758" y="118" class="body">论文明确指出它会轻微偏向较短解答；minimum 是其对照聚合。</text>
    <rect x="758" y="140" width="554" height="30" rx="9" fill="#fffbeb"/>
    <text x="1035" y="161" text-anchor="middle" class="small">若改用几何平均，应标为新实验，不能冒充论文默认方法</text>
  </g>
  <text x="60" y="718" class="small">Appendix F：neutral=positive + product 为 78.2%；四种 neutral/reduction 组合只相差 0.4–0.8 个百分点。</text>
</svg>
