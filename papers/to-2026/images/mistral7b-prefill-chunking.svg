<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mistral 7B 的分块预填充</title>
  <desc id="desc">长 prompt 被切成窗口大小的块，当前块查询同时读取上一块留下的滚动缓存和当前块内满足因果约束的键，并继续应用滑动窗口边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#19263f"/></linearGradient>
    <linearGradient id="hot" x1="0" x2="1"><stop stop-color="#f8c15d"/><stop offset="1" stop-color="#e77940"/></linearGradient>
    <linearGradient id="cool" x1="0" x2="1"><stop stop-color="#35c4d5"/><stop offset="1" stop-color="#3e73d7"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#91abc7"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity=".4"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#50657c" stroke-width="1"/></pattern>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#9eb3cc}.head{font-size:20px;font-weight:750;fill:#fff}.body{font-size:15px;fill:#dce8f5}.small{font-size:13px;fill:#9eb3cc}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#f6f9ff}.dark{font-size:15px;font-weight:760;fill:#152238}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="59" class="sans title">Chunked Prefill：长 Prompt 分块算，局部注意力仍完全等价</text>
  <text x="52" y="91" class="sans sub">当前块内部可以并行；每个 Query 同时满足 causal mask 与 sliding-window mask，完成后再把本块 K/V 写入滚动缓存</text>

  <g filter="url(#shadow)"><rect x="48" y="126" width="1184" height="181" rx="22" fill="#0d2135" stroke="#355672"/></g>
  <text x="78" y="165" class="sans head">示例：W=4，处理第三个 chunk</text>
  <rect x="78" y="197" width="300" height="70" rx="14" fill="#1b3146"/><text x="228" y="226" text-anchor="middle" class="sans body">Chunk 0 · positions 0–3</text><text x="228" y="250" text-anchor="middle" class="sans small">已经超过窗口，不再读取</text>
  <path d="M378 232H421" stroke="#91abc7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="434" y="197" width="300" height="70" rx="14" fill="url(#cool)"/><text x="584" y="226" text-anchor="middle" class="sans head">Rolling Cache · positions 4–7</text><text x="584" y="250" text-anchor="middle" class="sans body">只有仍在窗口内的后缀会被使用</text>
  <path d="M734 232H777" stroke="#91abc7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="790" y="197" width="410" height="70" rx="14" fill="url(#hot)"/><text x="995" y="226" text-anchor="middle" class="sans dark">Current Chunk · positions 8–11</text><text x="995" y="250" text-anchor="middle" class="sans dark">块内 causal：Query 不能读取未来 Key</text>

  <g filter="url(#shadow)"><rect x="48" y="341" width="716" height="307" rx="22" fill="#0d2135" stroke="#355672"/></g>
  <text x="78" y="379" class="sans head">当前块的有效连接（每行最多 4 个 Key）</text>
  <text x="78" y="404" class="sans small">列是绝对 Key 位置 4…11；蓝色来自旧 cache，橙色来自当前 chunk</text>
  <rect x="268" y="437" width="304" height="152" fill="#14283d"/>
  <g fill="#3d92b4"><rect x="306" y="437" width="114" height="38"/><rect x="344" y="475" width="76" height="38"/><rect x="382" y="513" width="38" height="38"/></g>
  <g fill="#e99346"><rect x="420" y="437" width="38" height="38"/><rect x="420" y="475" width="76" height="38"/><rect x="420" y="513" width="114" height="38"/><rect x="420" y="551" width="152" height="38"/></g>
  <rect x="268" y="437" width="304" height="152" fill="url(#grid)"/>
  <g class="sans small" text-anchor="middle"><text x="287" y="425">4</text><text x="325" y="425">5</text><text x="363" y="425">6</text><text x="401" y="425">7</text><text x="439" y="425">8</text><text x="477" y="425">9</text><text x="515" y="425">10</text><text x="553" y="425">11</text></g>
  <g class="sans small" text-anchor="end"><text x="256" y="461">Q8</text><text x="256" y="499">Q9</text><text x="256" y="537">Q10</text><text x="256" y="575">Q11</text></g>
  <rect x="608" y="439" width="124" height="55" rx="12" fill="#234c61"/><text x="670" y="463" text-anchor="middle" class="sans body">旧 Cache</text><text x="670" y="483" text-anchor="middle" class="sans small">窗口后缀</text>
  <rect x="608" y="516" width="124" height="55" rx="12" fill="#6b4931"/><text x="670" y="540" text-anchor="middle" class="sans body">当前块</text><text x="670" y="560" text-anchor="middle" class="sans small">因果三角形</text>

  <g filter="url(#shadow)"><rect x="800" y="341" width="432" height="307" rx="22" fill="#0d2135" stroke="#355672"/></g>
  <text x="830" y="379" class="sans head">每个块的执行顺序</text>
  <g class="sans">
    <circle cx="854" cy="432" r="20" fill="#31536f"/><text x="854" y="438" text-anchor="middle" class="head">1</text><text x="890" y="428" class="body">读取旧 cache + 当前块 K/V</text><text x="890" y="450" class="small">候选集合可大于单个 Query 的窗口</text>
    <path d="M854 454V480" stroke="#91abc7" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="854" cy="508" r="20" fill="#31536f"/><text x="854" y="514" text-anchor="middle" class="head">2</text><text x="890" y="504" class="body">同时施加 local + causal mask</text><text x="890" y="526" class="small">再做局部 FlashAttention</text>
    <path d="M854 530V556" stroke="#91abc7" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="854" cy="584" r="20" fill="url(#hot)"/><text x="854" y="590" text-anchor="middle" class="dark">3</text><text x="890" y="580" class="body">提交本块 K/V，循环覆盖旧槽</text><text x="890" y="602" class="small">进入下一块，物理容量仍为 W</text>
  </g>
  <text x="52" y="686" class="sans small">分块改变的是调度与中间内存，不应改变数学结果；本文附带的零依赖代码会把 chunked prefill 与物化局部 GQA 逐元素比较。</text>
</svg>
