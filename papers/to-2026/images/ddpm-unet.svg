<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">DDPM 原论文使用的时间条件 U-Net</title>
  <desc id="desc">带残差块、跨层跳连、16乘16自注意力和正弦时间嵌入的 U-Net，把带噪图像映射为同形状的噪声预测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#17142d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
    <style>.s{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{font-size:32px;font-weight:700;fill:#f8fafc}.h{font-size:20px;font-weight:650;fill:#e2e8f0}.m{font-size:15px;fill:#cbd5e1}.n{font-size:13px;fill:#94a3b8}.card{fill:#0c1d31;stroke:#2a4563;stroke-width:1.5}.flow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}.skip{fill:none;stroke:#fbbf24;stroke-width:2.5;stroke-dasharray:7 6}</style>
  </defs>
  <rect width="1400" height="760" rx="27" fill="url(#bg)"/>
  <text x="52" y="61" class="s t">εθ(xₜ,t) 不是 1,000 个网络，而是一个跨时间共享的 U-Net</text>
  <text x="52" y="92" class="s n">图示对应原论文架构原则：Wide-ResNet 风格残差块、GroupNorm、Swish、跳连、16×16 self-attention 与正弦时间嵌入。</text>

  <g transform="translate(46 142)">
    <rect x="0" y="168" width="135" height="112" rx="16" fill="#123754" stroke="#38bdf8" stroke-width="2"/>
    <text x="67" y="206" text-anchor="middle" class="s h">带噪图像</text><text x="67" y="235" text-anchor="middle" class="s m">xₜ</text><text x="67" y="261" text-anchor="middle" class="s n">B×H×W×3</text>
    <path d="M145 224H189" class="flow"/>

    <g transform="translate(205 84)">
      <rect x="0" y="0" width="145" height="280" rx="18" fill="#13314b" stroke="#22d3ee"/>
      <text x="72" y="32" text-anchor="middle" class="s h">H × W</text>
      <rect x="18" y="57" width="109" height="72" rx="11" fill="#0f7490"/><text x="72" y="86" text-anchor="middle" class="s m">ResBlock ×2</text><text x="72" y="109" text-anchor="middle" class="s n">GN · Swish · Conv</text>
      <path d="M72 138V173" class="flow"/><rect x="18" y="187" width="109" height="55" rx="11" fill="#155e75"/><text x="72" y="220" text-anchor="middle" class="s m">↓2 Conv</text>
      <text x="72" y="264" text-anchor="middle" class="s n">保存 skip feature</text>
    </g>
    <path d="M360 224H404" class="flow"/>
    <g transform="translate(420 122)">
      <rect width="145" height="204" rx="18" fill="#18304f" stroke="#818cf8"/>
      <text x="72" y="33" text-anchor="middle" class="s h">… 多尺度</text>
      <rect x="18" y="60" width="109" height="67" rx="11" fill="#3730a3"/><text x="72" y="87" text-anchor="middle" class="s m">ResBlock ×2</text><text x="72" y="110" text-anchor="middle" class="s n">通道逐级增加</text>
      <rect x="18" y="146" width="109" height="38" rx="10" fill="#312e81"/><text x="72" y="170" text-anchor="middle" class="s n">32→16→8→4</text>
    </g>
    <path d="M575 224H619" class="flow"/>
    <g transform="translate(635 146)">
      <rect width="154" height="156" rx="18" fill="#332248" stroke="#c084fc" stroke-width="2"/>
      <text x="77" y="33" text-anchor="middle" class="s h">瓶颈</text>
      <rect x="19" y="53" width="116" height="44" rx="10" fill="#6d28d9"/><text x="77" y="81" text-anchor="middle" class="s m">Self-Attention</text>
      <text x="77" y="122" text-anchor="middle" class="s n">ResBlock · Attn</text><text x="77" y="142" text-anchor="middle" class="s n">· ResBlock</text>
    </g>
    <path d="M799 224H843" class="flow"/>
    <g transform="translate(859 122)">
      <rect width="145" height="204" rx="18" fill="#2d2948" stroke="#818cf8"/>
      <text x="72" y="33" text-anchor="middle" class="s h">… 多尺度</text>
      <rect x="18" y="59" width="109" height="38" rx="10" fill="#312e81"/><text x="72" y="83" text-anchor="middle" class="s n">4→8→16→32</text>
      <rect x="18" y="117" width="109" height="67" rx="11" fill="#3730a3"/><text x="72" y="144" text-anchor="middle" class="s m">Concat skip</text><text x="72" y="167" text-anchor="middle" class="s n">ResBlock ×3</text>
    </g>
    <path d="M1014 224H1058" class="flow"/>
    <g transform="translate(1074 84)">
      <rect width="145" height="280" rx="18" fill="#3a293e" stroke="#fb7185"/>
      <text x="72" y="32" text-anchor="middle" class="s h">H × W</text>
      <rect x="18" y="57" width="109" height="55" rx="11" fill="#9f315f"/><text x="72" y="90" text-anchor="middle" class="s m">↑2 + Conv</text>
      <path d="M72 121V156" class="flow"/><rect x="18" y="170" width="109" height="72" rx="11" fill="#be185d"/><text x="72" y="199" text-anchor="middle" class="s m">ResBlock ×3</text><text x="72" y="222" text-anchor="middle" class="s n">融合 encoder</text>
      <text x="72" y="264" text-anchor="middle" class="s n">GN · Swish · Conv</text>
    </g>
    <path d="M1229 224H1273" class="flow"/>
    <rect x="1288" y="168" width="66" height="112" rx="16" fill="#4c1d3b" stroke="#fb7185" stroke-width="2"/>
    <text x="1321" y="208" text-anchor="middle" class="s h">εθ</text><text x="1321" y="237" text-anchor="middle" class="s m">同形</text><text x="1321" y="260" text-anchor="middle" class="s n">3 ch</text>

    <path d="M278 74C278 12 1146 12 1146 74" class="skip"/><text x="712" y="25" text-anchor="middle" class="s n" fill="#fbbf24">多尺度 skip connection：保留空间细节并直接送入对称的上采样层</text>

    <g transform="translate(378 416)">
      <rect width="634" height="120" rx="18" class="card"/>
      <circle cx="57" cy="60" r="34" fill="#7c3aed"/><text x="57" y="68" text-anchor="middle" class="s h">t</text>
      <path d="M101 60H150" class="flow"/><rect x="165" y="25" width="180" height="70" rx="13" fill="#29215a"/><text x="255" y="51" text-anchor="middle" class="s m">sin/cos embedding</text><text x="255" y="76" text-anchor="middle" class="s n">→ MLP → 4C</text>
      <path d="M359 60H408" class="flow"/><text x="424" y="49" class="s m">加到每个 ResBlock</text><text x="424" y="75" class="s n">告诉共享网络当前噪声强度</text>
    </g>
  </g>
  <g transform="translate(52 698)"><text class="s n">32×32 模型：4 个分辨率、35.7M 参数；256×256 模型：6 个分辨率、114M 参数；self-attention 位于 16×16 特征图。</text><text x="1296" text-anchor="end" class="s n">输出层零初始化；论文采用 EMA=0.9999。</text></g>
</svg>
