<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Toolformer 的三路未来词元损失过滤</title>
  <desc id="desc">在候选调用位置之后，分别计算无调用、调用但没有返回值、调用且有返回值三种前缀条件下的加权未来词元损失。前两者取最小值作为强基线，只有工具返回值带来的损失下降超过阈值时才保留调用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .heading { font: 700 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 500 14px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .formula { font: 600 20px "STIX Two Math", "Times New Roman", serif; fill: #1e293b; }
      .white { fill: #fff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="840" fill="url(#bg)"/>
  <text x="56" y="52" class="title">过滤的关键：奖励“返回值的信息量”，而不是奖励调用格式</text>
  <text x="56" y="82" class="subtitle">候选调用插在位置 i；评分只看原文从 xᵢ 开始的未来 token，并让越近的 token 权重越大。</text>

  <g transform="translate(56 112)" filter="url(#shadow)">
    <rect width="1288" height="154" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <text x="24" y="36" class="heading">原文与候选插入位置</text>
    <g transform="translate(24 56)">
      <rect width="89" height="48" rx="10" fill="#f1f5f9"/><text x="44" y="30" text-anchor="middle" class="mono">Out</text>
      <rect x="99" width="69" height="48" rx="10" fill="#f1f5f9"/><text x="133" y="30" text-anchor="middle" class="mono">of</text>
      <rect x="178" width="93" height="48" rx="10" fill="#f1f5f9"/><text x="224" y="30" text-anchor="middle" class="mono">1400</text>
      <rect x="281" width="146" height="48" rx="10" fill="#f1f5f9"/><text x="354" y="30" text-anchor="middle" class="mono">participants</text>
      <rect x="437" width="91" height="48" rx="10" fill="#f1f5f9"/><text x="482" y="30" text-anchor="middle" class="mono">400</text>
      <path d="M538 -7 V59" stroke="#ea580c" stroke-width="4"/>
      <path d="M530 1 L538 -9 L546 1" fill="#ea580c"/>
      <text x="538" y="82" text-anchor="middle" class="small">位置 i</text>
      <rect x="550" width="74" height="48" rx="10" fill="#ffedd5" stroke="#fb923c"/><text x="587" y="30" text-anchor="middle" class="mono">or</text><text x="587" y="73" text-anchor="middle" class="small">w₀</text>
      <rect x="634" width="93" height="48" rx="10" fill="#ffedd5" stroke="#fb923c"/><text x="680" y="30" text-anchor="middle" class="mono">29%</text><text x="680" y="73" text-anchor="middle" class="small">w₁</text>
      <rect x="737" width="103" height="48" rx="10" fill="#fff7ed"/><text x="788" y="30" text-anchor="middle" class="mono">passed</text><text x="788" y="73" text-anchor="middle" class="small">w₂</text>
      <rect x="850" width="77" height="48" rx="10" fill="#fff7ed"/><text x="888" y="30" text-anchor="middle" class="mono">the</text><text x="888" y="73" text-anchor="middle" class="small">w₃</text>
      <rect x="937" width="95" height="48" rx="10" fill="#fff7ed"/><text x="984" y="30" text-anchor="middle" class="mono">test</text><text x="984" y="73" text-anchor="middle" class="small">w₄</text>
    </g>
  </g>

  <text x="56" y="306" class="heading">同一候选，构造三个条件</text>

  <g transform="translate(56 330)" filter="url(#shadow)">
    <rect width="388" height="276" rx="22" fill="#fff" stroke="#94a3b8"/>
    <rect width="388" height="54" rx="22" fill="#475569"/>
    <rect y="32" width="388" height="22" fill="#475569"/>
    <text x="24" y="35" class="heading white">A. 不调用工具</text>
    <text x="24" y="86" class="body">前缀 z = ε</text>
    <rect x="24" y="106" width="340" height="54" rx="11" fill="#f1f5f9"/>
    <text x="194" y="139" text-anchor="middle" class="mono">… 400 │ or 29% passed …</text>
    <text x="24" y="195" class="body">模型靠参数记忆或上下文猜测</text>
    <text x="24" y="227" class="formula">Lᵢ(ε)</text>
    <rect x="112" y="209" width="230" height="24" rx="12" fill="#cbd5e1"/>
    <rect x="112" y="209" width="190" height="24" rx="12" fill="#64748b"/>
    <text x="24" y="257" class="small">这是“完全不调用”的基线。</text>
  </g>

  <g transform="translate(506 330)" filter="url(#shadow)">
    <rect width="388" height="276" rx="22" fill="#fff" stroke="#f59e0b"/>
    <rect width="388" height="54" rx="22" fill="#d97706"/>
    <rect y="32" width="388" height="22" fill="#d97706"/>
    <text x="24" y="35" class="heading white">B. 有调用，返回值为空</text>
    <text x="24" y="86" class="body">前缀 z = e(c, ε)</text>
    <rect x="24" y="106" width="340" height="54" rx="11" fill="#fffbeb"/>
    <text x="194" y="130" text-anchor="middle" class="mono">[Calculator(400/1400) → ]</text>
    <text x="194" y="149" text-anchor="middle" class="small">格式与参数存在，但没有答案</text>
    <text x="24" y="195" class="body">控制“调用文本本身”造成的收益</text>
    <text x="24" y="227" class="formula">Lᵢ(e(c, ε))</text>
    <rect x="151" y="209" width="191" height="24" rx="12" fill="#fde68a"/>
    <rect x="151" y="209" width="166" height="24" rx="12" fill="#d97706"/>
    <text x="24" y="257" class="small">防止把格式提示误认为工具价值。</text>
  </g>

  <g transform="translate(956 330)" filter="url(#shadow)">
    <rect width="388" height="276" rx="22" fill="#fff" stroke="#10b981"/>
    <rect width="388" height="54" rx="22" fill="#059669"/>
    <rect y="32" width="388" height="22" fill="#059669"/>
    <text x="24" y="35" class="heading white">C. 有调用，也有返回值</text>
    <text x="24" y="86" class="body">前缀 z = e(c, r)</text>
    <rect x="24" y="106" width="340" height="54" rx="11" fill="#ecfdf5"/>
    <text x="194" y="130" text-anchor="middle" class="mono">[Calculator(400/1400) → 0.29]</text>
    <text x="194" y="149" text-anchor="middle" class="small">答案让 “29%” 更容易预测</text>
    <text x="24" y="195" class="body">真正希望得到的低损失</text>
    <text x="24" y="227" class="formula">Lᵢ⁺ = Lᵢ(e(c, r))</text>
    <rect x="178" y="209" width="164" height="24" rx="12" fill="#a7f3d0"/>
    <rect x="178" y="209" width="66" height="24" rx="12" fill="#059669"/>
    <text x="24" y="257" class="small">只有返回值带来明显下降才保留。</text>
  </g>

  <path d="M250 606 C250 640 540 640 540 670" class="arrow"/>
  <path d="M700 606 V670" class="arrow"/>
  <path d="M1150 606 C1150 640 860 640 860 670" class="arrow"/>

  <g transform="translate(240 670)" filter="url(#shadow)">
    <rect width="920" height="118" rx="24" fill="#0f172a"/>
    <text x="460" y="37" text-anchor="middle" class="formula white">Lᵢ⁻ = min(Lᵢ(ε), Lᵢ(e(c, ε)))</text>
    <text x="460" y="72" text-anchor="middle" class="formula white">保留条件：Lᵢ⁻ − Lᵢ⁺ ≥ τf</text>
    <text x="460" y="100" text-anchor="middle" class="small white">强基线取 A、B 中更小的损失；所以增益必须由工具结果 r 提供。</text>
  </g>

  <text x="56" y="821" class="subtitle">论文使用 w̃ₜ = max(0, 1 − 0.2t) 再归一化：非零权重集中在调用后的前 5 个 token，鼓励调用贴近它真正帮助的位置。</text>
</svg>
