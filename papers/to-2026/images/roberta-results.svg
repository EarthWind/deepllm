<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">RoBERTa 累积训练改进以及 SQuAD、RACE 和 GLUE 结果</title>
  <desc id="desc">上半部分用三个小折线图显示从十六GB一百K步开始，增加数据并训练到五百K步后 SQuAD 二点零、MNLI 和 SST二持续改善。下半部分给出单模型开发集 SQuAD 和 RACE 测试集对照，以及 RoBERTa 的 GLUE 测试集集成平均分。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter><style>.title{font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.panel{font:700 19px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 14px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.tiny{font:500 11.5px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}.value{font:700 13px "JetBrains Mono",Consolas,monospace;fill:#1d4ed8}.big{font:700 28px "JetBrains Mono",Consolas,monospace;fill:#1d4ed8}.axis{stroke:#94a3b8;stroke-width:1.4}.grid{stroke:#e2e8f0;stroke-width:1}.line{fill:none;stroke:#2563eb;stroke-width:3}</style></defs>
  <rect width="1400" height="900" fill="#f8fafc"/><text x="70" y="58" class="title">最终结果验证的是“累积配方”；每增加数据或训练时长，三类任务总体继续上升</text><text x="70" y="90" class="subtitle">上图为 RoBERTa-large 单模型开发集；四个阶段依次累积，不能把最后一行收益归给单一因素。</text>
  <g filter="url(#shadow)"><rect x="55" y="125" width="1290" height="390" rx="18" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="85" y="164" class="panel">Table 4：16GB/100K → 160GB/100K → 160GB/300K → 160GB/500K</text>
  <g transform="translate(80 192)"><text x="185" y="0" text-anchor="middle" class="panel">SQuAD 2.0 F1</text><line x1="45" y1="260" x2="350" y2="260" class="axis"/><line x1="45" y1="35" x2="45" y2="260" class="axis"/><g class="grid"><line x1="45" y1="210" x2="350" y2="210"/><line x1="45" y1="160" x2="350" y2="160"/><line x1="45" y1="110" x2="350" y2="110"/><line x1="45" y1="60" x2="350" y2="60"/></g><g class="tiny"><text x="35" y="264" text-anchor="end">87.0</text><text x="35" y="214" text-anchor="end">87.5</text><text x="35" y="164" text-anchor="end">88.0</text><text x="35" y="114" text-anchor="end">88.5</text><text x="35" y="64" text-anchor="end">89.0</text></g><polyline points="65,230 150,190 235,90 320,20" class="line"/><g fill="#2563eb"><circle cx="65" cy="230" r="6"/><circle cx="150" cy="190" r="6"/><circle cx="235" cy="90" r="6"/><circle cx="320" cy="20" r="6"/></g><g class="value"><text x="65" y="219" text-anchor="middle">87.3</text><text x="150" y="179" text-anchor="middle">87.7</text><text x="235" y="79" text-anchor="middle">88.7</text><text x="320" y="14" text-anchor="middle">89.4</text></g></g>
  <g transform="translate(500 192)"><text x="185" y="0" text-anchor="middle" class="panel">MNLI-m Accuracy</text><line x1="45" y1="260" x2="350" y2="260" class="axis"/><line x1="45" y1="35" x2="45" y2="260" class="axis"/><g class="grid"><line x1="45" y1="210" x2="350" y2="210"/><line x1="45" y1="160" x2="350" y2="160"/><line x1="45" y1="110" x2="350" y2="110"/><line x1="45" y1="60" x2="350" y2="60"/></g><g class="tiny"><text x="35" y="264" text-anchor="end">88.8</text><text x="35" y="214" text-anchor="end">89.2</text><text x="35" y="164" text-anchor="end">89.6</text><text x="35" y="114" text-anchor="end">90.0</text></g><polyline points="65,235 150,198 235,110 320,85" class="line"/><g fill="#2563eb"><circle cx="65" cy="235" r="6"/><circle cx="150" cy="198" r="6"/><circle cx="235" cy="110" r="6"/><circle cx="320" cy="85" r="6"/></g><g class="value"><text x="65" y="224" text-anchor="middle">89.0</text><text x="150" y="187" text-anchor="middle">89.3</text><text x="235" y="99" text-anchor="middle">90.0</text><text x="320" y="74" text-anchor="middle">90.2</text></g></g>
  <g transform="translate(920 192)"><text x="185" y="0" text-anchor="middle" class="panel">SST-2 Accuracy</text><line x1="45" y1="260" x2="350" y2="260" class="axis"/><line x1="45" y1="35" x2="45" y2="260" class="axis"/><g class="grid"><line x1="45" y1="210" x2="350" y2="210"/><line x1="45" y1="160" x2="350" y2="160"/><line x1="45" y1="110" x2="350" y2="110"/><line x1="45" y1="60" x2="350" y2="60"/></g><g class="tiny"><text x="35" y="264" text-anchor="end">95.2</text><text x="35" y="214" text-anchor="end">95.6</text><text x="35" y="164" text-anchor="end">96.0</text><text x="35" y="114" text-anchor="end">96.4</text></g><polyline points="65,247 150,210 235,147 320,110" class="line"/><g fill="#2563eb"><circle cx="65" cy="247" r="6"/><circle cx="150" cy="210" r="6"/><circle cx="235" cy="147" r="6"/><circle cx="320" cy="110" r="6"/></g><g class="value"><text x="65" y="236" text-anchor="middle">95.3</text><text x="150" y="199" text-anchor="middle">95.6</text><text x="235" y="136" text-anchor="middle">96.1</text><text x="320" y="99" text-anchor="middle">96.4</text></g></g>
  <g class="tiny"><text x="145" y="492">16G·100K</text><text x="230" y="492">160G·100K</text><text x="315" y="492">160G·300K</text><text x="400" y="492">160G·500K</text><text x="565" y="492">16G·100K</text><text x="650" y="492">160G·100K</text><text x="735" y="492">160G·300K</text><text x="820" y="492">160G·500K</text><text x="985" y="492">16G·100K</text><text x="1070" y="492">160G·100K</text><text x="1155" y="492">160G·300K</text><text x="1240" y="492">160G·500K</text></g>

  <g filter="url(#shadow)"><rect x="55" y="545" width="630" height="290" rx="18" fill="#fff" stroke="#93c5fd"/></g><text x="85" y="586" class="panel">理解与阅读：单模型结果</text><text x="85" y="611" class="small">SQuAD 为 dev、RACE 为 test；均按论文表中直接可比设置。</text>
  <g class="label"><text x="215" y="654">BERT-large</text><text x="355" y="654">XLNet-large</text><text x="505" y="654">RoBERTa</text></g><text x="85" y="694" class="label">SQuAD 1.1 F1</text><text x="235" y="694" class="value" fill="#475569">90.9</text><text x="375" y="694" class="value" fill="#475569">94.5</text><text x="525" y="694" class="value">94.6</text><text x="85" y="735" class="label">SQuAD 2.0 F1</text><text x="235" y="735" class="value" fill="#475569">81.8</text><text x="375" y="735" class="value" fill="#475569">88.8</text><text x="525" y="735" class="value">89.4</text><text x="85" y="776" class="label">RACE Accuracy</text><text x="235" y="776" class="value" fill="#475569">72.0</text><text x="375" y="776" class="value" fill="#475569">81.7</text><text x="525" y="776" class="value">83.2</text><text x="85" y="811" class="tiny">RoBERTa 的 SQuAD 结果不使用额外 QA 训练数据。</text>
  <g filter="url(#shadow)"><rect x="725" y="545" width="620" height="290" rx="18" fill="#fff" stroke="#fdba74"/></g><text x="755" y="586" class="panel">GLUE public test：集成提交</text><text x="755" y="611" class="small">截至 2019-07-25；不是上方单模型 dev 设置。</text><rect x="765" y="651" width="520" height="60" rx="11" fill="#f8fafc" stroke="#cbd5e1"/><text x="790" y="688" class="label">XLNet ensemble</text><text x="1245" y="690" text-anchor="end" class="big" fill="#475569">88.4</text><rect x="765" y="730" width="520" height="60" rx="11" fill="#fff7ed" stroke="#f59e0b"/><text x="790" y="767" class="label">RoBERTa ensemble</text><text x="1245" y="769" text-anchor="end" class="big">88.5</text><text x="755" y="814" class="tiny">每个任务集成 5–7 个单任务模型；RTE、STS、MRPC 从 MNLI 微调模型继续训练。</text>
  <text x="55" y="873" class="tiny">来源：Liu et al. (2019), Tables 4–7。不同任务指标与评估划分不可横向当作同一尺度；折线仅展示同一任务内部的累积变化。</text>
</svg>
