<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#07162e"/><stop offset="1" stop-color="#24153f"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#afc1e4"/></marker></defs><rect width="1400" height="760" rx="30" fill="url(#c)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">Promptable segmentation：同一图像，提示决定“分哪一个”</text><text x="52" y="96" fill="#a8bee2" font-size="18">点、框、粗 mask 都是对“目标对象”的不同表达；歧义时模型返回多个候选</text><g transform="translate(70,190)"><rect width="260" height="350" rx="20" fill="#102d46" stroke="#2ec7de" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">输入图像</text><rect x="38" y="105" width="180" height="145" rx="12" fill="#2b536b"/><circle cx="93" cy="154" r="28" fill="#efb449"/><path d="M45 235l48-62 32 35 28-45 45 72z" fill="#4bd3a4"/><circle cx="125" cy="180" r="9" fill="#ff4f70"/><text x="38" y="300" fill="#f2ca78" font-size="17">同一场景含多个对象</text></g><g transform="translate(400,190)"><rect width="280" height="350" rx="20" fill="#172449" stroke="#9b75ed" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">Prompt</text><circle cx="70" cy="130" r="12" fill="#efad3c"/><text x="95" y="137" fill="#f3cb7b" font-size="17">positive point</text><circle cx="70" cy="180" r="12" fill="#49d5a7"/><text x="95" y="187" fill="#a9efd2" font-size="17">negative point</text><rect x="48" y="230" width="180" height="65" rx="10" fill="#3b2d68"/><text x="87" y="270" fill="#fff" font-size="18">box prompt</text></g><g transform="translate(750,190)"><rect width="280" height="350" rx="20" fill="#29203f" stroke="#efad3e" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">Mask decoder</text><rect x="38" y="105" width="205" height="75" rx="12" fill="#4c376b"/><text x="90" y="150" fill="#fff" font-size="19">mask logits</text><rect x="38" y="210" width="205" height="75" rx="12" fill="#12443e"/><text x="91" y="255" fill="#a8efd1" font-size="19">IoU score</text></g><g transform="translate(1100,190)"><rect width="230" height="350" rx="20" fill="#103d3a" stroke="#49d6a8" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">输出</text><path d="M40 135l55-60 35 38 35-52 45 74z" fill="#4bd3a4"/><text x="38" y="270" fill="#a8efd2" font-size="17">候选 1 / 2 / 3</text><text x="38" y="310" fill="#f2ca78" font-size="17">选择或继续提示</text></g><path d="M335 355h55M685 355h55M1035 355h55" stroke="#afc1e4" stroke-width="4" marker-end="url(#a)"/><path d="M1240 590C930 665 430 665 175 590" fill="none" stroke="#f2d34b" stroke-width="3" stroke-dasharray="10 10"/><text x="435" y="700" fill="#f2d454" font-size="18">交互式分割的优势：错误可以用新的 prompt 纠正，而不是重训模型</text></g></svg>
