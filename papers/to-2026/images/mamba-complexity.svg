<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Mamba 与 Transformer 的训练和推理复杂度</title><desc id="desc">对比全序列训练、单 token 增量解码、上下文状态以及论文 A100 基准的适用条件。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#142039"/></linearGradient><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:20px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d3deec}.small{font-size:14px;fill:#9fb2cc}.metric{font-size:27px;font-weight:800;fill:#fff}.cell{stroke:#31475f;stroke-width:1}.warn{fill:#fbbf24}</style></defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/><text x="64" y="72" class="title">复杂度账本：训练线性，增量状态不随上下文增长</text><text x="64" y="107" class="sub">L = 序列长度，D = 模型宽度，N = 每通道 SSM 状态维度；省略 batch、层数与常数</text>
  <g transform="translate(64 154)"><rect width="1312" height="356" rx="24" fill="#0d1a2c" stroke="#354961"/><g transform="translate(0 0)"><rect width="280" height="74" rx="24" fill="#12263d"/><rect x="280" width="344" height="74" fill="#075985"/><rect x="624" width="344" height="74" fill="#047857"/><rect x="968" width="344" height="74" rx="24" fill="#31304f"/><text x="30" y="46" class="h">指标</text><text x="452" y="46" class="h" text-anchor="middle">Transformer Attention</text><text x="796" y="46" class="h" text-anchor="middle">Mamba Selective SSM</text><text x="1140" y="46" class="h" text-anchor="middle">真正含义</text></g>
    <g transform="translate(0 74)"><rect width="280" height="88" fill="#101f32" class="cell"/><rect x="280" width="344" height="88" fill="#102941" class="cell"/><rect x="624" width="344" height="88" fill="#12362f" class="cell"/><rect x="968" width="344" height="88" fill="#171f34" class="cell"/><text x="30" y="52" class="body">全序列训练计算</text><text x="452" y="56" class="metric" text-anchor="middle">O(L²D)</text><text x="796" y="56" class="metric" text-anchor="middle" fill="#6ee7b7">O(LDN)</text><text x="992" y="37" class="small">Mamba 随 L 线性</text><text x="992" y="64" class="small">N 是额外状态展开</text></g>
    <g transform="translate(0 162)"><rect width="280" height="88" fill="#101f32" class="cell"/><rect x="280" width="344" height="88" fill="#102941" class="cell"/><rect x="624" width="344" height="88" fill="#12362f" class="cell"/><rect x="968" width="344" height="88" fill="#171f34" class="cell"/><text x="30" y="52" class="body">单 token 增量计算</text><text x="452" y="56" class="metric" text-anchor="middle">O(LD)</text><text x="796" y="56" class="metric" text-anchor="middle" fill="#6ee7b7">O(DN)</text><text x="992" y="37" class="small">Attention 要读取历史 KV</text><text x="992" y="64" class="small">Mamba 只更新当前状态</text></g>
    <g transform="translate(0 250)"><rect width="280" height="106" rx="0 0 0 24" fill="#101f32" class="cell"/><rect x="280" width="344" height="106" fill="#102941" class="cell"/><rect x="624" width="344" height="106" fill="#12362f" class="cell"/><rect x="968" width="344" height="106" rx="0 0 24 0" fill="#171f34" class="cell"/><text x="30" y="60" class="body">单层上下文状态</text><text x="452" y="64" class="metric" text-anchor="middle">O(LD) KV</text><text x="796" y="64" class="metric" text-anchor="middle" fill="#6ee7b7">O(DN) h</text><text x="992" y="45" class="small">固定状态带来吞吐优势</text><text x="992" y="73" class="small">也意味着历史被有损压缩</text></g>
  </g>
  <g transform="translate(64 561)"><rect width="638" height="247" rx="24" fill="#142b43" stroke="#38bdf8"/><text x="28" y="46" class="h">论文训练 kernel 基准</text><text x="28" y="91" class="body">状态维度 N = 16，A100 80GB PCIe</text><text x="28" y="133" class="metric" fill="#7dd3fc">L &gt; 2K 时快于 FlashAttention-2</text><text x="28" y="174" class="metric" fill="#7dd3fc">比朴素 PyTorch scan 快 20–40×</text><text x="28" y="214" class="small">比较的是 scan 算子，不等于所有端到端训练都同倍数</text></g>
  <g transform="translate(738 561)"><rect width="638" height="247" rx="24" fill="#14382f" stroke="#34d399"/><text x="28" y="46" class="h">论文自回归推理基准</text><text x="28" y="91" class="body">A100 80GB，prompt length = 2048</text><text x="28" y="139" class="metric" fill="#6ee7b7">相近规模吞吐约 4–5×</text><text x="28" y="181" class="body">无 KV cache，可使用更大 batch</text><text x="28" y="214" class="small">速度随硬件、batch、长度、kernel 与服务框架变化</text></g>
  <g transform="translate(64 839)"><rect width="1312" height="38" rx="12" fill="#3a280c" stroke="#f59e0b"/><text x="20" y="26" class="small warn">不要写成“Mamba 永远快 5×”：这是特定 A100 基准；短序列、小 batch 或缺少优化 kernel 时，线性复杂度不保证更低墙钟时间。</text></g>
</svg>
