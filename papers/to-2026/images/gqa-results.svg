<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171a38"/></linearGradient>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#edf4ff}.muted{fill:#94a8c8}.h{font-size:34px;font-weight:800}.s{font-size:18px}.m{font-size:23px;font-weight:700}.v{font-size:20px;font-weight:800}</style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg5)"/>
  <text x="66" y="66" class="h">EMNLP 2023 主结果：GQA-8 接近 MHA-XXL 质量，速度接近 MQA</text>
  <text x="66" y="104" class="muted s">5% uptrained T5.1.1 XXL；时间为每样本每 TPUv4 chip；任务平均由 5 个摘要、WMT 与 TriviaQA 组成</text>

  <g transform="translate(65 145)">
    <rect width="1270" height="300" rx="22" fill="#0d2038" stroke="#2d4767"/>
    <text x="28" y="43" class="m">平均推理时间（越短越好）</text>
    <g transform="translate(30 76)">
      <text y="29" class="m">MHA-XXL</text><rect x="190" y="3" width="906" height="35" rx="10" fill="#446895"/><text x="1115" y="29" class="v">1.51 s</text>
      <g transform="translate(0 57)"><text y="29" class="m">MHA-Large</text><rect x="190" y="3" width="222" height="35" rx="10" fill="#527aa9"/><text x="430" y="29" class="v">0.37 s</text></g>
      <g transform="translate(0 114)"><text y="29" class="m" fill="#6ee8bd">GQA-8-XXL</text><rect x="190" y="3" width="168" height="35" rx="10" fill="#38d3a5"/><text x="376" y="29" class="v" fill="#6ee8bd">0.28 s · 5.4× vs MHA-XXL</text></g>
      <g transform="translate(0 171)"><text y="29" class="m">MQA-XXL</text><rect x="190" y="3" width="144" height="35" rx="10" fill="#8e70dc"/><text x="352" y="29" class="v">0.24 s</text></g>
    </g>
  </g>

  <g transform="translate(65 480)">
    <rect width="1270" height="255" rx="22" fill="#0d2038" stroke="#2d4767"/>
    <text x="28" y="43" class="m">七任务平均分（越高越好；不同任务原始指标直接平均）</text>
    <g transform="translate(30 82)">
      <line x1="280" y1="132" x2="1220" y2="132" stroke="#4c6380" stroke-width="2"/>
      <g class="muted s"><text x="280" y="162">45.5</text><text x="557" y="162">46.0</text><text x="834" y="162">46.5</text><text x="1110" y="162">47.0+</text></g>
      <g>
        <circle cx="557" cy="75" r="13" fill="#527aa9"/><text x="557" y="45" text-anchor="middle" class="v">MHA-Large 46.0</text>
        <circle cx="1220" cy="75" r="13" fill="#446895"/><text x="1220" y="45" text-anchor="end" class="v">MHA-XXL 47.2</text>
        <circle cx="1165" cy="112" r="16" fill="#38d3a5"/><text x="1140" y="119" text-anchor="end" class="v" fill="#6ee8bd">GQA-8 47.1</text>
        <circle cx="889" cy="75" r="13" fill="#8e70dc"/><text x="889" y="45" text-anchor="middle" class="v">MQA 46.6</text>
      </g>
    </g>
  </g>

  <g transform="translate(65 770)"><rect width="1270" height="48" rx="14" fill="#15362f" stroke="#38d3a5"/><text x="635" y="31" text-anchor="middle" class="s">GQA-8：相对 MHA-XXL 平均分仅 −0.1，时间约为 18.5%；相对 MQA 只慢约 17%，平均分 +0.5。</text></g>
</svg>
