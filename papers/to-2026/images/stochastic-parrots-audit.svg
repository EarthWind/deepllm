<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#08152c"/><stop offset="1" stop-color="#21153e"/></linearGradient></defs><rect width="1400" height="760" rx="28" fill="url(#b)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">一个可复现的模型风险审计闭环</text><text x="52" y="96" fill="#a8bde4" font-size="18">把“感觉有风险”拆成可检查的证据、假设、决策与责任</text>
<g transform="translate(80,170)"><rect width="250" height="420" rx="20" fill="#112c46" stroke="#36c6de" stroke-width="2"/><text x="30" y="58" fill="#fff" font-size="24" font-weight="700">1. 数据卡</text><text x="30" y="108" fill="#a6dce7" font-size="17">来源 / 时间 / 许可</text><text x="30" y="143" fill="#a6dce7" font-size="17">语言与群体覆盖</text><text x="30" y="178" fill="#a6dce7" font-size="17">PII 与近重复</text><text x="30" y="250" fill="#fff" font-size="16">事实：已测量什么？</text><text x="30" y="286" fill="#f4c878" font-size="16">缺口：仍未知什么？</text></g>
<g transform="translate(400,170)"><rect width="250" height="420" rx="20" fill="#152244" stroke="#9b78ed" stroke-width="2"/><text x="30" y="58" fill="#fff" font-size="24" font-weight="700">2. 影响测量</text><text x="30" y="108" fill="#c7b8ff" font-size="17">分层错误率</text><text x="30" y="143" fill="#c7b8ff" font-size="17">代表性缺口</text><text x="30" y="178" fill="#c7b8ff" font-size="17">隐私/泄露信号</text><text x="30" y="250" fill="#fff" font-size="16">不只看平均分</text><text x="30" y="286" fill="#f4c878" font-size="16">报告不确定性</text></g>
<g transform="translate(720,170)"><rect width="250" height="420" rx="20" fill="#29213e" stroke="#f0ad3c" stroke-width="2"/><text x="30" y="58" fill="#fff" font-size="24" font-weight="700">3. 成本核算</text><text x="30" y="108" fill="#f2cd85" font-size="17">GPU 小时与功率</text><text x="30" y="143" fill="#f2cd85" font-size="17">PUE 与碳强度</text><text x="30" y="178" fill="#f2cd85" font-size="17">复现价值与机会成本</text><text x="30" y="250" fill="#fff" font-size="16">写明假设</text><text x="30" y="286" fill="#f4c878" font-size="16">避免伪精确</text></g>
<g transform="translate(1040,170)"><rect width="250" height="420" rx="20" fill="#103b3a" stroke="#46d5a4" stroke-width="2"/><text x="30" y="58" fill="#fff" font-size="24" font-weight="700">4. 治理决策</text><text x="30" y="108" fill="#a5efd0" font-size="17">继续 / 缩小范围</text><text x="30" y="143" fill="#a5efd0" font-size="17">人工复核与申诉</text><text x="30" y="178" fill="#a5efd0" font-size="17">撤回与修复机制</text><text x="30" y="250" fill="#fff" font-size="16">把受影响者纳入决策</text><text x="30" y="286" fill="#f4c878" font-size="16">记录谁拥有否决权</text></g>
<path d="M334 380h60M654 380h60M974 380h60" stroke="#a8bde4" stroke-width="4" marker-end="url(#a)"/><path d="M1165 612c-220 90-820 90-1040 0" fill="none" stroke="#f4c438" stroke-width="3" stroke-dasharray="10 10"/><text x="505" y="718" fill="#f4d66f" font-size="18">审计不是一次性 checkbox，而是可追踪的反馈回路</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#a8bde4"/></marker></defs></svg>
