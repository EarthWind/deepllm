<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Mamba 从连续状态空间到选择性离散递推</title><desc id="desc">展示连续 SSM、零阶保持离散化，以及 Delta 对保留和重置状态的门控解释。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#142137"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:21px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d3deec}.small{font-size:14px;fill:#9fb2cc}.formula{font-size:22px;font-family:"JetBrains Mono","Noto Sans SC",monospace;fill:#eef6ff}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/><text x="64" y="72" class="title">选择从哪里来？先把连续系统离散化</text><text x="64" y="107" class="sub">Mamba 的门控不是额外贴上去的 sigmoid：它可以从输入依赖时间步 Δ 的 ZOH 离散化中推出来</text>
  <g transform="translate(64 158)"><rect width="372" height="250" rx="24" fill="#132943" stroke="#38bdf8"/><text x="28" y="46" class="h">① 连续时间 SSM</text><text x="28" y="98" class="formula">h′(t) = A h(t) + B x(t)</text><text x="28" y="144" class="formula">y(t)  = C h(t) + D x(t)</text><path d="M28 173h316" stroke="#31506b"/><text x="28" y="207" class="body">A 描述状态衰减与演化</text><text x="28" y="234" class="small">Mamba 中 A 采用结构化对角形式并跨 token 固定</text></g>
  <path d="M447 283h88" class="line"/><g transform="translate(547 158)"><rect width="380" height="250" rx="24" fill="#26244b" stroke="#818cf8"/><text x="28" y="46" class="h">② 零阶保持（ZOH）</text><text x="28" y="93" class="formula">Āₜ = exp(Δₜ A)</text><text x="28" y="137" class="formula">B̄ₜ = A⁻¹(Āₜ − I) Bₜ</text><path d="M28 165h324" stroke="#4b4778"/><text x="28" y="199" class="body">假设一个时间步内输入保持不变</text><text x="28" y="228" class="small">实际计算用稳定形式避免接近 0 时相消</text></g>
  <path d="M938 283h88" class="line"/><g transform="translate(1038 158)"><rect width="338" height="250" rx="24" fill="#143a31" stroke="#34d399"/><text x="28" y="46" class="h">③ 离散选择性递推</text><text x="28" y="95" class="formula">hₜ = Āₜhₜ₋₁ + B̄ₜxₜ</text><text x="28" y="141" class="formula">yₜ = Cₜhₜ + Dxₜ</text><path d="M28 169h282" stroke="#31594e"/><text x="28" y="202" class="body">Δₜ、Bₜ、Cₜ = f(xₜ)</text><text x="28" y="230" class="small">动力学随位置变化，不再等价于固定卷积</text></g>
  <g transform="translate(64 466)"><rect width="1312" height="378" rx="26" fill="#0d1a2c" stroke="#344961"/><text x="28" y="47" class="h">N = 1 的特殊情形：Δ 就是有理论来源的 RNN gate</text><text x="28" y="91" class="formula">A = −1, B = 1, Δₜ = softplus(wᵀxₜ)  ⇒  gₜ = sigmoid(wᵀxₜ)</text><text x="28" y="133" class="formula">hₜ = (1 − gₜ)hₜ₋₁ + gₜxₜ</text>
    <g transform="translate(28 174)"><rect width="596" height="160" rx="20" fill="#142c3c"/><circle cx="80" cy="80" r="47" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/><text x="80" y="72" class="formula" text-anchor="middle">Δ 小</text><text x="80" y="101" class="small" text-anchor="middle">g → 0</text><path d="M145 80h76" class="line"/><rect x="235" y="40" width="326" height="80" rx="16" fill="#0b1f31"/><text x="257" y="72" class="body">旧状态持续：hₜ ≈ hₜ₋₁</text><text x="257" y="101" class="small">当前 token 像短暂噪声，被忽略</text></g>
    <g transform="translate(658 174)"><rect width="626" height="160" rx="20" fill="#17352f"/><circle cx="80" cy="80" r="47" fill="#065f46" stroke="#34d399" stroke-width="3"/><text x="80" y="72" class="formula" text-anchor="middle">Δ 大</text><text x="80" y="101" class="small" text-anchor="middle">g → 1</text><path d="M145 80h76" class="line"/><rect x="235" y="40" width="356" height="80" rx="16" fill="#0b2922"/><text x="257" y="72" class="body">状态重置：hₜ ≈ xₜ</text><text x="257" y="101" class="small">当前 token 被选择，旧信息被快速遗忘</text></g>
  </g><text x="64" y="884" class="small">注意：完整 Mamba 的状态维度 N 通常大于 1；门控等价是论文用于解释 Δ 的特殊情形，不表示整个模型退化成一个标量 EMA。</text>
</svg>
