<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Switch Transformer Block 与 Top-1 路由</title>
  <desc id="desc">注意力保持稠密，原来的单个前馈网络替换成路由器与多个 FFN 专家。每个 token 只选择一个专家，输出乘以对应路由概率，再通过残差连接回到主干。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#242454"/></linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13b7c8"/><stop offset="1" stop-color="#6759e8"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb34b"/><stop offset="1" stop-color="#ff6577"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".4"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#aebfda"/></marker>
    <marker id="arrowHot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#ff9a55"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#afbfda}.head{font-size:22px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#deebfb}.small{font-size:14px;fill:#aebfda}.dark{font-size:16px;font-weight:720;fill:#10243a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px;fill:#f4f8ff}.formula{font-family:"STIX Two Math","Times New Roman",serif;font-size:20px;fill:#fff}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="sans title">Switch Transformer：Attention 不变，只把 FFN 换成条件计算</text>
  <text x="54" y="94" class="sans sub">同一层拥有多个专家，但每个 token 的激活路径只有一条；总参数量与单 token 计算量因此部分解耦</text>

  <g filter="url(#shadow)"><rect x="54" y="132" width="1172" height="508" rx="25" fill="#10233b" stroke="#526d8f" stroke-width="2"/></g>
  <rect x="82" y="174" width="144" height="62" rx="14" fill="#263c5d"/>
  <text x="154" y="212" text-anchor="middle" class="sans mono">token x</text>
  <path d="M226 205H278" stroke="#aebfda" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="289" y="165" width="184" height="80" rx="15" fill="#1e5364" stroke="#42c4cf"/>
  <text x="381" y="197" text-anchor="middle" class="sans head">Self-Attention</text>
  <text x="381" y="224" text-anchor="middle" class="sans small">仍然是稠密子层</text>
  <path d="M473 205H525" stroke="#aebfda" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="536" y="165" width="184" height="80" rx="15" fill="url(#router)"/>
  <text x="628" y="197" text-anchor="middle" class="sans head">Router</text>
  <text x="628" y="224" text-anchor="middle" class="sans small">p = softmax(Wᵣx)</text>

  <path d="M720 195C780 195 787 174 836 174" fill="none" stroke="#526a8c" stroke-width="2.5"/>
  <path d="M720 202C780 202 787 276 836 276" fill="none" stroke="#526a8c" stroke-width="2.5"/>
  <path d="M720 209C780 209 787 378 836 378" fill="none" stroke="#ff9a55" stroke-width="5" marker-end="url(#arrowHot)"/>
  <path d="M720 216C780 216 787 480 836 480" fill="none" stroke="#526a8c" stroke-width="2.5"/>

  <g opacity=".58">
    <rect x="848" y="141" width="204" height="67" rx="14" fill="#253858" stroke="#60799b"/>
    <text x="950" y="181" text-anchor="middle" class="sans body">Expert 1 · FFN</text>
    <rect x="848" y="243" width="204" height="67" rx="14" fill="#253858" stroke="#60799b"/>
    <text x="950" y="283" text-anchor="middle" class="sans body">Expert 2 · FFN</text>
    <rect x="848" y="447" width="204" height="67" rx="14" fill="#253858" stroke="#60799b"/>
    <text x="950" y="487" text-anchor="middle" class="sans body">Expert 4 · FFN</text>
  </g>
  <rect x="838" y="337" width="224" height="82" rx="16" fill="url(#active)" filter="url(#shadow)"/>
  <text x="950" y="371" text-anchor="middle" class="sans head">Expert 3 · FFN</text>
  <text x="950" y="398" text-anchor="middle" class="sans dark">i* = argmax pᵢ(x)</text>

  <path d="M1062 378H1100" stroke="#ff9a55" stroke-width="4" marker-end="url(#arrowHot)"/>
  <rect x="1110" y="337" width="82" height="82" rx="16" fill="#273d5d" stroke="#ff9a55" stroke-width="2"/>
  <text x="1151" y="371" text-anchor="middle" class="sans body">乘门值</text>
  <text x="1151" y="399" text-anchor="middle" class="sans mono">pᵢ*</text>

  <path d="M1151 419V550H710" fill="none" stroke="#ff9a55" stroke-width="4" marker-end="url(#arrowHot)"/>
  <circle cx="680" cy="550" r="26" fill="#263c5d" stroke="#9cb0cd" stroke-width="2"/><text x="680" y="558" text-anchor="middle" class="sans head">+</text>
  <path d="M154 236V550H654" fill="none" stroke="#7188aa" stroke-width="2.5"/>
  <path d="M706 550H787" stroke="#aebfda" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="798" y="518" width="177" height="64" rx="14" fill="#263c5d"/>
  <text x="886" y="557" text-anchor="middle" class="sans mono">output</text>

  <text x="84" y="605" class="sans formula">y = pᵢ*(x) Eᵢ*(x)，i* = argmaxᵢ pᵢ(x)</text>
  <text x="663" y="605" class="sans small">溢出 token 的专家分支为 0，但残差主干仍将 x 传到下一层。</text>
</svg>
