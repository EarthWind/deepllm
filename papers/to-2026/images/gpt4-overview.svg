<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GPT-4 技术报告披露边界与训练评测闭环</title>
  <desc id="desc">报告明确 GPT-4 接受交错图像和文本并输出文本，使用下一 token 预训练和 RLHF 后训练；架构规模、硬件、计算量和数据构造没有披露。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#11162d"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset=".52" stop-color="#312e81"/><stop offset="1" stop-color="#581c87"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:22px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d5e1ef}.small{font-size:14px;fill:#9fb2cc}.tag{font-size:14px;font-weight:700}.card{fill:#101f34;stroke:#2c4564;stroke-width:1.5}.line{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" class="title">GPT-4：公开的是系统外轮廓，不是可复现配方</text>
  <text x="64" y="106" class="sub">蓝色路径 = 报告明确陈述　·　橙色区域 = 报告明确拒绝披露</text>

  <g transform="translate(64 175)">
    <rect width="230" height="116" rx="18" class="card"/>
    <rect x="22" y="22" width="66" height="66" rx="12" fill="#0c4a6e" stroke="#38bdf8"/>
    <path d="M37 72 51 55l11 12 9-8 9 13z" fill="#38bdf8"/><circle cx="70" cy="43" r="6" fill="#fbbf24"/>
    <text x="108" y="52" class="h">图像</text><text x="108" y="78" class="small">照片 · 图表</text><text x="108" y="98" class="small">文档 · 截图</text>
    <rect y="142" width="230" height="116" rx="18" class="card"/>
    <rect x="22" y="164" width="66" height="66" rx="12" fill="#1e3a8a" stroke="#60a5fa"/>
    <path d="M38 183h34M38 196h26M38 209h31" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <text x="108" y="196" class="h">文本</text><text x="108" y="224" class="small">任意交错输入</text>
    <text x="0" y="300" class="small">输入：image + text</text>
  </g>

  <path d="M306 233 C372 233 377 299 432 319" class="line"/><path d="M306 375 C372 375 378 351 432 338" class="line"/>

  <g transform="translate(444 160)" filter="url(#shadow)">
    <rect width="500" height="405" rx="28" fill="url(#core)" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="24" y="22" width="114" height="30" rx="15" fill="#083344"/><text x="81" y="43" class="tag" text-anchor="middle" fill="#67e8f9">报告明确</text>
    <text x="250" y="94" class="h" text-anchor="middle">Transformer-style model</text>
    <g transform="translate(65 112)">
      <rect width="370" height="58" rx="12" fill="#122347" stroke="#4f7bb8"/>
      <text x="185" y="36" class="body" text-anchor="middle">预训练：预测文档中的下一个 token</text>
      <path d="M185 63v23" class="line"/>
      <rect y="92" width="370" height="58" rx="12" fill="#20225a" stroke="#818cf8"/>
      <text x="185" y="128" class="body" text-anchor="middle">后训练：SFT → RM → PPO / RLHF</text>
      <path d="M185 155v23" class="line"/>
      <rect y="184" width="370" height="58" rx="12" fill="#36205c" stroke="#c084fc"/>
      <text x="185" y="220" class="body" text-anchor="middle">安全增强：额外提示 + RBRM 奖励</text>
    </g>
    <text x="250" y="383" class="small" text-anchor="middle">能力主要来自预训练；行为可控性主要来自后训练</text>
  </g>

  <path d="M956 330h89" class="line"/>
  <g transform="translate(1058 191)">
    <rect width="318" height="126" rx="18" class="card"/><text x="24" y="43" class="h">文本输出</text><text x="24" y="75" class="body">问答 · 推理 · 代码</text><text x="24" y="102" class="small">报告没有声称输出图像</text>
    <rect y="154" width="318" height="178" rx="18" class="card"/><text x="24" y="197" class="h">系统级评测</text><text x="24" y="231" class="body">考试 / NLP / 多语言 / 视觉</text><text x="24" y="261" class="body">事实性 / 校准 / 红队 / 安全</text><text x="24" y="296" class="small">模型能力 ≠ 产品可靠性</text>
  </g>

  <g transform="translate(64 650)">
    <rect width="1312" height="176" rx="22" fill="#241b18" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="22" y="20" width="114" height="30" rx="15" fill="#4a2b09"/><text x="79" y="41" class="tag" text-anchor="middle" fill="#fbbf24">没有披露</text>
    <text x="24" y="89" class="body">模型参数量与精确结构　·　是否 MoE　·　视觉编码器与融合方式　·　上下文长度　·　硬件型号与数量</text>
    <text x="24" y="126" class="body">训练 FLOPs 与成本　·　token 总数与语料配比　·　优化器和超参数　·　完整训练方法与数据构造</text>
    <text x="24" y="157" class="small">因此任何“GPT-4 有 X 万亿参数 / Y 个专家”的说法，都不是这份技术报告提供的事实。</text>
  </g>
</svg>
