<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#08152e"/><stop offset="1" stop-color="#25153e"/></linearGradient><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#b2c3e3"/></marker></defs><rect width="1400" height="760" rx="30" fill="url(#b)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">弱监督数据策略：规模换来覆盖，噪声由鲁棒训练吸收</text><text x="52" y="96" fill="#aabfe3" font-size="18">Whisper 不依赖每条样本都精确、统一、人工审核；它利用互联网转录的异质性</text><g transform="translate(65,190)"><rect width="250" height="350" rx="20" fill="#102d46" stroke="#2fc6de" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">多源音频</text><path d="M40 130q25-70 50 0t50 0 50 0 50 0" fill="none" stroke="#40d2df" stroke-width="5"/><text x="38" y="220" fill="#a8dce6" font-size="17">播客 / 视频 / 访谈</text><text x="38" y="255" fill="#a8dce6" font-size="17">多语言 / 多口音</text><text x="38" y="290" fill="#f2c979" font-size="17">转录质量不均</text></g><g transform="translate(390,190)"><rect width="250" height="350" rx="20" fill="#172449" stroke="#9b75ed" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">弱标签</text><rect x="40" y="110" width="170" height="80" rx="12" fill="#3a2d68"/><text x="62" y="158" fill="#fff" font-size="18">audio + text</text><text x="38" y="235" fill="#c8bafd" font-size="17">自动/人工混合</text><text x="38" y="270" fill="#c8bafd" font-size="17">时间戳不总精确</text><text x="38" y="305" fill="#f2c979" font-size="17">标签噪声可容忍</text></g><g transform="translate(715,190)"><rect width="250" height="350" rx="20" fill="#29203f" stroke="#efad3e" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">鲁棒训练</text><path d="M42 130h170M42 170h135M42 210h160" stroke="#f3c975" stroke-width="8" stroke-linecap="round"/><text x="38" y="270" fill="#f2cc7b" font-size="17">多任务 token</text><text x="38" y="305" fill="#f2cc7b" font-size="17">large-scale pretraining</text></g><g transform="translate(1040,190)"><rect width="250" height="350" rx="20" fill="#103d3a" stroke="#49d6a8" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">覆盖收益</text><text x="38" y="130" fill="#a8efd4" font-size="17">语言与口音更广</text><text x="38" y="170" fill="#a8efd4" font-size="17">零样本迁移</text><text x="38" y="210" fill="#a8efd4" font-size="17">噪声场景更稳</text><text x="38" y="280" fill="#f2ca78" font-size="17">代价：数据偏差</text><text x="38" y="315" fill="#f2ca78" font-size="17">版权与隐私风险</text></g><path d="M320 365h60M645 365h60M970 365h60" stroke="#b2c3e3" stroke-width="4" marker-end="url(#m)"/><path d="M1180 585C900 675 470 675 180 585" fill="none" stroke="#f2d34d" stroke-width="3" stroke-dasharray="10 10"/><text x="470" y="700" fill="#f2d451" font-size="18">弱监督不是“没有监督”，而是把单条标签精度换成总体覆盖与鲁棒性</text></g></svg>
