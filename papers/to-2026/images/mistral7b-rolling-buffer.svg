<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Rolling Buffer KV Cache</title>
  <desc id="desc">固定 W 个物理缓存槽，绝对位置 i 写入 i modulo W；位置超过窗口后覆盖最旧值，同时保留绝对位置标签以正确应用因果和滑窗掩码。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#19263f"/></linearGradient>
    <linearGradient id="hot" x1="0" x2="1"><stop stop-color="#f8c15d"/><stop offset="1" stop-color="#e77940"/></linearGradient>
    <linearGradient id="cool" x1="0" x2="1"><stop stop-color="#35c4d5"/><stop offset="1" stop-color="#3e73d7"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#91abc7"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity=".4"/></filter>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#9eb3cc}.head{font-size:20px;font-weight:750;fill:#fff}.body{font-size:15px;fill:#dce8f5}.small{font-size:13px;fill:#9eb3cc}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#f6f9ff}.dark{font-size:15px;font-weight:760;fill:#152238}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="59" class="sans title">Rolling Buffer Cache：序列继续增长，物理缓存不再增长</text>
  <text x="52" y="91" class="sans sub">逻辑位置单调增加，物理槽循环复用；正确性依赖绝对位置标签与局部因果 Mask</text>

  <g filter="url(#shadow)"><rect x="48" y="126" width="610" height="474" rx="22" fill="#0d2135" stroke="#355672"/></g>
  <text x="77" y="165" class="sans head">W=8，写完绝对位置 0…11 后</text>
  <text x="77" y="190" class="sans small">新位置 8…11 覆盖槽 0…3；槽中保存位置 4…11，按逻辑位置排序后供查询读取</text>
  <circle cx="349" cy="382" r="128" fill="#10283d" stroke="#3a5a75" stroke-width="3"/>
  <circle cx="349" cy="382" r="63" fill="url(#cool)"/>
  <text x="349" y="375" text-anchor="middle" class="sans head">slot</text><text x="349" y="402" text-anchor="middle" class="sans mono">i mod 8</text>
  <g class="sans">
    <g transform="translate(318 221)"><rect width="62" height="48" rx="12" fill="url(#hot)"/><text x="31" y="20" text-anchor="middle" class="dark">slot 0</text><text x="31" y="39" text-anchor="middle" class="dark">pos 8</text></g>
    <g transform="translate(433 263)"><rect width="62" height="48" rx="12" fill="url(#hot)"/><text x="31" y="20" text-anchor="middle" class="dark">slot 1</text><text x="31" y="39" text-anchor="middle" class="dark">pos 9</text></g>
    <g transform="translate(474 358)"><rect width="68" height="48" rx="12" fill="url(#hot)"/><text x="34" y="20" text-anchor="middle" class="dark">slot 2</text><text x="34" y="39" text-anchor="middle" class="dark">pos 10</text></g>
    <g transform="translate(433 464)"><rect width="68" height="48" rx="12" fill="url(#hot)"/><text x="34" y="20" text-anchor="middle" class="dark">slot 3</text><text x="34" y="39" text-anchor="middle" class="dark">pos 11</text></g>
    <g transform="translate(315 502)"><rect width="68" height="48" rx="12" fill="#2a6682"/><text x="34" y="20" text-anchor="middle" class="body">slot 4</text><text x="34" y="39" text-anchor="middle" class="body">pos 4</text></g>
    <g transform="translate(199 464)"><rect width="68" height="48" rx="12" fill="#2a6682"/><text x="34" y="20" text-anchor="middle" class="body">slot 5</text><text x="34" y="39" text-anchor="middle" class="body">pos 5</text></g>
    <g transform="translate(156 358)"><rect width="68" height="48" rx="12" fill="#2a6682"/><text x="34" y="20" text-anchor="middle" class="body">slot 6</text><text x="34" y="39" text-anchor="middle" class="body">pos 6</text></g>
    <g transform="translate(199 263)"><rect width="68" height="48" rx="12" fill="#2a6682"/><text x="34" y="20" text-anchor="middle" class="body">slot 7</text><text x="34" y="39" text-anchor="middle" class="body">pos 7</text></g>
  </g>
  <path d="M427 215A186 186 0 0 1 544 333" fill="none" stroke="#e99a48" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="77" y="576" class="sans mono">physical_slot = absolute_position % W</text>

  <g filter="url(#shadow)"><rect x="694" y="126" width="538" height="474" rx="22" fill="#0d2135" stroke="#355672"/></g>
  <text x="724" y="165" class="sans head">一条序列的理想 bf16 KV payload</text>
  <text x="724" y="190" class="sans small">32 层 · head_dim 128；不含分页、对齐、临时张量与 allocator 开销</text>
  <text x="724" y="233" class="sans body">Rolling GQA, W=4K</text><rect x="724" y="248" width="31" height="28" rx="7" fill="url(#hot)"/><text x="766" y="268" class="sans mono">512 MiB</text>
  <text x="724" y="315" class="sans body">Full GQA, N=8K</text><rect x="724" y="330" width="62" height="28" rx="7" fill="#4e87b5"/><text x="797" y="350" class="sans mono">1 GiB</text>
  <text x="724" y="397" class="sans body">Full GQA, N=32K</text><rect x="724" y="412" width="248" height="28" rx="7" fill="#52749a"/><text x="983" y="432" class="sans mono">4 GiB</text>
  <text x="724" y="479" class="sans body">Full MHA, N=32K</text><rect x="724" y="494" width="448" height="28" rx="7" fill="#654f5f"/><text x="1176" y="514" text-anchor="end" class="sans mono">16 GiB</text>
  <rect x="724" y="542" width="448" height="36" rx="10" fill="#293129" stroke="#d79042"/><text x="948" y="566" text-anchor="middle" class="sans body">论文口径：32K 上 SWA 相对 full GQA 节省 8×</text>
  <text x="52" y="665" class="sans small">覆盖旧槽不会丢掉当前层仍可见的信息：超过窗口的 Key / Value 本来就会被局部注意力 Mask 屏蔽。缓存槽仍须携带绝对位置，不能只看物理下标。</text>
</svg>
