<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V3 节点受限路由</title>
  <desc id="desc">256 个路由专家分布到 8 个节点组；每个 token 先按各节点最高两个专家修正分数之和选择 4 个节点，再在候选节点内选择最终 8 个专家。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061522"/><stop offset="1" stop-color="#1a2140"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#34c7d8"/><stop offset="1" stop-color="#367bdd"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#ffc45d"/><stop offset="1" stop-color="#ee7d45"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity=".42"/></filter>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#9fb5d0}.head{font-size:20px;font-weight:760;fill:#fff}.body{font-size:15px;fill:#dce8f6}.small{font-size:13px;fill:#9fb5d0}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#f4f8ff}.dark{font-size:15px;font-weight:760;fill:#102033}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="59" class="sans title">Node-Limited Routing：先给 IB 扇出设上界，再选 Top-8</text>
  <text x="52" y="91" class="sans sub">训练 EP64 跨 8 个节点；每节点 8 GPU、32 个 routed experts，每 token 最多访问 4 个节点</text>

  <g filter="url(#shadow)"><rect x="48" y="126" width="780" height="489" rx="22" fill="#0d2236" stroke="#355773"/></g>
  <text x="78" y="166" class="sans head">8 个专家组映射到 8 个节点 · 图中选中 Node 0 / 2 / 5 / 7</text>
  <g class="sans">
    <rect x="78" y="199" width="164" height="118" rx="15" fill="url(#cyan)"/><text x="160" y="229" text-anchor="middle" class="dark">Node 0 · selected</text><text x="160" y="258" text-anchor="middle" class="dark">E0…E31</text><circle cx="126" cy="288" r="10" fill="#ffd166"/><circle cx="160" cy="288" r="10" fill="#ffd166"/><circle cx="194" cy="288" r="10" fill="#215070"/>
    <rect x="263" y="199" width="164" height="118" rx="15" fill="#263b51"/><text x="345" y="229" text-anchor="middle" class="body">Node 1</text><text x="345" y="258" text-anchor="middle" class="small">E32…E63</text><circle cx="311" cy="288" r="10" fill="#38546f"/><circle cx="345" cy="288" r="10" fill="#38546f"/>
    <rect x="448" y="199" width="164" height="118" rx="15" fill="url(#cyan)"/><text x="530" y="229" text-anchor="middle" class="dark">Node 2 · selected</text><text x="530" y="258" text-anchor="middle" class="dark">E64…E95</text><circle cx="496" cy="288" r="10" fill="#ffd166"/><circle cx="530" cy="288" r="10" fill="#215070"/><circle cx="564" cy="288" r="10" fill="#ffd166"/>
    <rect x="633" y="199" width="164" height="118" rx="15" fill="#263b51"/><text x="715" y="229" text-anchor="middle" class="body">Node 3</text><text x="715" y="258" text-anchor="middle" class="small">E96…E127</text><circle cx="681" cy="288" r="10" fill="#38546f"/><circle cx="715" cy="288" r="10" fill="#38546f"/>
    <rect x="78" y="342" width="164" height="118" rx="15" fill="#263b51"/><text x="160" y="372" text-anchor="middle" class="body">Node 4</text><text x="160" y="401" text-anchor="middle" class="small">E128…E159</text>
    <rect x="263" y="342" width="164" height="118" rx="15" fill="url(#cyan)"/><text x="345" y="372" text-anchor="middle" class="dark">Node 5 · selected</text><text x="345" y="401" text-anchor="middle" class="dark">E160…E191</text><circle cx="311" cy="431" r="10" fill="#ffd166"/><circle cx="345" cy="431" r="10" fill="#ffd166"/>
    <rect x="448" y="342" width="164" height="118" rx="15" fill="#263b51"/><text x="530" y="372" text-anchor="middle" class="body">Node 6</text><text x="530" y="401" text-anchor="middle" class="small">E192…E223</text>
    <rect x="633" y="342" width="164" height="118" rx="15" fill="url(#cyan)"/><text x="715" y="372" text-anchor="middle" class="dark">Node 7 · selected</text><text x="715" y="401" text-anchor="middle" class="dark">E224…E255</text><circle cx="681" cy="431" r="10" fill="#ffd166"/><circle cx="715" cy="431" r="10" fill="#ffd166"/>
  </g>
  <rect x="78" y="493" width="719" height="88" rx="14" fill="#29322d" stroke="#d18c45"/>
  <text x="102" y="524" class="sans mono">group_score(node) = sum(top-2 corrected expert scores)</text><text x="102" y="552" class="sans mono">Top-4 nodes → candidate experts → global Top-8</text><text x="102" y="574" class="sans small">黄色圆点为最终 8 个 routed experts；1 个 shared expert 另行始终执行</text>

  <g filter="url(#shadow)"><rect x="854" y="126" width="378" height="489" rx="22" fill="#0d2236" stroke="#355773"/></g>
  <text x="884" y="166" class="sans head">通信拓扑如何被利用</text>
  <rect x="888" y="199" width="310" height="90" rx="14" fill="#2a314e" stroke="#7967bb"/><text x="1043" y="230" text-anchor="middle" class="sans head">跨节点 · InfiniBand</text><text x="1043" y="259" text-anchor="middle" class="sans body">50 GB/s · 最多 4 个目标节点</text>
  <rect x="888" y="310" width="310" height="90" rx="14" fill="#163e4c" stroke="#3bb7c6"/><text x="1043" y="341" text-anchor="middle" class="sans head">节点内 · NVLink</text><text x="1043" y="370" text-anchor="middle" class="sans body">160 GB/s · 转发到目标 GPU</text>
  <rect x="888" y="421" width="310" height="133" rx="14" fill="url(#amber)"/><text x="1043" y="452" text-anchor="middle" class="sans dark">Warp-specialized All-to-All</text><text x="1043" y="482" text-anchor="middle" class="sans dark">20 SM · 10 communication channels</text><text x="1043" y="511" text-anchor="middle" class="sans dark">dispatch / forward / receive 重叠</text><text x="1043" y="536" text-anchor="middle" class="sans dark">训练全程 token dropping = 0</text>
  <text x="52" y="665" class="sans body">节点限制只约束跨节点覆盖，不保证每个 batch 天然均衡；动态 bias 与大规模 EP/DP 共同维持计算负载。</text>
  <text x="52" y="691" class="sans small">论文中的 4 节点上限针对其 H800 + IB/NVLink 拓扑；换集群必须重新评估最优 M。</text>
</svg>
