<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Switch Transformer 专家并行与 All-to-All 通信</title>
  <desc id="desc">各设备先本地计算路由，把 token 按专家重排后通过 all-to-all 发往拥有对应专家参数的设备。专家执行密集前馈网络，再通过第二次 all-to-all 将输出送回原 token 所在设备并恢复顺序。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#242454"/></linearGradient>
    <linearGradient id="a2a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b8c7"/><stop offset="1" stop-color="#725eea"/></linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".4"/></filter>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#aebfda"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#afbfda}.head{font-size:21px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#deebfb}.small{font-size:14px;fill:#aebfda}.dark{font-size:15px;font-weight:720;fill:#10243a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#f4f8ff}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg3)"/>
  <text x="54" y="62" class="sans title">专家并行：省下的是 FFN 计算，新增的是两次跨设备重排</text>
  <text x="54" y="94" class="sans sub">稀疏数学只有一行 argmax；高性能实现的中心却是 token dispatch、All-to-All 与批量 GEMM</text>

  <g filter="url(#shadow3)"><rect x="54" y="132" width="1172" height="510" rx="25" fill="#10233b" stroke="#526d8f" stroke-width="2"/></g>

  <text x="83" y="174" class="sans head">1 · 本地 token 与路由</text>
  <g transform="translate(84 197)">
    <rect width="220" height="76" rx="14" fill="#203b59" stroke="#5c7798"/>
    <text x="22" y="30" class="sans body">Device 0</text><text x="22" y="57" class="sans small">tokens → E1, E3, E3</text>
    <rect y="92" width="220" height="76" rx="14" fill="#203b59" stroke="#5c7798"/>
    <text x="22" y="122" class="sans body">Device 1</text><text x="22" y="149" class="sans small">tokens → E2, E1, E4</text>
    <rect y="184" width="220" height="76" rx="14" fill="#203b59" stroke="#5c7798"/>
    <text x="22" y="214" class="sans body">Device 2</text><text x="22" y="241" class="sans small">tokens → E4, E2, E2</text>
    <rect y="276" width="220" height="76" rx="14" fill="#203b59" stroke="#5c7798"/>
    <text x="22" y="306" class="sans body">Device 3</text><text x="22" y="333" class="sans small">tokens → E3, E4, E1</text>
  </g>

  <path d="M314 373H386" stroke="#aebfda" stroke-width="3" marker-end="url(#arrow3)"/>
  <rect x="397" y="219" width="176" height="307" rx="20" fill="url(#a2a)" filter="url(#shadow3)"/>
  <text x="485" y="264" text-anchor="middle" class="sans head">All-to-All</text>
  <text x="485" y="294" text-anchor="middle" class="sans small">按 expert id 分桶</text>
  <path d="M429 330L541 414M541 330L429 414M429 372H541" stroke="#e7ecff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <text x="485" y="462" text-anchor="middle" class="sans small">数据分片维度</text>
  <text x="485" y="486" text-anchor="middle" class="sans mono">tokens → experts</text>
  <path d="M573 373H645" stroke="#aebfda" stroke-width="3" marker-end="url(#arrow3)"/>

  <text x="656" y="174" class="sans head">2 · 每张设备持有不同专家参数</text>
  <g transform="translate(656 197)">
    <rect width="240" height="76" rx="14" fill="#194655" stroke="#21c2bc"/><text x="24" y="31" class="sans body">Device 0 · Expert 1</text><text x="24" y="57" class="sans small">dense FFN batch / GEMM</text>
    <rect y="92" width="240" height="76" rx="14" fill="#2c2c5c" stroke="#8875ef"/><text x="24" y="123" class="sans body">Device 1 · Expert 2</text><text x="24" y="149" class="sans small">dense FFN batch / GEMM</text>
    <rect y="184" width="240" height="76" rx="14" fill="#4a343a" stroke="#f19555"/><text x="24" y="215" class="sans body">Device 2 · Expert 3</text><text x="24" y="241" class="sans small">dense FFN batch / GEMM</text>
    <rect y="276" width="240" height="76" rx="14" fill="#244454" stroke="#4ec6df"/><text x="24" y="307" class="sans body">Device 3 · Expert 4</text><text x="24" y="333" class="sans small">dense FFN batch / GEMM</text>
  </g>

  <path d="M896 373H946" stroke="#aebfda" stroke-width="3" marker-end="url(#arrow3)"/>
  <rect x="957" y="219" width="176" height="307" rx="20" fill="#28385b" stroke="#8875ef" stroke-width="2" filter="url(#shadow3)"/>
  <text x="1045" y="264" text-anchor="middle" class="sans head">All-to-All</text>
  <text x="1045" y="294" text-anchor="middle" class="sans small">发送专家输出</text>
  <path d="M989 330L1101 414M1101 330L989 414M989 372H1101" stroke="#b9c5ff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <text x="1045" y="462" text-anchor="middle" class="sans small">恢复 token 顺序</text>
  <text x="1045" y="486" text-anchor="middle" class="sans mono">experts → tokens</text>

  <path d="M1133 373H1166" stroke="#aebfda" stroke-width="3" marker-end="url(#arrow3)"/>
  <rect x="1168" y="326" width="36" height="94" rx="10" fill="#263c5d"/>
  <text x="1186" y="356" text-anchor="middle" class="sans body" transform="rotate(90 1186 356)">combine</text>

  <rect x="84" y="574" width="1090" height="42" rx="12" fill="#182d48"/>
  <text x="629" y="601" text-anchor="middle" class="sans body">计算仍是硬件擅长的稠密矩阵乘；“稀疏”体现在只给每个 token 调用一个专家，以及专家参数分散存放。</text>
</svg>
