<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MHA、GQA、MQA 与 MLA 的 KV Cache 比较</title>
  <desc id="desc">在 DeepSeek-V2 的 128 个头、128 维内容头口径下，MHA 每 token 每层缓存 32768 个元素，8 组 GQA 为 2048，MLA 为 576，MQA 为 256；MLA 同时保留论文消融中接近或超过 MHA 的能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061522"/><stop offset="1" stop-color="#1b2140"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#36c4d6"/><stop offset="1" stop-color="#3878dc"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#ffc15a"/><stop offset="1" stop-color="#ec7c42"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity=".42"/></filter>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#9fb5d0}.head{font-size:20px;font-weight:760;fill:#fff}.body{font-size:15px;fill:#dce8f6}.small{font-size:13px;fill:#9fb5d0}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#f4f8ff}.dark{font-size:15px;font-weight:760;fill:#142039}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="59" class="sans title">KV Cache：MLA 处在 MQA 的容量附近，却不共享同一种表示</text>
  <text x="52" y="91" class="sans sub">下图比较同一组 head 超参数下的元素数；能力标签来自论文实验，不意味着任意训练设置都保持同样排序</text>

  <g filter="url(#shadow)"><rect x="48" y="127" width="760" height="494" rx="22" fill="#0d2236" stroke="#355773"/></g>
  <text x="80" y="169" class="sans head">每 token / 每层缓存元素（对数视觉比例）</text>
  <g class="sans">
    <text x="82" y="230" class="head">MHA</text><rect x="188" y="204" width="560" height="36" rx="9" fill="#526981"/><text x="730" y="229" text-anchor="end" class="mono">32,768</text>
    <text x="82" y="312" class="head">GQA-8</text><rect x="188" y="286" width="280" height="36" rx="9" fill="#4b7895"/><text x="452" y="311" text-anchor="end" class="mono">2,048</text>
    <text x="82" y="394" class="head">MLA</text><rect x="188" y="368" width="205" height="36" rx="9" fill="url(#cyan)"/><text x="377" y="393" text-anchor="end" class="mono">576</text>
    <text x="82" y="476" class="head">MQA</text><rect x="188" y="450" width="140" height="36" rx="9" fill="#6a5c86"/><text x="312" y="475" text-anchor="end" class="mono">256</text>
  </g>
  <rect x="78" y="520" width="700" height="71" rx="14" fill="#2a3029" stroke="#d18c45"/>
  <text x="102" y="550" class="sans mono">MLA / MHA = 576 / 32768 = 1.758%</text>
  <text x="102" y="576" class="sans body">同形状理论元素数减少 98.24%；论文部署对 DeepSeek 67B 报告 93.3% 缩减。</text>

  <g filter="url(#shadow)"><rect x="844" y="127" width="388" height="494" rx="22" fill="#0d2236" stroke="#355773"/></g>
  <text x="874" y="169" class="sans head">128K、60 层、单序列</text>
  <text x="874" y="195" class="sans small">只算理想 KV payload，不含权重与 allocator</text>
  <rect x="874" y="236" width="328" height="91" rx="15" fill="#24374d"/>
  <text x="899" y="267" class="sans body">同形状 MHA · bf16</text>
  <text x="899" y="303" class="sans title">480 GiB</text>
  <rect x="874" y="350" width="328" height="91" rx="15" fill="url(#cyan)"/>
  <text x="899" y="381" class="sans dark">MLA · bf16</text>
  <text x="899" y="417" class="sans title">8.44 GiB</text>
  <rect x="874" y="464" width="328" height="91" rx="15" fill="url(#amber)"/>
  <text x="899" y="495" class="sans dark">MLA · 平均 6 bit / element</text>
  <text x="899" y="531" class="sans title">3.16 GiB</text>
  <text x="52" y="674" class="sans small">480 GiB 是“把 DeepSeek-V2 改成同头数 MHA”的教学基线，不是 DeepSeek 67B 的实测缓存；93.3% 与 5.76× 必须保留论文部署基线。</text>
</svg>
