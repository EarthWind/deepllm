<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Reflexion 在代码生成任务中的自生成测试闭环</title>
  <desc id="desc">Actor 生成实现，模型生成最多六个内部测试，经 AST 过滤后在隔离环境执行；失败日志与代码形成反思，再生成改进实现；隐藏测试只用于最终评测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#2563eb"/></marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#dc2626"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#059669"/></marker>
    <style>.title{font:700 31px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 19px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 15px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.mono{font:600 14px "JetBrains Mono",Consolas,monospace;fill:#1e293b}.white{fill:#fff}.red{fill:#b91c1c}.green{fill:#047857}.violet{fill:#7c3aed}</style>
  </defs>
  <rect width="1400" height="790" fill="url(#bg)"/>
  <text x="55" y="54" class="title">代码任务：测试负责暴露错误，反思负责把错误变成修改策略</text>
  <text x="55" y="84" class="subtitle">论文不在迭代时偷看 HumanEval / MBPP 隐藏测试；内部反馈来自模型自生成测试与编译 / 执行日志。</text>

  <g transform="translate(55 126)" filter="url(#shadow)">
    <rect width="1290" height="578" rx="28" fill="#fff" stroke="#cbd5e1"/>

    <g transform="translate(42 52)">
      <rect width="214" height="106" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <text x="20" y="34" class="h">① 生成实现</text>
      <text x="20" y="65" class="mono">def solve(...):</text>
      <text x="20" y="90" class="small">GPT-4 · zero-shot</text>
    </g>
    <path d="M256 105H326" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(331 52)">
      <rect width="238" height="106" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
      <text x="20" y="34" class="h violet">② 自生成测试</text>
      <text x="20" y="65" class="body">CoT 提出输入、期望输出与解释</text>
      <text x="20" y="90" class="small">最多采样 n = 6</text>
    </g>
    <path d="M569 105H639" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(644 52)">
      <rect width="214" height="106" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="20" y="34" class="h">③ AST 过滤</text>
      <text x="20" y="65" class="body">丢弃语法无效的测试</text>
      <text x="20" y="90" class="small">只保证可解析，不保证语义正确</text>
    </g>
    <path d="M858 105H928" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(933 52)">
      <rect width="314" height="106" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="20" y="34" class="h">④ 隔离执行 / 编译</text>
      <text x="20" y="65" class="mono">implementation × internal tests</text>
      <text x="20" y="90" class="small">收集 assertion、异常与 compiler feedback</text>
    </g>

    <path d="M1090 158V236" stroke="#dc2626" stroke-width="3" marker-end="url(#redArrow)"/>
    <g transform="translate(882 244)">
      <rect width="365" height="126" rx="18" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
      <text x="20" y="34" class="h red">未通过内部测试</text>
      <text x="20" y="66" class="body">实现 + 失败日志 → Self-Reflection</text>
      <text x="20" y="94" class="body">定位边界条件 / 状态更新 / 算法错误</text>
      <text x="20" y="116" class="small">只存最近 1 条代码反思</text>
    </g>

    <path d="M882 307H790" stroke="#dc2626" stroke-width="3" marker-end="url(#redArrow)"/>
    <g transform="translate(471 244)">
      <rect width="319" height="126" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
      <text x="20" y="34" class="h violet">⑤ 生成改进实现</text>
      <text x="20" y="66" class="body">条件：旧代码 + 日志 + 反思</text>
      <text x="20" y="94" class="mono">impl<tspan baseline-shift="sub" font-size="10">t+1</tspan> = Actor(context)</text>
      <text x="20" y="116" class="small">然后回到 AST 后的内部测试循环</text>
    </g>
    <path d="M630 244V200Q630 184 646 184H1090V166" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M1090 158H1267V487H1249" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#greenArrow)"/>
    <text x="1257" y="420" text-anchor="end" class="small green">内部测试全过</text>
    <g transform="translate(806 440)">
      <rect width="441" height="94" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
      <text x="20" y="34" class="h green">⑥ 提交一次候选，做隐藏测试评测</text>
      <text x="20" y="65" class="body">HumanEval / MBPP hidden tests 只决定最终 pass@1</text>
      <text x="20" y="86" class="small">因此内部测试的 false positive 会让错误实现过早终止</text>
    </g>

    <g transform="translate(42 410)">
      <rect width="690" height="124" rx="20" fill="#fff7ed" stroke="#fdba74"/>
      <text x="20" y="34" class="h">最关键的评测风险：测试也会错</text>
      <text x="20" y="67" class="body">False positive：错误实现通过全部内部测试 → 错误地提前提交，通常不可恢复。</text>
      <text x="20" y="96" class="body">False negative：正确实现被错误测试拒绝 → 可能被有害修改，但反思仍可能识别坏测试。</text>
      <text x="20" y="117" class="small">论文认为前者更危险；MBPP Python 的内部测试 false-positive 率明显更高。</text>
    </g>
  </g>
</svg>
