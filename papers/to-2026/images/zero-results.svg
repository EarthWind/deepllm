<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ZeRO 论文实测结果与理论容量边界</title>
  <desc id="desc">区分论文实测的 170B 可运行模型、100B 模型在 400 张 V100 上 15 PFLOPS、17B Turing-NLG 端到端训练，以及 Stage 3 容量分析得到的 1T 参数理论可放下结论。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#18264a"/></linearGradient>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{fill:#f6f9ff;font-size:30px;font-weight:750}.sub{fill:#9eb5d4;font-size:15px}.h{fill:#edf4ff;font-size:18px;font-weight:700}.b{fill:#bfd0e7;font-size:14px}.v{fill:#fff;font-size:26px;font-weight:800}.tiny{fill:#8ea7c6;font-size:12px}</style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text class="t" x="55" y="63">“走向一万亿参数”有四种不同证据，不能混成一次训练</text>
  <text class="sub" x="55" y="94">论文 v3 · 400 × V100 32GB（25 个 DGX-2 节点）· ZeRO-100B 实现是 Stage 2 + ZeRO-R</text>

  <g transform="translate(55 141)">
    <g><rect width="260" height="413" rx="20" fill="#10233d" stroke="#334d6d"/><text class="h" x="20" y="39">DP-only 可用性</text><text class="tiny" x="20" y="62">128 GPUs，不用 MP / PP</text><g transform="translate(29 102)"><text class="b" y="18">普通 DDP</text><rect x="83" width="25" height="28" rx="6" fill="#526d89"/><text class="b" x="118" y="19">1.4B</text><text class="b" y="78">ZeRO</text><rect x="83" y="60" width="145" height="28" rx="6" fill="#35c9bd"/><text x="218" y="80" text-anchor="end" fill="#062e2b" font-size="14" font-weight="800">13B</text></g><text class="v" x="130" y="269" text-anchor="middle">&gt; 40 TF/GPU</text><text class="tiny" x="130" y="298" text-anchor="middle">论文报告的 ZeRO 平均吞吐</text><rect x="20" y="334" width="220" height="53" rx="10" fill="#172a42"/><text class="tiny" x="130" y="356" text-anchor="middle">证明：无需改模型也能跨过</text><text class="tiny" x="130" y="375" text-anchor="middle">单卡 model-state 容量墙</text></g>
    <g transform="translate(277)"><rect width="260" height="413" rx="20" fill="#102b3b" stroke="#35c9bd"/><text class="h" x="20" y="39">大模型 step 实测</text><text class="tiny" x="20" y="62">ZeRO + 16-way Megatron MP</text><text class="v" x="130" y="130" text-anchor="middle">170B</text><text class="b" x="130" y="158" text-anchor="middle">最大可运行模型</text><text class="v" x="130" y="227" text-anchor="middle">15 PFLOP/s</text><text class="b" x="130" y="255" text-anchor="middle">8B–100B 平均 sustained</text><text class="tiny" x="130" y="284" text-anchor="middle">100B：&gt;38 TFLOP/s/GPU</text><rect x="20" y="334" width="220" height="53" rx="10" fill="#17323d"/><text class="tiny" x="130" y="356" text-anchor="middle">170B 是系统运行/吞吐证据，</text><text class="tiny" x="130" y="375" text-anchor="middle">不等于完成收敛训练</text></g>
    <g transform="translate(554)"><rect width="260" height="413" rx="20" fill="#182b49" stroke="#4e8de5"/><text class="h" x="20" y="39">端到端模型</text><text class="tiny" x="20" y="62">Turing-NLG · 历史时点 2020-05</text><text class="v" x="130" y="130" text-anchor="middle">17B</text><text class="b" x="130" y="158" text-anchor="middle">300K iterations</text><text class="v" x="130" y="227" text-anchor="middle">10.21 PPL</text><text class="b" x="130" y="255" text-anchor="middle">WikiText-103（论文写 Webtext-103）</text><text class="tiny" x="130" y="284" text-anchor="middle">41.4 TFLOP/s/GPU</text><rect x="20" y="334" width="220" height="53" rx="10" fill="#1b304d"/><text class="tiny" x="130" y="356" text-anchor="middle">这是论文中真正给出训练曲线与</text><text class="tiny" x="130" y="375" text-anchor="middle">语言模型结果的案例</text></g>
    <g transform="translate(831)"><rect width="260" height="413" rx="20" fill="#302f58" stroke="#8c76dd"/><text class="h" x="20" y="39">Stage 3 容量分析</text><text class="tiny" x="20" y="62">1024 GPUs · 16P / N</text><text class="v" x="130" y="130" text-anchor="middle">1T params</text><text class="b" x="130" y="158" text-anchor="middle">16 TB model states / 1024</text><text class="v" x="130" y="227" text-anchor="middle">15.625 GB</text><text class="b" x="130" y="255" text-anchor="middle">每 GPU 理论 model-state 内存</text><text class="tiny" x="130" y="284" text-anchor="middle">还未计 activation / buffer</text><rect x="20" y="334" width="220" height="53" rx="10" fill="#29284d"/><text class="tiny" x="130" y="356" text-anchor="middle">论文没有训练 1T；作者估计当时</text><text class="tiny" x="130" y="375" text-anchor="middle">算力下可能需要一年以上</text></g>
  </g>
  <g transform="translate(55 584)"><rect width="1090" height="67" rx="14" fill="#10233d" stroke="#334d6d"/><text class="b" x="22" y="27">为什么会“超线性”？DP degree 增加 → 每卡 model states 减少 → 可用更大 local batch → GEMM arithmetic intensity 与 GPU 利用率上升。</text><text class="tiny" x="22" y="49">这不是固定 global batch 的纯 strong scaling；论文 60B 实验的 total batch 从 64 GPUs 时 64 增至 400 GPUs 时 1600。</text></g>
</svg>
