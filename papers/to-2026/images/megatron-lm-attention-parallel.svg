<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Megatron-LM 的多头注意力张量并行</title><desc id="desc">QKV 投影按注意力头切到各 GPU，每个 GPU 本地计算完整注意力头，输出投影按行切并 all-reduce。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172a"/><stop offset="1" stop-color="#123047"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6edbeb"/></marker><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{fill:#f4fbff;font-size:30px;font-weight:750}.sub{fill:#9ebdd0;font-size:15px}.h{fill:#eaf8ff;font-size:18px;font-weight:700}.b{fill:#bad3e1;font-size:14px}.tiny{fill:#89aabd;font-size:12px}</style></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><text class="t" x="55" y="64">注意力天然按 head 可分：每张 GPU 算完整的局部 heads</text><text class="sub" x="55" y="94">Q/K/V column-parallel → local attention → output projection row-parallel → all-reduce</text>
  <g transform="translate(55 145)"><rect width="1090" height="444" rx="20" fill="#0b293e" stroke="#315b73"/>
    <rect x="28" y="130" width="120" height="145" rx="13" fill="#153f54" stroke="#4d8ba3"/><text class="h" x="88" y="190" text-anchor="middle">输入 X</text><text class="tiny" x="88" y="219" text-anchor="middle">[bs, h]</text><path d="M161 202h55" stroke="#6edbeb" stroke-width="3" marker-end="url(#a)"/>
    <rect x="231" y="89" width="180" height="227" rx="14" fill="#153f54" stroke="#4d8ba3"/><text class="h" x="321" y="40" text-anchor="middle">融合 QKV 投影按 head 组切分</text>
    <g transform="translate(250 112)"><rect width="65" height="54" rx="8" fill="#175d68"/><text class="h" x="32" y="34" text-anchor="middle">Q₁</text><rect x="77" width="65" height="54" rx="8" fill="#3a315e"/><text class="h" x="109" y="34" text-anchor="middle">Q₂</text><rect y="67" width="65" height="54" rx="8" fill="#175d68"/><text class="h" x="32" y="101" text-anchor="middle">K₁</text><rect x="77" y="67" width="65" height="54" rx="8" fill="#3a315e"/><text class="h" x="109" y="101" text-anchor="middle">K₂</text><rect y="134" width="65" height="54" rx="8" fill="#175d68"/><text class="h" x="32" y="168" text-anchor="middle">V₁</text><rect x="77" y="134" width="65" height="54" rx="8" fill="#3a315e"/><text class="h" x="109" y="168" text-anchor="middle">V₂</text></g>
    <path d="M425 202h48" stroke="#6edbeb" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(488 87)"><rect width="193" height="98" rx="13" fill="#124d58" stroke="#3bc8bc"/><text class="h" x="96" y="31" text-anchor="middle">GPU 0：heads 0…k</text><text class="b" x="96" y="57" text-anchor="middle">softmax(Q₁K₁ᵀ)V₁</text><text class="tiny" x="96" y="80" text-anchor="middle">head 内无通信</text><rect y="133" width="193" height="98" rx="13" fill="#312c57" stroke="#8a75e0"/><text class="h" x="96" y="164" text-anchor="middle">GPU 1：heads k…</text><text class="b" x="96" y="190" text-anchor="middle">softmax(Q₂K₂ᵀ)V₂</text><text class="tiny" x="96" y="213" text-anchor="middle">head 内无通信</text></g>
    <path d="M695 202h48" stroke="#6edbeb" stroke-width="3" marker-end="url(#a)"/>
    <rect x="759" y="88" width="141" height="228" rx="14" fill="#153f54" stroke="#4d8ba3"/><path d="M759 202h141" stroke="#8a75e0" stroke-width="3"/><text class="h" x="829" y="40" text-anchor="middle">输出投影按输入行切</text><text class="h" x="829" y="149" text-anchor="middle">Wₒ,₁</text><text class="h" x="829" y="264" text-anchor="middle">Wₒ,₂</text>
    <path d="M914 202h45" stroke="#6edbeb" stroke-width="3" marker-end="url(#a)"/><rect x="975" y="142" width="89" height="55" rx="10" fill="#17485e"/><text class="h" x="1019" y="176" text-anchor="middle">O₁</text><rect x="975" y="210" width="89" height="55" rx="10" fill="#362e59"/><text class="h" x="1019" y="244" text-anchor="middle">O₂</text>
    <path d="M1019 279v44H894" fill="none" stroke="#f1b95e" stroke-width="3" marker-end="url(#a)"/><rect x="640" y="343" width="254" height="67" rx="13" fill="#3a3024" stroke="#ba8141"/><text x="767" y="371" text-anchor="middle" fill="#ffe1a3" font-size="18" font-weight="750">SUM all-reduce</text><text x="767" y="394" text-anchor="middle" fill="#e5c58e" font-size="13">完整 attention output</text>
    <rect x="28" y="354" width="512" height="55" rx="11" fill="#102537"/><text class="b" x="48" y="378">每层 attention forward 1 次同步；MLP 再 1 次</text><text class="tiny" x="48" y="399">Backward 各有对应同步，因此训练一层共 4 次 collective。</text>
  </g><text class="tiny" x="55" y="628">论文 scaling study 保持每头 hidden size 为 96；heads 增多会让部分 GEMM 变小、softmax 元素增多，8-way 效率从 16 heads 的 82% 降到 32 heads 的 77%。</text>
</svg>
