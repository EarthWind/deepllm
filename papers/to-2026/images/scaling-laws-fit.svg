  <line x1="294.4" y1="150" x2="294.4" y2="650" class="grid"/>
<line x1="565.0" y1="150" x2="565.0" y2="650" class="grid"/>
<line x1="835.7" y1="150" x2="835.7" y2="650" class="grid"/>
