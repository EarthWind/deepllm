<circle cx="933.6" cy="589.4" r="7" fill="#f59e0b" stroke="#fef3c7" stroke-width="2"/>
  <text x="294.4" y="684" class="tick" text-anchor="middle">10^8</text>
<text x="565.0" y="684" class="tick" text-anchor="middle">10^9</text>
<text x="835.7" y="684" class="tick" text-anchor="middle">10^10</text>
  <text x="82" y="620.2" class="tick" text-anchor="end">2</text>
<text x="82" y="492.0" class="tick" text-anchor="end">2.5</text>
<text x="82" y="387.3" class="tick" text-anchor="end">3</text>
<text x="82" y="221.9" class="tick" text-anchor="end">4</text>
  <text x="525.0" y="718" class="label" text-anchor="middle">训练数据量 D（tokens，对数刻度）</text>
  <text x="34" y="400.0" class="label" text-anchor="middle" transform="rotate(-90 34 400.0)">验证损失 L（对数刻度）</text>

  <rect x="1000" y="150" width="330" height="154" rx="18" fill="#112542" stroke="#38bdf8" stroke-width="2"/>
  <text x="1030" y="190" class="section">拟合结果</text>
  <text x="1030" y="230" class="mono">α = 0.0953</text>
  <text x="1030" y="262" class="mono">R² = 0.9995</text>
  <text x="1030" y="288" class="small">目标值：论文 α_D ≈ 0.095</text>

  <rect x="1000" y="326" width="330" height="154" rx="18" fill="#112542" stroke="#f59e0b" stroke-width="2"/>
  <text x="1030" y="366" class="section">读懂指数</text>
  <text x="1030" y="407" class="mono">D × 10</text>
  <text x="1030" y="440" class="label">拟合项下降 19.7%</text>
  <text x="1030" y="466" class="small">幂指数很小，边际收益递减很慢</text>

  <rect x="1000" y="502" width="330" height="148" rx="18" fill="#112542" stroke="#818cf8" stroke-width="2"/>
  <text x="1030" y="542" class="section">拟合边界</text>
  <text x="1030" y="579" class="small">先保证模型规模、算力不构成瓶颈；</text>
  <text x="1030" y="608" class="small">不要把受限区间混进单变量拟合。</text>
  <text x="1030" y="637" class="small">外推必须报告区间与误差。</text>
</svg>
