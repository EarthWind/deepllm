<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Kimi k1.5 的 partial rollout 与混合部署</title>
  <desc id="desc">长轨迹按固定输出预算切段，旧前缀存入 replay buffer 并复用，只有当前段重新采样；训练与推理共享 GPU，通过 checkpoint engine 切换。</desc>
  <defs><linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#17113c"/></linearGradient><marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker><style>.zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:40px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a5b4fc}.h{font-size:24px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#cbd5e1}.small{font-size:15px;fill:#94a3b8}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:16px;fill:#cffafe}.box{fill:#0d2944;stroke:#345674;stroke-width:2}.tag{font-size:14px;font-weight:800;fill:#071426}</style></defs>
  <rect width="1440" height="900" rx="30" fill="url(#bg4)"/>
  <text x="70" y="72" class="zh title">Partial rollout：128K 是轨迹上限，不等于每轮重生成 128K</text>
  <text x="70" y="108" class="zh sub">固定 segment budget 控制尾延迟；replay buffer 保存旧片段，本轮只生成新的 on-policy 后缀</text>

  <rect x="70" y="155" width="1300" height="330" rx="24" class="box"/>
  <text x="98" y="200" class="zh h">同一条长推理轨迹跨四轮完成</text>
  <g class="zh">
    <text x="98" y="255" class="b">iter n−3</text><rect x="210" y="228" width="250" height="44" rx="12" fill="#22d3ee"/><text x="335" y="256" text-anchor="middle" class="tag">segment A · ON-POLICY</text>
    <text x="98" y="317" class="b">iter n−2</text><rect x="210" y="290" width="250" height="44" rx="12" fill="#19415b"/><rect x="460" y="290" width="250" height="44" rx="12" fill="#38bdf8"/><text x="335" y="318" text-anchor="middle" class="small">A · REUSED / LOSS 可 MASK</text><text x="585" y="318" text-anchor="middle" class="tag">B · ON-POLICY</text>
    <text x="98" y="379" class="b">iter n−1</text><rect x="210" y="352" width="500" height="44" rx="12" fill="#19415b"/><rect x="710" y="352" width="250" height="44" rx="12" fill="#818cf8"/><text x="460" y="380" text-anchor="middle" class="small">A + B · REUSED PREFIX</text><text x="835" y="380" text-anchor="middle" class="tag">C · ON-POLICY</text>
    <text x="98" y="441" class="b">iter n</text><rect x="210" y="414" width="750" height="44" rx="12" fill="#19415b"/><rect x="960" y="414" width="300" height="44" rx="12" fill="#c084fc"/><text x="585" y="442" text-anchor="middle" class="small">A + B + C · REUSED PREFIX</text><text x="1110" y="442" text-anchor="middle" class="tag">D · ON-POLICY / FINISH</text>
  </g>

  <rect x="70" y="535" width="610" height="245" rx="24" class="box"/>
  <text x="98" y="578" class="zh h">为什么它能降低 rollout 浪费</text>
  <text x="98" y="622" class="zh b">• 单条超长响应不会独占 worker</text>
  <text x="98" y="658" class="zh b">• 其他 worker 可异步处理短任务</text>
  <text x="98" y="694" class="zh b">• 重复片段可提前终止并附加 penalty</text>
  <text x="98" y="733" class="zh mono">13K target / 4,096 budget</text>
  <text x="398" y="733" class="zh b">本文示例：13K vs 从头重生成 37,576 token</text>

  <rect x="730" y="535" width="640" height="245" rx="24" fill="#26204e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="758" y="578" class="zh h">Megatron ↔ vLLM 混合部署</text>
  <rect x="758" y="615" width="160" height="55" rx="16" fill="#155e75"/><text x="838" y="649" text-anchor="middle" class="zh b">TRAIN</text>
  <line x1="918" y1="642" x2="1038" y2="642" stroke="#67e8f9" stroke-width="4" marker-end="url(#a4)"/>
  <rect x="1055" y="615" width="160" height="55" rx="16" fill="#5b21b6"/><text x="1135" y="649" text-anchor="middle" class="zh b">ROLLOUT</text>
  <text x="758" y="712" class="zh b">checkpoint-engine + shared memory + Mooncake RDMA</text>
  <text x="758" y="748" class="zh small">训练→推理少于 1 分钟；推理→训练约 10 秒</text>
  <text x="720" y="850" text-anchor="middle" class="zh sub">旧 segment 可能来自更早 reference，论文允许将其排除在 loss 外；这正是 partial rollout 的 off-policy 边界</text>
</svg>
