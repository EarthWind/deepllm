<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Toolformer 从少量示例到自主调用工具的完整流程</title>
  <desc id="desc">离线阶段用每个工具的少量示例提示语言模型标注普通文本，采样候选调用、执行工具、按未来词元损失过滤，再用保留的调用微调模型。在线阶段，模型生成调用，运行时执行工具并把结果写回上下文。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="offline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="online" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 22px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .heading { font: 700 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 500 13px "JetBrains Mono", Consolas, monospace; fill: #1e3a8a; }
      .white { fill: #fff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .blue-arrow { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#blueArrow); }
    </style>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <text x="56" y="52" class="title">Toolformer：把“工具是否有用”变成可自动计算的数据过滤器</text>
  <text x="56" y="82" class="subtitle">少量人工示例只负责教会调用语法；大规模训练标签由模型提议、工具执行与语言模型损失共同产生。</text>

  <g transform="translate(56 112)" filter="url(#shadow)">
    <rect width="1288" height="396" rx="24" fill="#fff" stroke="#bfdbfe"/>
    <rect width="1288" height="58" rx="24" fill="url(#offline)"/>
    <rect y="34" width="1288" height="24" fill="url(#offline)"/>
    <text x="28" y="38" class="section">离线：自监督构造带 API 调用的语言模型数据 C*</text>

    <g transform="translate(28 91)">
      <rect width="190" height="238" rx="18" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="95" y="32" text-anchor="middle" class="heading">起点</text>
      <rect x="19" y="52" width="152" height="55" rx="12" fill="#fff" stroke="#c4b5fd"/>
      <text x="95" y="76" text-anchor="middle" class="body">普通文本 C</text>
      <text x="95" y="96" text-anchor="middle" class="small">CCNet 子集</text>
      <rect x="19" y="122" width="152" height="76" rx="12" fill="#ede9fe"/>
      <text x="95" y="148" text-anchor="middle" class="body">每个 API 的</text>
      <text x="95" y="170" text-anchor="middle" class="body">少量 few-shot 示例</text>
      <text x="95" y="220" text-anchor="middle" class="small">不需要逐条人工轨迹</text>
    </g>

    <path d="M218 210 H258" class="arrow"/>

    <g transform="translate(263 91)">
      <rect width="210" height="238" rx="18" fill="#eff6ff" stroke="#60a5fa"/>
      <circle cx="34" cy="34" r="18" fill="#2563eb"/>
      <text x="34" y="40" text-anchor="middle" class="heading white">1</text>
      <text x="68" y="40" class="heading">采样候选调用</text>
      <text x="20" y="79" class="body">选择 p([) &gt; τs 的位置</text>
      <text x="20" y="105" class="body">每处采样工具名与参数</text>
      <rect x="18" y="129" width="174" height="63" rx="10" fill="#dbeafe"/>
      <text x="105" y="154" text-anchor="middle" class="mono">[Calculator(</text>
      <text x="105" y="175" text-anchor="middle" class="mono">400 / 1400)]</text>
      <text x="105" y="218" text-anchor="middle" class="small">追求召回率，允许有噪声</text>
    </g>

    <path d="M473 210 H513" class="arrow"/>

    <g transform="translate(518 91)">
      <rect width="210" height="238" rx="18" fill="#ecfeff" stroke="#22d3ee"/>
      <circle cx="34" cy="34" r="18" fill="#0891b2"/>
      <text x="34" y="40" text-anchor="middle" class="heading white">2</text>
      <text x="68" y="40" class="heading">执行真实工具</text>
      <text x="20" y="79" class="body">解析调用并获得文本结果</text>
      <g transform="translate(20 101)">
        <rect width="79" height="35" rx="9" fill="#cffafe" stroke="#06b6d4"/>
        <text x="39" y="23" text-anchor="middle" class="small">Calculator</text>
        <rect x="91" width="79" height="35" rx="9" fill="#cffafe" stroke="#06b6d4"/>
        <text x="130" y="23" text-anchor="middle" class="small">Search</text>
        <rect y="47" width="79" height="35" rx="9" fill="#cffafe" stroke="#06b6d4"/>
        <text x="39" y="70" text-anchor="middle" class="small">QA</text>
        <rect x="91" y="47" width="79" height="35" rx="9" fill="#cffafe" stroke="#06b6d4"/>
        <text x="130" y="70" text-anchor="middle" class="small">MT / Date</text>
      </g>
      <text x="105" y="218" text-anchor="middle" class="mono">result = 0.29</text>
    </g>

    <path d="M728 210 H768" class="arrow"/>

    <g transform="translate(773 91)">
      <rect width="224" height="238" rx="18" fill="#fff7ed" stroke="#fb923c"/>
      <circle cx="34" cy="34" r="18" fill="#ea580c"/>
      <text x="34" y="40" text-anchor="middle" class="heading white">3</text>
      <text x="68" y="40" class="heading">按损失收益过滤</text>
      <text x="20" y="78" class="body">比较调用后未来 token：</text>
      <rect x="18" y="96" width="188" height="83" rx="11" fill="#ffedd5"/>
      <text x="112" y="122" text-anchor="middle" class="mono">gain = L⁻ − L⁺</text>
      <text x="112" y="147" text-anchor="middle" class="mono">L⁻ = min(L∅, Lcall)</text>
      <text x="112" y="169" text-anchor="middle" class="mono">保留 gain ≥ τf</text>
      <text x="112" y="218" text-anchor="middle" class="small">只留下“返回值真的有用”的调用</text>
    </g>

    <path d="M997 210 H1037" class="arrow"/>

    <g transform="translate(1042 91)">
      <rect width="218" height="238" rx="18" fill="#ecfdf5" stroke="#34d399"/>
      <circle cx="34" cy="34" r="18" fill="#059669"/>
      <text x="34" y="40" text-anchor="middle" class="heading white">4</text>
      <text x="68" y="40" class="heading">合并并继续 LM 训练</text>
      <text x="20" y="78" class="body">调用插回原文得到 C*</text>
      <rect x="18" y="97" width="182" height="80" rx="11" fill="#d1fae5"/>
      <text x="109" y="122" text-anchor="middle" class="small">原文内容不变</text>
      <text x="109" y="145" text-anchor="middle" class="small">只增加调用与结果</text>
      <text x="109" y="167" text-anchor="middle" class="small">标准 next-token objective</text>
      <rect x="47" y="195" width="124" height="32" rx="16" fill="#047857"/>
      <text x="109" y="217" text-anchor="middle" class="body white">Toolformer</text>
    </g>
  </g>

  <path d="M1180 508 C1180 535 1080 536 1080 560" class="blue-arrow"/>

  <g transform="translate(56 560)" filter="url(#shadow)">
    <rect width="1288" height="164" rx="24" fill="#fff" stroke="#a7f3d0"/>
    <rect width="246" height="164" rx="24" fill="url(#online)"/>
    <rect x="222" width="24" height="164" fill="url(#online)"/>
    <text x="28" y="34" class="section">在线：模型决定</text>
    <text x="28" y="60" class="section">是否调用工具</text>
    <text x="28" y="91" class="body white">生成普通文本或 API 语法</text>
    <text x="28" y="116" class="body white">运行时只在 “→” 处接管</text>
    <text x="28" y="143" class="small white">不是独立规划器，而是解码协议</text>

    <g transform="translate(282 35)">
      <rect width="225" height="94" rx="16" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="112" y="28" text-anchor="middle" class="heading">① 模型生成调用前缀</text>
      <text x="112" y="57" text-anchor="middle" class="mono">[Calculator(400/1400) -></text>
      <text x="112" y="79" text-anchor="middle" class="small">暂停自回归解码</text>
    </g>
    <path d="M507 82 H559" class="arrow"/>
    <g transform="translate(564 35)">
      <rect width="205" height="94" rx="16" fill="#ecfeff" stroke="#22d3ee"/>
      <text x="102" y="28" text-anchor="middle" class="heading">② Runtime 执行</text>
      <text x="102" y="57" text-anchor="middle" class="body">解析工具名与参数</text>
      <text x="102" y="79" text-anchor="middle" class="mono">result = 0.29</text>
    </g>
    <path d="M769 82 H821" class="arrow"/>
    <g transform="translate(826 35)">
      <rect width="220" height="94" rx="16" fill="#ecfdf5" stroke="#34d399"/>
      <text x="110" y="28" text-anchor="middle" class="heading">③ 注入结果并续写</text>
      <text x="110" y="57" text-anchor="middle" class="mono">0.29]</text>
      <text x="110" y="79" text-anchor="middle" class="small">结果成为后续上下文</text>
    </g>
    <path d="M1046 82 H1098" class="arrow"/>
    <g transform="translate(1103 35)">
      <rect width="153" height="94" rx="47" fill="#047857"/>
      <text x="76" y="43" text-anchor="middle" class="heading white">继续生成</text>
      <text x="76" y="68" text-anchor="middle" class="small white">… 29% passed</text>
    </g>
  </g>

  <text x="56" y="758" class="subtitle">核心闭环：模型用自己的预测损失定义“有用”，过滤后的调用再教会同一个模型何时调用、传什么参数、怎样消费结果。</text>
</svg>
