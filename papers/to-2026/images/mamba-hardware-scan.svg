<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Mamba selective scan 的硬件感知实现</title><desc id="desc">参数从 HBM 读入 SRAM，在片上融合离散化和扫描，只写回输出；并行前缀扫描和反向重算解决递推与中间状态内存问题。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#142039"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:21px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d3deec}.small{font-size:14px;fill:#9fb2cc}.metric{font-size:29px;font-weight:800;fill:#fff}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/><text x="64" y="72" class="title">线性递推不自动等于 GPU 快：Mamba 还做了系统设计</text><text x="64" y="107" class="sub">三个关键词：kernel fusion、parallel scan、recomputation；目标是少访问 HBM，不物化 B×L×D×N 全状态</text>
  <g transform="translate(64 164)"><rect width="292" height="304" rx="24" fill="#18263d" stroke="#64748b"/><text x="28" y="45" class="h">GPU HBM</text><text x="28" y="78" class="small">容量大，带宽相对昂贵</text><g transform="translate(28 107)"><rect width="236" height="50" rx="12" fill="#26384e"/><text x="118" y="31" class="body" text-anchor="middle">x, Δ, A, B, C</text><rect y="68" width="236" height="50" rx="12" fill="#26384e"/><text x="118" y="99" class="body" text-anchor="middle">不写入完整中间 h</text><rect y="136" width="236" height="50" rx="12" fill="#164e63"/><text x="118" y="167" class="body" text-anchor="middle">最终输出 y</text></g></g>
  <path d="M368 273h94" class="line"/><path d="M462 375H368" class="line"/>
  <g transform="translate(474 142)"><rect width="520" height="350" rx="28" fill="#12382f" stroke="#34d399" stroke-width="2"/><text x="28" y="48" class="h">片上 SRAM / fused selective scan kernel</text><text x="28" y="82" class="small">容量小、访问快；参数加载后尽量一次完成</text><g transform="translate(28 112)"><rect width="137" height="84" rx="17" fill="#0b2824"/><text x="68" y="35" class="h" text-anchor="middle">① 生成参数</text><text x="68" y="63" class="small" text-anchor="middle">Δₜ, Bₜ, Cₜ</text><rect x="155" width="137" height="84" rx="17" fill="#0b2824"/><text x="223" y="35" class="h" text-anchor="middle">② 离散化</text><text x="223" y="63" class="small" text-anchor="middle">Āₜ, B̄ₜ</text><rect x="310" width="154" height="84" rx="17" fill="#064e3b"/><text x="387" y="35" class="h" text-anchor="middle">③ 扫描</text><text x="387" y="63" class="small" text-anchor="middle">状态更新与读出</text></g><path d="M165 154h17M320 154h17" class="line"/><g transform="translate(28 225)"><rect width="436" height="82" rx="17" fill="#0b2922"/><text x="20" y="34" class="body">只把 y : (B, L, D) 写回 HBM</text><text x="20" y="62" class="small">避免物化 h : (B, L, D, N) 和离散化参数大张量</text></g></g>
  <path d="M1007 316h71" class="line"/>
  <g transform="translate(1090 164)"><rect width="286" height="304" rx="24" fill="#25244a" stroke="#8b8cf8"/><text x="28" y="45" class="h">为什么能并行？</text><text x="28" y="85" class="body">每一步都是仿射映射</text><text x="28" y="119" class="small">Tₜ(h)=Āₜh+bₜ</text><text x="28" y="155" class="body">映射复合满足结合律</text><text x="28" y="189" class="small">(T₃∘T₂)∘T₁=T₃∘(T₂∘T₁)</text><path d="M28 215h230" stroke="#484b7a"/><text x="28" y="249" class="body">可用并行 prefix scan</text><text x="28" y="279" class="small">深度 O(log L)，总工作量 O(L)</text></g>
  <g transform="translate(64 548)"><rect width="1312" height="278" rx="25" fill="#0d1a2c" stroke="#354961"/><text x="28" y="47" class="h">反向传播：用计算换显存</text><g transform="translate(28 78)"><rect width="374" height="148" rx="18" fill="#30251a"/><text x="20" y="38" class="h">前向</text><text x="20" y="74" class="body">不保存所有中间状态 hₜ</text><text x="20" y="105" class="small">降低 B×L×D×N 激活占用</text></g><path d="M418 152h76" class="line"/><g transform="translate(506 78)"><rect width="374" height="148" rx="18" fill="#252449"/><text x="20" y="38" class="h">反向</text><text x="20" y="74" class="body">从 HBM 重载输入与参数</text><text x="20" y="105" class="small">在 SRAM 中重新计算所需状态</text></g><path d="M896 152h76" class="line"/><g transform="translate(984 78)"><rect width="272" height="148" rx="18" fill="#143a31"/><text x="20" y="38" class="h">结果</text><text x="20" y="81" class="metric" fill="#6ee7b7">内存 ≈ FlashAttention</text><text x="20" y="116" class="small">论文的优化实现结论</text></g><text x="28" y="253" class="small">“重算”增加部分 FLOPs，却减少昂贵的 HBM 流量；在带宽受限算子上通常是划算的。</text></g>
  <text x="64" y="874" class="small">教学图省略 CUDA thread block、分块大小和张量布局；官方 kernel 才是论文速度数字的实现基础，纯 Python for 循环不具备该性能。</text>
</svg>
