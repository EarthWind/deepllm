<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">BART 论文比较的五种文档噪声</title>
  <desc id="desc">以同一段 A B C 句号 D E 句号为例，展示 token masking、token deletion、text infilling、sentence permutation 和 document rotation 的输入变化。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".09"/></filter>
    <style>.title{font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.panel{font:700 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 14px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.tiny{font:500 11.5px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}.token{font:700 14px "JetBrains Mono",Consolas,monospace;fill:#1e3a8a}.mask{font:700 13px "JetBrains Mono",Consolas,monospace;fill:#9f1239}.arrow{stroke:#94a3b8;stroke-width:2;fill:none}</style>
  </defs>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="58" class="title">同一份原文，五种“出题方式”训练出不同能力</text>
  <text x="70" y="90" class="subtitle">蓝色为保留 token，红色为单个 mask；虚线空位表示 token 被真正删除。所有噪声都只作用于 Encoder 输入。</text>
  <g filter="url(#shadow)"><rect x="55" y="125" width="1290" height="105" rx="17" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="85" y="161" class="panel">原始文档</text><text x="85" y="188" class="small">三句话；后续各行独立从这份原文构造</text>
  <g transform="translate(420 146)">
    <g fill="#dbeafe" stroke="#60a5fa"><rect x="0" y="0" width="55" height="48" rx="8"/><rect x="65" y="0" width="55" height="48" rx="8"/><rect x="130" y="0" width="55" height="48" rx="8"/><rect x="195" y="0" width="55" height="48" rx="8"/><rect x="270" y="0" width="55" height="48" rx="8"/><rect x="335" y="0" width="55" height="48" rx="8"/><rect x="400" y="0" width="55" height="48" rx="8"/><rect x="475" y="0" width="55" height="48" rx="8"/><rect x="540" y="0" width="55" height="48" rx="8"/></g>
    <g class="token" text-anchor="middle"><text x="27" y="30">A</text><text x="92" y="30">B</text><text x="157" y="30">C</text><text x="222" y="30">.</text><text x="297" y="30">D</text><text x="362" y="30">E</text><text x="427" y="30">.</text><text x="502" y="30">F</text><text x="567" y="30">.</text></g>
  </g>

  <g filter="url(#shadow)"><rect x="55" y="255" width="625" height="175" rx="17" fill="#fff" stroke="#93c5fd"/></g>
  <text x="85" y="292" class="panel">1. Token Masking</text><text x="85" y="317" class="small">被选 token 各自替换为 mask；位置与长度仍然可见</text>
  <g transform="translate(85 345)"><g fill="#dbeafe" stroke="#60a5fa"><rect x="0" width="48" height="44" rx="7"/><rect x="58" width="48" height="44" rx="7"/><rect x="174" width="48" height="44" rx="7"/><rect x="232" width="48" height="44" rx="7"/><rect x="348" width="48" height="44" rx="7"/><rect x="406" width="48" height="44" rx="7"/></g><g fill="#ffe4e6" stroke="#fb7185"><rect x="116" width="48" height="44" rx="7"/><rect x="290" width="48" height="44" rx="7"/></g><g class="token" text-anchor="middle"><text x="24" y="28">A</text><text x="82" y="28">B</text><text x="198" y="28">.</text><text x="256" y="28">D</text><text x="372" y="28">.</text><text x="430" y="28">F</text></g><g class="mask" text-anchor="middle"><text x="140" y="28">MASK</text><text x="314" y="28">MASK</text></g></g>
  <text x="85" y="410" class="tiny">模型知道“这里缺 1 个”，主要难点是猜内容。</text>

  <g filter="url(#shadow)"><rect x="720" y="255" width="625" height="175" rx="17" fill="#fff" stroke="#93c5fd"/></g>
  <text x="750" y="292" class="panel">2. Token Deletion</text><text x="750" y="317" class="small">token 直接消失；模型还要判断哪里、少了几个</text>
  <g transform="translate(750 345)"><g fill="#dbeafe" stroke="#60a5fa"><rect x="0" width="48" height="44" rx="7"/><rect x="58" width="48" height="44" rx="7"/><rect x="174" width="48" height="44" rx="7"/><rect x="232" width="48" height="44" rx="7"/><rect x="348" width="48" height="44" rx="7"/></g><g fill="none" stroke="#fb7185" stroke-dasharray="6 5"><rect x="116" width="48" height="44" rx="7"/><rect x="290" width="48" height="44" rx="7"/></g><g class="token" text-anchor="middle"><text x="24" y="28">A</text><text x="82" y="28">B</text><text x="198" y="28">D</text><text x="256" y="28">E</text><text x="372" y="28">F</text></g></g>
  <text x="750" y="410" class="tiny">论文受控实验中，生成任务上通常优于逐 token masking。</text>

  <g filter="url(#shadow)"><rect x="55" y="460" width="625" height="175" rx="17" fill="#fff" stroke="#fb7185"/></g>
  <text x="85" y="497" class="panel">3. Text Infilling（最终配方）</text><text x="85" y="522" class="small">span 长度采自 Poisson(λ=3)，整段只换成 1 个 mask</text>
  <g transform="translate(85 550)"><g fill="#dbeafe" stroke="#60a5fa"><rect x="0" width="48" height="44" rx="7"/><rect x="58" width="48" height="44" rx="7"/><rect x="232" width="48" height="44" rx="7"/><rect x="290" width="48" height="44" rx="7"/><rect x="348" width="48" height="44" rx="7"/></g><g fill="#ffe4e6" stroke="#fb7185"><rect x="128" width="84" height="44" rx="7"/></g><g class="token" text-anchor="middle"><text x="24" y="28">A</text><text x="82" y="28">B</text><text x="256" y="28">E</text><text x="314" y="28">.</text><text x="372" y="28">F</text></g><text x="170" y="28" text-anchor="middle" class="mask">MASK</text></g>
  <text x="85" y="615" class="tiny">还允许 0 长 span：插入一个 mask，迫使模型判断“其实没有词缺失”。</text>

  <g filter="url(#shadow)"><rect x="720" y="460" width="625" height="175" rx="17" fill="#fff" stroke="#c4b5fd"/></g>
  <text x="750" y="497" class="panel">4. Sentence Permutation（最终配方）</text><text x="750" y="522" class="small">按句号切句，把所有句子随机重排</text>
  <g transform="translate(750 550)"><rect x="0" width="125" height="44" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><rect x="145" width="165" height="44" rx="8" fill="#dbeafe" stroke="#60a5fa"/><rect x="330" width="125" height="44" rx="8" fill="#dcfce7" stroke="#4ade80"/><g class="token" text-anchor="middle"><text x="62" y="28">F .</text><text x="227" y="28">A B C .</text><text x="392" y="28">D E .</text></g></g>
  <text x="750" y="615" class="tiny">单独使用很弱；与 infilling 组合后，CNN/DM PPL 从 5.83 降到 5.41。</text>

  <g filter="url(#shadow)"><rect x="55" y="665" width="1290" height="150" rx="17" fill="#fff" stroke="#fbbf24"/></g>
  <text x="85" y="702" class="panel">5. Document Rotation</text><text x="85" y="727" class="small">均匀选一个 token 为新起点；模型要找回真正开头</text>
  <g transform="translate(500 700)"><g fill="#fef3c7" stroke="#f59e0b"><rect x="0" width="55" height="48" rx="8"/><rect x="65" width="55" height="48" rx="8"/><rect x="130" width="55" height="48" rx="8"/><rect x="195" width="55" height="48" rx="8"/><rect x="260" width="55" height="48" rx="8"/><rect x="325" width="55" height="48" rx="8"/><rect x="390" width="55" height="48" rx="8"/><rect x="455" width="55" height="48" rx="8"/><rect x="520" width="55" height="48" rx="8"/></g><g class="token" text-anchor="middle"><text x="27" y="30">D</text><text x="92" y="30">E</text><text x="157" y="30">.</text><text x="222" y="30">F</text><text x="287" y="30">.</text><text x="352" y="30">A</text><text x="417" y="30">B</text><text x="482" y="30">C</text><text x="547" y="30">.</text></g></g>
  <text x="85" y="790" class="tiny">论文结论：rotation 与 sentence permutation 单独做预训练都明显不足；局部 token/span 缺失才是稳定强信号。</text>
  <text x="55" y="865" class="tiny">示意图只展示变换语义，不声称复刻某个随机样本；最终 BART-large 使用 text infilling + sentence permutation，不使用其余三种噪声。</text>
</svg>
