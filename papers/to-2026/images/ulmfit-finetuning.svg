<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ULMFiT 控制微调的三种互补机制</title>
  <desc id="desc">左侧展示自底向上按 2.6 倍递增的判别式学习率；中间展示前 10% 快速升温、后 90% 缓慢衰减的 STLR；右侧展示从分类头到更低层逐步扩大的渐进解冻范围。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel-title { font: 700 20px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 600 13px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .white { font: 700 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="60" class="title">防止灾难性遗忘，不靠一个开关，而靠三个时间尺度</text>
  <text x="70" y="92" class="subtitle">Discriminative fine-tuning 控制“哪层走多快”，STLR 控制“每层何时走快”，gradual unfreezing 控制“何时允许哪层开始走”。</text>

  <!-- Panel 1: discriminative LRs -->
  <g filter="url(#shadow)">
    <rect x="55" y="130" width="400" height="680" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="89" cy="174" r="18" fill="#2563eb"/>
  <text x="89" y="179" text-anchor="middle" class="white">1</text>
  <text x="120" y="181" class="panel-title">判别式微调</text>
  <text x="85" y="216" class="small">越靠近任务输出，学习率越大；底层小步移动。</text>

  <line x1="158" y1="700" x2="389" y2="700" class="axis"/>
  <line x1="158" y1="314" x2="158" y2="700" class="axis"/>
  <line x1="158" y1="604" x2="389" y2="604" class="grid"/>
  <line x1="158" y1="508" x2="389" y2="508" class="grid"/>
  <line x1="158" y1="412" x2="389" y2="412" class="grid"/>
  <line x1="158" y1="316" x2="389" y2="316" class="grid"/>

  <text x="143" y="676" text-anchor="end" class="small">Embedding</text>
  <text x="143" y="580" text-anchor="end" class="small">LSTM 1</text>
  <text x="143" y="484" text-anchor="end" class="small">LSTM 2</text>
  <text x="143" y="388" text-anchor="end" class="small">LSTM 3</text>
  <text x="143" y="292" text-anchor="end" class="small">分类头</text>

  <rect x="158" y="650" width="34" height="45" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="158" y="554" width="59" height="45" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
  <rect x="158" y="458" width="100" height="45" rx="6" fill="#93c5fd" stroke="#3b82f6"/>
  <rect x="158" y="362" width="158" height="45" rx="6" fill="#60a5fa" stroke="#2563eb"/>
  <rect x="158" y="266" width="220" height="45" rx="6" fill="#2563eb" stroke="#1d4ed8"/>
  <text x="201" y="680" class="mono">ηᴸ/45.7</text>
  <text x="226" y="584" class="mono">ηᴸ/17.6</text>
  <text x="267" y="488" class="mono">ηᴸ/6.76</text>
  <text x="325" y="392" class="mono">ηᴸ/2.6</text>
  <text x="268" y="296" text-anchor="middle" class="white">ηᴸ（最大）</text>

  <path d="M362 665 C405 624 405 362 362 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="382" y="511" transform="rotate(-90 382 511)" text-anchor="middle" class="small">每升一层 × 2.6</text>

  <rect x="82" y="734" width="346" height="52" rx="10" fill="#eff6ff"/>
  <text x="255" y="756" text-anchor="middle" class="label">更新式</text>
  <text x="255" y="778" text-anchor="middle" class="mono">θₜˡ = θₜ₋₁ˡ − ηˡ · ∇θˡ J(θ)</text>

  <!-- Panel 2: STLR -->
  <g filter="url(#shadow)">
    <rect x="500" y="130" width="400" height="680" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="534" cy="174" r="18" fill="#d97706"/>
  <text x="534" y="179" text-anchor="middle" class="white">2</text>
  <text x="565" y="181" class="panel-title">倾斜三角学习率</text>
  <text x="530" y="216" class="small">短暂快速升温，随后把大部分更新用于缓慢收敛。</text>

  <line x1="570" y1="650" x2="850" y2="650" class="axis"/>
  <line x1="570" y1="300" x2="570" y2="650" class="axis"/>
  <line x1="570" y1="342" x2="850" y2="342" class="grid"/>
  <line x1="570" y1="638" x2="850" y2="638" class="grid"/>
  <line x1="598" y1="300" x2="598" y2="650" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>

  <path d="M570 638 L598 320 L850 638" fill="none" stroke="#d97706" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="570" cy="638" r="5" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <circle cx="598" cy="320" r="6" fill="#d97706"/>
  <circle cx="850" cy="638" r="5" fill="#ffffff" stroke="#d97706" stroke-width="3"/>

  <text x="558" y="345" text-anchor="end" class="mono">ηmax</text>
  <text x="558" y="642" text-anchor="end" class="mono">ηmax/32</text>
  <text x="570" y="676" text-anchor="middle" class="small">0%</text>
  <text x="598" y="676" text-anchor="middle" class="small">10%</text>
  <text x="850" y="676" text-anchor="middle" class="small">100%</text>
  <text x="710" y="706" text-anchor="middle" class="small">优化器更新进度 t / T</text>

  <rect x="586" y="247" width="145" height="40" rx="9" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="658" y="272" text-anchor="middle" class="label">快速找到合适区域</text>
  <path d="M633 287 L603 311" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="677" y="395" width="170" height="50" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="762" y="417" text-anchor="middle" class="label">长衰减用于细化</text>
  <text x="762" y="437" text-anchor="middle" class="tiny">而不是反复重启周期</text>
  <path d="M755 445 L738 494" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="528" y="734" width="344" height="52" rx="10" fill="#fff7ed"/>
  <text x="700" y="756" text-anchor="middle" class="label">论文默认</text>
  <text x="700" y="778" text-anchor="middle" class="mono">cut_frac = 0.1 · ratio = 32</text>

  <!-- Panel 3: gradual unfreezing -->
  <g filter="url(#shadow)">
    <rect x="945" y="130" width="400" height="680" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="979" cy="174" r="18" fill="#7c3aed"/>
  <text x="979" y="179" text-anchor="middle" class="white">3</text>
  <text x="1010" y="181" class="panel-title">渐进解冻</text>
  <text x="975" y="216" class="small">先训练新分类头，再从高层到低层扩大可训练范围。</text>

  <text x="1017" y="269" text-anchor="middle" class="small">阶段</text>
  <text x="1087" y="269" text-anchor="middle" class="tiny">Emb.</text>
  <text x="1138" y="269" text-anchor="middle" class="tiny">L1</text>
  <text x="1189" y="269" text-anchor="middle" class="tiny">L2</text>
  <text x="1240" y="269" text-anchor="middle" class="tiny">L3</text>
  <text x="1291" y="269" text-anchor="middle" class="tiny">Head</text>

  <!-- matrix background and rows -->
  <rect x="1059" y="284" width="257" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="1110" y1="284" x2="1110" y2="614" class="grid"/>
  <line x1="1161" y1="284" x2="1161" y2="614" class="grid"/>
  <line x1="1212" y1="284" x2="1212" y2="614" class="grid"/>
  <line x1="1263" y1="284" x2="1263" y2="614" class="grid"/>
  <line x1="1059" y1="350" x2="1316" y2="350" class="grid"/>
  <line x1="1059" y1="416" x2="1316" y2="416" class="grid"/>
  <line x1="1059" y1="482" x2="1316" y2="482" class="grid"/>
  <line x1="1059" y1="548" x2="1316" y2="548" class="grid"/>

  <text x="1017" y="323" text-anchor="middle" class="label">0</text>
  <text x="1017" y="389" text-anchor="middle" class="label">1</text>
  <text x="1017" y="455" text-anchor="middle" class="label">2</text>
  <text x="1017" y="521" text-anchor="middle" class="label">3</text>
  <text x="1017" y="587" text-anchor="middle" class="label">4</text>

  <!-- trainable cells -->
  <rect x="1268" y="290" width="45" height="54" rx="7" fill="#7c3aed"/>
  <rect x="1217" y="356" width="45" height="54" rx="7" fill="#a78bfa"/>
  <rect x="1268" y="356" width="45" height="54" rx="7" fill="#7c3aed"/>
  <rect x="1166" y="422" width="45" height="54" rx="7" fill="#c4b5fd"/>
  <rect x="1217" y="422" width="45" height="54" rx="7" fill="#a78bfa"/>
  <rect x="1268" y="422" width="45" height="54" rx="7" fill="#7c3aed"/>
  <rect x="1115" y="488" width="45" height="54" rx="7" fill="#ddd6fe"/>
  <rect x="1166" y="488" width="45" height="54" rx="7" fill="#c4b5fd"/>
  <rect x="1217" y="488" width="45" height="54" rx="7" fill="#a78bfa"/>
  <rect x="1268" y="488" width="45" height="54" rx="7" fill="#7c3aed"/>
  <rect x="1064" y="554" width="45" height="54" rx="7" fill="#ede9fe"/>
  <rect x="1115" y="554" width="45" height="54" rx="7" fill="#ddd6fe"/>
  <rect x="1166" y="554" width="45" height="54" rx="7" fill="#c4b5fd"/>
  <rect x="1217" y="554" width="45" height="54" rx="7" fill="#a78bfa"/>
  <rect x="1268" y="554" width="45" height="54" rx="7" fill="#7c3aed"/>

  <text x="1145" y="649" text-anchor="middle" class="small">浅层知识更通用</text>
  <text x="1275" y="649" text-anchor="middle" class="small">高层更任务相关</text>
  <path d="M1084 665 L1290 665" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="973" y="696" width="344" height="90" rx="10" fill="#f5f3ff"/>
  <text x="1145" y="722" text-anchor="middle" class="label">每扩一层，已解冻层继续训练</text>
  <text x="1145" y="747" text-anchor="middle" class="small">不同于 chain-thaw 的“一次只训单层”</text>
  <text x="1145" y="771" text-anchor="middle" class="small">最后全解冻并训练到收敛</text>

  <rect x="55" y="840" width="1290" height="38" rx="10" fill="#e2e8f0"/>
  <text x="700" y="865" text-anchor="middle" class="label">三者共同约束参数漂移：底层更晚开始、步长更小；所有层先快速适配，再以长衰减稳定收敛。</text>
</svg>
