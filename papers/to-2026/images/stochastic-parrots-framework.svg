<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#21143d"/></linearGradient><linearGradient id="bird"><stop stop-color="#25c5df"/><stop offset="1" stop-color="#9776f0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<rect width="1400" height="820" rx="32" fill="url(#bg)"/><text x="54" y="64" fill="#f6f8ff" font-size="32" font-weight="700">Stochastic Parrots：规模增长不是价值增长的充分条件</text><text x="54" y="98" fill="#9fb8df" font-size="18">论文把技术系统放回数据、劳动、环境与社会后果的完整链条中</text>
<g font-family="Arial,'Noto Sans SC',sans-serif"><rect x="50" y="150" width="280" height="530" rx="24" fill="#102b45" stroke="#2bc3dd" stroke-width="2"/><text x="82" y="202" fill="#fff" font-size="25" font-weight="700">数据与劳动</text><text x="82" y="244" fill="#9ed5e4" font-size="17">来源、许可、同意</text><text x="82" y="275" fill="#9ed5e4" font-size="17">标注者与隐形劳动</text><text x="82" y="306" fill="#9ed5e4" font-size="17">记录谁被纳入/排除</text><path d="M110 390h160M110 430h120M110 470h180" stroke="#5fd9ea" stroke-width="8" stroke-linecap="round"/><rect x="86" y="355" width="190" height="145" rx="12" fill="#173c57" stroke="#5fd9ea"/><text x="102" y="560" fill="#fff" font-size="18">documentation debt</text>
<rect x="370" y="150" width="660" height="530" rx="24" fill="#101f42" stroke="#9b74ef" stroke-width="2"/><text x="405" y="202" fill="#fff" font-size="25" font-weight="700">大规模语言模型</text><text x="405" y="242" fill="#bca8f8" font-size="17">统计地重组训练语料中的形式</text><circle cx="700" cy="415" r="150" fill="#34bfd8" opacity=".18" filter="url(#glow)"/><path d="M635 520c-38-94-18-216 66-258 60-30 116 20 101 67 48 7 73 58 43 92 24 54-29 101-88 100l-42 48z" fill="url(#bird)" opacity=".85"/><circle cx="745" cy="322" r="8" fill="#fff"/><path d="M648 398l95-76 80 84-109 79zM610 450l204-94M666 543l94-221" stroke="#e8f7ff" stroke-opacity=".58" stroke-width="2" fill="none"/><g fill="#bf9aff"><circle cx="648" cy="398" r="5"/><circle cx="743" cy="322" r="5"/><circle cx="823" cy="406" r="5"/><circle cx="714" cy="485" r="5"/></g><text x="535" y="620" fill="#d6d7ff" font-size="18">可生成流畅文本 ≠ 已获得世界中的意义</text>
<rect x="1070" y="150" width="280" height="530" rx="24" fill="#291f3f" stroke="#f0ae36" stroke-width="2"/><text x="1102" y="202" fill="#fff" font-size="25" font-weight="700">后果与治理</text><text x="1102" y="244" fill="#f2c879" font-size="17">偏见与刻板化</text><text x="1102" y="275" fill="#f2c879" font-size="17">隐私与误用</text><text x="1102" y="306" fill="#f2c879" font-size="17">环境与财务成本</text><path d="M1210 400l65 115h-130z" fill="#f3b540"/><text x="1202" y="487" fill="#33200a" font-size="42" font-weight="700">!</text><text x="1110" y="560" fill="#fff" font-size="18">部署前先问：谁受益，</text><text x="1110" y="592" fill="#fff" font-size="18">谁承担风险？</text></g>
<path d="M330 415h38M1030 415h38" stroke="#9fb8df" stroke-width="4" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#9fb8df"/></marker></defs>
</svg>
