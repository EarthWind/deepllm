<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">BERT 静态掩码与 RoBERTa 动态掩码</title>
  <desc id="desc">BERT 预处理十种掩码并在四十个训练周期中循环复用；RoBERTa 每次读取时重新采样。被选中的百分之十五位置再按八十、十、十分成 mask、随机词和保持原词。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>.title{font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.panel{font:700 20px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 14px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.tiny{font:500 11.5px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}.mono{font:600 12.5px "JetBrains Mono",Consolas,monospace;fill:#334155}.white{font:700 14px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#fff}.big{font:700 29px "JetBrains Mono",Consolas,monospace;fill:#1d4ed8}</style>
  </defs>
  <rect width="1400" height="790" fill="#f8fafc"/><text x="70" y="58" class="title">动态 masking 改变的是数据增强时机，不是 MLM 的 15% 与 80/10/10</text><text x="70" y="90" class="subtitle">标签永远是被选中位置的原 token；输入是否真的出现 &lt;mask&gt; 是另一层随机选择。</text>
  <g filter="url(#shadow)"><rect x="55" y="130" width="820" height="275" rx="18" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="85" y="171" class="panel">BERT：预处理阶段生成有限 pattern，再循环复用</text><text x="85" y="197" class="small">论文说明训练数据复制 10 份，40 个 epoch 中每个序列的同一 mask 会见到 4 次。</text>
  <g transform="translate(85 225)">
    <text x="0" y="26" class="label">pattern 0</text><rect x="100" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="163" y="0" width="55" height="38" rx="7" fill="#2563eb"/><rect x="226" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="289" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="352" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="415" y="0" width="55" height="38" rx="7" fill="#2563eb"/><text x="190" y="25" text-anchor="middle" class="white">MASK</text><text x="442" y="25" text-anchor="middle" class="white">MASK</text>
    <text x="0" y="82" class="label">pattern 1</text><rect x="100" y="56" width="55" height="38" rx="7" fill="#2563eb"/><rect x="163" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="226" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="289" y="56" width="55" height="38" rx="7" fill="#2563eb"/><rect x="352" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="415" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><text x="127" y="81" text-anchor="middle" class="white">MASK</text><text x="316" y="81" text-anchor="middle" class="white">MASK</text>
    <text x="0" y="139" class="label">… pattern 9</text><rect x="100" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="163" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="226" y="113" width="55" height="38" rx="7" fill="#2563eb"/><rect x="289" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="352" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="415" y="113" width="55" height="38" rx="7" fill="#2563eb"/><text x="253" y="138" text-anchor="middle" class="white">MASK</text><text x="442" y="138" text-anchor="middle" class="white">MASK</text>
    <path d="M505 16 C570 16 570 133 635 133" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6"/><text x="550" y="62" class="label" fill="#b45309">epoch 10</text><text x="550" y="85" class="small">回到 pattern 0</text>
  </g>
  <g filter="url(#shadow)"><rect x="55" y="430" width="820" height="285" rx="18" fill="#fff" stroke="#93c5fd"/></g>
  <text x="85" y="471" class="panel">RoBERTa：每次把序列交给模型时重新生成 mask</text><text x="85" y="497" class="small">pattern 数不再被预处理副本数限制；训练更久、重复读取更多时尤其自然。</text>
  <g transform="translate(85 527)">
    <text x="0" y="26" class="label">read 0</text><rect x="100" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="163" y="0" width="55" height="38" rx="7" fill="#2563eb"/><rect x="226" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="289" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="352" y="0" width="55" height="38" rx="7" fill="#2563eb"/><rect x="415" y="0" width="55" height="38" rx="7" fill="#dbeafe"/><text x="190" y="25" text-anchor="middle" class="white">MASK</text><text x="379" y="25" text-anchor="middle" class="white">MASK</text>
    <text x="0" y="82" class="label">read 1</text><rect x="100" y="56" width="55" height="38" rx="7" fill="#2563eb"/><rect x="163" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="226" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="289" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="352" y="56" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="415" y="56" width="55" height="38" rx="7" fill="#2563eb"/><text x="127" y="81" text-anchor="middle" class="white">MASK</text><text x="442" y="81" text-anchor="middle" class="white">MASK</text>
    <text x="0" y="139" class="label">read 10</text><rect x="100" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="163" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="226" y="113" width="55" height="38" rx="7" fill="#2563eb"/><rect x="289" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><rect x="352" y="113" width="55" height="38" rx="7" fill="#2563eb"/><rect x="415" y="113" width="55" height="38" rx="7" fill="#dbeafe"/><text x="253" y="138" text-anchor="middle" class="white">MASK</text><text x="379" y="138" text-anchor="middle" class="white">MASK</text>
    <text x="505" y="50" class="big">∞</text><text x="555" y="41" class="label">概念上可不断重采样</text><text x="555" y="66" class="small">固定 seed 仍可复现</text>
  </g>
  <g filter="url(#shadow)"><rect x="910" y="130" width="435" height="585" rx="18" fill="#fff" stroke="#fdba74"/></g>
  <text x="940" y="171" class="panel">一次 MLM 扰动的两层采样</text><text x="940" y="197" class="small">静态与动态都遵守相同条件概率。</text>
  <circle cx="1127" cy="292" r="74" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1127" y="282" text-anchor="middle" class="big">15%</text><text x="1127" y="309" text-anchor="middle" class="label">非特殊 token</text><text x="1127" y="331" text-anchor="middle" class="small">参与 MLM loss</text>
  <path d="M1127 366 L1127 406" stroke="#64748b" stroke-width="2.5"/><path d="M1120 398 L1127 409 L1134 398" fill="#64748b"/>
  <rect x="947" y="425" width="225" height="70" rx="12" fill="#2563eb"/><text x="968" y="453" class="white">80% → 替换为 &lt;mask&gt;</text><text x="968" y="478" class="tiny" fill="#dbeafe">占全部候选 token 的期望 12%</text>
  <rect x="1185" y="425" width="133" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b"/><text x="1202" y="453" class="label">10% → 随机词</text><text x="1202" y="478" class="tiny">期望 1.5%</text>
  <rect x="947" y="512" width="371" height="70" rx="12" fill="#ecfdf5" stroke="#34d399"/><text x="968" y="540" class="label">10% → 输入保持原词</text><text x="968" y="565" class="tiny">仍有标签、仍计算 loss；不是“跳过这个位置”</text>
  <rect x="947" y="608" width="371" height="75" rx="12" fill="#0f172a"/><text x="1132" y="637" text-anchor="middle" class="white">标签：三种分支都指向扰动前原 token</text><text x="1132" y="661" text-anchor="middle" class="tiny" fill="#cbd5e1">未选中的 85% 位置不计 MLM loss</text>
  <text x="55" y="758" class="tiny">论文 Table 1：dynamic 在 SQuAD 2.0 / MNLI-m / SST-2 上分别为 78.7 / 84.0 / 92.9；static 为 78.3 / 84.3 / 92.5。结论是相当或略好，不是单项巨大跃升。</text>
</svg>
