<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740" role="img" aria-labelledby="title desc">
  <title id="title">Vision Transformer 的数据规模结论与主要实验结果</title>
  <desc id="desc">左侧展示 ViT 与 BiT 在 ImageNet、ImageNet-21k、JFT-300M 三种规模上的相对表现，右侧给出论文 ViT-H/14 JFT 结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111e"/><stop offset="1" stop-color="#13152e"/></linearGradient>
    <style>.s{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{font-size:32px;font-weight:700;fill:#f8fafc}.h{font-size:21px;font-weight:650;fill:#e2e8f0}.m{font-size:16px;fill:#cbd5e1}.n{font-size:13px;fill:#94a3b8}.big{font-size:30px;font-weight:750;fill:#67e8f9}.card{fill:#0c1d31;stroke:#2a4563;stroke-width:1.5}</style>
  </defs>
  <rect width="1320" height="740" rx="26" fill="url(#bg)"/>
  <text x="52" y="61" class="s t">论文真正证明的是“规模改变架构优劣”，不是小数据上无条件碾压 CNN</text>
  <text x="52" y="92" class="s n">左侧为论文第 4.3 节的定性结论；右侧数字来自表 2，均为 JFT-300M 监督预训练后的 ViT-H/14</text>

  <g transform="translate(50 128)">
    <rect width="575" height="536" rx="20" class="card"/>
    <text x="28" y="42" class="s h">数据规模 × 归纳偏置</text>
    <path d="M79 440H532" stroke="#48647f" stroke-width="2"/><path d="M100 82V465" stroke="#48647f" stroke-width="2"/>
    <text x="60" y="94" class="s n" transform="rotate(-90 60 94)">迁移表现</text>
    <path d="M115 366C236 312 312 242 508 151" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
    <path d="M115 319C258 257 382 223 508 204" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
    <g fill="#22d3ee"><circle cx="115" cy="366" r="9"/><circle cx="303" cy="250" r="9"/><circle cx="508" cy="151" r="9"/></g>
    <g fill="#fb7185"><circle cx="115" cy="319" r="9"/><circle cx="303" cy="240" r="9"/><circle cx="508" cy="204" r="9"/></g>
    <text x="419" y="128" class="s m" fill="#67e8f9">ViT</text><text x="476" y="228" class="s m" fill="#fda4af">BiT CNN</text>
    <g class="s n" text-anchor="middle"><text x="115" y="470">ImageNet</text><text x="115" y="491">1.3M</text><text x="303" y="470">ImageNet-21k</text><text x="303" y="491">14M</text><text x="508" y="470">JFT</text><text x="508" y="491">303M</text></g>
    <g class="s n" text-anchor="middle"><text x="115" y="413" fill="#fda4af">CNN 占优</text><text x="303" y="215">大致相当</text><text x="508" y="116" fill="#67e8f9">ViT 反超</text></g>
    <text x="28" y="519" class="s n">示意线仅表达论文报告的相对趋势，不是从原图反算的逐点数值。</text>
  </g>

  <g transform="translate(655 128)">
    <rect width="615" height="536" rx="20" class="card"/>
    <text x="28" y="42" class="s h">ViT-H/14：论文最佳模型</text>
    <text x="28" y="69" class="s n">632M 参数 · JFT-300M · 14 epochs · 2.5k TPUv3-core-days</text>
    <g transform="translate(28 102)">
      <g><rect width="267" height="112" rx="15" fill="#0f2940"/><text x="22" y="34" class="s m">ImageNet</text><text x="22" y="79" class="s big">88.55%</text><text x="155" y="79" class="s n">± 0.04</text></g>
      <g transform="translate(291)"><rect width="267" height="112" rx="15" fill="#18254c"/><text x="22" y="34" class="s m">ImageNet-ReaL</text><text x="22" y="79" class="s big">90.72%</text><text x="155" y="79" class="s n">± 0.05</text></g>
      <g transform="translate(0 136)"><rect width="267" height="112" rx="15" fill="#132b3d"/><text x="22" y="34" class="s m">CIFAR-100</text><text x="22" y="79" class="s big">94.55%</text><text x="155" y="79" class="s n">± 0.04</text></g>
      <g transform="translate(291 136)"><rect width="267" height="112" rx="15" fill="#2d2050"/><text x="22" y="34" class="s m">VTAB-19</text><text x="22" y="79" class="s big">77.63%</text><text x="155" y="79" class="s n">± 0.23</text></g>
      <g transform="translate(0 272)"><rect width="267" height="112" rx="15" fill="#122c35"/><text x="22" y="34" class="s m">CIFAR-10</text><text x="22" y="79" class="s big">99.50%</text><text x="155" y="79" class="s n">± 0.06</text></g>
      <g transform="translate(291 272)"><rect width="267" height="112" rx="15" fill="#33203d"/><text x="22" y="34" class="s m">Oxford Pets</text><text x="22" y="79" class="s big">97.56%</text><text x="155" y="79" class="s n">± 0.03</text></g>
    </g>
    <text x="28" y="513" class="s n">同表中的 ViT-L/16（JFT）只用 0.68k core-days；BiT-L 为 9.9k。</text>
  </g>
  <text x="660" y="710" text-anchor="middle" class="s n">受控 JFT 扩展实验中，ViT 达到相同性能约少用 2–4× 预训练计算；混合 CNN+ViT 的小模型优势在大规模时消失。</text>
</svg>
