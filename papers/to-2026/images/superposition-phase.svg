<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#08152f"/><stop offset="1" stop-color="#251540"/></linearGradient></defs><rect width="1400" height="760" rx="30" fill="url(#b)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">相变直觉：稀疏性改变最优几何结构</text><text x="52" y="96" fill="#a9bde3" font-size="18">当每个 feature 足够少见，共享方向的干扰成本低于增加独立维度的成本</text><line x1="155" y1="600" x2="1250" y2="600" stroke="#8299bf" stroke-width="3"/><line x1="155" y1="165" x2="155" y2="600" stroke="#8299bf" stroke-width="3"/><text x="85" y="180" fill="#b7caeb" font-size="18">表示收益</text><text x="1090" y="645" fill="#b7caeb" font-size="18">feature 稀疏度 ↑</text><path d="M190 520C360 500 460 470 570 410S730 260 875 245 1070 220 1210 205" fill="none" stroke="#35c5df" stroke-width="6"/><path d="M190 490C360 455 455 390 575 365S760 380 900 410 1080 455 1210 505" fill="none" stroke="#efb13f" stroke-width="6"/><path d="M190 535C360 530 475 520 600 510S780 500 930 475 1090 445 1210 430" fill="none" stroke="#9b75ed" stroke-width="6"/><g fill="#fff"><circle cx="570" cy="410" r="8"/><circle cx="875" cy="245" r="8"/><circle cx="900" cy="410" r="8"/></g><text x="900" y="210" fill="#35c5df" font-size="18">独立方向：密集特征时更优</text><text x="940" y="550" fill="#efb13f" font-size="18">重叠/多面体：稀疏时更优</text><text x="860" y="490" fill="#9b75ed" font-size="18">重建误差</text><rect x="190" y="190" width="320" height="130" rx="15" fill="#102f49" stroke="#35c5df"/><text x="225" y="235" fill="#fff" font-size="22" font-weight="700">密集区</text><text x="225" y="275" fill="#a5dce6" font-size="16">每个 feature 同时出现</text><text x="225" y="300" fill="#f2c677" font-size="16">干扰共享，宜分开表示</text><rect x="940" y="275" width="330" height="130" rx="15" fill="#29213f" stroke="#efb13f"/><text x="975" y="320" fill="#fff" font-size="22" font-weight="700">稀疏区</text><text x="975" y="360" fill="#f2ca7c" font-size="16">feature 很少同时出现</text><text x="975" y="385" fill="#f2ca7c" font-size="16">可用几何折叠换取容量</text><text x="430" y="700" fill="#f1d354" font-size="18">相变不是神秘魔法，而是损失函数中两种代价的交叉</text></g></svg>
