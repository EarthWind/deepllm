<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">GPT-3 预训练与上下文学习</title>
  <desc id="desc">上半部分展示预训练通过梯度下降更新参数，下半部分展示推理时把任务说明、示例和问题拼入上下文，参数保持不变。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102951"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .title { font: 700 32px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #f8fafc; }
      .section { font: 700 24px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #e2e8f0; }
      .label { font: 600 19px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #f8fafc; }
      .small { font: 400 16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #cbd5e1; }
      .mono { font: 500 16px "JetBrains Mono","Noto Sans Mono CJK SC",monospace; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="64" class="title">同一个自回归目标，两种不同的“学习”</text>
  <line x1="64" y1="344" x2="1216" y2="344" stroke="#334155" stroke-width="2"/>

  <text x="64" y="116" class="section">① 预训练：参数学习</text>
  <g filter="url(#shadow)">
    <rect x="64" y="150" width="250" height="130" rx="18" fill="#10233f" stroke="#38bdf8" stroke-width="2"/>
    <text x="189" y="190" text-anchor="middle" class="label">海量文本 token</text>
    <text x="189" y="225" text-anchor="middle" class="mono">x₁, x₂, …, xₜ</text>
    <text x="189" y="255" text-anchor="middle" class="small">预测下一个 token</text>

    <rect x="455" y="150" width="250" height="130" rx="18" fill="#172554" stroke="#818cf8" stroke-width="2"/>
    <text x="580" y="190" text-anchor="middle" class="label">GPT-3</text>
    <text x="580" y="224" text-anchor="middle" class="mono">pθ(xₜ | x&lt;ₜ)</text>
    <text x="580" y="255" text-anchor="middle" class="small">前向计算</text>

    <rect x="846" y="150" width="250" height="130" rx="18" fill="#3b1d2f" stroke="#fb7185" stroke-width="2"/>
    <text x="971" y="190" text-anchor="middle" class="label">交叉熵损失</text>
    <text x="971" y="224" text-anchor="middle" class="mono">L = −log pθ(xₜ | x&lt;ₜ)</text>
    <text x="971" y="255" text-anchor="middle" class="small">反向传播更新 θ</text>
  </g>
  <path d="M314 215 H440" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M705 215 H831" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <path d="M970 145 C970 105, 580 105, 580 137" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowAmber)"/>
  <text x="785" y="96" text-anchor="middle" class="small">optimizer.step()：长期写入模型参数</text>

  <text x="64" y="400" class="section">② 推理：上下文学习（In-Context Learning）</text>
  <g filter="url(#shadow)">
    <rect x="64" y="440" width="210" height="170" rx="18" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="169" y="478" text-anchor="middle" class="label">任务说明</text>
    <text x="169" y="514" text-anchor="middle" class="small">“判断情感”</text>
    <text x="169" y="550" text-anchor="middle" class="label">示例 × K</text>
    <text x="169" y="582" text-anchor="middle" class="small">输入 → 输出</text>

    <rect x="314" y="440" width="210" height="170" rx="18" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="419" y="485" text-anchor="middle" class="label">当前问题</text>
    <text x="419" y="525" text-anchor="middle" class="small">“这部电影很棒”</text>
    <text x="419" y="567" text-anchor="middle" class="mono">Answer:</text>

    <rect x="654" y="440" width="250" height="170" rx="18" fill="#172554" stroke="#818cf8" stroke-width="2"/>
    <text x="779" y="485" text-anchor="middle" class="label">同一个 GPT-3</text>
    <text x="779" y="525" text-anchor="middle" class="mono">θ 固定</text>
    <text x="779" y="565" text-anchor="middle" class="small">只有前向计算</text>

    <rect x="1034" y="440" width="182" height="170" rx="18" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="1125" y="495" text-anchor="middle" class="label">续写</text>
    <text x="1125" y="540" text-anchor="middle" class="mono">正面</text>
    <text x="1125" y="578" text-anchor="middle" class="small">临时行为</text>
  </g>
  <path d="M274 525 H299" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M524 525 H639" stroke="#818cf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M904 525 H1019" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <text x="589" y="650" text-anchor="middle" class="small">任务说明、示例和问题都只是同一条 token 序列；没有反向传播，也没有参数更新</text>
</svg>
