<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V2 的预训练、长上下文扩展与对齐流程</title>
  <desc id="desc">DeepSeek-V2 先以 4K 长度在 8.1T 中英双语 token 上预训练，再用 YaRN 和 1000 步 32K 训练扩展至 128K；随后用 150 万 SFT 实例训练两轮，并用两阶段 GRPO 完成推理与人类偏好对齐。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061522"/><stop offset="1" stop-color="#1b2140"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#36c4d6"/><stop offset="1" stop-color="#3878dc"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#7d63e8"/><stop offset="1" stop-color="#bc62be"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#ffc15a"/><stop offset="1" stop-color="#ec7c42"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#91aac7"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#9fb5d0}.head{font-size:20px;font-weight:760;fill:#fff}.body{font-size:15px;fill:#dce8f6}.small{font-size:13px;fill:#9fb5d0}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#f4f8ff}.dark{font-size:15px;font-weight:760;fill:#142039}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="59" class="sans title">从 4K 预训练到 128K 服务，再到 SFT + 在线 GRPO</text>
  <text x="52" y="91" class="sans sub">“支持 128K”来自单独的 YaRN 扩展阶段；Base、Chat(SFT) 与 Chat(RL) 是三个不同 checkpoint 口径</text>

  <path d="M113 349H1166" stroke="#68829d" stroke-width="4"/>
  <g filter="url(#shadow)">
    <circle cx="171" cy="349" r="30" fill="url(#cyan)"/><circle cx="469" cy="349" r="30" fill="url(#violet)"/><circle cx="767" cy="349" r="30" fill="url(#amber)"/><circle cx="1065" cy="349" r="30" fill="#4b8c83"/>
  </g>
  <g class="sans">
    <rect x="58" y="146" width="226" height="153" rx="18" fill="#10273d" stroke="#397798"/>
    <text x="171" y="181" text-anchor="middle" class="head">1 · Pre-training</text>
    <text x="82" y="214" class="body">8.1T BBPE tokens</text><text x="82" y="242" class="body">sequence length 4K</text><text x="82" y="270" class="small">中英双语；中文 token 约多 12%</text>
    <path d="M171 299V315" stroke="#91aac7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="356" y="399" width="226" height="185" rx="18" fill="#172643" stroke="#7866b8"/>
    <text x="469" y="434" text-anchor="middle" class="head">2 · Long Context</text>
    <text x="380" y="467" class="body">YaRN factor 40</text><text x="380" y="495" class="body">1000 steps · length 32K</text><text x="380" y="523" class="body">target config 160K</text><text x="380" y="551" class="small">NIAH 评测至 128K</text>
    <path d="M469 383V399" stroke="#91aac7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="654" y="146" width="226" height="153" rx="18" fill="#352d28" stroke="#d18c45"/>
    <text x="767" y="181" text-anchor="middle" class="head">3 · SFT</text>
    <text x="678" y="214" class="body">1.5M sessions</text><text x="678" y="242" class="body">1.2M helpful + 0.3M safety</text><text x="678" y="270" class="small">2 epochs · lr 5e−6</text>
    <path d="M767 299V315" stroke="#91aac7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="952" y="399" width="226" height="185" rx="18" fill="#18343a" stroke="#4b8c83"/>
    <text x="1065" y="434" text-anchor="middle" class="head">4 · Online GRPO</text>
    <text x="976" y="467" class="body">Stage A: math + code</text><text x="976" y="495" class="body">Stage B: human preference</text><text x="976" y="523" class="small">helpful + safety + rule rewards</text><text x="976" y="551" class="small">无同尺寸 critic</text>
    <path d="M1065 383V399" stroke="#91aac7" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="48" y="624" width="1184" height="55" rx="16" fill="#2a3029" stroke="#d18c45"/>
  <text x="72" y="657" class="sans body">论文未包含 Multi-Token Prediction；MTP 是后续 DeepSeek-V3 的设计，不能回填到 V2；V2 的 RL 已使用 GRPO，但奖励与 R1-Zero 的纯规则路线不同。</text>
</svg>
