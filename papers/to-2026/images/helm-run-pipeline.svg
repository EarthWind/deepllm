<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">HELM v0.1.0 运行流水线</title><desc id="desc">从场景实例到适配请求、执行结果、指标统计与审计产物。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#151126"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6ad9ff"/></marker><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <text x="70" y="80" fill="#f5f7ff" font-family="Inter, PingFang SC, sans-serif" font-size="38" font-weight="700">HELM 的可复现单位：不是一个分数，而是一条完整运行链</text>
  <text x="70" y="122" fill="#93a8c1" font-family="Inter, PingFang SC, sans-serif" font-size="20">下图对应论文发布标签 v0.1.0 的核心对象；当前主分支接口已继续演化</text>
  <g font-family="Inter, PingFang SC, sans-serif">
    <g transform="translate(55 230)"><rect width="205" height="235" rx="25" fill="#102d3a" stroke="#3bd5f9" stroke-width="2"/><text x="102" y="51" text-anchor="middle" fill="#5ee0ff" font-size="25" font-weight="700">Scenario</text><text x="102" y="92" text-anchor="middle" fill="#eafcff" font-size="19">task + data</text><rect x="35" y="125" width="135" height="67" rx="12" fill="#164155"/><text x="102" y="153" text-anchor="middle" fill="#bcefff" font-size="16">Instance</text><text x="102" y="179" text-anchor="middle" fill="#8fd1e6" font-size="14">input + references</text></g>
    <g transform="translate(330 230)"><rect width="205" height="235" rx="25" fill="#25203d" stroke="#9d86ff" stroke-width="2"/><text x="102" y="51" text-anchor="middle" fill="#beaaff" font-size="25" font-weight="700">Adapter</text><text x="102" y="92" text-anchor="middle" fill="#f3efff" font-size="19">few-shot prompt</text><rect x="35" y="125" width="135" height="67" rx="12" fill="#37305a"/><text x="102" y="153" text-anchor="middle" fill="#ddd4ff" font-size="16">RequestState</text><text x="102" y="179" text-anchor="middle" fill="#b3a8d2" font-size="14">request + metadata</text></g>
    <g transform="translate(605 230)"><rect width="205" height="235" rx="25" fill="#302313" stroke="#ffb75d" stroke-width="2"/><text x="102" y="51" text-anchor="middle" fill="#ffc77d" font-size="25" font-weight="700">Executor</text><text x="102" y="92" text-anchor="middle" fill="#fff4e5" font-size="19">model / API</text><rect x="35" y="125" width="135" height="67" rx="12" fill="#47331b"/><text x="102" y="153" text-anchor="middle" fill="#ffe0b8" font-size="16">RequestResult</text><text x="102" y="179" text-anchor="middle" fill="#d3b995" font-size="14">completion + logprob</text></g>
    <g transform="translate(880 230)"><rect width="205" height="235" rx="25" fill="#182f2b" stroke="#55dfad" stroke-width="2"/><text x="102" y="51" text-anchor="middle" fill="#76edc3" font-size="25" font-weight="700">Metric</text><text x="102" y="92" text-anchor="middle" fill="#eafff7" font-size="19">measure behavior</text><rect x="35" y="125" width="135" height="67" rx="12" fill="#21483e"/><text x="102" y="153" text-anchor="middle" fill="#bcf5df" font-size="16">Stat</text><text x="102" y="179" text-anchor="middle" fill="#9dceb9" font-size="14">per-instance + aggregate</text></g>
    <g transform="translate(1155 230)"><rect width="230" height="235" rx="25" fill="#321b29" stroke="#ff78bc" stroke-width="2"/><text x="115" y="51" text-anchor="middle" fill="#ff9ece" font-size="25" font-weight="700">Artifacts</text><text x="115" y="92" text-anchor="middle" fill="#fff0f8" font-size="19">transparent record</text><text x="115" y="137" text-anchor="middle" fill="#f3bdd8" font-size="16">prompts · outputs</text><text x="115" y="170" text-anchor="middle" fill="#f3bdd8" font-size="16">run specs · metrics</text><text x="115" y="203" text-anchor="middle" fill="#f3bdd8" font-size="16">raw JSON · reports</text></g>
    <g stroke="#6ad9ff" stroke-width="4" marker-end="url(#a)"><path d="M265 348h52"/><path d="M540 348h52"/><path d="M815 348h52"/><path d="M1090 348h52"/></g>
    <g transform="translate(165 575)"><rect width="1110" height="165" rx="30" fill="#0d1828" stroke="#5f5982" stroke-width="2"/><text x="555" y="48" text-anchor="middle" fill="#f1efff" font-size="25" font-weight="700">RunSpec / Runner：把配置、状态和控制器接起来</text><text x="555" y="94" text-anchor="middle" fill="#b9afce" font-size="20">scenario_spec + adapter_spec + metric_specs + data_augmenter_spec + groups</text><text x="555" y="132" text-anchor="middle" fill="#79dfff" font-size="18">相同场景若 prompt、shot、temperature 或 tokenizer 不同，就不是同一条可比运行</text></g>
    <path d="M720 575V515" stroke="#9d86ff" stroke-width="4" marker-end="url(#a)" filter="url(#g)"/>
    <text x="720" y="817" text-anchor="middle" fill="#8298b4" font-size="18">规范化的是实验协议；模型内部仍可保持黑盒</text>
  </g>
</svg>
