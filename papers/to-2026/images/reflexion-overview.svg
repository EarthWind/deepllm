<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Reflexion 的 Actor、Evaluator、Self-Reflection 与记忆闭环</title>
  <desc id="desc">Actor 在环境中完成一次轨迹，Evaluator 给出反馈，Self-Reflection 把轨迹和反馈压缩成语言经验，长期记忆在环境重置后仍保留并条件化下一次尝试。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="actor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2563eb"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#ea580c"/></marker>
    <marker id="violetArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#8b5cf6"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#059669"/></marker>
    <style>
      .title{font:700 31px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.section{font:700 22px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#fff}.heading{font:700 20px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 14px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.mono{font:600 15px "JetBrains Mono",Consolas,monospace;fill:#1e3a8a}.white{fill:#fff}.blue{fill:#1d4ed8}.orange{fill:#c2410c}.violet{fill:#7c3aed}.green{fill:#047857}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="55" y="54" class="title">Reflexion：把一次失败压缩成下一次尝试可读取的语言经验</text>
  <text x="55" y="84" class="subtitle">轨迹是 trial 内的短期记忆；反思文本是跨 trial 保留的长期记忆；冻结 LLM 的参数 θ 不更新。</text>

  <g transform="translate(55 122)" filter="url(#shadow)">
    <rect width="1290" height="615" rx="28" fill="#fff" stroke="#cbd5e1"/>

    <g transform="translate(44 54)">
      <rect width="330" height="210" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <rect width="330" height="62" rx="24" fill="url(#actor)"/><rect y="38" width="330" height="24" fill="url(#actor)"/>
      <text x="24" y="40" class="section">① Actor · M<tspan baseline-shift="sub" font-size="14">a</tspan></text>
      <text x="24" y="96" class="body">输入：任务、观察、轨迹、mem</text>
      <text x="24" y="128" class="mono">a<tspan baseline-shift="sub" font-size="11">i</tspan> ∼ π(a<tspan baseline-shift="sub" font-size="11">i</tspan> | s<tspan baseline-shift="sub" font-size="11">i</tspan>; M<tspan baseline-shift="sub" font-size="11">a</tspan>, mem)</text>
      <text x="24" y="161" class="body">CoT：生成单次答案</text>
      <text x="24" y="189" class="body">ReAct：生成多步 Thought / Action</text>
    </g>

    <path d="M374 156H473" stroke="#2563eb" stroke-width="3.5" marker-end="url(#blueArrow)"/>
    <text x="424" y="137" text-anchor="middle" class="small blue">Action</text>

    <g transform="translate(478 54)">
      <rect width="330" height="210" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <rect width="330" height="62" rx="24" fill="#ea580c"/><rect y="38" width="330" height="24" fill="#ea580c"/>
      <text x="24" y="40" class="section">② Environment</text>
      <text x="24" y="96" class="body">执行动作，返回 Observation / Reward</text>
      <rect x="24" y="118" width="282" height="54" rx="13" fill="#ffedd5"/>
      <text x="165" y="151" text-anchor="middle" class="mono orange">τ<tspan baseline-shift="sub" font-size="11">t</tspan> = [a<tspan baseline-shift="sub" font-size="11">0</tspan>, o<tspan baseline-shift="sub" font-size="11">0</tspan>, …, a<tspan baseline-shift="sub" font-size="11">i</tspan>, o<tspan baseline-shift="sub" font-size="11">i</tspan>]</text>
      <text x="24" y="196" class="small">下一次 trial 通常从环境初态重新开始</text>
    </g>

    <path d="M808 156H907" stroke="#ea580c" stroke-width="3.5" marker-end="url(#orangeArrow)"/>
    <text x="858" y="137" text-anchor="middle" class="small orange">完整轨迹 τ<tspan baseline-shift="sub" font-size="10">t</tspan></text>

    <g transform="translate(912 54)">
      <rect width="330" height="210" rx="24" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
      <rect width="330" height="62" rx="24" fill="#dc2626"/><rect y="38" width="330" height="24" fill="#dc2626"/>
      <text x="24" y="40" class="section">③ Evaluator · M<tspan baseline-shift="sub" font-size="14">e</tspan></text>
      <text x="24" y="96" class="body">判断这一轮是否完成目标</text>
      <text x="24" y="128" class="mono orange">r<tspan baseline-shift="sub" font-size="11">t</tspan> = M<tspan baseline-shift="sub" font-size="11">e</tspan>(τ<tspan baseline-shift="sub" font-size="11">t</tspan>)</text>
      <text x="24" y="161" class="body">信号可来自：环境、规则、LLM、测试</text>
      <text x="24" y="189" class="small">通过 → 终止；失败 → 进入反思</text>
    </g>

    <path d="M1077 264V332" stroke="#8b5cf6" stroke-width="3.5" marker-end="url(#violetArrow)"/>
    <text x="1098" y="306" class="small violet">失败反馈 r<tspan baseline-shift="sub" font-size="10">t</tspan></text>

    <g transform="translate(806 338)">
      <rect width="436" height="204" rx="24" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
      <rect width="436" height="62" rx="24" fill="url(#reflect)"/><rect y="38" width="436" height="24" fill="url(#reflect)"/>
      <text x="24" y="40" class="section">④ Self-Reflection · M<tspan baseline-shift="sub" font-size="14">sr</tspan></text>
      <text x="24" y="96" class="body">定位错误，提出下一轮可执行的改进策略</text>
      <text x="24" y="128" class="mono violet">sr<tspan baseline-shift="sub" font-size="11">t</tspan> = M<tspan baseline-shift="sub" font-size="11">sr</tspan>(τ<tspan baseline-shift="sub" font-size="11">t</tspan>, r<tspan baseline-shift="sub" font-size="11">t</tspan>, mem<tspan baseline-shift="sub" font-size="11">t</tspan>)</text>
      <text x="24" y="163" class="body">“我在门锁住后重复开门；下次先取钥匙。”</text>
      <text x="24" y="190" class="small">它是语言提示，不是可微梯度</text>
    </g>

    <path d="M806 441H708" stroke="#059669" stroke-width="3.5" marker-end="url(#greenArrow)"/>
    <text x="757" y="422" text-anchor="middle" class="small green">append(sr<tspan baseline-shift="sub" font-size="10">t</tspan>)</text>

    <g transform="translate(374 338)">
      <rect width="334" height="204" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
      <rect width="334" height="62" rx="24" fill="url(#memory)"/><rect y="38" width="334" height="24" fill="url(#memory)"/>
      <text x="24" y="40" class="section">⑤ Episodic Memory</text>
      <text x="24" y="94" class="body">跨 trial 保存压缩后的经验</text>
      <rect x="24" y="113" width="286" height="48" rx="12" fill="#d1fae5"/>
      <text x="167" y="142" text-anchor="middle" class="mono green">mem<tspan baseline-shift="sub" font-size="11">t+1</tspan> = tail<tspan baseline-shift="sub" font-size="11">Ω</tspan>(mem<tspan baseline-shift="sub" font-size="11">t</tspan> ⊕ sr<tspan baseline-shift="sub" font-size="11">t</tspan>)</text>
      <text x="24" y="190" class="small">论文通常只保留最近 1–3 条反思</text>
    </g>

    <path d="M374 441H208Q140 441 140 373V272" fill="none" stroke="#059669" stroke-width="3.5" marker-end="url(#greenArrow)"/>
    <text x="152" y="354" class="small green">下一次 trial 读入 mem</text>

    <g transform="translate(44 338)">
      <rect width="252" height="204" rx="22" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="22" y="38" class="heading">参数发生了什么？</text>
      <text x="22" y="76" class="mono">θ<tspan baseline-shift="sub" font-size="11">LLM</tspan> ← θ<tspan baseline-shift="sub" font-size="11">LLM</tspan></text>
      <text x="22" y="108" class="body">没有反向传播</text>
      <text x="22" y="137" class="body">没有 optimizer step</text>
      <text x="22" y="166" class="body">改变的是 prompt 状态</text>
      <text x="22" y="191" class="small">“学习”只在当前记忆有效期内存在</text>
    </g>

    <g transform="translate(44 566)">
      <rect width="1198" height="31" rx="15" fill="#eef2ff"/>
      <text x="599" y="21" text-anchor="middle" class="small">同一个底座 LLM 可以分别承担 Actor、Evaluator 与 Self-Reflection；“三个模型”是逻辑角色，不必是三套不同权重。</text>
    </g>
  </g>
</svg>
