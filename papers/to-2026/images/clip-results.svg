<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 论文主要实验证据及边界</title>
  <desc id="desc">展示零样本 ImageNet 准确率、与监督 ResNet-50 线性探针的胜负、提示工程增益、迁移表示结果和分布偏移稳健性，同时提醒比较条件不同。</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111638"/></linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:20px;font-weight:650;fill:#e2e8f0}.small{font-size:15px;fill:#cbd5e1}.tiny{font-size:13px;fill:#94a3b8}.big{font-size:38px;font-weight:750;fill:#f8fafc}.panel{fill:#0d1c31;stroke:#29415f;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1400" height="790" rx="28" fill="url(#bg4)"/>
  <text x="58" y="62" class="sans title">论文证明了什么：能力很宽，但并非“所有任务都 SOTA”</text>
  <text x="58" y="92" class="sans sub">读实验时必须同时看评测协议、对照基线、训练规模和失败任务</text>

  <g transform="translate(55 132)">
    <rect width="610" height="260" rx="22" class="panel"/>
    <text x="28" y="42" class="sans label">Zero-shot ImageNet top-1</text>
    <text x="28" y="70" class="sans tiny">最佳 ViT-L/14@336px，不使用 ImageNet 的 128 万训练图像</text>
    <g transform="translate(30 104)">
      <text x="0" y="22" class="sans small">Visual N-Grams</text><rect x="140" y="5" width="60" height="26" rx="7" fill="#475569"/><text x="210" y="24" class="sans small">11.5%</text>
      <text x="0" y="74" class="sans small">原始 ResNet-50</text><rect x="140" y="57" width="400" height="26" rx="7" fill="#0e7490"/><text x="550" y="76" class="sans small">约 76%</text>
      <text x="0" y="126" class="sans small">CLIP zero-shot</text><rect x="140" y="109" width="407" height="26" rx="7" fill="url(#bar4)"/><text x="557" y="128" class="sans small" fill="#a5f3fc">76.2%</text>
    </g>
    <text x="30" y="238" class="sans tiny" fill="#fbbf24">不是受控方法对比：CLIP 使用更大数据、更多训练计算和更强架构。</text>
  </g>

  <g transform="translate(690 132)">
    <rect width="655" height="260" rx="22" class="panel"/>
    <text x="28" y="42" class="sans label">27 个数据集：zero-shot 对监督基线</text>
    <g transform="translate(33 82)">
      <rect width="373" height="70" rx="14" fill="#0e7490"/><text x="186" y="31" text-anchor="middle" class="sans big">16</text><text x="186" y="55" text-anchor="middle" class="sans tiny" fill="#cffafe">CLIP zero-shot 获胜</text>
      <rect x="381" width="241" height="70" rx="14" fill="#334155"/><text x="501" y="31" text-anchor="middle" class="sans big">11</text><text x="501" y="55" text-anchor="middle" class="sans tiny">ResNet-50 线性探针获胜</text>
    </g>
    <text x="33" y="186" class="sans small" fill="#a5f3fc">强项：</text><text x="87" y="186" class="sans tiny">Food101、Stanford Cars、动作识别、通用物体分类</text>
    <text x="33" y="218" class="sans small" fill="#fda4af">弱项：</text><text x="87" y="218" class="sans tiny">细粒度花卉/飞机、遥感、计数、交通标志、距离判断</text>
  </g>

  <g transform="translate(55 418)">
    <rect width="400" height="245" rx="22" class="panel"/>
    <text x="25" y="40" class="sans label">Prompt 是模型接口</text>
    <text x="25" y="86" class="sans big" fill="#c4b5fd">≈ +5 pt</text>
    <text x="25" y="116" class="sans small">36 数据集平均也接近 5 点</text>
    <g transform="translate(25 145)"><rect width="94" height="24" rx="7" fill="#7c3aed"/><text x="105" y="18" class="sans tiny">默认模板 +1.3</text><rect y="42" width="257" height="24" rx="7" fill="#a855f7"/><text x="268" y="60" class="sans tiny">80 模板集成再 +3.5</text></g>
  </g>

  <g transform="translate(478 418)">
    <rect width="400" height="245" rx="22" class="panel"/>
    <text x="25" y="40" class="sans label">表示学习不只会分类</text>
    <text x="25" y="86" class="sans big" fill="#67e8f9">21 / 27</text>
    <text x="25" y="116" class="sans small">CLIP 线性探针胜过 Noisy Student</text>
    <text x="25" y="151" class="sans tiny">收益尤其明显：</text>
    <text x="25" y="178" class="sans small">OCR · 地理定位 · 场景 · 视频动作</text>
    <text x="25" y="211" class="sans tiny">CLIP-ViT 在论文比较中约比 CLIP-ResNet 计算效率高 3×。</text>
  </g>

  <g transform="translate(901 418)">
    <rect width="444" height="245" rx="22" class="panel"/>
    <text x="25" y="40" class="sans label">自然分布偏移下更稳健</text>
    <text x="25" y="86" class="sans big" fill="#fbbf24">gap ↓ 75%</text>
    <text x="25" y="116" class="sans small">ImageNet 到 shifted sets 的差距最多缩小 75%</text>
    <text x="25" y="151" class="sans tiny">但原因不能只归于 zero-shot：</text>
    <text x="25" y="178" class="sans small">数据更大、更杂；监督来自语言</text>
    <text x="25" y="211" class="sans tiny">用 ImageNet 标签再拟合线性头虽把 IN 提到 85.4%，偏移集平均反而略降。</text>
  </g>

  <g transform="translate(55 690)">
    <rect width="1290" height="55" rx="14" fill="#2a1e13" stroke="#92400e"/>
    <text x="22" y="23" class="sans small" fill="#fde68a">准确表述：</text>
    <text x="22" y="44" class="sans tiny">CLIP 的突破是“一个任务无关模型可用语言定义许多新任务”，不是“零样本已经普遍超过专用监督模型”。论文自己估计，沿原扩展曲线追平整体 SOTA 约需 1000× 计算。</text>
  </g>
</svg>
