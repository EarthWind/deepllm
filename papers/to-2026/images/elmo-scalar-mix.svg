<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-labelledby="title desc">
  <title id="title">ELMo 的任务特定标量混合</title>
  <desc id="desc">同一个 token 的字符层、第一层双向 LSTM 和第二层双向 LSTM 表示，通过 softmax 归一化的任务参数和缩放参数 gamma 合成为任务特定 ELMo 向量。图中同时展示低层更适合词性、高层更适合词义消歧的论文探测结果。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel-title { font: 700 20px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .heading { font: 700 17px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 500 11.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .tiny-light { font: 500 11px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #cbd5e1; }
      .mono { font: 600 14px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .formula { font: 700 21px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #f8fafc; }
      .formula-small { font: 700 15px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #f8fafc; }
      .value { font: 700 24px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #1d4ed8; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="810" fill="#f8fafc"/>
  <text x="70" y="59" class="title">“Deep” 的真正含义：不丢掉中间层，让任务自己决定读哪一层</text>
  <text x="70" y="92" class="subtitle">ELMo 输出不是固定取顶层，也不是简单拼接所有层；任务学习少量标量，在三种预训练信号之间连续选择。</text>

  <!-- left stack -->
  <g filter="url(#shadow)">
    <rect x="55" y="130" width="410" height="590" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="85" y="174" class="panel-title">位置 k 的表示栈 Rₖ</text>
  <text x="85" y="201" class="small">三层均为 1024 维；token 层把 512 维 xₖ 复制后拼接。</text>

  <rect x="88" y="250" width="344" height="112" rx="15" fill="#f0fdfa" stroke="#14b8a6"/>
  <rect x="88" y="250" width="12" height="112" rx="6" fill="#0f766e"/>
  <text x="122" y="282" class="heading">hₖ,₀ · 字符词形层</text>
  <text x="122" y="308" class="mono">[xₖᴸᴹ ; xₖᴸᴹ]</text>
  <text x="122" y="335" class="small">形态、拼写、OOV 词构成；不含句子上下文</text>
  <circle cx="407" cy="280" r="18" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="407" y="286" text-anchor="middle" class="mono">s₀</text>

  <rect x="88" y="389" width="344" height="112" rx="15" fill="#eff6ff" stroke="#60a5fa"/>
  <rect x="88" y="389" width="12" height="112" rx="6" fill="#2563eb"/>
  <text x="122" y="421" class="heading">hₖ,₁ · biLSTM 第一层</text>
  <text x="122" y="447" class="mono">[fwd₁ ; bwd₁]</text>
  <text x="122" y="474" class="small">论文探测：更适合 POS 等局部句法信号</text>
  <circle cx="407" cy="419" r="18" fill="#dbeafe" stroke="#2563eb"/>
  <text x="407" y="425" text-anchor="middle" class="mono">s₁</text>

  <rect x="88" y="528" width="344" height="112" rx="15" fill="#f5f3ff" stroke="#a78bfa"/>
  <rect x="88" y="528" width="12" height="112" rx="6" fill="#7c3aed"/>
  <text x="122" y="560" class="heading">hₖ,₂ · biLSTM 第二层</text>
  <text x="122" y="586" class="mono">[fwd₂ ; bwd₂]</text>
  <text x="122" y="613" class="small">论文探测：更适合 WSD 等词义信号</text>
  <circle cx="407" cy="558" r="18" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="407" y="564" text-anchor="middle" class="mono">s₂</text>

  <rect x="88" y="666" width="344" height="30" rx="8" fill="#e2e8f0"/>
  <text x="260" y="686" text-anchor="middle" class="small">biLM 参数冻结；s 与 γ 随任务损失更新</text>

  <!-- middle scalar mix -->
  <path d="M465 426 L523 426" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="523" y="130" width="380" height="590" rx="18" fill="#ffffff" stroke="#fdba74"/>
  </g>
  <text x="553" y="174" class="panel-title">Scalar Mix</text>
  <text x="553" y="201" class="small">每个 ELMo 插入位置都有自己的一组混合参数。</text>

  <rect x="559" y="246" width="308" height="104" rx="15" fill="#fff7ed" stroke="#fb923c"/>
  <text x="713" y="278" text-anchor="middle" class="heading">先把自由参数归一化</text>
  <text x="713" y="312" text-anchor="middle" class="mono">sⱼ = exp(wⱼ) / Σₗ exp(wₗ)</text>
  <text x="713" y="337" text-anchor="middle" class="small">因此 s₀+s₁+s₂=1 且每项非负</text>

  <path d="M713 350 L713 390" class="arrow"/>
  <rect x="559" y="390" width="308" height="116" rx="15" fill="#111827"/>
  <text x="713" y="422" text-anchor="middle" class="formula">ELMo(k, task)</text>
  <text x="713" y="453" text-anchor="middle" class="formula-small">= gamma(task) ×</text>
  <text x="713" y="478" text-anchor="middle" class="formula-small">sum(j=0..2) s_j(task) h_(k,j)</text>
  <text x="713" y="498" text-anchor="middle" class="tiny-light">gamma 负责匹配预训练表示与任务网络的数值尺度</text>

  <path d="M713 506 L713 548" class="arrow"/>
  <rect x="559" y="548" width="308" height="92" rx="15" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="713" y="579" text-anchor="middle" class="heading">可选的两个稳定器</text>
  <text x="582" y="606" class="small">• 混合前对每层做 LayerNorm</text>
  <text x="582" y="628" class="small">• 损失加入 λ‖w‖²，偏向层均值</text>

  <rect x="559" y="666" width="308" height="30" rx="8" fill="#fff7ed"/>
  <text x="713" y="686" text-anchor="middle" class="small">λ 大 → 接近平均；λ 小 → 允许任务明显偏层</text>

  <!-- right evidence -->
  <path d="M903 426 L950 426" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="950" y="130" width="395" height="590" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="980" y="174" class="panel-title">为什么不只取最后一层？</text>
  <text x="980" y="201" class="small">线性探测直接读取单层表示；数值来自论文 Tables 5–6。</text>

  <rect x="980" y="246" width="335" height="154" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1008" y="278" class="heading">POS tagging · Penn Treebank</text>
  <text x="1008" y="306" class="small">更低的第一层胜过第二层</text>
  <text x="1008" y="346" class="tiny">L1</text>
  <text x="1008" y="384" class="tiny">L2</text>
  <rect x="1040" y="327" width="206" height="25" rx="5" fill="#2563eb"/>
  <rect x="1040" y="365" width="194" height="25" rx="5" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="1256" y="346" class="value">97.3</text>
  <text x="1244" y="384" class="mono">96.8</text>

  <rect x="980" y="427" width="335" height="154" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1008" y="459" class="heading">Word sense disambiguation</text>
  <text x="1008" y="487" class="small">更高的第二层胜过第一层</text>
  <text x="1008" y="527" class="tiny">L1</text>
  <text x="1008" y="565" class="tiny">L2</text>
  <rect x="1040" y="508" width="171" height="25" rx="5" fill="#ddd6fe" stroke="#7c3aed"/>
  <rect x="1040" y="546" width="196" height="25" rx="5" fill="#7c3aed"/>
  <text x="1221" y="527" class="mono">67.4</text>
  <text x="1246" y="565" class="value" fill="#6d28d9">69.0</text>

  <rect x="980" y="609" width="335" height="87" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1008" y="639" class="label">下游含义</text>
  <text x="1008" y="665" class="small">任务不必预先承诺“句法层”或“语义层”；</text>
  <text x="1008" y="686" class="small">可微分混合让监督信号自己选择。</text>

  <rect x="55" y="752" width="1290" height="34" rx="10" fill="#e2e8f0"/>
  <text x="700" y="774" text-anchor="middle" class="label">论文的关键消融：SQuAD 开发集从仅取顶层 84.7，变为层平均 85.0，再到可学习混合 85.2；改进虽小，却在多任务上一致。</text>
</svg>
