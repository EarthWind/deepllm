<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ELMo 在六项任务上的测试集改进、层混合消融与样本效率</title>
  <desc id="desc">左侧展示论文表一中 ELMo 相对各自强基线的相对误差下降。右上展示 SQuAD、SNLI 与 SRL 从基线到顶层、层平均和可学习混合的开发集结果。右下展示 SRL 使用百分之一训练集的 ELMo 模型约等于基线使用百分之十训练集，以及达到基线最佳值所需轮数从四百八十六降到十。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel-title { font: 700 20px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .heading { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 500 11.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 600 12.5px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .value { font: 700 14px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #1d4ed8; }
      .card-value { font: 700 29px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #6d28d9; }
      .white { font: 700 14px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #ffffff; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="59" class="title">同一套冻结表示跨六类任务增益：关键收益来自上下文与深层混合</text>
  <text x="70" y="92" class="subtitle">不同任务指标不可直接横比；左图统一使用论文报告的“相对误差下降”，右图保留各任务原始开发集指标。</text>

  <!-- research blossom -->
  <g transform="translate(1312 57)" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.85">
    <ellipse cx="0" cy="-12" rx="6" ry="12"/>
    <ellipse cx="12" cy="0" rx="12" ry="6"/>
    <ellipse cx="0" cy="12" rx="6" ry="12"/>
    <ellipse cx="-12" cy="0" rx="12" ry="6"/>
    <circle cx="0" cy="0" r="3" fill="#f59e0b" stroke="none"/>
  </g>

  <!-- left chart -->
  <g filter="url(#shadow)">
    <rect x="55" y="130" width="650" height="645" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="85" y="174" class="panel-title">六项测试任务的相对误差下降</text>
  <text x="85" y="202" class="small">相对论文自己的强基线；数值来自 Table 1 的 increase 列，单位：%</text>

  <line x1="188" y1="247" x2="640" y2="247" class="axis"/>
  <line x1="188" y1="247" x2="188" y2="615" class="axis"/>
  <line x1="278.4" y1="247" x2="278.4" y2="615" class="grid"/>
  <line x1="368.8" y1="247" x2="368.8" y2="615" class="grid"/>
  <line x1="459.2" y1="247" x2="459.2" y2="615" class="grid"/>
  <line x1="549.6" y1="247" x2="549.6" y2="615" class="grid"/>
  <line x1="640" y1="247" x2="640" y2="615" class="grid"/>
  <text x="188" y="233" text-anchor="middle" class="tiny">0</text>
  <text x="278.4" y="233" text-anchor="middle" class="tiny">5</text>
  <text x="368.8" y="233" text-anchor="middle" class="tiny">10</text>
  <text x="459.2" y="233" text-anchor="middle" class="tiny">15</text>
  <text x="549.6" y="233" text-anchor="middle" class="tiny">20</text>
  <text x="640" y="233" text-anchor="middle" class="tiny">25%</text>

  <text x="168" y="299" text-anchor="end" class="label">SQuAD · F1</text>
  <text x="168" y="357" text-anchor="end" class="label">SNLI · Acc.</text>
  <text x="168" y="415" text-anchor="end" class="label">SRL · F1</text>
  <text x="168" y="473" text-anchor="end" class="label">Coref · Avg. F1</text>
  <text x="168" y="531" text-anchor="end" class="label">NER · F1</text>
  <text x="168" y="589" text-anchor="end" class="label">SST-5 · Acc.</text>

  <rect x="188" y="277" width="450.2" height="31" rx="5" fill="#2563eb"/>
  <rect x="188" y="335" width="104.9" height="31" rx="5" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="188" y="393" width="310.9" height="31" rx="5" fill="#2563eb"/>
  <rect x="188" y="451" width="177.2" height="31" rx="5" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="188" y="509" width="379.7" height="31" rx="5" fill="#2563eb"/>
  <rect x="188" y="567" width="122.9" height="31" rx="5" fill="#bfdbfe" stroke="#2563eb"/>

  <text x="648" y="299" class="value">24.9</text>
  <text x="303" y="357" class="value">5.8</text>
  <text x="509" y="415" class="value">17.2</text>
  <text x="376" y="473" class="value">9.8</text>
  <text x="578" y="531" class="value">21.0</text>
  <text x="321" y="589" class="value">6.8</text>

  <rect x="85" y="642" width="590" height="105" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="110" y="672" class="heading">原始测试分数变化</text>
  <text x="110" y="699" class="small">SQuAD 81.1→85.8；SNLI 88.0→88.7；SRL 81.4→84.6</text>
  <text x="110" y="723" class="small">Coref 67.2→70.4；NER 90.15→92.22；SST-5 51.4→54.7</text>
  <text x="110" y="742" class="tiny">NER 与 SST-5 为 5 次随机种子均值；完整标准差见正文表格。</text>

  <!-- right top ablation -->
  <g filter="url(#shadow)">
    <rect x="745" y="130" width="600" height="405" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="775" y="174" class="panel-title">层组合消融：顶层有效，但全部层更好</text>
  <text x="775" y="202" class="small">开发集；Baseline → Last only → 层平均（λ=1）→ 可学习混合（λ=0.001）</text>

  <rect x="775" y="234" width="540" height="74" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="797" y="262" class="heading">SQuAD · F1</text>
  <text x="797" y="288" class="mono">80.8  →  84.7  →  85.0  →</text>
  <rect x="1207" y="249" width="80" height="38" rx="9" fill="#2563eb"/>
  <text x="1247" y="274" text-anchor="middle" class="white">85.2</text>

  <rect x="775" y="325" width="540" height="74" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="797" y="353" class="heading">SNLI · Accuracy</text>
  <text x="797" y="379" class="mono">88.1  →  89.1  →  89.3  →</text>
  <rect x="1207" y="340" width="80" height="38" rx="9" fill="#7c3aed"/>
  <text x="1247" y="365" text-anchor="middle" class="white">89.5</text>

  <rect x="775" y="416" width="540" height="74" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="797" y="444" class="heading">SRL · F1</text>
  <text x="797" y="470" class="mono">81.6  →  84.1  →  84.6  →</text>
  <rect x="1207" y="431" width="80" height="38" rx="9" fill="#c2410c"/>
  <text x="1247" y="456" text-anchor="middle" class="white">84.8</text>

  <text x="1045" y="516" text-anchor="middle" class="tiny">λ 大时正则化迫使权重接近均匀；λ 小时允许任务偏好某一内部层。</text>

  <!-- right bottom sample efficiency -->
  <g filter="url(#shadow)">
    <rect x="745" y="575" width="600" height="270" rx="18" fill="#ffffff" stroke="#c4b5fd"/>
  </g>
  <text x="775" y="619" class="panel-title">样本效率与优化速度</text>
  <text x="775" y="647" class="small">论文 Section 5.4；不是所有任务固定遵循同一倍率。</text>

  <rect x="775" y="677" width="252" height="130" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="800" y="707" class="heading">达到基线最佳 SRL F1</text>
  <text x="800" y="748" class="card-value">486 → 10</text>
  <text x="800" y="777" class="small">训练 epoch；论文称更新数相对下降 98%</text>

  <rect x="1055" y="677" width="260" height="130" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1080" y="707" class="heading">训练集规模</text>
  <text x="1080" y="748" class="card-value" fill="#1d4ed8">1% ≈ 10%</text>
  <text x="1080" y="777" class="small">SRL：ELMo 1% 数据约等于基线 10%</text>

  <text x="70" y="881" class="tiny">来源：Peters et al. (2018), Tables 1–3 and Section 5.4。左图长度按 Table 1 相对误差下降线性编码；所有绝对指标均保留论文单位。</text>
</svg>
