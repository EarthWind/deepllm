<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention 算法 1 的分块遍历</title>
  <desc id="desc">注意力分数矩阵被切成查询行块和键列块。外层固定一个 K/V 块并加载到 SRAM，内层依次遍历所有 Q 块；在 SRAM 中计算当前分数块并更新输出、最大值和分母，然后只写回这些线性大小的状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071629"/><stop offset="1" stop-color="#1d2850"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#725ef4"/><stop offset="1" stop-color="#b477f1"/></linearGradient>
    <linearGradient id="sram" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08a9bd"/><stop offset="1" stop-color="#36d39e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#adc0dd"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#afbfda}.head{font-size:22px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#dce9fa}.small{font-size:14px;fill:#acbdd8}.dark{font-size:16px;font-weight:680;fill:#10243a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#edf5ff}.label{font-size:14px;font-weight:700;fill:#fff}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="sans title">Tiling：从“生成整张图”改成“扫描一小块，立即归约”</text>
  <text x="54" y="94" class="sans sub">下图对应原论文 Algorithm 1 的循环次序：K/V block 外循环，Q block 内循环</text>

  <g transform="translate(65 150)">
    <text x="0" y="-18" class="sans head">隐式的 N × N score 网格</text>
    <text x="175" y="390" text-anchor="middle" class="sans small">Key 位置 / Kⱼ 列块 →</text>
    <text x="-37" y="178" text-anchor="middle" transform="rotate(-90 -37 178)" class="sans small">Query 位置 / Qᵢ 行块 →</text>
    <rect x="0" y="0" width="350" height="350" rx="5" fill="#102640" stroke="#607796" stroke-width="2"/>
    <g stroke="#4b6486" stroke-width="1">
      <path d="M70 0V350M140 0V350M210 0V350M280 0V350"/><path d="M0 70H350M0 140H350M0 210H350M0 280H350"/>
    </g>
    <rect x="140" y="70" width="70" height="70" fill="url(#tile)" stroke="#e8dcff" stroke-width="3"/>
    <text x="175" y="111" text-anchor="middle" class="sans label">Sᵢⱼ</text>
    <rect x="140" y="0" width="70" height="350" fill="#33c8b0" opacity=".10"/>
    <rect x="0" y="70" width="350" height="70" fill="#9170f5" opacity=".10"/>
    <text x="175" y="27" text-anchor="middle" class="sans label">Kⱼ / Vⱼ</text>
    <text x="35" y="111" text-anchor="middle" class="sans label">Qᵢ</text>
    <path d="M2 2L348 348" stroke="#efb55a" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="264" y="330" class="sans small" fill="#f4c568">causal 时仅算下三角</text>
  </g>

  <path d="M445 328H502" stroke="#adc0dd" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="515" y="153" width="292" height="388" rx="24" fill="url(#sram)"/>
  </g>
  <text x="661" y="194" text-anchor="middle" class="sans dark">片上 SRAM：只容纳当前 tile</text>
  <rect x="545" y="220" width="232" height="58" rx="13" fill="#0f5562" opacity=".78"/><text x="661" y="255" text-anchor="middle" class="sans mono">Sᵢⱼ = τQᵢKⱼᵀ</text>
  <path d="M661 279V302" stroke="#17465a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="545" y="311" width="232" height="78" rx="13" fill="#17465a" opacity=".82"/><text x="661" y="340" text-anchor="middle" class="sans body">rowmax + exp</text><text x="661" y="368" text-anchor="middle" class="sans mono">m′, ℓ′, P̃ᵢⱼ</text>
  <path d="M661 390V413" stroke="#17465a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="545" y="422" width="232" height="78" rx="13" fill="#17465a" opacity=".82"/><text x="661" y="452" text-anchor="middle" class="sans body">块级矩阵乘与归约</text><text x="661" y="480" text-anchor="middle" class="sans mono">Oᵢ ← merge(P̃ᵢⱼVⱼ)</text>

  <path d="M808 328H864" stroke="#adc0dd" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="877" y="153" width="348" height="388" rx="24" fill="#11263f" stroke="#5d7596" stroke-width="2"/></g>
  <text x="1051" y="194" text-anchor="middle" class="sans head">HBM 中的持久状态</text>
  <rect x="909" y="224" width="284" height="68" rx="14" fill="#203b5a"/><text x="1051" y="252" text-anchor="middle" class="sans body">输入块</text><text x="1051" y="277" text-anchor="middle" class="sans mono">Qᵢ : Bᵣ×d · Kⱼ,Vⱼ : B꜀×d</text>
  <rect x="909" y="315" width="284" height="102" rx="14" fill="#25365c" stroke="#8274f5"/><text x="1051" y="347" text-anchor="middle" class="sans body">每个 Q 行块写回</text><text x="1051" y="377" text-anchor="middle" class="sans mono">Oᵢ : Bᵣ×d</text><text x="1051" y="402" text-anchor="middle" class="sans mono">mᵢ, ℓᵢ : Bᵣ</text>
  <rect x="909" y="443" width="284" height="58" rx="14" fill="#183b43" stroke="#2dd4bf"/><text x="1051" y="468" text-anchor="middle" class="sans body">不会出现持久的</text><text x="1051" y="491" text-anchor="middle" class="sans mono">S, P : N×N</text>

  <rect x="104" y="602" width="1072" height="72" rx="20" fill="#142842" stroke="#456486"/>
  <text x="640" y="631" text-anchor="middle" class="sans body">原论文取 B꜀ = ⌊M/(4d)⌋，Bᵣ = min(⌊M/(4d)⌋, d)，让当前 Q/K/V/score/output 状态装入容量 M 的 SRAM。</text>
  <text x="640" y="657" text-anchor="middle" class="sans small">工程实现会按架构、dtype、head dimension、寄存器压力和并行度继续调 tile；公式表达的是设计约束，不是所有 GPU 的固定最优值。</text>
</svg>
