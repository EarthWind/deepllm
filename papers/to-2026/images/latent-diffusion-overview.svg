<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#241542"/></linearGradient><linearGradient id="latent"><stop stop-color="#20c4dd"/><stop offset="1" stop-color="#936eea"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#a5bce3"/></marker></defs><rect width="1400" height="820" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="64" fill="#fff" font-size="32" font-weight="700">Latent Diffusion：先压缩，再在语义空间扩散</text><text x="52" y="98" fill="#a7bce0" font-size="18">把昂贵的像素空间 denoising 转移到预训练 autoencoder 的 latent space</text><rect x="54" y="170" width="270" height="470" rx="22" fill="#102b45" stroke="#2ac7dd" stroke-width="2"/><text x="87" y="223" fill="#fff" font-size="25" font-weight="700">图像空间</text><rect x="93" y="285" width="190" height="150" rx="12" fill="#284f6b"/><circle cx="140" cy="330" r="30" fill="#f2bc55"/><path d="M103 410l55-70 36 36 34-48 53 82z" fill="#4ad3a3"/><text x="90" y="500" fill="#b2d9e4" font-size="17">512×512×3</text><text x="90" y="540" fill="#f2c777" font-size="17">高维、昂贵</text><line x1="340" y1="405" x2="440" y2="405" stroke="#a5bce3" stroke-width="4" marker-end="url(#a)"/><rect x="455" y="170" width="300" height="470" rx="22" fill="#172448" stroke="#9d76ee" stroke-width="2"/><text x="487" y="223" fill="#fff" font-size="25" font-weight="700">预训练 Autoencoder</text><text x="490" y="272" fill="#c7b9fa" font-size="17">Encoder E</text><rect x="500" y="305" width="210" height="90" rx="12" fill="#392b68"/><text x="559" y="360" fill="#fff" font-size="26" font-weight="700">z = E(x)</text><text x="490" y="445" fill="#c7b9fa" font-size="17">Decoder D</text><rect x="500" y="475" width="210" height="90" rx="12" fill="#392b68"/><text x="552" y="530" fill="#fff" font-size="26" font-weight="700">x̂ = D(z)</text><line x1="771" y1="405" x2="850" y2="405" stroke="#a5bce3" stroke-width="4" marker-end="url(#a)"/><rect x="865" y="170" width="480" height="470" rx="22" fill="#29203f" stroke="#f0ad3a" stroke-width="2"/><text x="898" y="223" fill="#fff" font-size="25" font-weight="700">Latent Diffusion U-Net</text><text x="900" y="267" fill="#f2ca7b" font-size="17">z₀ → zₜ → … → z₀</text><rect x="915" y="305" width="380" height="110" rx="14" fill="url(#latent)"/><text x="1010" y="355" fill="#06192d" font-size="22" font-weight="700">εθ(zₜ, t, c)</text><text x="987" y="388" fill="#06192d" font-size="16">预测噪声 / score</text><rect x="915" y="455" width="380" height="90" rx="14" fill="#4e356f"/><text x="1017" y="510" fill="#fff" font-size="22" font-weight="700">cross-attention</text><text x="987" y="575" fill="#f2ca7b" font-size="16">文本、框、语义图等条件 c</text><path d="M1130 650v52H670v-52" fill="none" stroke="#f3d044" stroke-width="3" stroke-dasharray="10 10"/><text x="730" y="735" fill="#f3d85c" font-size="18">训练：在 latent 上做去噪；采样后再由 Decoder 回到像素空间</text></g></svg>
