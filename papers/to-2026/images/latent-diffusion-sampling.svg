<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07162d"/><stop offset="1" stop-color="#24163e"/></linearGradient><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#afc1e5"/></marker></defs><rect width="1400" height="760" rx="30" fill="url(#b)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">一次文本到图像采样：噪声如何变成可控图像</text><text x="52" y="96" fill="#aabfe4" font-size="18">每一步都在 latent space 里预测噪声；条件通过 cross-attention 进入 U-Net</text><g transform="translate(65,190)"><rect width="190" height="330" rx="18" fill="#29304f" stroke="#8ba6d7" stroke-width="2"/><text x="40" y="55" fill="#fff" font-size="23" font-weight="700">随机 latent</text><path d="M30 145l34-50 28 78 41-108 35 150 34-57" fill="none" stroke="#d9a8f7" stroke-width="5"/><text x="35" y="270" fill="#bacbea" font-size="17">z_T ~ N(0,I)</text><text x="35" y="302" fill="#f2c877" font-size="16">没有语义的起点</text></g><g transform="translate(340,190)"><rect width="250" height="330" rx="18" fill="#172449" stroke="#956fe9" stroke-width="2"/><text x="42" y="55" fill="#fff" font-size="23" font-weight="700">文本条件</text><rect x="35" y="95" width="180" height="90" rx="12" fill="#3b2b67"/><text x="72" y="135" fill="#fff" font-size="18">a red fox</text><text x="58" y="163" fill="#cdbdff" font-size="15">text encoder τ(c)</text><text x="38" y="260" fill="#cdbdff" font-size="17">K 个 context token</text><text x="38" y="292" fill="#f2c877" font-size="16">作为 cross-attention 的 keys/values</text></g><g transform="translate(675,190)"><rect width="330" height="330" rx="18" fill="#102e49" stroke="#30c7df" stroke-width="2"/><text x="74" y="55" fill="#fff" font-size="23" font-weight="700">U-Net denoiser</text><rect x="42" y="100" width="245" height="80" rx="12" fill="#36c6dc"/><text x="78" y="148" fill="#052136" font-size="19" font-weight="700">εθ(z_t, t, τ(c))</text><path d="M55 225h220M55 250h180M55 275h220" stroke="#83e6ec" stroke-width="6" stroke-linecap="round"/><text x="45" y="305" fill="#b4e1e7" font-size="16">预测当前噪声 ε̂</text></g><g transform="translate(1090,190)"><rect width="240" height="330" rx="18" fill="#29203f" stroke="#f0ad3b" stroke-width="2"/><text x="57" y="55" fill="#fff" font-size="23" font-weight="700">Decoder</text><rect x="37" y="100" width="165" height="125" rx="12" fill="#284f6b"/><circle cx="83" cy="143" r="24" fill="#e8af4c"/><path d="M45 205l55-60 28 33 27-43 42 70z" fill="#4dd2a0"/><text x="43" y="270" fill="#f2c877" font-size="17">x̂ = D(z₀)</text><text x="34" y="302" fill="#b5c8e6" font-size="16">回到像素空间</text></g><path d="M260 350h70M600 350h64M1015 350h65" stroke="#afc1e5" stroke-width="4" marker-end="url(#m)"/><path d="M1280 555C1000 650 425 650 160 555" fill="none" stroke="#f0cf48" stroke-width="3" stroke-dasharray="11 10"/><text x="500" y="704" fill="#f2d65e" font-size="18">重复 T 次：减少噪声，而不是一次性预测全部像素</text></g></svg>
