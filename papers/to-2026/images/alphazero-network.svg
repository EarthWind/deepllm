<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AlphaZero 策略价值网络及三种游戏编码</title>
  <desc id="desc">棋盘历史特征进入共享残差塔，随后分为策略头和价值头；国际象棋、日本将棋与围棋分别训练实例并使用不同动作编码。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#111f3d"/></linearGradient><linearGradient id="tower" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263b75"/><stop offset="1" stop-color="#5947a9"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7dd3fc"/></marker><style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.m{font-size:21px;font-weight:650}.s{font-size:17px}.xs{font-size:15px;fill:#aebfd9}.card{fill:#132440;stroke:#31517a;stroke-width:2}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><text class="t h" x="60" y="62">一个接口、两颗头、三套独立训练的游戏实例</text><text class="t xs" x="60" y="93">网络同时回答“下一步先看哪里”与“当前局面对我有多好”</text>
  <g filter="url(#shadow)"><rect class="card" x="55" y="145" width="245" height="400" rx="22"/><text class="t m" x="84" y="185">状态特征 s</text><g transform="translate(92 220)"><rect x="30" y="0" width="120" height="120" rx="8" fill="#182e4b" stroke="#5cbce8"/><rect x="20" y="10" width="120" height="120" rx="8" fill="#1a3755" stroke="#5cbce8"/><rect x="10" y="20" width="120" height="120" rx="8" fill="#214261" stroke="#5cbce8"/><g stroke="#7dd3fc" opacity=".6"><path d="M10 50h120M10 80h120M10 110h120M40 20v120M70 20v120M100 20v120"/></g></g><text class="t s" x="84" y="400">最近 T=8 个棋盘历史</text><text class="t xs" x="84" y="432">当前玩家视角</text><text class="t xs" x="84" y="458">规则状态 / 重复局面 / 执子方</text><text class="t xs" x="84" y="484">非法动作在输出端屏蔽</text></g>
  <path class="line" d="M300 345H370"/>
  <g filter="url(#shadow)"><rect x="375" y="145" width="300" height="400" rx="22" fill="#151e3f" stroke="#8b7cf6" stroke-width="2"/><text class="t m" text-anchor="middle" x="525" y="185">残差主干</text><g transform="translate(418 220)"><rect width="214" height="54" rx="12" fill="url(#tower)"/><text class="t s" text-anchor="middle" x="107" y="34">3×3 Conv · 256 channels</text><rect y="76" width="214" height="118" rx="14" fill="#2c2b60" stroke="#a78bfa"/><text class="t s" text-anchor="middle" x="107" y="110">Residual Block × 19</text><text class="t xs" text-anchor="middle" x="107" y="142">3×3 Conv → BN → ReLU</text><text class="t xs" text-anchor="middle" x="107" y="168">3×3 Conv → BN + skip</text><path d="M30 210h154" stroke="#a78bfa" stroke-width="4" stroke-dasharray="9 7"/><text class="t xs" text-anchor="middle" x="107" y="244">同一表示分叉到两个 head</text></g><text class="t xs" text-anchor="middle" x="525" y="520">结构细节来自 2018 Science 扩展版</text></g>
  <path d="M675 300H750" class="line"/><path d="M675 405H750" class="line"/>
  <g filter="url(#shadow)"><rect x="755" y="184" width="375" height="180" rx="22" fill="#133246" stroke="#22d3ee" stroke-width="2"/><circle cx="808" cy="237" r="27" fill="#0e7490"/><text class="t m" x="850" y="229">策略头 p</text><text class="t s" x="850" y="259">每个合法动作的先验概率</text><text class="t xs" x="790" y="303">Chess  8×8×73 = 4,672</text><text class="t xs" x="790" y="329">Shogi   9×9×139 = 11,259</text><text class="t xs" x="1000" y="329">Go 19×19+pass = 362</text></g>
  <g filter="url(#shadow)"><rect x="755" y="392" width="375" height="153" rx="22" fill="#123a36" stroke="#34d399" stroke-width="2"/><circle cx="808" cy="443" r="27" fill="#137464"/><text class="t m" x="850" y="435">价值头 v</text><text class="t s" x="850" y="465">当前玩家的预期终局结果</text><text class="t xs" x="790" y="510">tanh 标量 ∈ [−1, +1]；和棋可取 0</text></g>
  <g transform="translate(55 584)"><rect width="1075" height="82" rx="18" fill="#0b1930" stroke="#29496e"/><text class="t s" x="25" y="34">2017 输入平面：Go 17 · Chess 119 · Shogi 362</text><text class="t xs" x="25" y="62">“通用算法”不等于“完全无编码”：走法规则、合法动作、升变 / 打入 / 王车易位等仍由环境和特征表示提供。</text></g>
</svg>
