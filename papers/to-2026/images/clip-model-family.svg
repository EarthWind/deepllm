<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 的模型家族与训练规模</title>
  <desc id="desc">展示五个改造 ResNet、三个 Vision Transformer、共享的文本 Transformer，以及论文训练数据、轮数、batch 和硬件时间。</desc>
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111638"/></linearGradient>
    <linearGradient id="rn6" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="vit6" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b21b6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:20px;font-weight:650;fill:#e2e8f0}.small{font-size:15px;fill:#cbd5e1}.tiny{font-size:13px;fill:#94a3b8}.big{font-size:32px;font-weight:750;fill:#f8fafc}.panel{fill:#0d1c31;stroke:#29415f;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg6)"/>
  <text x="58" y="62" class="sans title">CLIP 不是一个固定网络，而是一套可扩展训练方法</text>
  <text x="58" y="92" class="sans sub">论文同时扩展卷积与 ViT 图像塔；文本塔保持 12 层，主要随视觉宽度扩宽</text>

  <g transform="translate(55 135)">
    <rect width="630" height="348" rx="22" class="panel"/>
    <text x="28" y="43" class="sans label" fill="#67e8f9">CLIP-ResNet × 5</text>
    <g transform="translate(28 78)">
      <g fill="url(#rn6)"><rect width="90" height="92" rx="13" opacity=".55"/><rect x="110" width="90" height="116" rx="13" opacity=".64"/><rect x="220" width="90" height="150" rx="13" opacity=".73"/><rect x="330" width="90" height="194" rx="13" opacity=".84"/><rect x="440" width="110" height="248" rx="13"/></g>
      <g class="sans tiny" text-anchor="middle"><text x="45" y="112">RN50</text><text x="155" y="136">RN101</text><text x="265" y="170">RN50×4</text><text x="375" y="214">RN50×16</text><text x="495" y="269">RN50×64</text></g>
    </g>
    <text x="28" y="326" class="sans tiny">ResNet-D stem + anti-aliased blur pooling + attention pooling；宽度、深度、分辨率共同扩展。</text>
  </g>

  <g transform="translate(715 135)">
    <rect width="630" height="348" rx="22" class="panel"/>
    <text x="28" y="43" class="sans label" fill="#c4b5fd">CLIP-ViT × 3（另有 336px 再训练版）</text>
    <g transform="translate(35 80)">
      <rect width="150" height="150" rx="17" fill="url(#vit6)" opacity=".62"/><text x="75" y="78" text-anchor="middle" class="sans label">B/32</text><text x="75" y="106" text-anchor="middle" class="sans tiny">224 · D=512</text>
      <rect x="190" width="150" height="190" rx="17" fill="url(#vit6)" opacity=".78"/><text x="265" y="95" text-anchor="middle" class="sans label">B/16</text><text x="265" y="123" text-anchor="middle" class="sans tiny">224 · D=512</text>
      <rect x="380" width="180" height="245" rx="17" fill="url(#vit6)"/><text x="470" y="113" text-anchor="middle" class="sans label">L/14</text><text x="470" y="142" text-anchor="middle" class="sans tiny">224 / 336 · D=768</text><text x="470" y="174" text-anchor="middle" class="sans tiny">论文最佳模型</text>
    </g>
    <text x="28" y="326" class="sans tiny">CLIP-ViT 比 CLIP-ResNet 约高 3× 计算效率；最大 ViT 以 256 张 V100 训练 12 天。</text>
  </g>

  <g transform="translate(55 512)">
    <rect width="1290" height="180" rx="22" class="panel"/>
    <text x="28" y="43" class="sans label">共同训练底座</text>
    <g transform="translate(30 72)">
      <rect width="200" height="74" rx="15" fill="#0f3b42"/><text x="100" y="32" text-anchor="middle" class="sans big">400M</text><text x="100" y="57" text-anchor="middle" class="sans tiny">WIT 图文对</text>
      <rect x="218" width="200" height="74" rx="15" fill="#19345b"/><text x="318" y="32" text-anchor="middle" class="sans big">32</text><text x="318" y="57" text-anchor="middle" class="sans tiny">训练 epochs</text>
      <rect x="436" width="200" height="74" rx="15" fill="#31235d"/><text x="536" y="32" text-anchor="middle" class="sans big">32,768</text><text x="536" y="57" text-anchor="middle" class="sans tiny">global batch</text>
      <rect x="654" width="275" height="74" rx="15" fill="#2b234f"/><text x="791" y="29" text-anchor="middle" class="sans small">12 层 causal text Transformer</text><text x="791" y="54" text-anchor="middle" class="sans tiny">发布实现：词表 49,408 · 长度 77</text>
      <rect x="947" width="280" height="74" rx="15" fill="#3b2918"/><text x="1087" y="29" text-anchor="middle" class="sans small">AdamW + cosine schedule</text><text x="1087" y="54" text-anchor="middle" class="sans tiny">mixed precision · checkpointing · 分片 logits</text>
    </g>
  </g>
  <text x="55" y="716" class="sans tiny" fill="#fbbf24">口径提醒：400M 是唯一图文对数量；32 个 epoch 共呈现约 128 亿个样本次。正文写词表 49,152 / 长度 76；附录与发布接口为 49,408 / 77。</text>
</svg>
