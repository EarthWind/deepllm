<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#24153f"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#adbfdf"/></marker></defs><rect width="1400" height="820" rx="30" fill="url(#bg)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="64" fill="#fff" font-size="32" font-weight="700">Whisper：音频、弱监督与统一的 encoder–decoder</text><text x="52" y="98" fill="#a8bcdf" font-size="18">把 68 万小时的音频—文本数据变成一个可迁移的多任务语音接口</text><rect x="55" y="170" width="280" height="480" rx="22" fill="#102d46" stroke="#2ec6de" stroke-width="2"/><text x="90" y="225" fill="#fff" font-size="25" font-weight="700">原始音频</text><path d="M90 370q25-100 50 0t50 0 50 0 50 0" fill="none" stroke="#42d2df" stroke-width="6"/><text x="90" y="445" fill="#a7dce5" font-size="17">16 kHz waveform</text><rect x="90" y="490" width="200" height="70" rx="12" fill="#244b62"/><text x="127" y="533" fill="#fff" font-size="18">log-Mel spectrogram</text><line x1="355" y1="410" x2="450" y2="410" stroke="#adbfdf" stroke-width="4" marker-end="url(#a)"/><rect x="470" y="170" width="370" height="480" rx="22" fill="#172448" stroke="#9c76ec" stroke-width="2"/><text x="507" y="225" fill="#fff" font-size="25" font-weight="700">Audio encoder</text><rect x="510" y="285" width="290" height="85" rx="12" fill="#392b68"/><text x="590" y="337" fill="#fff" font-size="22" font-weight="700">Transformer</text><path d="M530 435h250M530 470h210M530 505h240" stroke="#bc9bf4" stroke-width="7" stroke-linecap="round"/><text x="510" y="570" fill="#cabaf8" font-size="17">音频 latent / context</text><line x1="860" y1="410" x2="945" y2="410" stroke="#adbfdf" stroke-width="4" marker-end="url(#a)"/><rect x="965" y="170" width="380" height="480" rx="22" fill="#29203f" stroke="#f0ad3c" stroke-width="2"/><text x="1000" y="225" fill="#fff" font-size="25" font-weight="700">Text decoder</text><text x="1000" y="270" fill="#f2ca7b" font-size="17">自回归 token 生成</text><rect x="1005" y="315" width="300" height="95" rx="12" fill="#4b3768"/><text x="1054" y="352" fill="#fff" font-size="18">语言 / 任务 token</text><text x="1065" y="383" fill="#d2c5fa" font-size="16">transcribe · translate</text><rect x="1005" y="455" width="300" height="95" rx="12" fill="#12433e"/><text x="1053" y="495" fill="#a8eed4" font-size="18">文本 + timestamps</text><text x="1056" y="525" fill="#a8eed4" font-size="16">language identification</text><path d="M645 700h360" stroke="#f2d149" stroke-width="3" stroke-dasharray="10 10"/><text x="490" y="750" fill="#f3d75b" font-size="18">同一 decoder 通过 special tokens 支持多任务与多语言迁移</text></g></svg>
