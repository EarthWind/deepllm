<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Switch Transformer 的专家容量与溢出 token</title>
  <desc id="desc">十二个 token 路由到三个专家，容量因子为一时每个专家只有四个槽位。专家一收到六个 token，最后两个溢出并跳过该专家层；提高容量因子会降低丢弃率，但带来更多空槽、计算和通信。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#25224f"/></linearGradient>
    <linearGradient id="hot2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb449"/><stop offset="1" stop-color="#ff6377"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".4"/></filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#9fb3d2"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#afbfda}.head{font-size:21px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#deebfb}.small{font-size:14px;fill:#aebfda}.dark{font-size:15px;font-weight:720;fill:#10243a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px;fill:#f4f8ff}.formula{font-family:"STIX Two Math","Times New Roman",serif;font-size:20px;fill:#fff}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg2)"/>
  <text x="54" y="62" class="sans title">容量因子：用固定形状承接动态路由</text>
  <text x="54" y="94" class="sans sub">示例 T = 12、N = 3、capacity factor = 1.0，因此每位专家最多接收 C = 4 个 token</text>

  <g filter="url(#shadow2)"><rect x="54" y="132" width="770" height="515" rx="25" fill="#10233b" stroke="#526d8f" stroke-width="2"/></g>
  <text x="84" y="174" class="sans head">Router 的实际选择并不一定均匀</text>

  <g>
    <rect x="85" y="207" width="56" height="38" rx="9" fill="#35bde0"/><text x="113" y="232" text-anchor="middle" class="sans dark">t₁</text>
    <rect x="151" y="207" width="56" height="38" rx="9" fill="#35bde0"/><text x="179" y="232" text-anchor="middle" class="sans dark">t₂</text>
    <rect x="217" y="207" width="56" height="38" rx="9" fill="#35bde0"/><text x="245" y="232" text-anchor="middle" class="sans dark">t₃</text>
    <rect x="283" y="207" width="56" height="38" rx="9" fill="#35bde0"/><text x="311" y="232" text-anchor="middle" class="sans dark">t₄</text>
    <rect x="349" y="207" width="56" height="38" rx="9" fill="#35bde0"/><text x="377" y="232" text-anchor="middle" class="sans dark">t₅</text>
    <rect x="415" y="207" width="56" height="38" rx="9" fill="#35bde0"/><text x="443" y="232" text-anchor="middle" class="sans dark">t₆</text>
    <rect x="481" y="207" width="56" height="38" rx="9" fill="#8b73ef"/><text x="509" y="232" text-anchor="middle" class="sans dark">t₇</text>
    <rect x="547" y="207" width="56" height="38" rx="9" fill="#8b73ef"/><text x="575" y="232" text-anchor="middle" class="sans dark">t₈</text>
    <rect x="613" y="207" width="56" height="38" rx="9" fill="#50d39c"/><text x="641" y="232" text-anchor="middle" class="sans dark">t₉</text>
    <rect x="679" y="207" width="56" height="38" rx="9" fill="#50d39c"/><text x="707" y="232" text-anchor="middle" class="sans dark">t₁₀</text>
    <rect x="85" y="256" width="56" height="38" rx="9" fill="#50d39c"/><text x="113" y="281" text-anchor="middle" class="sans dark">t₁₁</text>
    <rect x="151" y="256" width="56" height="38" rx="9" fill="#50d39c"/><text x="179" y="281" text-anchor="middle" class="sans dark">t₁₂</text>
  </g>
  <path d="M430 302V337" stroke="#9fb3d2" stroke-width="3" marker-end="url(#arrow2)"/>

  <text x="86" y="375" class="sans body">Expert 1 · 选中 6，容量 4</text>
  <g transform="translate(86 394)">
    <rect width="66" height="60" rx="10" fill="#35bde0"/><text x="33" y="36" text-anchor="middle" class="sans dark">t₁</text>
    <rect x="76" width="66" height="60" rx="10" fill="#35bde0"/><text x="109" y="36" text-anchor="middle" class="sans dark">t₂</text>
    <rect x="152" width="66" height="60" rx="10" fill="#35bde0"/><text x="185" y="36" text-anchor="middle" class="sans dark">t₃</text>
    <rect x="228" width="66" height="60" rx="10" fill="#35bde0"/><text x="261" y="36" text-anchor="middle" class="sans dark">t₄</text>
    <rect x="304" width="66" height="60" rx="10" fill="url(#hot2)" stroke="#ffbf57" stroke-dasharray="6 5"/><text x="337" y="27" text-anchor="middle" class="sans dark">t₅</text><text x="337" y="48" text-anchor="middle" class="sans dark">overflow</text>
    <rect x="380" width="66" height="60" rx="10" fill="url(#hot2)" stroke="#ffbf57" stroke-dasharray="6 5"/><text x="413" y="27" text-anchor="middle" class="sans dark">t₆</text><text x="413" y="48" text-anchor="middle" class="sans dark">overflow</text>
  </g>
  <text x="86" y="496" class="sans body">Expert 2 · 选中 2</text>
  <g transform="translate(86 512)"><rect width="66" height="52" rx="10" fill="#8b73ef"/><text x="33" y="32" text-anchor="middle" class="sans dark">t₇</text><rect x="76" width="66" height="52" rx="10" fill="#8b73ef"/><text x="109" y="32" text-anchor="middle" class="sans dark">t₈</text><rect x="152" width="66" height="52" rx="10" fill="#1b304c" stroke="#667c9b" stroke-dasharray="5 5"/><rect x="228" width="66" height="52" rx="10" fill="#1b304c" stroke="#667c9b" stroke-dasharray="5 5"/></g>
  <text x="405" y="496" class="sans body">Expert 3 · 选中 4</text>
  <g transform="translate(405 512)"><rect width="66" height="52" rx="10" fill="#50d39c"/><text x="33" y="32" text-anchor="middle" class="sans dark">t₉</text><rect x="76" width="66" height="52" rx="10" fill="#50d39c"/><text x="109" y="32" text-anchor="middle" class="sans dark">t₁₀</text><rect x="152" width="66" height="52" rx="10" fill="#50d39c"/><text x="185" y="32" text-anchor="middle" class="sans dark">t₁₁</text><rect x="228" width="66" height="52" rx="10" fill="#50d39c"/><text x="261" y="32" text-anchor="middle" class="sans dark">t₁₂</text></g>
  <text x="86" y="612" class="sans small">虚线空槽浪费容量；橙色溢出 token 不执行专家 FFN，依靠残差连接继续向前。</text>

  <g filter="url(#shadow2)"><rect x="858" y="132" width="368" height="515" rx="25" fill="#11243c" stroke="#526d8f" stroke-width="2"/></g>
  <text x="890" y="177" class="sans head">容量是一组工程权衡</text>
  <rect x="888" y="207" width="308" height="100" rx="15" fill="#183a4a" stroke="#35bde0"/>
  <text x="910" y="238" class="sans body">较小 capacity factor</text>
  <text x="910" y="268" class="sans small">更少内存、padding 与通信</text>
  <text x="910" y="291" class="sans small">但热门专家更容易溢出</text>
  <rect x="888" y="327" width="308" height="100" rx="15" fill="#2c2858" stroke="#8b73ef"/>
  <text x="910" y="358" class="sans body">较大 capacity factor</text>
  <text x="910" y="388" class="sans small">更多缓冲，降低 token 丢弃率</text>
  <text x="910" y="411" class="sans small">但空槽也参与固定形状的执行</text>
  <rect x="888" y="447" width="308" height="105" rx="15" fill="#352c37" stroke="#ff9a55"/>
  <text x="910" y="478" class="sans body">负载均衡损失</text>
  <text x="910" y="508" class="sans small">从训练目标上减少热点专家</text>
  <text x="910" y="531" class="sans small">与容量缓冲共同控制丢弃率</text>
  <text x="1042" y="596" text-anchor="middle" class="sans formula">C = ceil((T / N) · c_f)</text>
  <text x="1042" y="622" text-anchor="middle" class="sans small">真实分布式实现通常按每个 core 的 token 数计算</text>
</svg>
