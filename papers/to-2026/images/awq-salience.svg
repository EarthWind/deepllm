<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171a38"/></linearGradient>
    <linearGradient id="good" x1="0" x2="1"><stop stop-color="#1fae91"/><stop offset="1" stop-color="#48dda1"/></linearGradient>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#edf4ff}.h{font-size:34px;font-weight:800}.m{font-size:23px;font-weight:700}.s{font-size:18px}.v{font-size:20px;font-weight:800}.muted{fill:#94a8c8}.code{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/>
  <text x="66" y="66" class="h">显著性来自 Activation：权重值不大，也可能承载最重要的输入特征</text>
  <text x="66" y="104" class="s muted">论文 Table 1：OPT-6.7B，WikiText-2，INT3-g128；PPL 越低越好</text>

  <g transform="translate(65 145)">
    <rect width="450" height="610" rx="24" fill="#0d2038" stroke="#2d496d"/>
    <text x="28" y="47" class="m">为什么看输入通道</text>
    <g transform="translate(30 85)">
      <text x="0" y="27" class="s code">y = Σⱼ wⱼ xⱼ</text>
      <text x="0" y="63" class="s muted">同样的权重误差 δwⱼ，输出扰动为：</text>
      <rect x="0" y="86" width="390" height="65" rx="15" fill="#142d4a" stroke="#4d76aa"/>
      <text x="195" y="128" text-anchor="middle" class="m code">δyⱼ = δwⱼ · xⱼ</text>
      <text x="0" y="190" class="s">当 mean(|xⱼ|) 很大时：</text>
      <text x="22" y="229" class="s muted">• 很小的 δwⱼ 也会被放大</text>
      <text x="22" y="264" class="s muted">• 对应整列 W[:, j] 都更敏感</text>
      <text x="22" y="299" class="s muted">• 只看 |wⱼ| 无法看到这个乘数</text>
      <g transform="translate(0 337)">
        <rect width="390" height="125" rx="18" fill="#15352f" stroke="#3ad1a4"/>
        <text x="195" y="38" text-anchor="middle" class="m" fill="#6ee8bd">论文的关键反常识</text>
        <text x="195" y="76" text-anchor="middle" class="s">按 activation 选 0.1%-1%</text>
        <text x="195" y="106" text-anchor="middle" class="s">远好于按 weight norm 或随机选</text>
      </g>
    </g>
  </g>

  <g transform="translate(545 145)">
    <rect width="790" height="610" rx="24" fill="#0d2038" stroke="#2d496d"/>
    <text x="28" y="47" class="m">保留 1% 通道为 FP16 的诊断实验</text>
    <text x="28" y="80" class="s muted">注意：这只是发现规律的 oracle-style 实验，不是最终 AWQ 格式</text>
    <g transform="translate(32 118)">
      <line x1="250" y1="0" x2="250" y2="385" stroke="#3a506e" stroke-width="2"/>
      <g class="s muted"><text x="250" y="400">10</text><text x="393" y="400">14</text><text x="536" y="400">18</text><text x="679" y="400">22+</text></g>

      <text x="0" y="38" class="m">FP16 baseline</text>
      <rect x="250" y="10" width="31" height="38" rx="10" fill="#4d72a2"/><text x="300" y="38" class="v">10.86</text>

      <text x="0" y="112" class="m">RTN 全部 INT3</text>
      <rect x="250" y="84" width="484" height="38" rx="10" fill="#d46d62"/><text x="682" y="112" text-anchor="end" class="v">23.54</text>

      <text x="0" y="186" class="m" fill="#6ee8bd">Activation top 1%</text>
      <rect x="250" y="158" width="50" height="38" rx="10" fill="url(#good)"/><text x="319" y="186" class="v" fill="#6ee8bd">11.39</text>

      <text x="0" y="260" class="m">Weight norm top 1%</text>
      <rect x="250" y="232" width="443" height="38" rx="10" fill="#9a7197"/><text x="710" y="260" class="v">22.37</text>

      <text x="0" y="334" class="m">Random 1%</text>
      <rect x="250" y="306" width="509" height="38" rx="10" fill="#826d9e"/><text x="734" y="334" text-anchor="end" class="v">24.23</text>

      <rect x="0" y="423" width="725" height="60" rx="16" fill="#352a20" stroke="#d59645"/>
      <text x="362" y="448" text-anchor="middle" class="s" fill="#ffd080">混合精度能证明 saliency，但不利于规整打包、向量化读取和 kernel 实现。</text>
      <text x="362" y="473" text-anchor="middle" class="s muted">AWQ 下一步：不保留 FP16，而是用 scaling 在统一整数格式里“软保护”。</text>
    </g>
  </g>
  <text x="700" y="815" text-anchor="middle" class="s muted">“1% salient weights”更准确地说是少量重要输入通道对应的权重列；实际比例与模型、层和统计口径有关。</text>
</svg>
