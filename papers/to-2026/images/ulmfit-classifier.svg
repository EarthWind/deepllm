<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">ULMFiT 的 BPT3C、concat pooling 与分类头</title>
  <desc id="desc">长文档按顺序切分，LSTM 状态跨块传递，收集可容纳的隐藏状态。最后时刻、时间维最大值和时间维均值拼接后，送入两层带批归一化、dropout 和激活函数的分类器。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .heading { font: 700 19px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 600 13px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .mono-light { font: 600 13px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #e2e8f0; }
      .white { font: 700 15px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .state { fill: none; stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="840" fill="#f8fafc"/>
  <text x="70" y="60" class="title">长文档不压成最后一个状态：分块计算，再从整段时间轴取证</text>
  <text x="70" y="92" class="subtitle">BPT3C 解决长文档的计算问题；concat pooling 解决“决定性词可能出现在任意位置”的表示问题。</text>

  <!-- Left: BPT3C -->
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="540" height="610" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="85" y="180" class="heading">1　BPT3C：按顺序读取长文档</text>
  <text x="85" y="210" class="small">固定长度分块只改变一次送入 GPU 的时间步数，不改变文档顺序。</text>

  <rect x="85" y="242" width="480" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="325" y="266" text-anchor="middle" class="label">完整文档：一条电影评论，可能有数百个词</text>
  <text x="325" y="287" text-anchor="middle" class="small">x₁ x₂ … x₇₀ | x₇₁ … x₁₄₀ | … | xₜ</text>

  <text x="108" y="340" class="small">chunk 1</text>
  <text x="251" y="340" class="small">chunk 2</text>
  <text x="394" y="340" class="small">chunk K</text>
  <rect x="85" y="354" width="112" height="88" rx="11" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="228" y="354" width="112" height="88" rx="11" fill="#e0e7ff" stroke="#818cf8"/>
  <rect x="371" y="354" width="112" height="88" rx="11" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="141" y="388" text-anchor="middle" class="label">AWD-LSTM</text>
  <text x="141" y="416" text-anchor="middle" class="mono">h₁ … h_b</text>
  <text x="284" y="388" text-anchor="middle" class="label">AWD-LSTM</text>
  <text x="284" y="416" text-anchor="middle" class="mono">h_b₊₁ …</text>
  <text x="427" y="388" text-anchor="middle" class="label">AWD-LSTM</text>
  <text x="427" y="416" text-anchor="middle" class="mono">… h_T</text>
  <text x="522" y="404" class="label">…</text>

  <path d="M197 398 L228 398" class="state"/>
  <path d="M340 398 L371 398" class="state"/>
  <path d="M483 398 L516 398" class="state"/>
  <text x="212" y="381" text-anchor="middle" class="tiny">传递状态</text>
  <text x="355" y="381" text-anchor="middle" class="tiny">传递状态</text>

  <rect x="85" y="482" width="480" height="104" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="325" y="512" text-anchor="middle" class="label">收集对分类预测有贡献的隐藏状态</text>
  <g>
    <circle cx="130" cy="548" r="12" fill="#bfdbfe"/><circle cx="175" cy="548" r="12" fill="#bfdbfe"/>
    <circle cx="220" cy="548" r="12" fill="#c7d2fe"/><circle cx="265" cy="548" r="12" fill="#c7d2fe"/>
    <circle cx="310" cy="548" r="12" fill="#ddd6fe"/><circle cx="355" cy="548" r="12" fill="#ddd6fe"/>
    <circle cx="400" cy="548" r="12" fill="#c4b5fd"/><circle cx="445" cy="548" r="12" fill="#a78bfa"/>
    <circle cx="500" cy="548" r="12" fill="#7c3aed"/>
  </g>
  <path d="M325 586 L325 622" class="arrow"/>

  <rect x="85" y="622" width="480" height="88" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="325" y="652" text-anchor="middle" class="label">重要边界</text>
  <text x="325" y="677" text-anchor="middle" class="small">分块不是把 chunks 当成独立样本；状态必须按文档连续传递。</text>
  <text x="325" y="698" text-anchor="middle" class="small">真实实现还需控制截断反传窗口和显存中保留的时间步。</text>

  <!-- Middle: concat pooling -->
  <g filter="url(#shadow)">
    <rect x="630" y="135" width="390" height="610" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="660" y="180" class="heading">2　Concat Pooling：三种视角</text>
  <text x="660" y="210" class="small">设 H={h₁,…,h_T}，每个 hₜ∈ℝᵈ。</text>

  <rect x="660" y="245" width="330" height="102" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="706" cy="296" r="24" fill="#2563eb"/>
  <text x="706" y="301" text-anchor="middle" class="white">末</text>
  <text x="748" y="281" class="label">最后隐藏状态 h_T</text>
  <text x="748" y="306" class="small">保留顺序累积后的最终上下文</text>
  <text x="748" y="329" class="small">但可能遗忘早期的局部强信号</text>

  <rect x="660" y="365" width="330" height="102" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <circle cx="706" cy="416" r="24" fill="#7c3aed"/>
  <text x="706" y="421" text-anchor="middle" class="white">峰</text>
  <text x="748" y="401" class="label">时间维 max pool</text>
  <text x="748" y="426" class="small">每个通道保留最强激活</text>
  <text x="748" y="449" class="small">捕捉任意位置的决定性短语</text>

  <rect x="660" y="485" width="330" height="102" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="706" cy="536" r="24" fill="#d97706"/>
  <text x="706" y="541" text-anchor="middle" class="white">均</text>
  <text x="748" y="521" class="label">时间维 mean pool</text>
  <text x="748" y="546" class="small">汇总全局平均语气与主题</text>
  <text x="748" y="569" class="small">对持续但不尖锐的信号敏感</text>

  <path d="M825 347 L825 365" class="arrow"/>
  <path d="M825 467 L825 485" class="arrow"/>
  <path d="M825 587 L825 626" class="arrow"/>
  <rect x="660" y="626" width="330" height="84" rx="12" fill="#0f172a"/>
  <text x="825" y="657" text-anchor="middle" class="white">拼接为 3d 维文档向量</text>
  <text x="825" y="688" text-anchor="middle" class="mono-light">h_c = [h_T ; max(H) ; mean(H)]</text>

  <!-- Right: classifier -->
  <g filter="url(#shadow)">
    <rect x="1055" y="135" width="290" height="610" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="1085" y="180" class="heading">3　两层分类头</text>
  <text x="1085" y="210" class="small">只有这些参数从随机初始化开始。</text>

  <rect x="1090" y="248" width="220" height="68" rx="11" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1200" y="276" text-anchor="middle" class="label">BatchNorm + Dropout</text>
  <text x="1200" y="299" text-anchor="middle" class="small">输入：3d</text>
  <path d="M1200 316 L1200 344" class="arrow"/>

  <rect x="1090" y="344" width="220" height="68" rx="11" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1200" y="372" text-anchor="middle" class="label">Linear → ReLU</text>
  <text x="1200" y="395" text-anchor="middle" class="small">论文隐藏层宽度 50</text>
  <path d="M1200 412 L1200 440" class="arrow"/>

  <rect x="1090" y="440" width="220" height="68" rx="11" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1200" y="468" text-anchor="middle" class="label">BatchNorm + Dropout</text>
  <text x="1200" y="491" text-anchor="middle" class="small">正则化新任务头</text>
  <path d="M1200 508 L1200 536" class="arrow"/>

  <rect x="1090" y="536" width="220" height="68" rx="11" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1200" y="564" text-anchor="middle" class="label">Linear → Softmax</text>
  <text x="1200" y="587" text-anchor="middle" class="small">输出 C 个类别概率</text>

  <rect x="1090" y="637" width="220" height="73" rx="11" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="1200" y="663" text-anchor="middle" class="label">论文最终结果</text>
  <text x="1200" y="686" text-anchor="middle" class="small">正向模型 + 反向模型</text>
  <text x="1200" y="704" text-anchor="middle" class="small">独立训练，预测概率取平均</text>

  <path d="M595 440 C615 440 610 667 630 667" class="arrow"/>
  <path d="M1020 667 L1055 667" class="arrow"/>

  <rect x="55" y="778" width="1290" height="40" rx="10" fill="#e2e8f0"/>
  <text x="700" y="804" text-anchor="middle" class="label">不要把“bidirectional”理解成一个双向 LSTM：论文训练两个方向相反、参数独立的 LM-classifier，再平均预测。</text>
</svg>
