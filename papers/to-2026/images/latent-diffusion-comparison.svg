<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#08162e"/><stop offset="1" stop-color="#24163e"/></linearGradient></defs><rect width="1400" height="760" rx="30" fill="url(#c)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">为什么 latent space 是一个关键折中</text><text x="52" y="96" fill="#aabfe4" font-size="18">目标不是压缩得越狠越好，而是在计算量与视觉细节之间找到近似最优点</text><rect x="60" y="170" width="590" height="470" rx="22" fill="#102c46" stroke="#2fc7df" stroke-width="2"/><text x="98" y="225" fill="#fff" font-size="25" font-weight="700">像素空间 diffusion</text><text x="98" y="270" fill="#a5dae4" font-size="17">高分辨率 feature map 直接去噪</text><text x="98" y="315" fill="#a5dae4" font-size="17">每一步处理 512×512×3 的大张量</text><rect x="105" y="370" width="470" height="55" rx="10" fill="#244c64"/><rect x="105" y="370" width="440" height="55" rx="10" fill="#31c5db"/><text x="260" y="405" fill="#062033" font-size="18" font-weight="700">计算量：高</text><rect x="105" y="455" width="470" height="55" rx="10" fill="#244c64"/><rect x="105" y="455" width="180" height="55" rx="10" fill="#53d5aa"/><text x="260" y="490" fill="#d8fff4" font-size="18" font-weight="700">细节：强</text><text x="105" y="570" fill="#f3c976" font-size="17">优点：少量信息损失</text><text x="105" y="603" fill="#f3c976" font-size="17">缺点：训练/推理昂贵</text><rect x="750" y="170" width="590" height="470" rx="22" fill="#29203f" stroke="#f0ad3c" stroke-width="2"/><text x="788" y="225" fill="#fff" font-size="25" font-weight="700">Latent diffusion</text><text x="788" y="270" fill="#f2cc7e" font-size="17">先由 autoencoder 提取语义 latent</text><text x="788" y="315" fill="#f2cc7e" font-size="17">再在 64×64×4 的空间去噪</text><rect x="795" y="370" width="470" height="55" rx="10" fill="#4b385e"/><rect x="795" y="370" width="110" height="55" rx="10" fill="#efab3b"/><text x="965" y="405" fill="#fff" font-size="18" font-weight="700">计算量：低</text><rect x="795" y="455" width="470" height="55" rx="10" fill="#4b385e"/><rect x="795" y="455" width="405" height="55" rx="10" fill="#9a75ed"/><text x="965" y="490" fill="#fff" font-size="18" font-weight="700">细节：高</text><text x="795" y="570" fill="#f3d078" font-size="17">优点：可扩展、适合高分辨率</text><text x="795" y="603" fill="#f3d078" font-size="17">代价：重建质量受 autoencoder 限制</text><path d="M650 405h95" stroke="#f1d149" stroke-width="4"/><text x="668" y="380" fill="#f4d95b" font-size="17">折中</text></g></svg>
