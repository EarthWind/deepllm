<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">RoPE 的多频率二维旋转平面</title>
  <desc id="desc">头维度被分为多组二维通道对。低索引通道旋转更快，适合分辨近距离位置；高索引通道旋转更慢，承载更长尺度的相位变化。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .heading { font: 700 19px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 400 14px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 500 15px "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; fill: #334155; }
      .axis { stroke: #94a3b8; stroke-width: 1.3; }
      .wave { fill: none; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1400" height="720" fill="url(#bg2)"/>
  <text x="64" y="58" class="title">一个 head 不是只转一次：RoPE 是一组从快到慢的“相位时钟”</text>
  <text x="64" y="88" class="subtitle">第 i 个二维通道对使用 θᵢ = base⁻²ⁱ/ᵈ；位置 m 对应相位 mθᵢ，周期 λᵢ = 2π/θᵢ。</text>

  <g transform="translate(72 132)">
    <rect width="1256" height="218" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="36" class="heading">head_dim = d → d/2 个二维旋转平面</text>

    <g transform="translate(108 130)">
      <circle r="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <line x1="-68" y1="0" x2="68" y2="0" class="axis"/>
      <line x1="0" y1="68" x2="0" y2="-68" class="axis"/>
      <path d="M0 0 L-42 -38" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow2)"/>
      <path d="M52 0 A52 52 0 0 0 -37 -37" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="-70" y="-75" class="label">通道 (0, 1)</text>
      <text x="-67" y="89" class="mono">θ₀ = 1</text>
    </g>

    <g transform="translate(420 130)">
      <circle r="60" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
      <line x1="-68" y1="0" x2="68" y2="0" class="axis"/>
      <line x1="0" y1="68" x2="0" y2="-68" class="axis"/>
      <path d="M0 0 L18 -54" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow2)"/>
      <path d="M52 0 A52 52 0 0 0 17 -49" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="-82" y="-75" class="label">通道 (2, 3)</text>
      <text x="-91" y="89" class="mono">θ₁ = base⁻²/ᵈ</text>
    </g>

    <text x="627" y="141" text-anchor="middle" class="heading">…</text>

    <g transform="translate(832 130)">
      <circle r="60" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <line x1="-68" y1="0" x2="68" y2="0" class="axis"/>
      <line x1="0" y1="68" x2="0" y2="-68" class="axis"/>
      <path d="M0 0 L54 -18" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow2)"/>
      <path d="M52 0 A52 52 0 0 0 49 -16" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="-112" y="-75" class="label">高索引通道对</text>
      <text x="-111" y="89" class="mono">θᵢ 很小</text>
    </g>

    <g transform="translate(1120 130)">
      <circle r="60" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
      <line x1="-68" y1="0" x2="68" y2="0" class="axis"/>
      <line x1="0" y1="68" x2="0" y2="-68" class="axis"/>
      <path d="M0 0 L56 -7" stroke="#c026d3" stroke-width="4" marker-end="url(#arrow2)"/>
      <path d="M52 0 A52 52 0 0 0 51 -7" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="-98" y="-75" class="label">最后一组</text>
      <text x="-118" y="89" class="mono">θd/2−1 最小</text>
    </g>
  </g>

  <g transform="translate(72 386)">
    <rect width="1256" height="258" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="38" class="heading">同一段位置轴，在不同通道里呈现不同波长</text>
    <line x1="188" y1="82" x2="1198" y2="82" class="axis"/>
    <line x1="188" y1="137" x2="1198" y2="137" class="axis"/>
    <line x1="188" y1="192" x2="1198" y2="192" class="axis"/>
    <text x="26" y="87" class="label">快频率</text>
    <text x="26" y="142" class="label">中频率</text>
    <text x="26" y="197" class="label">慢频率</text>
    <path d="M188 82 C230 25 272 139 314 82 S398 25 440 82 S524 139 566 82 S650 25 692 82 S776 139 818 82 S902 25 944 82 S1028 139 1070 82 S1154 25 1196 82" class="wave" stroke="#2563eb"/>
    <path d="M188 137 C272 68 356 206 440 137 S608 68 692 137 S860 206 944 137 S1112 68 1196 137" class="wave" stroke="#7c3aed"/>
    <path d="M188 192 C356 122 524 122 692 192 S1028 262 1196 192" class="wave" stroke="#c026d3"/>
    <text x="190" y="229" class="small">近距离变化敏感</text>
    <text x="1198" y="229" text-anchor="end" class="small">长尺度仍缓慢变化</text>
  </g>

  <text x="700" y="690" text-anchor="middle" class="small">多尺度相位共同参与点积；这会形成复杂的振荡与相消，而不是一个手工规定的单调距离衰减函数。</text>
</svg>
