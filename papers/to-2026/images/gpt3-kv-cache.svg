<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">自回归生成中的 KV Cache</title>
  <desc id="desc">左侧展示每生成一个 token 都重复计算全部历史，右侧展示缓存历史键和值后只计算新 token。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 31px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #f8fafc; }
      .heading { font: 700 22px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #f8fafc; }
      .label { font: 600 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #f8fafc; }
      .small { font: 400 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #cbd5e1; }
      .mono { font: 500 15px "JetBrains Mono","Noto Sans Mono CJK SC",monospace; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg3)"/>
  <text x="54" y="60" class="title">KV Cache：让逐 token 生成不再反复计算历史 K / V</text>
  <line x1="640" y1="94" x2="640" y2="510" stroke="#334155" stroke-width="2"/>

  <text x="54" y="120" class="heading">不使用 Cache</text>
  <text x="680" y="120" class="heading">使用 Cache</text>

  <g>
    <text x="54" y="170" class="small">第 1 步</text>
    <rect x="125" y="145" width="74" height="42" rx="9" fill="#2563eb"/>
    <text x="162" y="172" text-anchor="middle" class="label">A</text>
    <rect x="207" y="145" width="74" height="42" rx="9" fill="#2563eb"/>
    <text x="244" y="172" text-anchor="middle" class="label">B</text>
    <rect x="289" y="145" width="74" height="42" rx="9" fill="#2563eb"/>
    <text x="326" y="172" text-anchor="middle" class="label">C</text>
    <path d="M378 166 H468" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr3)"/>
    <rect x="483" y="145" width="95" height="42" rx="9" fill="#78350f" stroke="#f59e0b"/>
    <text x="530" y="172" text-anchor="middle" class="label">生成 D</text>

    <text x="54" y="254" class="small">第 2 步</text>
    <rect x="125" y="229" width="74" height="42" rx="9" fill="#2563eb"/>
    <text x="162" y="256" text-anchor="middle" class="label">A</text>
    <rect x="207" y="229" width="74" height="42" rx="9" fill="#2563eb"/>
    <text x="244" y="256" text-anchor="middle" class="label">B</text>
    <rect x="289" y="229" width="74" height="42" rx="9" fill="#2563eb"/>
    <text x="326" y="256" text-anchor="middle" class="label">C</text>
    <rect x="371" y="229" width="74" height="42" rx="9" fill="#2563eb"/>
    <text x="408" y="256" text-anchor="middle" class="label">D</text>
    <path d="M460 250 H493" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr3)"/>
    <rect x="508" y="229" width="95" height="42" rx="9" fill="#78350f" stroke="#f59e0b"/>
    <text x="555" y="256" text-anchor="middle" class="label">生成 E</text>

    <text x="54" y="345" class="label">问题</text>
    <text x="125" y="345" class="small">A、B、C 的注意力投影在每一步都被重新计算</text>
    <text x="54" y="387" class="mono">prefill + 逐步重复历史计算</text>
  </g>

  <g>
    <text x="680" y="170" class="small">Prefill</text>
    <rect x="760" y="145" width="64" height="42" rx="9" fill="#2563eb"/>
    <text x="792" y="172" text-anchor="middle" class="label">A</text>
    <rect x="832" y="145" width="64" height="42" rx="9" fill="#2563eb"/>
    <text x="864" y="172" text-anchor="middle" class="label">B</text>
    <rect x="904" y="145" width="64" height="42" rx="9" fill="#2563eb"/>
    <text x="936" y="172" text-anchor="middle" class="label">C</text>
    <path d="M983 166 H1038" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr3)"/>
    <rect x="1053" y="137" width="170" height="58" rx="10" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="1138" y="161" text-anchor="middle" class="label">缓存 K / V</text>
    <text x="1138" y="184" text-anchor="middle" class="small">A, B, C</text>

    <text x="680" y="254" class="small">Decode</text>
    <rect x="760" y="229" width="64" height="42" rx="9" fill="#f59e0b"/>
    <text x="792" y="256" text-anchor="middle" class="label">D</text>
    <text x="842" y="256" class="label">＋</text>
    <rect x="875" y="220" width="180" height="60" rx="10" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="965" y="246" text-anchor="middle" class="label">历史 K / V</text>
    <text x="965" y="270" text-anchor="middle" class="small">直接读取，不重算</text>
    <path d="M1070 250 H1102" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr3)"/>
    <rect x="1117" y="229" width="106" height="42" rx="9" fill="#78350f" stroke="#f59e0b"/>
    <text x="1170" y="256" text-anchor="middle" class="label">生成 E</text>

    <text x="680" y="345" class="label">代价</text>
    <text x="760" y="345" class="small">减少重复计算，但缓存会随层数、序列长度增长</text>
    <text x="680" y="387" class="mono">每层缓存形状约为 2 × B × H × T × d_head</text>
  </g>

  <rect x="54" y="440" width="1169" height="70" rx="14" fill="#0f2946" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="638" y="470" text-anchor="middle" class="label">GPT-3 论文的核心论点是上下文学习；KV Cache 是让长 prompt 自回归生成可用的工程机制。</text>
  <text x="638" y="496" text-anchor="middle" class="small">两者不要混淆：Cache 不让模型“学得更多”，它只避免重复计算。</text>
</svg>
