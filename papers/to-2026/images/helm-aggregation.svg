<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">从多维分数矩阵到负责任决策</title><desc id="desc">先检查覆盖率和方向，再按利益相关者权重计算效用，同时保留Pareto前沿和原始矩阵。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="1" stop-color="#171128"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#62d9ff"/></marker></defs><rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <text x="70" y="78" fill="#f5f8ff" font-family="Inter, PingFang SC, sans-serif" font-size="38" font-weight="700">HELM 输出的是决策材料，不是宇宙唯一总分</text><text x="70" y="121" fill="#95a9c3" font-family="Inter, PingFang SC, sans-serif" font-size="20">排名必须引入价值判断：权重属于谁、缺失如何处理、哪些门槛不可补偿，都要公开</text>
  <g font-family="Inter, PingFang SC, sans-serif">
    <g transform="translate(70 205)"><rect width="300" height="360" rx="28" fill="#102b39" stroke="#3ad2f5"/><text x="150" y="46" text-anchor="middle" fill="#58defb" font-size="24" font-weight="700">原始分数矩阵</text><g transform="translate(35 85)" fill="#1a4557" stroke="#48a8c6"><rect width="62" height="44" rx="7"/><rect x="76" width="62" height="44" rx="7"/><rect x="152" width="62" height="44" rx="7"/><rect y="58" width="62" height="44" rx="7"/><rect x="76" y="58" width="62" height="44" rx="7" fill="#0a111c" stroke-dasharray="5 4"/><rect x="152" y="58" width="62" height="44" rx="7"/><rect y="116" width="62" height="44" rx="7"/><rect x="76" y="116" width="62" height="44" rx="7"/><rect x="152" y="116" width="62" height="44" rx="7"/><rect y="174" width="62" height="44" rx="7"/><rect x="76" y="174" width="62" height="44" rx="7"/><rect x="152" y="174" width="62" height="44" rx="7" fill="#0a111c" stroke-dasharray="5 4"/></g><text x="150" y="328" text-anchor="middle" fill="#a7c5d2" font-size="17">保留 per-instance 与缺失</text></g>
    <path d="M385 385h75" stroke="#62d9ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(475 205)"><rect width="400" height="360" rx="28" fill="#25203d" stroke="#a58cff"/><text x="200" y="46" text-anchor="middle" fill="#beaaff" font-size="24" font-weight="700">检查与对齐</text><g font-size="18"><text x="38" y="102" fill="#f2edff">① 覆盖率：missing ≠ 0</text><text x="38" y="150" fill="#f2edff">② 方向：accuracy ↑，ECE ↓</text><text x="38" y="198" fill="#f2edff">③ 量纲：按公开范围归一化</text><text x="38" y="246" fill="#f2edff">④ 不确定性：配对 bootstrap</text><text x="38" y="294" fill="#f2edff">⑤ 门槛：安全底线不可被平均</text></g><text x="200" y="335" text-anchor="middle" fill="#b2a5c6" font-size="16">先决定“可比”，再计算“偏好”</text></g>
    <path d="M890 385h75" stroke="#62d9ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(980 205)"><rect width="390" height="360" rx="28" fill="#302414" stroke="#ffb65d"/><text x="195" y="46" text-anchor="middle" fill="#ffc77d" font-size="24" font-weight="700">两类诚实输出</text><rect x="35" y="84" width="320" height="104" rx="18" fill="#45331c"/><text x="195" y="120" text-anchor="middle" fill="#fff3df" font-size="19">带权效用 U(w)</text><text x="195" y="154" text-anchor="middle" fill="#f4c889" font-size="16">权重与缺项必须披露</text><rect x="35" y="212" width="320" height="104" rx="18" fill="#17372f" stroke="#50d9a6"/><text x="195" y="248" text-anchor="middle" fill="#eafff6" font-size="19">Pareto 前沿</text><text x="195" y="282" text-anchor="middle" fill="#83e7bf" font-size="16">展示不可互相支配的选择</text></g>
    <g transform="translate(150 660)"><rect width="1140" height="140" rx="30" fill="#11192a" stroke="#5c5478"/><text x="570" y="46" text-anchor="middle" fill="#f1efff" font-size="24" font-weight="700">不同使用者可以得出不同、但可审计的选择</text><text x="210" y="94" text-anchor="middle" fill="#6edfff" font-size="18">医疗：校准与最坏群体优先</text><text x="570" y="94" text-anchor="middle" fill="#ffca83" font-size="18">端侧：延迟与能耗优先</text><text x="930" y="94" text-anchor="middle" fill="#e893ff" font-size="18">内容生成：毒性与版权门槛优先</text><text x="570" y="123" text-anchor="middle" fill="#8298b4" font-size="16">矩阵与原始记录始终保留，避免一个总分抹平冲突</text></g>
    <text x="720" y="862" text-anchor="middle" fill="#ffb5ce" font-size="17">不要：静默丢行、把缺失填 0、未说明范围就平均、用高准确率抵消硬性风险</text>
  </g>
</svg>
