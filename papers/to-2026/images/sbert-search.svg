<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Sentence-BERT 从离线编码到在线语义检索</title>
  <desc id="desc">语料离线经共享编码器和池化写入向量索引；查询在线编码后做近邻搜索，可选用 Cross-Encoder 重排。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#111a32"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e5eefc}.h1{font-size:30px;font-weight:800}.h2{font-size:23px;font-weight:800}.body{font-size:17px}.small{font-size:15px}.muted{fill:#91a4c6}.label{font-size:14px;font-weight:800;letter-spacing:.1em}.card{fill:#0c192d;stroke:#294064;stroke-width:1.5}.node{fill:#11243d;stroke:#3b82f6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg3)"/>
  <text x="48" y="58" class="t h1">句向量真正改变的是系统边界</text>
  <text x="48" y="91" class="t body muted">语料编码从请求路径移到离线流程；在线只编码查询，并在向量空间取 Top-k</text>

  <rect x="38" y="128" width="1124" height="217" rx="22" class="card"/>
  <rect x="56" y="146" width="96" height="29" rx="14" fill="#0e3440" stroke="#22d3ee"/><text x="104" y="166" text-anchor="middle" class="t label" fill="#67e8f9">OFFLINE</text>
  <text x="56" y="207" class="t h2">语料只编码一次</text>
  <g transform="translate(248 166)">
    <rect x="0" y="10" width="168" height="112" rx="15" class="node"/><text x="84" y="42" text-anchor="middle" class="t body">文档 / 句子语料</text><text x="84" y="70" text-anchor="middle" class="t small muted">c₁, c₂, …, cₙ</text><text x="84" y="97" text-anchor="middle" class="t small muted">批处理 + 长度分桶</text>
    <path d="M177 66H228" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="240" y="10" width="184" height="112" rx="15" class="node"/><text x="332" y="42" text-anchor="middle" class="t body">共享 Encoder θ</text><text x="332" y="70" text-anchor="middle" class="t small muted">BERT / RoBERTa</text><text x="332" y="97" text-anchor="middle" class="t small muted">+ MEAN Pooling</text>
    <path d="M433 66H484" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="496" y="10" width="172" height="112" rx="15" fill="#102b3b" stroke="#22d3ee" stroke-width="1.5"/><text x="582" y="42" text-anchor="middle" class="t body">向量索引</text><text x="582" y="70" text-anchor="middle" class="t small muted">e₁, e₂, …, eₙ</text><text x="582" y="97" text-anchor="middle" class="t small muted">持久化 + ANN</text>
    <g transform="translate(695 18)"><circle cx="20" cy="20" r="8" fill="#38bdf8"/><circle cx="70" cy="10" r="6" fill="#64748b"/><circle cx="104" cy="46" r="7" fill="#64748b"/><circle cx="55" cy="74" r="8" fill="#38bdf8"/><circle cx="15" cy="88" r="5" fill="#64748b"/><circle cx="120" cy="92" r="6" fill="#64748b"/></g>
  </g>

  <rect x="38" y="372" width="1124" height="260" rx="22" class="card"/>
  <rect x="56" y="390" width="96" height="29" rx="14" fill="#28204d" stroke="#a78bfa"/><text x="104" y="410" text-anchor="middle" class="t label" fill="#c4b5fd">ONLINE</text>
  <text x="56" y="451" class="t h2">每个查询只跑一次 Encoder</text>
  <g transform="translate(220 426)">
    <rect x="0" y="26" width="144" height="96" rx="15" fill="#241e43" stroke="#a78bfa"/><text x="72" y="62" text-anchor="middle" class="t body">查询 q</text><text x="72" y="91" text-anchor="middle" class="t small muted">一条新文本</text>
    <path d="M153 74H202" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowV)"/>
    <rect x="214" y="26" width="160" height="96" rx="15" fill="#201d40" stroke="#a78bfa"/><text x="294" y="61" text-anchor="middle" class="t body">同一 Encoder θ</text><text x="294" y="90" text-anchor="middle" class="t small muted">q → e_q</text>
    <path d="M383 74H432" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowV)"/>
    <rect x="444" y="26" width="164" height="96" rx="15" fill="#102b3b" stroke="#22d3ee"/><text x="526" y="61" text-anchor="middle" class="t body">ANN / cosine</text><text x="526" y="90" text-anchor="middle" class="t small muted">召回 Top-k</text>
    <path d="M617 74H666" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="678" y="0" width="220" height="148" rx="15" fill="#132038" stroke="#64748b"/>
    <text x="788" y="31" text-anchor="middle" class="t body">候选结果</text>
    <rect x="699" y="46" width="178" height="25" rx="7" fill="#12344a"/><text x="710" y="64" class="t small" fill="#67e8f9">1　0.92</text>
    <rect x="699" y="80" width="150" height="25" rx="7" fill="#1e2c46"/><text x="710" y="98" class="t small muted">2　0.86</text>
    <rect x="699" y="114" width="122" height="25" rx="7" fill="#1e2c46"/><text x="710" y="132" class="t small muted">3　0.81</text>
  </g>
  <path d="M1008 632V660H663" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="396" y="645" width="267" height="35" rx="17" fill="#332716" stroke="#f59e0b"/>
  <text x="529" y="668" text-anchor="middle" class="t small" fill="#fbbf24">可选：Cross-Encoder 重排 Top-k</text>
  <text x="680" y="669" class="t small muted">这是常见工程扩展，不是论文核心架构</text>

  <circle cx="1124" cy="201" r="8" fill="#22d3ee" filter="url(#g)"/><circle cx="1124" cy="452" r="8" fill="#a78bfa" filter="url(#g)"/>
</svg>
