<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">BERT 的输入、编码器与任务头</title>
  <desc id="desc">句子对经过 token、segment 和 position embedding 相加后，进入多层双向 Transformer Encoder；预训练阶段连接 MLM 和 NSP 头，微调阶段连接分类、序列标注和抽取式问答头。</desc>
  <defs>
    <linearGradient id="encoderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .white-label { font: 700 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .white-small { font: 400 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .soft-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="62" class="title">BERT：同一个双向编码器，连接不同训练目标与任务头</text>
  <text x="70" y="92" class="subtitle">主干只产生上下文化表示；MLM、NSP、分类、序列标注和问答能力来自顶部的目标函数与输出头。</text>

  <text x="70" y="148" class="section">1　输入序列</text>
  <g filter="url(#shadow)">
    <rect x="70" y="170" width="340" height="84" rx="14" class="soft-box"/>
  </g>
  <g>
    <rect x="90" y="193" width="54" height="36" rx="7" fill="#ede9fe"/>
    <rect x="151" y="193" width="56" height="36" rx="7" fill="#dbeafe"/>
    <rect x="214" y="193" width="56" height="36" rx="7" fill="#dbeafe"/>
    <rect x="277" y="193" width="56" height="36" rx="7" fill="#ede9fe"/>
    <rect x="340" y="193" width="50" height="36" rx="7" fill="#dcfce7"/>
    <text x="117" y="216" text-anchor="middle" class="label">[CLS]</text>
    <text x="179" y="216" text-anchor="middle" class="label">句子 A</text>
    <text x="242" y="216" text-anchor="middle" class="label">…</text>
    <text x="305" y="216" text-anchor="middle" class="label">[SEP]</text>
    <text x="365" y="216" text-anchor="middle" class="label">句子 B</text>
  </g>
  <text x="70" y="280" class="small">句子 B 之后还有一个 [SEP]；单句输入可省略 B。</text>

  <text x="70" y="340" class="section">2　输入表示（逐位置相加）</text>
  <g filter="url(#shadow)">
    <rect x="70" y="364" width="340" height="190" rx="14" class="soft-box"/>
  </g>
  <rect x="94" y="390" width="126" height="43" rx="9" fill="#dbeafe"/>
  <rect x="260" y="390" width="126" height="43" rx="9" fill="#dcfce7"/>
  <rect x="177" y="468" width="126" height="43" rx="9" fill="#fef3c7"/>
  <text x="157" y="417" text-anchor="middle" class="label">Token Emb.</text>
  <text x="323" y="417" text-anchor="middle" class="label">Segment Emb.</text>
  <text x="240" y="495" text-anchor="middle" class="label">Position Emb.</text>
  <text x="240" y="457" text-anchor="middle" class="section">＋</text>
  <text x="240" y="538" text-anchor="middle" class="small">LayerNorm + Dropout 后送入主干</text>

  <path d="M410 212 C465 212 470 405 520 405" class="arrow"/>
  <path d="M410 460 C465 460 470 440 520 440" class="arrow"/>

  <text x="520" y="148" class="section">3　共享主干</text>
  <g filter="url(#shadow)">
    <rect x="520" y="170" width="370" height="384" rx="20" fill="url(#encoderGradient)"/>
  </g>
  <text x="705" y="214" text-anchor="middle" class="white-label">Transformer Encoder × L</text>
  <rect x="558" y="246" width="294" height="76" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#bfdbfe" stroke-opacity="0.55"/>
  <text x="705" y="277" text-anchor="middle" class="white-label">双向 Multi-Head Self-Attention</text>
  <text x="705" y="303" text-anchor="middle" class="white-small">只屏蔽 padding，不使用因果 mask</text>
  <rect x="558" y="344" width="294" height="70" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#bfdbfe" stroke-opacity="0.55"/>
  <text x="705" y="376" text-anchor="middle" class="white-label">Position-wise FFN</text>
  <text x="705" y="400" text-anchor="middle" class="white-small">H → 4H → H，激活函数 GELU</text>
  <rect x="558" y="436" width="294" height="78" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#bfdbfe" stroke-opacity="0.55"/>
  <text x="705" y="468" text-anchor="middle" class="white-label">残差连接 + LayerNorm</text>
  <text x="705" y="493" text-anchor="middle" class="white-small">输出每个位置的上下文化向量</text>

  <path d="M890 350 C940 350 940 246 984 246" class="arrow"/>
  <path d="M890 370 C940 370 940 467 984 467" class="arrow"/>

  <text x="984" y="148" class="section">4　任务头</text>
  <g filter="url(#shadow)">
    <rect x="984" y="170" width="346" height="214" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  </g>
  <rect x="1008" y="194" width="298" height="72" rx="10" fill="#ffedd5"/>
  <text x="1157" y="223" text-anchor="middle" class="label">MLM：选中位置 → 词表概率</text>
  <text x="1157" y="247" text-anchor="middle" class="small">恢复被扰动前的原 token</text>
  <rect x="1008" y="286" width="298" height="72" rx="10" fill="#ffedd5"/>
  <text x="1157" y="315" text-anchor="middle" class="label">NSP：[CLS] → 二分类</text>
  <text x="1157" y="339" text-anchor="middle" class="small">IsNext / NotNext</text>
  <text x="984" y="406" class="small">预训练：共享主干 + 两个联合目标</text>

  <g filter="url(#shadow)">
    <rect x="984" y="432" width="346" height="232" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  </g>
  <rect x="1008" y="456" width="298" height="51" rx="10" fill="#dcfce7"/>
  <rect x="1008" y="522" width="298" height="51" rx="10" fill="#dcfce7"/>
  <rect x="1008" y="588" width="298" height="51" rx="10" fill="#dcfce7"/>
  <text x="1157" y="487" text-anchor="middle" class="label">[CLS] → 句子 / 句对分类</text>
  <text x="1157" y="553" text-anchor="middle" class="label">每个 token → 序列标注</text>
  <text x="1157" y="619" text-anchor="middle" class="label">每个 token → 问答起止位置</text>
  <text x="984" y="687" class="small">微调：替换顶部任务头，并端到端更新全部参数</text>

  <rect x="70" y="722" width="1260" height="58" rx="12" fill="#e2e8f0"/>
  <text x="700" y="747" text-anchor="middle" class="label">关键边界：BERT 是 encoder-only 表示模型；双向指每层的注意力可同时读取左右上下文，</text>
  <text x="700" y="769" text-anchor="middle" class="small">不等于自回归生成，也不意味着 [CLS] 天然就是高质量通用句向量。</text>
</svg>
