<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">InstructGPT 的 SFT、奖励模型与 PPO 三阶段训练流水线</title>
  <desc id="desc">第一阶段用人工示范监督微调，第二阶段用人类对多个候选回答的排序训练奖励模型，第三阶段用奖励模型、参考策略和预训练数据共同约束 PPO 更新。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="stage1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .stage-title { font: 700 22px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .stage-subtitle { font: 400 14px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #e0f2fe; }
      .heading { font: 700 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 500 13px "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; fill: #334155; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .soft-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="url(#bg)"/>
  <text x="64" y="58" class="title">InstructGPT：三个阶段，解决三个不同的学习问题</text>
  <text x="64" y="88" class="subtitle">示范教会模型“怎么答”，排序教会奖励模型“哪个更好”，PPO 再让策略提高奖励且不要偏离太远。</text>

  <g transform="translate(64 128)">
    <g filter="url(#shadow)">
      <rect width="388" height="590" rx="22" class="soft-box"/>
    </g>
    <rect width="388" height="86" rx="22" fill="url(#stage1)"/>
    <rect y="64" width="388" height="22" fill="url(#stage1)"/>
    <text x="28" y="36" class="stage-title">1　监督微调 SFT</text>
    <text x="28" y="64" class="stage-subtitle">Collect demonstrations → imitate good responses</text>

    <text x="28" y="124" class="heading">数据：约 13k 个训练 prompts</text>
    <rect x="28" y="146" width="332" height="116" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="48" y="176" class="label">Prompt</text>
    <text x="48" y="201" class="small">“用两句话解释月食。”</text>
    <line x1="48" y1="218" x2="340" y2="218" stroke="#bfdbfe"/>
    <text x="48" y="244" class="label">人工示范 Response</text>

    <path d="M194 262 V300" class="arrow"/>
    <rect x="78" y="300" width="232" height="74" rx="15" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="194" y="330" text-anchor="middle" class="label">预训练 GPT-3</text>
    <text x="194" y="354" text-anchor="middle" class="small">response-only next-token loss</text>

    <path d="M194 374 V412" class="arrow"/>
    <rect x="78" y="412" width="232" height="68" rx="34" fill="#1d4ed8"/>
    <text x="194" y="441" text-anchor="middle" class="stage-title">SFT policy</text>
    <text x="194" y="465" text-anchor="middle" class="stage-subtitle">会按示范格式回答</text>

    <rect x="28" y="510" width="332" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="194" y="532" text-anchor="middle" class="mono">L_SFT = −Σ log π(y_t | x, y_&lt;t)</text>
    <text x="194" y="551" text-anchor="middle" class="small">prompt token 通常不计入监督损失</text>
  </g>

  <path d="M452 423 H500" class="arrow"/>

  <g transform="translate(506 128)">
    <g filter="url(#shadow)">
      <rect width="388" height="590" rx="22" class="soft-box"/>
    </g>
    <rect width="388" height="86" rx="22" fill="url(#stage2)"/>
    <rect y="64" width="388" height="22" fill="url(#stage2)"/>
    <text x="28" y="36" class="stage-title">2　奖励模型 RM</text>
    <text x="28" y="64" class="stage-subtitle">Rank candidates → learn a scalar preference score</text>

    <text x="28" y="124" class="heading">数据：约 33k 个训练 prompts</text>
    <rect x="28" y="146" width="150" height="48" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="103" y="176" text-anchor="middle" class="label">同一个 Prompt</text>
    <path d="M178 170 H211" class="arrow"/>
    <g transform="translate(211 126)">
      <rect x="0" y="0" width="149" height="38" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
      <rect x="0" y="46" width="149" height="38" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
      <rect x="0" y="92" width="149" height="38" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="74" y="25" text-anchor="middle" class="small">候选 A</text>
      <text x="74" y="71" text-anchor="middle" class="small">候选 B</text>
      <text x="74" y="117" text-anchor="middle" class="small">候选 C … K=4–9</text>
    </g>

    <rect x="28" y="290" width="332" height="62" rx="13" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="194" y="316" text-anchor="middle" class="label">标注员整体排序</text>
    <text x="194" y="339" text-anchor="middle" class="mono">B ≻ A ≻ C → C(K,2) 个偏好对</text>

    <path d="M194 352 V388" class="arrow"/>
    <rect x="78" y="388" width="232" height="78" rx="15" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="194" y="419" text-anchor="middle" class="label">6B Reward Model</text>
    <text x="194" y="444" text-anchor="middle" class="small">prompt + response → scalar reward</text>

    <rect x="28" y="510" width="332" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="194" y="532" text-anchor="middle" class="mono">L_RM = −log σ(r_chosen − r_rejected)</text>
    <text x="194" y="551" text-anchor="middle" class="small">学的是相对顺序，不是绝对“真理分数”</text>
  </g>

  <path d="M894 423 H942" class="arrow"/>

  <g transform="translate(948 128)">
    <g filter="url(#shadow)">
      <rect width="388" height="590" rx="22" class="soft-box"/>
    </g>
    <rect width="388" height="86" rx="22" fill="url(#stage3)"/>
    <rect y="64" width="388" height="22" fill="url(#stage3)"/>
    <text x="28" y="36" class="stage-title">3　PPO / PPO-ptx</text>
    <text x="28" y="64" class="stage-subtitle">Generate → score → constrain → update policy</text>

    <text x="28" y="124" class="heading">数据：约 31k 个无标签 prompts</text>
    <rect x="28" y="146" width="148" height="54" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="102" y="178" text-anchor="middle" class="label">SFT policy 采样</text>
    <path d="M176 173 H210" class="arrow"/>
    <rect x="210" y="146" width="150" height="54" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="285" y="178" text-anchor="middle" class="label">生成 Response</text>

    <path d="M285 200 V235" class="arrow"/>
    <rect x="28" y="235" width="100" height="68" rx="12" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="78" y="262" text-anchor="middle" class="label">RM</text>
    <text x="78" y="284" text-anchor="middle" class="small">最终分数</text>
    <rect x="144" y="235" width="100" height="68" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="194" y="262" text-anchor="middle" class="label">SFT ref</text>
    <text x="194" y="284" text-anchor="middle" class="small">token KL</text>
    <rect x="260" y="235" width="100" height="68" rx="12" fill="#dcfce7" stroke="#4ade80"/>
    <text x="310" y="262" text-anchor="middle" class="label">Value</text>
    <text x="310" y="284" text-anchor="middle" class="small">优势估计</text>

    <path d="M78 303 C78 342 194 330 194 360" class="arrow"/>
    <path d="M194 303 V360" class="arrow"/>
    <path d="M310 303 C310 342 194 330 194 360" class="arrow"/>
    <rect x="78" y="360" width="232" height="76" rx="15" fill="#ffedd5" stroke="#fb923c"/>
    <text x="194" y="390" text-anchor="middle" class="label">PPO clipped update</text>
    <text x="194" y="414" text-anchor="middle" class="small">提高奖励，限制单次策略漂移</text>

    <path d="M194 436 V470" class="arrow"/>
    <rect x="54" y="470" width="280" height="52" rx="12" fill="#ecfccb" stroke="#84cc16"/>
    <text x="194" y="493" text-anchor="middle" class="label">＋预训练 token NLL 梯度</text>
    <text x="194" y="513" text-anchor="middle" class="small">PPO-ptx：缓解 alignment tax</text>

    <rect x="28" y="536" width="332" height="34" rx="17" fill="#c2410c"/>
    <text x="194" y="559" text-anchor="middle" class="stage-title">InstructGPT policy</text>
  </g>

  <path d="M1142 736 C1142 812 700 812 700 748 C700 727 700 722 700 715" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#loopArrow)"/>
  <text x="922" y="812" text-anchor="middle" class="small">可迭代：用当前更强策略生成新候选 → 再收集排序 → 更新 RM 与策略</text>
</svg>
