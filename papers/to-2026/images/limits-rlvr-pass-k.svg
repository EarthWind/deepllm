<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">pass@k 如何把采样效率与推理覆盖率拆开</title>
  <desc id="desc">RLVR 在小 k 时优于基础模型，但基础模型曲线在大 k 时反超。右侧解释无偏估计式和 pass@k 与实用选择策略的区别。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#131a3b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121e38"/>
      <stop offset="1" stop-color="#0b152b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="50" y="58" fill="#f8fafc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="30" font-weight="700">pass@k：把“更容易采到”与“能否采到”拆开</text>
  <text x="50" y="90" fill="#a5b4fc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="16">论文关心的是有限采样预算下的能力覆盖边界，不是线上系统怎样从 k 个答案中选一个</text>

  <g transform="translate(48 124)" filter="url(#shadow)">
    <rect width="748" height="490" rx="22" fill="url(#panel)" stroke="#334155"/>
    <text x="24" y="38" fill="#e2e8f0" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">论文反复观察到的曲线形态</text>
    <text x="724" y="38" text-anchor="end" fill="#64748b" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12">概念重绘，不对应某一数据集的逐点值</text>

    <g transform="translate(78 72)">
      <rect width="622" height="322" rx="12" fill="#081326" stroke="#1e293b"/>
      <g stroke="#26334b" stroke-width="1">
        <path d="M0 64.4H622M0 128.8H622M0 193.2H622M0 257.6H622"/>
        <path d="M88.9 0V322M177.7 0V322M266.6 0V322M355.4 0V322M444.3 0V322M533.1 0V322"/>
      </g>
      <path d="M0 322H622M0 0V322" stroke="#64748b" stroke-width="1.5"/>
      <g fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12">
        <text x="-14" y="326" text-anchor="end">0</text>
        <text x="-14" y="262" text-anchor="end">20</text>
        <text x="-14" y="197" text-anchor="end">40</text>
        <text x="-14" y="133" text-anchor="end">60</text>
        <text x="-14" y="69" text-anchor="end">80</text>
        <text x="-14" y="5" text-anchor="end">100</text>
        <text x="0" y="347" text-anchor="middle">1</text>
        <text x="88.9" y="347" text-anchor="middle">2</text>
        <text x="177.7" y="347" text-anchor="middle">4</text>
        <text x="266.6" y="347" text-anchor="middle">8</text>
        <text x="355.4" y="347" text-anchor="middle">16</text>
        <text x="444.3" y="347" text-anchor="middle">32</text>
        <text x="533.1" y="347" text-anchor="middle">64</text>
        <text x="622" y="347" text-anchor="middle">128</text>
      </g>
      <text transform="translate(-54 161) rotate(-90)" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="14">可解问题覆盖率 pass@k（%）</text>

      <path d="M0 270C75 215 126 167 190 128C258 86 345 58 445 39C512 27 569 21 622 18" fill="none" stroke="#38bdf8" stroke-width="5" filter="url(#glow)"/>
      <path d="M0 155C70 127 127 108 190 91C266 70 344 61 445 56C515 53 574 51 622 50" fill="none" stroke="#4ade80" stroke-width="5" filter="url(#glow)"/>
      <g fill="#38bdf8"><circle cx="0" cy="270" r="5"/><circle cx="266.6" cy="91" r="5"/><circle cx="622" cy="18" r="5"/></g>
      <g fill="#4ade80"><circle cx="0" cy="155" r="5"/><circle cx="266.6" cy="70" r="5"/><circle cx="622" cy="50" r="5"/></g>

      <circle cx="335" cy="65" r="9" fill="#fbbf24" stroke="#fef3c7" stroke-width="2"/>
      <path d="M335 55V-12H430" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
      <rect x="430" y="-31" width="164" height="42" rx="12" fill="#422006" stroke="#f59e0b"/>
      <text x="512" y="-14" text-anchor="middle" fill="#fde68a" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12" font-weight="700">交点之后</text>
      <text x="512" y="3" text-anchor="middle" fill="#fef3c7" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12">Base 覆盖更宽</text>

      <g transform="translate(24 20)">
        <rect width="148" height="61" rx="13" fill="#0b2740" stroke="#38bdf8" stroke-opacity="0.5"/>
        <path d="M14 19H48" stroke="#38bdf8" stroke-width="4"/>
        <text x="58" y="24" fill="#bae6fd" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="13" font-weight="700">Base</text>
        <path d="M14 43H48" stroke="#4ade80" stroke-width="4"/>
        <text x="58" y="48" fill="#bbf7d0" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="13" font-weight="700">RLVR</text>
      </g>
    </g>

    <g transform="translate(24 437)">
      <rect width="330" height="35" rx="17.5" fill="#064e3b"/>
      <text x="165" y="23" text-anchor="middle" fill="#a7f3d0" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="13">小 k：RLVR 的单次采样效率更高</text>
      <rect x="370" width="330" height="35" rx="17.5" fill="#0c4a6e"/>
      <text x="535" y="23" text-anchor="middle" fill="#bae6fd" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="13">大 k：Base 暴露更多稀有正确路径</text>
    </g>
  </g>

  <g transform="translate(820 124)" filter="url(#shadow)">
    <rect width="332" height="224" rx="22" fill="url(#panel)" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="22" y="38" fill="#e2e8f0" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">低方差无偏估计</text>
    <text x="22" y="71" fill="#94a3b8" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="13">每题先采 n 条，其中 c 条正确：</text>
    <rect x="22" y="91" width="288" height="62" rx="14" fill="#0a1025" stroke="#3730a3"/>
    <text x="166" y="130" text-anchor="middle" fill="#c7d2fe" font-family="Georgia,'Times New Roman',serif" font-size="23">1 − C(n−c, k) / C(n, k)</text>
    <text x="22" y="181" fill="#a5b4fc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="13">再对所有题取平均</text>
    <text x="22" y="204" fill="#64748b" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12">论文常用 n = 128、256 或 1024</text>
  </g>

  <g transform="translate(820 370)" filter="url(#shadow)">
    <rect width="332" height="244" rx="22" fill="url(#panel)" stroke="#fbbf24" stroke-opacity="0.35"/>
    <text x="22" y="38" fill="#e2e8f0" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">它不回答什么？</text>
    <g transform="translate(22 61)">
      <circle cx="10" cy="9" r="7" fill="#fb7185"/>
      <text x="29" y="14" fill="#cbd5e1" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="14">不评价多数投票质量</text>
      <circle cx="10" cy="49" r="7" fill="#fb7185"/>
      <text x="29" y="54" fill="#cbd5e1" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="14">不保证能选中那条正确回答</text>
      <circle cx="10" cy="89" r="7" fill="#fb7185"/>
      <text x="29" y="94" fill="#cbd5e1" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="14">不等价于无限采样的理论支持集</text>
    </g>
    <rect x="22" y="178" width="288" height="46" rx="13" fill="#422006"/>
    <text x="166" y="197" text-anchor="middle" fill="#fde68a" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12" font-weight="700">它只问：有限预算内</text>
    <text x="166" y="215" text-anchor="middle" fill="#fef3c7" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12">至少出现一次正确解了吗？</text>
  </g>
</svg>
