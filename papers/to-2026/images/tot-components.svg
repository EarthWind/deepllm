<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Tree of Thoughts 四个可替换组件及三类任务的实例化</title>
  <desc id="desc">thought 切分、候选生成、状态评估和搜索策略构成 ToT；24 点、创意写作和迷你填字分别选择不同配置。</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0c6c75"/><stop offset="1" stop-color="#14558b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#163449" flood-opacity=".13"/></filter>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:36px;font-weight:750;fill:#102d40}.sub{font-size:17px;fill:#536f81}.h{font-size:21px;font-weight:700;fill:#fff}.n{font-size:28px;font-weight:800;fill:#fff}.body{font-size:17px;fill:#29485c}.body2{font-size:15px;fill:#5e7889}.task{font-size:20px;font-weight:750;fill:#17394d}.cell{font-size:17px;fill:#24485b}.tag{font-size:14px;font-weight:700}.arrow{font-size:26px;font-weight:700;fill:#88aabd}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#f4f8fa"/>
  <text class="title" x="70" y="70">ToT 不是固定提示词，而是四个可替换的设计选择</text>
  <text class="sub" x="70" y="105">同一个语言模型，换 thought 粒度、生成方式、评估方式与搜索策略，就得到不同的推理系统</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="290" height="218" rx="22" fill="#fff"/><rect x="70" y="155" width="290" height="65" rx="22" fill="url(#head)"/><rect x="70" y="198" width="290" height="22" fill="url(#head)"/>
    <circle cx="108" cy="187" r="23" fill="#38b9aa"/><text class="n" x="108" y="197" text-anchor="middle">1</text><text class="h" x="143" y="194">Thought 切分</text>
    <text class="body" x="94" y="258">选择“搜索动作”的语义粒度</text><text class="body2" x="94" y="291">太小：评估困难、深度过大</text><text class="body2" x="94" y="320">太大：多样性差、错误难回退</text><text class="body2" x="94" y="349">应是可生成且可评价的完整单元</text>
  </g>
  <text class="arrow" x="373" y="275">→</text>
  <g filter="url(#shadow)">
    <rect x="400" y="155" width="290" height="218" rx="22" fill="#fff"/><rect x="400" y="155" width="290" height="65" rx="22" fill="url(#head)"/><rect x="400" y="198" width="290" height="22" fill="url(#head)"/>
    <circle cx="438" cy="187" r="23" fill="#38b9aa"/><text class="n" x="438" y="197" text-anchor="middle">2</text><text class="h" x="473" y="194">候选生成 G</text>
    <text class="body" x="424" y="258">sample：独立采样 k 次</text><text class="body2" x="424" y="291">适合开放、丰富的 thought 空间</text><text class="body" x="424" y="326">propose：一次列出受约束动作</text><text class="body2" x="424" y="354">适合规则明确、易重复的空间</text>
  </g>
  <text class="arrow" x="703" y="275">→</text>
  <g filter="url(#shadow)">
    <rect x="730" y="155" width="290" height="218" rx="22" fill="#fff"/><rect x="730" y="155" width="290" height="65" rx="22" fill="url(#head)"/><rect x="730" y="198" width="290" height="22" fill="url(#head)"/>
    <circle cx="768" cy="187" r="23" fill="#38b9aa"/><text class="n" x="768" y="197" text-anchor="middle">3</text><text class="h" x="803" y="194">状态评估 V</text>
    <text class="body" x="754" y="258">value：逐个判断状态前景</text><text class="body2" x="754" y="291">如 sure / likely / impossible</text><text class="body" x="754" y="326">vote：让候选彼此比较</text><text class="body2" x="754" y="354">多次投票后聚合，减小偶然性</text>
  </g>
  <text class="arrow" x="1033" y="275">→</text>
  <g filter="url(#shadow)">
    <rect x="1060" y="155" width="310" height="218" rx="22" fill="#fff"/><rect x="1060" y="155" width="310" height="65" rx="22" fill="url(#head)"/><rect x="1060" y="198" width="310" height="22" fill="url(#head)"/>
    <circle cx="1098" cy="187" r="23" fill="#38b9aa"/><text class="n" x="1098" y="197" text-anchor="middle">4</text><text class="h" x="1133" y="194">搜索算法</text>
    <text class="body" x="1084" y="258">BFS：每层只保留 top-b</text><text class="body2" x="1084" y="291">适合浅层、可并行地比较候选</text><text class="body" x="1084" y="326">DFS：阈值剪枝并回溯</text><text class="body2" x="1084" y="354">适合深层、局部约束逐步显现</text>
  </g>

  <text class="title" x="70" y="444" font-size="30">论文中的三种具体配置</text>
  <rect x="70" y="475" width="1300" height="342" rx="20" fill="#fff" stroke="#cadae3" stroke-width="2"/>
  <rect x="70" y="475" width="1300" height="60" rx="20" fill="#e1eef3"/><rect x="70" y="515" width="1300" height="20" fill="#e1eef3"/>
  <path d="M290 475V817M550 475V817M810 475V817M1070 475V817M70 535H1370M70 629H1370M70 723H1370" stroke="#d5e3e9" stroke-width="2"/>
  <text class="task" x="180" y="513" text-anchor="middle">任务</text><text class="task" x="420" y="513" text-anchor="middle">Thought</text><text class="task" x="680" y="513" text-anchor="middle">生成</text><text class="task" x="940" y="513" text-anchor="middle">评估</text><text class="task" x="1220" y="513" text-anchor="middle">搜索</text>

  <rect x="95" y="561" width="170" height="42" rx="21" fill="#daf4ee"/><text class="task" x="180" y="589" text-anchor="middle">24 点</text>
  <text class="cell" x="420" y="578" text-anchor="middle">一步中间算式</text><text class="body2" x="420" y="603" text-anchor="middle">合并两个剩余数字</text>
  <text class="cell" x="680" y="590" text-anchor="middle">propose</text><text class="cell" x="940" y="577" text-anchor="middle">value × 3</text><text class="body2" x="940" y="602" text-anchor="middle">sure / likely / impossible</text><text class="cell" x="1220" y="577" text-anchor="middle">BFS，b = 5</text><text class="body2" x="1220" y="602" text-anchor="middle">每层贪心保留 top-5</text>

  <rect x="95" y="655" width="170" height="42" rx="21" fill="#e5edfb"/><text class="task" x="180" y="683" text-anchor="middle">创意写作</text>
  <text class="cell" x="420" y="672" text-anchor="middle">完整写作计划</text><text class="body2" x="420" y="697" text-anchor="middle">再据计划生成文章</text>
  <text class="cell" x="680" y="684" text-anchor="middle">sample × 5</text><text class="cell" x="940" y="671" text-anchor="middle">vote × 5</text><text class="body2" x="940" y="696" text-anchor="middle">候选之间相对比较</text><text class="cell" x="1220" y="671" text-anchor="middle">BFS，b = 1</text><text class="body2" x="1220" y="696" text-anchor="middle">计划与成文各选一个</text>

  <rect x="95" y="749" width="170" height="42" rx="21" fill="#f8e8df"/><text class="task" x="180" y="777" text-anchor="middle">5×5 填字</text>
  <text class="cell" x="420" y="766" text-anchor="middle">一个单词</text><text class="body2" x="420" y="791" text-anchor="middle">填入最有希望的线索</text>
  <text class="cell" x="680" y="778" text-anchor="middle">propose × 5</text><text class="cell" x="940" y="765" text-anchor="middle">value</text><text class="body2" x="940" y="790" text-anchor="middle">检查剩余线索可行性</text><text class="cell" x="1220" y="765" text-anchor="middle">DFS ≤ 100 步</text><text class="body2" x="1220" y="790" text-anchor="middle">阈值剪枝 + 回溯</text>

  <rect x="70" y="846" width="1300" height="34" rx="17" fill="#dceff0"/><text class="tag" x="720" y="869" text-anchor="middle" fill="#28636a">关键：任务定义的是“什么状态值得继续”，搜索算法只负责如何分配推理预算</text>
</svg>
