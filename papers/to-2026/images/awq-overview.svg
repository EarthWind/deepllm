<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171a38"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#3478ff"/><stop offset="1" stop-color="#45c9ff"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#20ad91"/><stop offset="1" stop-color="#4ce0a2"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#89a2c8"/></marker>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#edf4ff}.h{font-size:34px;font-weight:800}.m{font-size:23px;font-weight:700}.s{font-size:18px}.muted{fill:#94a8c8}.code{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <text x="66" y="66" class="h">AWQ 全流程：用 Activation 找显著通道，用等价缩放保护，再统一低比特部署</text>
  <text x="66" y="104" class="s muted">离线 calibration/search 不更新参数；在线 runtime 仍是规整 W4A16，而不是 1% FP16 混合精度</text>

  <g transform="translate(65 150)">
    <rect width="285" height="310" rx="23" fill="#0d2038" stroke="#38577d"/>
    <circle cx="45" cy="45" r="23" fill="#263f67"/><text x="45" y="53" text-anchor="middle" class="m">1</text>
    <text x="82" y="52" class="m">收集 Activation</text>
    <text x="26" y="87" class="s muted">少量无标签 Pile 文本前向</text>
    <g transform="translate(29 120)">
      <rect width="227" height="128" rx="15" fill="#132b49" stroke="#446891"/>
      <g fill="#4387ff"><rect x="20" y="20" width="16" height="82" rx="5"/><rect x="51" y="67" width="16" height="35" rx="5"/><rect x="82" y="44" width="16" height="58" rx="5"/><rect x="113" y="10" width="16" height="92" rx="5"/><rect x="144" y="73" width="16" height="29" rx="5"/><rect x="175" y="52" width="16" height="50" rx="5"/></g>
      <rect x="113" y="10" width="16" height="92" rx="5" fill="#ffbe55"/>
      <text x="113" y="121" text-anchor="middle" class="s muted">input channels</text>
    </g>
    <text x="142" y="286" text-anchor="middle" class="s code">sₓ = mean(|X|)</text>
  </g>

  <path d="M365 305H412" stroke="#89a2c8" stroke-width="4" marker-end="url(#arr)"/>

  <g transform="translate(425 150)">
    <rect width="285" height="310" rx="23" fill="#10253c" stroke="#3ac89f"/>
    <circle cx="45" cy="45" r="23" fill="#17493f"/><text x="45" y="53" text-anchor="middle" class="m">2</text>
    <text x="82" y="52" class="m">搜索通道缩放</text>
    <text x="26" y="87" class="s muted">20 个 α 候选，以输出 MSE 选优</text>
    <rect x="28" y="117" width="229" height="73" rx="15" fill="#123a35" stroke="#42d3a6"/>
    <text x="142" y="149" text-anchor="middle" class="m code">s = sₓᵅ</text>
    <text x="142" y="177" text-anchor="middle" class="s muted">α ∈ {0, .05, …, .95}</text>
    <path d="M42 258 C82 230 112 278 145 223 S205 214 243 202" fill="none" stroke="#ffbd56" stroke-width="4"/>
    <g fill="#ffbd56"><circle cx="42" cy="258" r="5"/><circle cx="145" cy="223" r="5"/><circle cx="243" cy="202" r="5"/></g>
    <text x="142" y="286" text-anchor="middle" class="s code">argmin ‖Ŷ(α) − Y‖²</text>
  </g>

  <path d="M725 305H772" stroke="#89a2c8" stroke-width="4" marker-end="url(#arr)"/>

  <g transform="translate(785 150)">
    <rect width="285" height="310" rx="23" fill="#10253c" stroke="#4a72ae"/>
    <circle cx="45" cy="45" r="23" fill="#263f67"/><text x="45" y="53" text-anchor="middle" class="m">3</text>
    <text x="82" y="52" class="m">等价变换与量化</text>
    <text x="26" y="87" class="s muted">先放大权重列，再反向缩放输入</text>
    <g transform="translate(24 120)">
      <rect width="104" height="55" rx="13" fill="url(#blue)"/><text x="52" y="35" text-anchor="middle" class="m code">W·s</text>
      <rect x="133" width="104" height="55" rx="13" fill="#24395a"/><text x="185" y="35" text-anchor="middle" class="m code">X/s</text>
      <text x="119" y="94" text-anchor="middle" class="m code">(W·s)(X/s)=WX</text>
      <rect y="122" width="237" height="55" rx="13" fill="#3a2f24" stroke="#db9850"/><text x="119" y="157" text-anchor="middle" class="m code">Q₄(W·s)</text>
    </g>
  </g>

  <path d="M1085 305H1132" stroke="#89a2c8" stroke-width="4" marker-end="url(#arr)"/>

  <g transform="translate(1145 150)">
    <rect width="190" height="310" rx="23" fill="#102b3b" stroke="#3bd8ae"/>
    <circle cx="42" cy="45" r="23" fill="#17493f"/><text x="42" y="53" text-anchor="middle" class="m">4</text>
    <text x="76" y="52" class="m">打包部署</text>
    <g transform="translate(29 112)">
      <g fill="url(#green)"><rect width="36" height="36" rx="7"/><rect x="43" width="36" height="36" rx="7"/><rect x="86" width="36" height="36" rx="7"/><rect y="43" width="36" height="36" rx="7"/><rect x="43" y="43" width="36" height="36" rx="7"/><rect x="86" y="43" width="36" height="36" rx="7"/></g>
      <text x="61" y="112" text-anchor="middle" class="m code">INT4</text>
      <text x="61" y="143" text-anchor="middle" class="s muted">g128</text>
    </g>
    <text x="95" y="286" text-anchor="middle" class="s">TinyChat / runtime</text>
  </g>

  <g transform="translate(65 510)">
    <rect width="1270" height="280" rx="24" fill="#0d2038" stroke="#2d486b"/>
    <text x="28" y="48" class="m">真正改变了什么？</text>
    <g transform="translate(28 82)">
      <rect width="375" height="145" rx="18" fill="#122944"/>
      <text x="22" y="38" class="m" fill="#74b5ff">量化前的数学函数</text>
      <text x="22" y="75" class="s">不变：W·X = (W·s)·(X/s)</text>
      <text x="22" y="108" class="s muted">缩放可吸收到 LayerNorm / 前一线性层</text>
    </g>
    <g transform="translate(447 82)">
      <rect width="375" height="145" rx="18" fill="#12352f"/>
      <text x="22" y="38" class="m" fill="#6ee8bd">量化后的误差分配</text>
      <text x="22" y="75" class="s">改变：显著通道获得更细的有效步长</text>
      <text x="22" y="108" class="s muted">代价由低 activation 通道分担</text>
    </g>
    <g transform="translate(866 82)">
      <rect width="375" height="145" rx="18" fill="#352a21"/>
      <text x="22" y="38" class="m" fill="#ffd087">部署数据结构</text>
      <text x="22" y="75" class="s">仍是统一 W3/W4 codes + scale/zero</text>
      <text x="22" y="108" class="s muted">没有稀疏索引和逐权重混合精度</text>
    </g>
  </g>
  <text x="700" y="855" text-anchor="middle" class="s muted">AWQ = activation-aware 搜索算法　＋　hardware-friendly 等价变换　＋　低比特 runtime 协同设计</text>
</svg>
