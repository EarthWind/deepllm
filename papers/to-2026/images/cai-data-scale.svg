<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Constitutional AI 论文各训练阶段的数据规模</title>
  <desc id="desc">监督学习阶段包括 182831 条红队提示和 135296 条有用性提示；前者每条生成四个批判修订对，后者每条采样两个回答。偏好模型使用 135296 条人类有用性比较和 182831 条 AI 无害性比较。强化学习提示池还增加了 491142 条模型生成红队提示和 474300 条模型生成有用性提示。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .stage { font: 700 20px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .heading { font: 700 17px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .number { font: 700 28px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 400 12px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .white { fill: #fff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <text x="58" y="54" class="title">数据规模：prompt、sample 与 comparison 不是同一个计数单位</text>
  <text x="58" y="84" class="subtitle">下图严格沿用论文第 3.2 与 4.2 节的口径；“×4 / ×2”表示每条 prompt 的采样数，不能直接当作独立 prompt 数。</text>

  <g transform="translate(58 124)" filter="url(#shadow)">
    <rect width="390" height="540" rx="24" fill="#fff" stroke="#bfdbfe"/>
    <rect width="390" height="62" rx="24" fill="#2563eb"/>
    <rect y="40" width="390" height="22" fill="#2563eb"/>
    <text x="24" y="40" class="stage">1　SL-CAI 数据生成</text>

    <text x="24" y="102" class="heading">无害性：red-team prompts</text>
    <rect x="24" y="122" width="342" height="72" rx="14" fill="#fff7ed" stroke="#fb923c"/>
    <circle cx="49" cy="148" r="8" fill="#f97316"/>
    <text x="68" y="153" class="label">人类编写</text>
    <text x="342" y="155" text-anchor="end" class="number">42,496</text>
    <rect x="24" y="206" width="342" height="72" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
    <circle cx="49" cy="232" r="8" fill="#8b5cf6"/>
    <text x="68" y="237" class="label">模型生成</text>
    <text x="342" y="239" text-anchor="end" class="number">140,335</text>
    <rect x="24" y="290" width="342" height="70" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="46" y="318" class="label">合计 prompts</text>
    <text x="342" y="328" text-anchor="end" class="number">182,831</text>
    <text x="195" y="348" text-anchor="middle" class="small">每条采样 4 个 critique–revision pairs</text>

    <text x="24" y="404" class="heading">有用性：human-written prompts</text>
    <rect x="24" y="424" width="342" height="80" rx="14" fill="#ecfdf5" stroke="#34d399"/>
    <text x="46" y="454" class="label">Helpful prompts</text>
    <text x="342" y="462" text-anchor="end" class="number">135,296</text>
    <text x="195" y="489" text-anchor="middle" class="small">每条从 Helpful RLHF 采样 2 个 responses</text>
  </g>

  <path d="M448 394 H493" class="arrow"/>

  <g transform="translate(506 124)" filter="url(#shadow)">
    <rect width="390" height="540" rx="24" fill="#fff" stroke="#c4b5fd"/>
    <rect width="390" height="62" rx="24" fill="#7c3aed"/>
    <rect y="40" width="390" height="22" fill="#7c3aed"/>
    <text x="24" y="40" class="stage">2　Preference Model 数据</text>

    <text x="24" y="106" class="heading">混合两个监督来源</text>
    <rect x="24" y="130" width="342" height="116" rx="16" fill="#eff6ff" stroke="#60a5fa"/>
    <circle cx="49" cy="159" r="8" fill="#2563eb"/>
    <text x="68" y="164" class="label">Human Feedback</text>
    <text x="342" y="173" text-anchor="end" class="number">135,296</text>
    <text x="49" y="207" class="small">helpfulness comparisons</text>
    <text x="49" y="229" class="tiny">人类选择更有帮助的回答</text>

    <rect x="24" y="266" width="342" height="116" rx="16" fill="#f5f3ff" stroke="#a78bfa"/>
    <circle cx="49" cy="295" r="8" fill="#8b5cf6"/>
    <text x="68" y="300" class="label">AI Feedback</text>
    <text x="342" y="309" text-anchor="end" class="number">182,831</text>
    <text x="49" y="343" class="small">harmlessness comparisons</text>
    <text x="49" y="365" class="tiny">每条 SL-CAI red-team prompt 生成 1 个比较</text>

    <rect x="24" y="420" width="342" height="84" rx="15" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="195" y="450" text-anchor="middle" class="label">Hybrid Preference Model</text>
    <text x="195" y="476" text-anchor="middle" class="small">AI 替换 harmlessness labels</text>
    <text x="195" y="496" text-anchor="middle" class="tiny">而不是替换全部人类反馈</text>
  </g>

  <path d="M896 394 H941" class="arrow"/>

  <g transform="translate(954 124)" filter="url(#shadow)">
    <rect width="388" height="540" rx="24" fill="#fff" stroke="#a7f3d0"/>
    <rect width="388" height="62" rx="24" fill="#059669"/>
    <rect y="40" width="388" height="22" fill="#059669"/>
    <text x="24" y="40" class="stage">3　RL prompt pool</text>

    <text x="24" y="106" class="heading">所有 RL run 使用同一提示集合</text>
    <rect x="24" y="130" width="340" height="80" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="194" y="160" text-anchor="middle" class="label">包含 SL-CAI 阶段的全部 prompts</text>
    <text x="194" y="185" text-anchor="middle" class="small">human + model，helpful + red-team</text>
    <text x="194" y="244" text-anchor="middle" class="heading">再增加模型生成 prompts</text>

    <rect x="24" y="268" width="340" height="92" rx="15" fill="#fff7ed" stroke="#fb923c"/>
    <text x="46" y="298" class="label">Red-team</text>
    <text x="340" y="309" text-anchor="end" class="number">491,142</text>
    <text x="46" y="339" class="small">用于持续覆盖有害请求分布</text>

    <rect x="24" y="380" width="340" height="92" rx="15" fill="#ecfdf5" stroke="#34d399"/>
    <text x="46" y="410" class="label">Helpfulness</text>
    <text x="340" y="421" text-anchor="end" class="number">474,300</text>
    <text x="46" y="451" class="small">用于维持普通任务的有用性</text>

    <text x="194" y="505" text-anchor="middle" class="tiny">注意：这些是训练 prompts 的组成，</text>
    <text x="194" y="525" text-anchor="middle" class="tiny">不能和 PM comparisons 直接相加比较。</text>
  </g>

  <g transform="translate(58 706)">
    <circle cx="8" cy="0" r="7" fill="#f97316"/><text x="24" y="5" class="small">人类红队 / 人类编写</text>
    <circle cx="198" cy="0" r="7" fill="#8b5cf6"/><text x="214" y="5" class="small">模型生成 / AI 反馈</text>
    <circle cx="406" cy="0" r="7" fill="#2563eb"/><text x="422" y="5" class="small">人类偏好标签</text>
    <circle cx="596" cy="0" r="7" fill="#10b981"/><text x="612" y="5" class="small">有用性与最终策略训练</text>
  </g>
</svg>
