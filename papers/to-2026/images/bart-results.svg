<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">BART 受控预训练目标比较与主要下游结果</title>
  <desc id="desc">左上比较六种 BART 噪声在 CNN DailyMail 上的 perplexity，右上比较 BART 与此前最佳模型在 XSum 的三项 ROUGE，底部列出 SQuAD、MNLI、ELI5、ConvAI2 和罗马尼亚语到英语的结果。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter><style>.title{font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.panel{font:700 19px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 13.5px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.tiny{font:500 11.5px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}.value{font:700 13px "JetBrains Mono",Consolas,monospace;fill:#1d4ed8}.big{font:700 25px "JetBrains Mono",Consolas,monospace;fill:#1d4ed8}.axis{stroke:#94a3b8;stroke-width:1.3}.grid{stroke:#e2e8f0;stroke-width:1}</style></defs>
  <rect width="1400" height="930" fill="#f8fafc"/><text x="70" y="58" class="title">实验告诉我们的不是“噪声越多越好”，而是局部缺失 + 自回归重建最稳</text><text x="70" y="90" class="subtitle">左图为相同 base 规模、数据、训练步数与微调流程的受控比较（PPL 越低越好）；右图为 large 模型 XSum 测试集。</text>
  <g filter="url(#shadow)"><rect x="55" y="125" width="630" height="490" rx="18" fill="#fff" stroke="#93c5fd"/></g><text x="85" y="164" class="panel">CNN/DailyMail PPL：六种 BART 噪声</text><text x="85" y="190" class="small">Table 1；所有 base 变体训练 1M 步，Books + Wikipedia</text>
  <g class="grid"><line x1="300" y1="230" x2="300" y2="545"/><line x1="355" y1="230" x2="355" y2="545"/><line x1="410" y1="230" x2="410" y2="545"/><line x1="465" y1="230" x2="465" y2="545"/><line x1="520" y1="230" x2="520" y2="545"/><line x1="575" y1="230" x2="575" y2="545"/><line x1="630" y1="230" x2="630" y2="545"/></g>
  <g class="tiny" text-anchor="middle"><text x="300" y="565">5</text><text x="355" y="565">6</text><text x="410" y="565">7</text><text x="465" y="565">8</text><text x="520" y="565">9</text><text x="575" y="565">10</text><text x="630" y="565">11</text></g>
  <g class="label"><text x="85" y="254">Token masking</text><text x="85" y="304">Token deletion</text><text x="85" y="354">Text infilling</text><text x="85" y="404">Document rotation</text><text x="85" y="454">Sentence shuffling</text><text x="85" y="504">Infilling + shuffle</text></g>
  <g><rect x="300" y="235" width="60.5" height="25" rx="5" fill="#93c5fd"/><rect x="300" y="285" width="47.9" height="25" rx="5" fill="#60a5fa"/><rect x="300" y="335" width="45.7" height="25" rx="5" fill="#60a5fa"/><rect x="300" y="385" width="307.5" height="25" rx="5" fill="#fda4af"/><rect x="300" y="435" width="159.0" height="25" rx="5" fill="#c4b5fd"/><rect x="300" y="485" width="22.6" height="25" rx="5" fill="#2563eb"/></g>
  <g class="value"><text x="370" y="253">6.10</text><text x="357" y="303">5.87</text><text x="355" y="353">5.83</text><text x="617" y="403">10.59</text><text x="469" y="453">7.89</text><text x="332" y="503">5.41</text></g>
  <text x="85" y="590" class="tiny">横轴从 5 开始以放大受控差异；数值标签给出完整 PPL，不能把条长当作从零起算的绝对比例。</text>

  <g filter="url(#shadow)"><rect x="720" y="125" width="625" height="490" rx="18" fill="#fff" stroke="#fbbf24"/></g><text x="750" y="164" class="panel">XSum ROUGE：更抽象的摘要任务</text><text x="750" y="190" class="small">BERTSUMEXTABS（此前最佳） vs BART；三项均从 0 起轴</text>
  <g class="grid"><line x1="790" y1="500" x2="1295" y2="500"/><line x1="790" y1="440" x2="1295" y2="440"/><line x1="790" y1="380" x2="1295" y2="380"/><line x1="790" y1="320" x2="1295" y2="320"/><line x1="790" y1="260" x2="1295" y2="260"/><line x1="790" y1="200" x2="1295" y2="200"/></g><line x1="790" y1="200" x2="790" y2="500" class="axis"/><line x1="790" y1="500" x2="1295" y2="500" class="axis"/><g class="tiny" text-anchor="end"><text x="780" y="504">0</text><text x="780" y="444">10</text><text x="780" y="384">20</text><text x="780" y="324">30</text><text x="780" y="264">40</text><text x="780" y="204">50</text></g>
  <g><rect x="860" y="267.1" width="48" height="232.9" fill="#cbd5e1"/><rect x="914" y="229.2" width="48" height="270.8" fill="#f59e0b"/><rect x="1015" y="401" width="48" height="99" fill="#cbd5e1"/><rect x="1069" y="366.4" width="48" height="133.6" fill="#f59e0b"/><rect x="1170" y="312.4" width="48" height="187.6" fill="#cbd5e1"/><rect x="1224" y="276.5" width="48" height="223.5" fill="#f59e0b"/></g>
  <g class="value" text-anchor="middle"><text x="884" y="256">38.81</text><text x="938" y="218" fill="#b45309">45.14</text><text x="1039" y="390">16.50</text><text x="1093" y="355" fill="#b45309">22.27</text><text x="1194" y="301">31.27</text><text x="1248" y="265" fill="#b45309">37.25</text></g><g class="label" text-anchor="middle"><text x="911" y="532">ROUGE-1</text><text x="1066" y="532">ROUGE-2</text><text x="1221" y="532">ROUGE-L</text></g><rect x="910" y="565" width="18" height="12" fill="#cbd5e1"/><text x="936" y="576" class="tiny">BERTSUMEXTABS</text><rect x="1085" y="565" width="18" height="12" fill="#f59e0b"/><text x="1111" y="576" class="tiny">BART</text>

  <g filter="url(#shadow)"><rect x="55" y="650" width="250" height="215" rx="16" fill="#fff" stroke="#93c5fd"/></g><text x="80" y="687" class="panel">理解任务</text><text x="80" y="718" class="small">SQuAD 1.1 F1</text><text x="280" y="720" text-anchor="end" class="big">94.6</text><text x="80" y="754" class="small">SQuAD 2.0 F1</text><text x="280" y="756" text-anchor="end" class="big">89.2</text><text x="80" y="790" class="small">MNLI m/mm</text><text x="280" y="792" text-anchor="end" class="value">89.9 / 90.1</text><text x="80" y="832" class="tiny">与同资源 RoBERTa 大体相当</text>
  <g filter="url(#shadow)"><rect x="325" y="650" width="250" height="215" rx="16" fill="#fff" stroke="#fbbf24"/></g><text x="350" y="687" class="panel">长答案 ELI5</text><text x="350" y="723" class="small">ROUGE-1 / 2 / L</text><text x="550" y="758" text-anchor="end" class="big" fill="#b45309">30.6 / 6.2</text><text x="550" y="788" text-anchor="end" class="big" fill="#b45309">/ 24.3</text><text x="350" y="832" class="tiny">ROUGE-L 比此前最佳高 1.2</text>
  <g filter="url(#shadow)"><rect x="595" y="650" width="250" height="215" rx="16" fill="#fff" stroke="#86efac"/></g><text x="620" y="687" class="panel">对话 ConvAI2</text><text x="620" y="723" class="small">验证 F1</text><text x="820" y="725" text-anchor="end" class="big" fill="#047857">20.72</text><text x="620" y="766" class="small">验证 PPL ↓</text><text x="820" y="768" text-anchor="end" class="big" fill="#047857">11.85</text><text x="620" y="832" class="tiny">此前系统：19.09 / 17.51</text>
  <g filter="url(#shadow)"><rect x="865" y="650" width="480" height="215" rx="16" fill="#fff" stroke="#c4b5fd"/></g><text x="890" y="687" class="panel">WMT16 罗马尼亚语 → 英语（BLEU）</text><g><rect x="890" y="718" width="405" height="30" rx="6" fill="#e2e8f0"/><rect x="890" y="763" width="399" height="30" rx="6" fill="#c4b5fd"/><rect x="890" y="808" width="418" height="30" rx="6" fill="#8b5cf6"/></g><g class="label"><text x="900" y="738">Baseline</text><text x="900" y="783">Fixed BART</text><text x="900" y="828" fill="#fff">Tuned BART</text></g><g class="value" text-anchor="end"><text x="1285" y="738">36.80</text><text x="1280" y="783">36.29</text><text x="1298" y="828" fill="#fff">37.96</text></g>
  <text x="55" y="905" class="tiny">来源：Lewis et al. (2019), Tables 1–6。任务、指标和数据划分不同，底部卡片只用于逐项报告，不用于跨任务比较；PPL 越低越好，其余所列指标越高越好。</text>
</svg>
