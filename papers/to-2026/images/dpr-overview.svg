<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DPR 双编码器与开放域问答数据流</title>
  <desc id="desc">段落编码器离线生成向量索引，问题编码器在线生成查询向量，以最大内积搜索召回段落，再由 Reader 抽取答案。</desc>
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f59e0b"/></marker>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e7eefb}.h1{font-size:30px;font-weight:800}.h2{font-size:23px;font-weight:800}.body{font-size:17px}.small{font-size:15px}.tiny{font-size:13px}.muted{fill:#91a4c6}.formula{font-family:"JetBrains Mono",Consolas,monospace;font-size:18px}.card{fill:#0b182b;stroke:#2b4163;stroke-width:1.5}.cyan{fill:#102a3c;stroke:#22d3ee;stroke-width:1.7}.amber{fill:#302719;stroke:#f59e0b;stroke-width:1.7}.neutral{fill:#122039;stroke:#536985;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#081321"/>
  <text x="48" y="58" class="t h1">DPR：把“找资料”和“读资料”拆成两次计算</text>
  <text x="48" y="91" class="t body muted">段落塔离线处理 2,100 万 passages；问题塔在线只编码当前查询</text>

  <g transform="translate(38 126)">
    <rect width="1124" height="254" rx="22" class="card"/>
    <rect x="18" y="18" width="90" height="29" rx="14" fill="#332715" stroke="#f59e0b"/><text x="63" y="38" text-anchor="middle" class="t tiny" fill="#fbbf24">OFFLINE</text>
    <text x="22" y="82" class="t h2">段落只编码一次</text>
    <text x="22" y="109" class="t small muted">Wikipedia → 固定长度 passages → 向量索引</text>
    <g transform="translate(235 48)">
      <rect x="0" y="18" width="155" height="126" rx="15" class="neutral"/>
      <text x="77" y="49" text-anchor="middle" class="t body">标题 + 段落</text>
      <g transform="translate(20 66)"><rect width="115" height="12" rx="4" fill="#63738b"/><rect y="22" width="96" height="10" rx="4" fill="#3c506d"/><rect y="42" width="107" height="10" rx="4" fill="#3c506d"/></g>
      <path d="M165 81H219" stroke="#f59e0b" stroke-width="3" marker-end="url(#aa)"/>
      <rect x="231" y="0" width="173" height="162" rx="16" class="amber"/>
      <text x="317" y="42" text-anchor="middle" class="t h2">BERT P</text>
      <text x="317" y="72" text-anchor="middle" class="t small muted">Passage Encoder</text>
      <rect x="272" y="96" width="90" height="38" rx="19" fill="#4b3818" stroke="#fbbf24"/><text x="317" y="121" text-anchor="middle" class="t body">[CLS] p</text>
      <path d="M414 81H468" stroke="#f59e0b" stroke-width="3" marker-end="url(#aa)"/>
      <rect x="480" y="0" width="180" height="162" rx="16" class="amber"/>
      <text x="570" y="36" text-anchor="middle" class="t h2">FAISS index</text>
      <text x="570" y="64" text-anchor="middle" class="t small muted">21,015,324 × 768</text>
      <g transform="translate(516 83)"><circle cx="8" cy="20" r="6" fill="#f59e0b"/><circle cx="41" cy="4" r="5" fill="#8a6b2a"/><circle cx="70" cy="28" r="6" fill="#fbbf24"/><circle cx="102" cy="8" r="5" fill="#8a6b2a"/><circle cx="118" cy="49" r="6" fill="#f59e0b"/><circle cx="55" cy="59" r="5" fill="#8a6b2a"/><path d="M8 20L41 4L70 28L102 8M70 28L118 49M70 28L55 59" stroke="#8a6b2a"/></g>
      <text x="691" y="82" class="t formula" fill="#fbbf24">E_P(p)</text>
    </g>
  </g>

  <g transform="translate(38 406)">
    <rect width="1124" height="292" rx="22" class="card"/>
    <rect x="18" y="18" width="90" height="29" rx="14" fill="#0e3040" stroke="#22d3ee"/><text x="63" y="38" text-anchor="middle" class="t tiny" fill="#67e8f9">ONLINE</text>
    <text x="22" y="82" class="t h2">每个问题编码一次，再检索 Top-k</text>
    <g transform="translate(190 82)">
      <rect x="0" y="36" width="135" height="78" rx="14" class="cyan"/><text x="67" y="68" text-anchor="middle" class="t body">问题 q</text><text x="67" y="95" text-anchor="middle" class="t small muted">自然语言查询</text>
      <path d="M145 75H191" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
      <rect x="203" y="0" width="170" height="150" rx="16" class="cyan"/>
      <text x="288" y="42" text-anchor="middle" class="t h2">BERT Q</text><text x="288" y="71" text-anchor="middle" class="t small muted">Question Encoder</text>
      <rect x="243" y="94" width="90" height="36" rx="18" fill="#123b4d" stroke="#67e8f9"/><text x="288" y="118" text-anchor="middle" class="t body">[CLS] q</text>
      <path d="M383 75H429" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
      <rect x="441" y="0" width="174" height="150" rx="16" class="cyan"/>
      <text x="528" y="39" text-anchor="middle" class="t h2">MIPS</text><text x="528" y="68" text-anchor="middle" class="t small muted">最大内积 Top-k</text>
      <text x="528" y="105" text-anchor="middle" class="t formula" fill="#67e8f9">qᵀp</text><text x="528" y="130" text-anchor="middle" class="t tiny muted">k ≈ 20–100</text>
      <path d="M625 75H671" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
      <rect x="683" y="0" width="185" height="150" rx="16" class="neutral"/>
      <text x="775" y="37" text-anchor="middle" class="t h2">Reader</text><text x="775" y="66" text-anchor="middle" class="t small muted">段落选择 + span</text>
      <rect x="706" y="89" width="138" height="13" rx="5" fill="#4d607b"/><rect x="706" y="111" width="103" height="14" rx="5" fill="#f59e0b"/><text x="775" y="143" text-anchor="middle" class="t tiny muted">最终答案</text>
    </g>
    <rect x="206" y="247" width="720" height="28" rx="14" fill="#111f35" stroke="#354a6b"/>
    <text x="566" y="267" text-anchor="middle" class="t small"><tspan fill="#67e8f9">E_Q 与 E_P 参数独立</tspan>　·　维度同为 768　·　检索打分可分解</text>
  </g>

  <text x="600" y="733" text-anchor="middle" class="t small muted">Retriever 的任务是让答案进入候选集；Reader 的任务是在候选中定位答案</text>
</svg>
