<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Gemma 3 性能与长上下文结果</title>
  <desc id="desc">左侧比较 Gemma 3 4B IT 与 Gemma 2 27B IT 的四项指标，右侧显示 12B 与 27B IT 在 32K 和 128K 的长上下文得分变化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#17152f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35d7dd"/><stop offset="1" stop-color="#9d7cff"/></linearGradient>
    <style>
      .title{font:700 31px Inter,"Noto Sans SC",sans-serif;fill:#f7f9ff}.sub{font:400 15px Inter,"Noto Sans SC",sans-serif;fill:#9aa8c5}
      .head{font:700 20px Inter,"Noto Sans SC",sans-serif;fill:#f5f8ff}.body{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#bac5dd}
      .small{font:400 12px Inter,"Noto Sans SC",sans-serif;fill:#8391ad}.num{font:800 14px Inter,sans-serif;fill:#fff}.card{fill:#111f39;stroke:#344866;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1400" height="900" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" class="title">“小模型追上大模型”与“支持 128K”都要逐指标阅读</text>
  <text x="60" y="94" class="sub">同一论文评测协议；分数只在各自 benchmark 内比较，不做跨指标平均</text>

  <rect x="54" y="132" width="646" height="690" rx="22" class="card"/>
  <text x="82" y="174" class="head">Gemma 3 4B IT vs Gemma 2 27B IT</text>
  <text x="82" y="200" class="small">新 4B 在数学与 grounded factuality 更强，但代码与 MMLU-Pro 尚未追平。</text>
  <g transform="translate(82 235)">
    <rect width="16" height="16" rx="4" fill="#5b6982"/><text x="26" y="13" class="small">Gemma 2 27B IT</text>
    <rect x="170" width="16" height="16" rx="4" fill="url(#accent)"/><text x="196" y="13" class="small">Gemma 3 4B IT</text>
  </g>
  <g transform="translate(82 288)">
    <text x="0" y="17" class="body">MATH</text><rect x="124" y="0" width="334" height="22" rx="6" fill="#536078"/><rect x="124" y="30" width="454" height="22" rx="6" fill="url(#accent)"/><text x="466" y="17" class="num">55.6</text><text x="586" y="47" class="num">75.6</text>
    <text x="0" y="117" class="body">FACTS</text><rect x="124" y="100" width="374" height="22" rx="6" fill="#536078"/><rect x="124" y="130" width="421" height="22" rx="6" fill="url(#accent)"/><text x="506" y="117" class="num">62.4</text><text x="553" y="147" class="num">70.1</text>
    <text x="0" y="217" class="body">MMLU-Pro</text><rect x="124" y="200" width="341" height="22" rx="6" fill="#536078"/><rect x="124" y="230" width="262" height="22" rx="6" fill="url(#accent)"/><text x="473" y="217" class="num">56.9</text><text x="394" y="247" class="num">43.6</text>
    <text x="0" y="317" class="body">LiveCode</text><rect x="124" y="300" width="122" height="22" rx="6" fill="#536078"/><rect x="124" y="330" width="76" height="22" rx="6" fill="url(#accent)"/><text x="254" y="317" class="num">20.4</text><text x="208" y="347" class="num">12.6</text>
  </g>
  <rect x="82" y="690" width="590" height="96" rx="14" fill="#172943" stroke="#435978"/>
  <text x="104" y="721" class="body">结论边界</text>
  <text x="104" y="748" class="small">“4B competitive with 27B”是跨一组 benchmark 的整体描述，</text>
  <text x="104" y="770" class="small">不是每项都超过，也不能脱离 IT / zero-shot 评测协议。</text>

  <rect x="728" y="132" width="618" height="690" rx="22" class="card"/>
  <text x="756" y="174" class="head">长上下文：32K → 128K</text>
  <text x="756" y="200" class="small">Gemma 3 IT；较长窗口可用，但 RULER 的质量下降明显。</text>
  <g transform="translate(756 246)">
    <text x="154" y="0" text-anchor="middle" class="small">32K</text><text x="490" y="0" text-anchor="middle" class="small">128K</text>
    <line x1="154" y1="16" x2="154" y2="430" stroke="#364862"/><line x1="490" y1="16" x2="490" y2="430" stroke="#364862"/>

    <text x="0" y="58" class="body">RULER 12B</text><circle cx="154" cy="52" r="9" fill="#36d7dd"/><circle cx="490" cy="150" r="9" fill="#a17cff"/><line x1="163" y1="55" x2="481" y2="147" stroke="#708ff1" stroke-width="4"/><text x="173" y="42" class="num">80.3</text><text x="510" y="154" class="num">57.1</text>
    <text x="0" y="178" class="body">RULER 27B</text><circle cx="154" cy="104" r="9" fill="#36d7dd"/><circle cx="490" cy="218" r="9" fill="#a17cff"/><line x1="163" y1="107" x2="481" y2="215" stroke="#708ff1" stroke-width="4"/><text x="173" y="94" class="num">91.1</text><text x="510" y="222" class="num">66.0</text>

    <text x="0" y="326" class="body">MRCR 12B</text><circle cx="154" cy="316" r="9" fill="#36d7dd"/><circle cx="490" cy="334" r="9" fill="#a17cff"/><line x1="163" y1="317" x2="481" y2="333" stroke="#708ff1" stroke-width="4"/><text x="173" y="306" class="num">53.7</text><text x="510" y="338" class="num">49.8</text>
    <text x="0" y="416" class="body">MRCR 27B</text><circle cx="154" cy="382" r="9" fill="#36d7dd"/><circle cx="490" cy="399" r="9" fill="#a17cff"/><line x1="163" y1="383" x2="481" y2="398" stroke="#708ff1" stroke-width="4"/><text x="173" y="372" class="num">63.2</text><text x="510" y="403" class="num">59.3</text>
  </g>
  <rect x="756" y="690" width="562" height="96" rx="14" fill="#172943" stroke="#435978"/>
  <text x="778" y="721" class="body">结论边界</text>
  <text x="778" y="748" class="small">128K 是最大可处理长度，不是“从 32K 到 128K 分数恒定”。</text>
  <text x="778" y="770" class="small">任务、模型尺寸和 PT / IT 都会改变退化幅度。</text>
  <text x="58" y="862" class="small">来源：Gemma 3 Technical Report v1，Table 6 与 Table 15。Arena 1338 为 2025-03-08 的初步快照，未混入此静态图。</text>
</svg>
