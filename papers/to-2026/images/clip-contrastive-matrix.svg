<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 批内对比学习的相似度矩阵与对称损失</title>
  <desc id="desc">四个图像嵌入与四个文本嵌入两两计算相似度。对角线是真配对，其余单元格是批内负例；按行和按列分别做交叉熵后取平均。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111638"/></linearGradient>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:20px;font-weight:650;fill:#e2e8f0}.small{font-size:15px;fill:#cbd5e1}.tiny{font-size:13px;fill:#94a3b8}.math{font-family:"Times New Roman",serif;font-size:20px;fill:#a5f3fc}.panel{fill:#0d1c31;stroke:#29415f;stroke-width:1.5}.arrow{fill:none;stroke:#67e8f9;stroke-width:3;marker-end:url(#arr2)}
    </style>
  </defs>
  <rect width="1400" height="800" rx="28" fill="url(#bg2)"/>
  <text x="58" y="62" class="sans title">一个 batch 就是一道 N 类匹配题</text>
  <text x="58" y="92" class="sans sub">N 个真配对产生 N² 个候选组合：N 个正例位于对角线，N²−N 个错配自然成为负例</text>

  <g transform="translate(65 150)">
    <text x="318" y="-16" text-anchor="middle" class="sans label" fill="#c4b5fd">文本嵌入 tⱼ</text>
    <text x="-34" y="280" transform="rotate(-90 -34 280)" text-anchor="middle" class="sans label" fill="#67e8f9">图像嵌入 vᵢ</text>
    <g class="sans small" text-anchor="middle"><text x="174" y="22">t₁</text><text x="274" y="22">t₂</text><text x="374" y="22">t₃</text><text x="474" y="22">t₄</text></g>
    <g class="sans small" text-anchor="end"><text x="112" y="94">v₁</text><text x="112" y="194">v₂</text><text x="112" y="294">v₃</text><text x="112" y="394">v₄</text></g>
    <g transform="translate(130 42)" stroke="#40556e">
      <g fill="#12263d"><rect width="88" height="88" rx="8"/><rect x="100" width="88" height="88" rx="8"/><rect x="200" width="88" height="88" rx="8"/><rect x="300" width="88" height="88" rx="8"/><rect y="100" width="88" height="88" rx="8"/><rect x="100" y="100" width="88" height="88" rx="8"/><rect x="200" y="100" width="88" height="88" rx="8"/><rect x="300" y="100" width="88" height="88" rx="8"/><rect y="200" width="88" height="88" rx="8"/><rect x="100" y="200" width="88" height="88" rx="8"/><rect x="200" y="200" width="88" height="88" rx="8"/><rect x="300" y="200" width="88" height="88" rx="8"/><rect y="300" width="88" height="88" rx="8"/><rect x="100" y="300" width="88" height="88" rx="8"/><rect x="200" y="300" width="88" height="88" rx="8"/><rect x="300" y="300" width="88" height="88" rx="8"/></g>
      <g fill="#fbbf24" stroke="#fde68a" stroke-width="2"><rect x="4" y="4" width="80" height="80" rx="8"/><rect x="104" y="104" width="80" height="80" rx="8"/><rect x="204" y="204" width="80" height="80" rx="8"/><rect x="304" y="304" width="80" height="80" rx="8"/></g>
      <g class="sans label" text-anchor="middle" fill="#0f172a"><text x="44" y="52">正</text><text x="144" y="152">正</text><text x="244" y="252">正</text><text x="344" y="352">正</text></g>
      <g class="sans tiny" text-anchor="middle"><text x="144" y="52">负例</text><text x="244" y="52">负例</text><text x="344" y="52">负例</text><text x="44" y="152">负例</text><text x="244" y="152">负例</text><text x="344" y="152">负例</text><text x="44" y="252">负例</text><text x="144" y="252">负例</text><text x="344" y="252">负例</text><text x="44" y="352">负例</text><text x="144" y="352">负例</text><text x="244" y="352">负例</text></g>
    </g>
    <text x="324" y="468" text-anchor="middle" class="math">Sᵢⱼ = exp(s) · (vᵢ · tⱼ),  ‖vᵢ‖₂ = ‖tⱼ‖₂ = 1</text>
  </g>

  <path d="M585 352H660" class="arrow"/>
  <g transform="translate(682 140)">
    <rect width="650" height="538" rx="22" class="panel"/>
    <text x="325" y="45" text-anchor="middle" class="sans label">为什么要做两个方向</text>
    <g transform="translate(35 82)">
      <rect width="270" height="152" rx="17" fill="#0e3c4c" stroke="#22d3ee"/>
      <text x="135" y="34" text-anchor="middle" class="sans label">按行：image → text</text>
      <text x="135" y="65" text-anchor="middle" class="sans small">每张图在 N 条文本中</text>
      <text x="135" y="89" text-anchor="middle" class="sans small">找回自己的配对文本</text>
      <text x="135" y="126" text-anchor="middle" class="math">Lᵢ₂ₜ = CE(S, y)</text>
    </g>
    <g transform="translate(345 82)">
      <rect width="270" height="152" rx="17" fill="#31235d" stroke="#a78bfa"/>
      <text x="135" y="34" text-anchor="middle" class="sans label">按列：text → image</text>
      <text x="135" y="65" text-anchor="middle" class="sans small">每条文本在 N 张图中</text>
      <text x="135" y="89" text-anchor="middle" class="sans small">找回自己的配对图像</text>
      <text x="135" y="126" text-anchor="middle" class="math">Lₜ₂ᵢ = CE(Sᵀ, y)</text>
    </g>
    <path d="M170 260C170 302 280 302 310 336M480 260C480 302 370 302 340 336" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="164" y="326" width="322" height="82" rx="18" fill="#4f3d16" stroke="#fbbf24"/>
    <text x="325" y="360" text-anchor="middle" class="sans label">对称 CLIP 损失</text>
    <text x="325" y="390" text-anchor="middle" class="math">L = ½ (Lᵢ₂ₜ + Lₜ₂ᵢ)</text>
    <g transform="translate(35 438)">
      <rect width="580" height="68" rx="14" fill="#101f33" stroke="#334155"/>
      <text x="18" y="27" class="sans small" fill="#fde68a">batch 越大，负例越多：</text>
      <text x="18" y="50" class="sans tiny">论文 N=32,768，每个正例同时面对 32,767 个批内错配；但错配中也可能存在语义相近的“假负例”。</text>
    </g>
  </g>

  <g transform="translate(65 698)">
    <rect width="1267" height="60" rx="14" fill="#101f33" stroke="#334155"/>
    <text x="24" y="25" class="sans small" fill="#a5f3fc">温度不是可有可无：</text>
    <text x="24" y="47" class="sans tiny">论文学习 logit scale exp(s)=1/τ，初始 τ=0.07，并把 scale 上限裁到 100；它控制 softmax 的尖锐程度和梯度强度，不改变固定相似度的排序。</text>
  </g>
</svg>
