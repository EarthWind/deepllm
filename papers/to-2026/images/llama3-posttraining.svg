<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Llama 3 六轮后训练与数据飞轮</title>
  <desc id="desc">展示每轮从最新模型生成每题十到三十个候选，经奖励模型拒绝采样后做监督微调和直接偏好优化，并将更新模型用于下一轮数据生产；同时展示最终 SFT 数据混合。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#1a123b"/></linearGradient>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#a78bfa"/></marker>
    <style>.zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:40px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a5b4fc}.h{font-size:24px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#cbd5e1}.small{font-size:15px;fill:#94a3b8}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:17px;fill:#e0f2fe}.box{fill:#0d2542;stroke:#355170;stroke-width:2}.tag{font-size:15px;font-weight:800;fill:#071326}</style>
  </defs>
  <rect width="1440" height="920" rx="30" fill="url(#bg3)"/>
  <text x="70" y="72" class="zh title">后训练不是一次 SFT：六轮数据—模型共同演化</text>
  <text x="70" y="108" class="zh sub">Llama 3 选择 RM rejection sampling + SFT + DPO，而不是更复杂的 PPO；每轮都用更新模型收集更难数据</text>

  <rect x="70" y="150" width="1300" height="310" rx="24" class="box"/>
  <text x="98" y="194" class="zh h">单轮数据飞轮（重复 6 次）</text>
  <g class="zh">
    <rect x="98" y="235" width="190" height="132" rx="20" fill="#123a52"/><text x="193" y="273" text-anchor="middle" class="h">最新 Chat 模型</text><text x="193" y="308" text-anchor="middle" class="b">人类 prompt</text><text x="193" y="338" text-anchor="middle" class="small">能力专家 / 上轮最佳点</text>
    <rect x="337" y="235" width="190" height="132" rx="20" fill="#173551"/><text x="432" y="273" text-anchor="middle" class="h">采样 K 个候选</text><text x="432" y="308" text-anchor="middle" class="mono">K = 10–30</text><text x="432" y="338" text-anchor="middle" class="small">共享 prompt KV pages</text>
    <rect x="576" y="235" width="190" height="132" rx="20" fill="#222d58"/><text x="671" y="273" text-anchor="middle" class="h">RM 选最高分</text><text x="671" y="308" text-anchor="middle" class="b">Rejection sampling</text><text x="671" y="338" text-anchor="middle" class="small">edited &gt; chosen &gt; rejected</text>
    <rect x="815" y="235" width="190" height="132" rx="20" fill="#30265b"/><text x="910" y="273" text-anchor="middle" class="h">SFT</text><text x="910" y="308" text-anchor="middle" class="mono">LR = 10⁻⁵</text><text x="910" y="338" text-anchor="middle" class="small">8.5K–9K steps</text>
    <rect x="1054" y="235" width="190" height="132" rx="20" fill="#3b2458"/><text x="1149" y="273" text-anchor="middle" class="h">DPO</text><text x="1149" y="308" text-anchor="middle" class="mono">β = 0.1</text><text x="1149" y="338" text-anchor="middle" class="small">+ 0.2 chosen NLL</text>
    <rect x="1268" y="248" width="74" height="106" rx="18" fill="#fbbf24"/><text x="1305" y="291" text-anchor="middle" class="tag">下一轮</text><text x="1305" y="320" text-anchor="middle" class="tag">更难数据</text>
  </g>
  <g stroke="#a78bfa" stroke-width="4" marker-end="url(#a3)"><line x1="288" y1="301" x2="326" y2="301"/><line x1="527" y1="301" x2="565" y2="301"/><line x1="766" y1="301" x2="804" y2="301"/><line x1="1005" y1="301" x2="1043" y2="301"/><line x1="1244" y1="301" x2="1257" y2="301"/></g>
  <path d="M1305 367V411H192V378" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a3)"/>

  <rect x="70" y="508" width="810" height="286" rx="24" class="box"/>
  <text x="98" y="552" class="zh h">最终 SFT 数据混合（按 example 比例）</text>
  <g class="zh">
    <rect x="98" y="590" width="395" height="72" rx="14" fill="#155e75"/><text x="295" y="622" text-anchor="middle" class="h">通用英文 · 52.66%</text><text x="295" y="649" text-anchor="middle" class="small">多轮、知识、指令遵循</text>
    <rect x="493" y="590" width="159" height="72" fill="#4338ca"/><text x="572" y="622" text-anchor="middle" class="h">代码</text><text x="572" y="649" text-anchor="middle" class="small">14.89%</text>
    <rect x="652" y="590" width="160" height="72" rx="14" fill="#7e22ce"/><text x="732" y="622" text-anchor="middle" class="h">推理与工具</text><text x="732" y="649" text-anchor="middle" class="small">21.19%</text>
    <rect x="98" y="681" width="202" height="70" rx="14" fill="#27355b"/><text x="199" y="711" text-anchor="middle" class="b">Exam-like · 8.14%</text><text x="199" y="738" text-anchor="middle" class="small">考试型知识与推理</text>
    <rect x="322" y="681" width="202" height="70" rx="14" fill="#3b2a59"/><text x="423" y="711" text-anchor="middle" class="b">多语言 · 3.01%</text><text x="423" y="738" text-anchor="middle" class="small">7 种非英语语言</text>
    <rect x="546" y="681" width="266" height="70" rx="14" fill="#503137"/><text x="679" y="711" text-anchor="middle" class="b">长上下文 · 0.11%</text><text x="679" y="738" text-anchor="middle" class="small">平均 context 约 37.4K token</text>
  </g>

  <rect x="930" y="508" width="440" height="286" rx="24" class="box"/>
  <text x="958" y="552" class="zh h">两项稳定 DPO 的修改</text>
  <rect x="958" y="586" width="384" height="76" rx="16" fill="#26275a"/><text x="982" y="616" class="zh b">屏蔽聊天格式 token</text><text x="982" y="645" class="zh small">避免 header / termination 同时受正负目标拉扯</text>
  <rect x="958" y="680" width="384" height="76" rx="16" fill="#39243b"/><text x="982" y="710" class="zh b">chosen response 加 0.2× NLL</text><text x="982" y="739" class="zh small">维持生成格式并防止 chosen 概率下降</text>
  <text x="958" y="780" class="zh small">阶段内还会平均不同数据与超参数所得 checkpoint</text>
  <text x="720" y="874" text-anchor="middle" class="zh sub">合成数据不是自动可信：topic、quality、difficulty 与 semantic dedup 共同决定哪些样本能进入下一轮</text>
</svg>
