<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">奖励模型损失、逐 token KL shaping 与 PPO 更新之间的关系</title>
  <desc id="desc">左侧展示成对奖励模型如何由摘要分数差得到偏好概率；中间展示完整摘要的奖励如何拆成每个 token 的 KL 惩罚和末 token 的奖励模型分数；右侧展示 value、GAE 与 PPO clipping 的职责。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .heading { font: 700 20px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 500 13px "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; fill: #334155; }
      .big-mono { font: 600 17px "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; fill: #312e81; }
      .white { font: 700 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="790" fill="url(#bg)"/>
  <text x="64" y="58" class="title">三种约束不要混为一谈：RM 排序、KL 管距离、PPO 管单次更新</text>
  <text x="64" y="88" class="subtitle">奖励模型评价完整摘要；reference 提供可逐 token 分解的分布锚点；value 只用于降低策略梯度方差。</text>

  <g transform="translate(64 128)" filter="url(#shadow)">
    <rect width="392" height="536" rx="22" class="card"/>
    <circle cx="44" cy="42" r="22" fill="#7c3aed"/>
    <text x="44" y="48" text-anchor="middle" class="white">1</text>
    <text x="80" y="49" class="heading">Reward Model：学相对偏好</text>

    <rect x="28" y="88" width="150" height="76" rx="13" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="103" y="118" text-anchor="middle" class="label">preferred</text>
    <text x="103" y="143" text-anchor="middle" class="mono">r_w = 1.7</text>
    <rect x="214" y="88" width="150" height="76" rx="13" fill="#fce7f3" stroke="#f472b6"/>
    <text x="289" y="118" text-anchor="middle" class="label">rejected</text>
    <text x="289" y="143" text-anchor="middle" class="mono">r_l = 0.2</text>

    <path d="M103 164 C103 204 196 190 196 220" class="arrow"/>
    <path d="M289 164 C289 204 196 190 196 220" class="arrow"/>
    <rect x="28" y="220" width="336" height="64" rx="14" fill="#faf5ff" stroke="#a78bfa"/>
    <text x="196" y="246" text-anchor="middle" class="big-mono">P(y_w ≻ y_l | x) = σ(r_w − r_l)</text>
    <text x="196" y="270" text-anchor="middle" class="small">margin=1.5 时，偏好概率约为 0.818</text>

    <rect x="28" y="310" width="336" height="64" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="196" y="337" text-anchor="middle" class="big-mono">L_RM = −log σ(r_w − r_l)</text>
    <text x="196" y="360" text-anchor="middle" class="small">margin 越大且方向正确，loss 越小</text>

    <g transform="translate(28 402)">
      <rect width="336" height="104" rx="14" fill="#fff7ed" stroke="#fdba74"/>
      <text x="18" y="28" class="label">可识别性边界</text>
      <text x="18" y="54" class="mono">r'(x,y) = r(x,y) + c(x)</text>
      <text x="18" y="78" class="small">同一 post 下加任意常数，偏好概率不变。</text>
      <text x="18" y="97" class="small">所以 reward 是排序坐标，不是绝对质量单位。</text>
    </g>
  </g>

  <g transform="translate(504 128)" filter="url(#shadow)">
    <rect width="392" height="536" rx="22" class="card"/>
    <circle cx="44" cy="42" r="22" fill="#d97706"/>
    <text x="44" y="48" text-anchor="middle" class="white">2</text>
    <text x="80" y="49" class="heading">KL shaping：把序列奖励拆开</text>

    <text x="28" y="94" class="label">策略生成一个摘要 y=(y₁,…,y_T)</text>
    <g transform="translate(28 116)">
      <rect x="0" width="62" height="58" rx="11" fill="#ffedd5" stroke="#fb923c"/>
      <rect x="78" width="62" height="58" rx="11" fill="#ffedd5" stroke="#fb923c"/>
      <rect x="156" width="62" height="58" rx="11" fill="#ffedd5" stroke="#fb923c"/>
      <text x="246" y="37" text-anchor="middle" class="label">···</text>
      <rect x="274" width="62" height="58" rx="11" fill="#fed7aa" stroke="#f97316"/>
      <text x="31" y="35" text-anchor="middle" class="label">y₁</text>
      <text x="109" y="35" text-anchor="middle" class="label">y₂</text>
      <text x="187" y="35" text-anchor="middle" class="label">y₃</text>
      <text x="305" y="35" text-anchor="middle" class="label">EOS</text>
    </g>

    <rect x="28" y="204" width="336" height="82" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="196" y="232" text-anchor="middle" class="mono">k_t = log π_RL(y_t|s_t) − log π_SFT(y_t|s_t)</text>
    <text x="196" y="258" text-anchor="middle" class="mono">r_t^KL = −β k_t</text>
    <text x="196" y="278" text-anchor="middle" class="small">每个采样 token 都有一个 KL shaping 项</text>

    <rect x="28" y="310" width="336" height="84" rx="14" fill="#faf5ff" stroke="#c084fc"/>
    <text x="196" y="339" text-anchor="middle" class="mono">r_t = −βk_t　　　　　(t &lt; T)</text>
    <text x="196" y="366" text-anchor="middle" class="mono">r_T = −βk_T + rθ(x,y)</text>
    <text x="196" y="387" text-anchor="middle" class="small">RM 只在完整摘要结束时给一次终局分数</text>

    <rect x="28" y="420" width="336" height="86" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="196" y="450" text-anchor="middle" class="mono">Σ_t r_t = rθ(x,y) − β log π_RL(y|x)/π_SFT(y|x)</text>
    <text x="196" y="481" text-anchor="middle" class="small">采样 log-ratio 的期望才是 KL；单条轨迹的某一项</text>
    <text x="196" y="500" text-anchor="middle" class="small">可能为负，不要把它误判为实现错误。</text>
  </g>

  <g transform="translate(944 128)" filter="url(#shadow)">
    <rect width="392" height="536" rx="22" class="card"/>
    <circle cx="44" cy="42" r="22" fill="#0284c7"/>
    <text x="44" y="48" text-anchor="middle" class="white">3</text>
    <text x="80" y="49" class="heading">Value、GAE 与 PPO：稳定更新</text>

    <rect x="28" y="88" width="336" height="74" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="196" y="116" text-anchor="middle" class="label">独立 Value Transformer</text>
    <text x="196" y="140" text-anchor="middle" class="small">从 RM 初始化；预测 V(s_t)，不定义“好摘要”</text>
    <path d="M196 162 V196" class="arrow"/>

    <rect x="28" y="196" width="336" height="82" rx="14" fill="#ecfdf5" stroke="#34d399"/>
    <text x="196" y="224" text-anchor="middle" class="mono">δ_t = r_t + γV(s_{t+1}) − V(s_t)</text>
    <text x="196" y="251" text-anchor="middle" class="mono">Â_t = δ_t + γλÂ_{t+1}</text>
    <text x="196" y="272" text-anchor="middle" class="small">论文：γ=1，λ=0.95</text>
    <path d="M196 278 V312" class="arrow"/>

    <rect x="28" y="312" width="336" height="104" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="196" y="340" text-anchor="middle" class="mono">ρ_t(φ)=π_φ(y_t|s_t)/π_old(y_t|s_t)</text>
    <text x="196" y="367" text-anchor="middle" class="mono">min(ρ_t Â_t, clip(ρ_t,1−ε,1+ε)Â_t)</text>
    <text x="196" y="394" text-anchor="middle" class="small">clip 限制同一批 rollout 上的单次更新幅度</text>

    <g transform="translate(28 440)">
      <rect width="336" height="66" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="168" y="27" text-anchor="middle" class="label">PPO clip ≠ KL penalty</text>
      <text x="168" y="50" text-anchor="middle" class="small">一个约束 update，另一个锚定 SFT 行为分布。</text>
    </g>
  </g>

  <text x="700" y="724" text-anchor="middle" class="label">完整训练还包含 value loss、优化器、rollout batching、长度/EOS 处理与分布式执行；图中只画论文理解所需的核心路径。</text>
  <text x="700" y="750" text-anchor="middle" class="small">PPO clipped 公式来自标准 PPO；该论文正文给出序列 reward，并在附录报告 PPO/GAE 配置。</text>
</svg>
