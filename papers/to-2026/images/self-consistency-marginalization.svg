<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">从单条最高概率路径到答案概率质量的边缘化</title>
  <desc id="desc">示意单条概率最高的推理路径可能通向错误答案，而多条不同路径通向同一答案后，其总概率质量可以更大；Self-Consistency 用采样票数近似这种答案边缘分布。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 750 31px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .heading { font: 700 20px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 500 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 500 15px "JetBrains Mono", Consolas, monospace; fill: #334155; }
      .formula { font: 600 22px "STIX Two Math", "Times New Roman", serif; fill: #1e3a8a; }
      .white { font: 700 15px Inter, "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg2)"/>
  <text x="62" y="59" class="title">为什么不能只拿“概率最高的那一条推理链”</text>
  <text x="62" y="90" class="subtitle">一条路径的概率，与某个答案从所有可能路径获得的总概率质量，不是同一个量。</text>

  <g transform="translate(54 132)" filter="url(#shadow2)">
    <rect width="630" height="495" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="28" y="44" class="heading">路径空间：单链解码只保留一条高概率路径</text>
    <text x="28" y="72" class="small">下列概率仅用于解释机制，不是论文测量值。</text>

    <text x="30" y="125" class="mono">r₁ → a = 18</text><rect x="188" y="105" width="188" height="28" rx="8" fill="#bae6fd"/><rect x="188" y="105" width="160" height="28" rx="8" fill="#0ea5e9"/><text x="390" y="125" class="mono">0.17</text>
    <text x="30" y="183" class="mono">r₂ → a = 18</text><rect x="188" y="163" width="188" height="28" rx="8" fill="#bae6fd"/><rect x="188" y="163" width="132" height="28" rx="8" fill="#0ea5e9"/><text x="390" y="183" class="mono">0.14</text>
    <text x="30" y="241" class="mono">r₃ → a = 18</text><rect x="188" y="221" width="188" height="28" rx="8" fill="#bae6fd"/><rect x="188" y="221" width="104" height="28" rx="8" fill="#0ea5e9"/><text x="390" y="241" class="mono">0.11</text>
    <text x="30" y="299" class="mono">r₄ → a = 16</text><rect x="188" y="279" width="188" height="28" rx="8" fill="#fed7aa"/><rect x="188" y="279" width="188" height="28" rx="8" fill="#f97316"/><text x="390" y="299" class="mono">0.20</text>
    <text x="30" y="357" class="mono">r₅ → a = 20</text><rect x="188" y="337" width="188" height="28" rx="8" fill="#ddd6fe"/><rect x="188" y="337" width="123" height="28" rx="8" fill="#8b5cf6"/><text x="390" y="357" class="mono">0.13</text>
    <text x="30" y="415" class="mono">其他分散路径</text><rect x="188" y="395" width="188" height="28" rx="8" fill="#e2e8f0"/><rect x="188" y="395" width="188" height="28" rx="8" fill="#94a3b8"/><text x="390" y="415" class="mono">0.25</text>

    <rect x="28" y="446" width="574" height="31" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="43" y="467" class="body">单条最大路径是 r₄，因此 greedy 可能输出 16。</text>
  </g>

  <line x1="700" y1="377" x2="750" y2="377" stroke="#64748b" stroke-width="3" marker-end="url(#arrow2)"/>

  <g transform="translate(768 132)" filter="url(#shadow2)">
    <rect width="578" height="495" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="28" y="44" class="heading">答案空间：对通向同一答案的路径求和</text>
    <text x="28" y="85" class="formula">p(a | x) = Σᵣ p(r, a | x)</text>

    <text x="30" y="147" class="mono">a = 18</text>
    <rect x="126" y="124" width="380" height="34" rx="10" fill="#dbeafe"/>
    <rect x="126" y="124" width="319" height="34" rx="10" fill="url(#blue2)"/>
    <text x="431" y="147" text-anchor="end" class="white">0.42</text>
    <text x="30" y="213" class="mono">a = 16</text>
    <rect x="126" y="190" width="380" height="34" rx="10" fill="#ffedd5"/>
    <rect x="126" y="190" width="152" height="34" rx="10" fill="#f97316"/>
    <text x="265" y="213" text-anchor="end" class="white">0.20</text>
    <text x="30" y="279" class="mono">a = 20</text>
    <rect x="126" y="256" width="380" height="34" rx="10" fill="#ede9fe"/>
    <rect x="126" y="256" width="99" height="34" rx="10" fill="#8b5cf6"/>
    <text x="212" y="279" text-anchor="end" class="white">0.13</text>
    <text x="30" y="345" class="mono">其他答案</text>
    <rect x="126" y="322" width="380" height="34" rx="10" fill="#e2e8f0"/>
    <rect x="126" y="322" width="190" height="34" rx="10" fill="#94a3b8"/>
    <text x="303" y="345" text-anchor="end" class="white">0.25</text>

    <rect x="28" y="388" width="522" height="76" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="47" y="416" class="body">多条不同路径共同支持 18，使其答案质量最大。</text>
    <text x="47" y="443" class="small">Self-Consistency 用 m 次采样中的票数频率近似这个边缘分布。</text>
  </g>

  <g transform="translate(54 660)">
    <rect width="1292" height="58" rx="15" fill="#172554"/>
    <text x="28" y="36" class="white">关键前提：正确路径必须能被采到，且错误不能高度相关；如果同一种系统性错误占据最大质量，投票只会更自信地选错。</text>
  </g>
</svg>
