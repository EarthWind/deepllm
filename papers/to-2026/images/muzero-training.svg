<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MuZero 五步展开训练与三个监督目标</title><desc id="desc">从回放轨迹选择时刻t，表示函数建立根隐藏状态，动力学模型沿真实动作展开五步，每步的奖励、价值和策略预测分别对齐观察奖励、n步回报和历史MCTS访问策略。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#111d38"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7dd3fc"/></marker><style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.m{font-size:20px;font-weight:650}.s{font-size:17px}.xs{font-size:14px;fill:#aebfd9}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><text class="t h" x="60" y="62">训练时：模型沿真实动作展开 K=5，但从不预测未来 observation</text><text class="t xs" x="60" y="93">同一组参数 hθ、gθ、fθ 通过 BPTT 联合更新；每个 hypothetical step 都有 policy、value、reward 目标</text>
  <g filter="url(#shadow)"><rect x="55" y="135" width="1090" height="155" rx="22" fill="#122844" stroke="#38bdf8" stroke-width="2"/><text class="t m" x="82" y="173">Replay 中的真实轨迹</text><g transform="translate(92 205)"><g class="t s" text-anchor="middle"><text x="0" y="0">oₜ</text><text x="175" y="0">oₜ₊₁</text><text x="350" y="0">oₜ₊₂</text><text x="525" y="0">oₜ₊₃</text><text x="700" y="0">oₜ₊₄</text><text x="875" y="0">oₜ₊₅</text></g><g stroke="#62ccee" stroke-width="3" marker-end="url(#arrow)"><path d="M35 -5H135"/><path d="M210 -5H310"/><path d="M385 -5H485"/><path d="M560 -5H660"/><path d="M735 -5H835"/></g><g class="t xs" text-anchor="middle"><text x="85" y="30">aₜ · uₜ₊₁</text><text x="260" y="30">aₜ₊₁ · uₜ₊₂</text><text x="435" y="30">aₜ₊₂ · uₜ₊₃</text><text x="610" y="30">aₜ₊₃ · uₜ₊₄</text><text x="785" y="30">aₜ₊₄ · uₜ₊₅</text></g></g></g>
  <g transform="translate(55 335)" filter="url(#shadow)"><rect width="1090" height="210" rx="22" fill="#211f46" stroke="#a78bfa" stroke-width="2"/><text class="t m" x="27" y="39">学习模型的 latent unroll</text><g transform="translate(89 89)"><circle cx="0" cy="0" r="25" fill="#334e9d"/><circle cx="175" cy="0" r="25" fill="#4b43aa"/><circle cx="350" cy="0" r="25" fill="#5c47b7"/><circle cx="525" cy="0" r="25" fill="#6c4dc1"/><circle cx="700" cy="0" r="25" fill="#7c55c9"/><circle cx="875" cy="0" r="25" fill="#8b5cd0"/><g class="t s" text-anchor="middle"><text x="0" y="6">s⁰</text><text x="175" y="6">s¹</text><text x="350" y="6">s²</text><text x="525" y="6">s³</text><text x="700" y="6">s⁴</text><text x="875" y="6">s⁵</text></g><g stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"><path d="M28 0H140"/><path d="M203 0H315"/><path d="M378 0H490"/><path d="M553 0H665"/><path d="M728 0H840"/></g><g class="t xs" text-anchor="middle"><text x="85" y="-20">gθ(·,aₜ)</text><text x="260" y="-20">gθ(·,aₜ₊₁)</text><text x="435" y="-20">gθ(·,aₜ₊₂)</text><text x="610" y="-20">gθ(·,aₜ₊₃)</text><text x="785" y="-20">gθ(·,aₜ₊₄)</text></g><g class="t xs" text-anchor="middle"><text x="0" y="50">p⁰,v⁰</text><text x="175" y="50">r¹,p¹,v¹</text><text x="350" y="50">r²,p²,v²</text><text x="525" y="50">r³,p³,v³</text><text x="700" y="50">r⁴,p⁴,v⁴</text><text x="875" y="50">r⁵,p⁵,v⁵</text></g></g><text class="t xs" x="90" y="181">只有真实 action 序列用于展开；未来 oₜ₊ₖ 不作为重建目标</text></g>
  <g transform="translate(55 585)"><rect width="1090" height="83" rx="18" fill="#103239" stroke="#34d399"/><text class="t s" x="25" y="33">每一步 k：　rᵏ ← observed reward uₜ₊ₖ　·　vᵏ ← n-step target zₜ₊ₖ　·　pᵏ ← search policy πₜ₊ₖ</text><text class="t xs" x="25" y="61">L = Σₖ [ℓʳ(u,rᵏ)+ℓᵛ(z,vᵏ)+ℓᵖ(π,pᵏ)] + c‖θ‖²　；board games 无中间奖励时省略 reward loss</text></g>
</svg>
