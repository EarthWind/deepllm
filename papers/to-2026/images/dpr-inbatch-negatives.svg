<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DPR batch 内负例训练矩阵</title>
  <desc id="desc">四个问题与四个正段落形成四乘四分数矩阵，对角线为正例，非对角为 batch 内负例；追加 BM25 hard negatives 后候选翻倍。</desc>
  <defs>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e7eefb}.h1{font-size:30px;font-weight:800}.h2{font-size:22px;font-weight:800}.body{font-size:17px}.small{font-size:15px}.tiny{font-size:13px}.muted{fill:#91a4c6}.formula{font-family:"JetBrains Mono",Consolas,monospace;font-size:17px}.card{fill:#0b182b;stroke:#2b4163;stroke-width:1.5}.cell{fill:#17253b;stroke:#425675}.pos{fill:#123849;stroke:#22d3ee;stroke-width:2}.hard{fill:#3a2c18;stroke:#f59e0b;stroke-width:1.6}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#081321"/>
  <text x="48" y="58" class="t h1">In-batch negatives：一次矩阵乘法制造大量对比</text>
  <text x="48" y="91" class="t body muted">每个问题只标一个正段落；同 batch 里其他问题的正段落自动成为负例</text>

  <g transform="translate(38 126)">
    <rect width="700" height="560" rx="22" class="card"/>
    <text x="24" y="43" class="t h2">B = 4 的 QPᵀ 示例</text>
    <text x="24" y="70" class="t small muted">对角线是正确配对；每行做一次 softmax cross-entropy</text>
    <g transform="translate(132 110)">
      <text x="110" y="-17" text-anchor="middle" class="t small" fill="#fbbf24">正段落 p₁⁺</text><text x="230" y="-17" text-anchor="middle" class="t small" fill="#fbbf24">p₂⁺</text><text x="350" y="-17" text-anchor="middle" class="t small" fill="#fbbf24">p₃⁺</text><text x="470" y="-17" text-anchor="middle" class="t small" fill="#fbbf24">p₄⁺</text>
      <text x="-18" y="46" text-anchor="end" class="t small" fill="#67e8f9">q₁</text><text x="-18" y="126" text-anchor="end" class="t small" fill="#67e8f9">q₂</text><text x="-18" y="206" text-anchor="end" class="t small" fill="#67e8f9">q₃</text><text x="-18" y="286" text-anchor="end" class="t small" fill="#67e8f9">q₄</text>
      <g>
        <rect x="50" y="0" width="110" height="66" rx="9" class="pos"/><text x="105" y="28" text-anchor="middle" class="t body">s₁₁</text><text x="105" y="51" text-anchor="middle" class="t tiny" fill="#67e8f9">positive</text>
        <rect x="170" y="0" width="110" height="66" rx="9" class="cell"/><text x="225" y="40" text-anchor="middle" class="t body muted">s₁₂</text><rect x="290" y="0" width="110" height="66" rx="9" class="cell"/><text x="345" y="40" text-anchor="middle" class="t body muted">s₁₃</text><rect x="410" y="0" width="110" height="66" rx="9" class="cell"/><text x="465" y="40" text-anchor="middle" class="t body muted">s₁₄</text>
        <rect x="50" y="80" width="110" height="66" rx="9" class="cell"/><text x="105" y="120" text-anchor="middle" class="t body muted">s₂₁</text><rect x="170" y="80" width="110" height="66" rx="9" class="pos"/><text x="225" y="108" text-anchor="middle" class="t body">s₂₂</text><text x="225" y="131" text-anchor="middle" class="t tiny" fill="#67e8f9">positive</text><rect x="290" y="80" width="110" height="66" rx="9" class="cell"/><text x="345" y="120" text-anchor="middle" class="t body muted">s₂₃</text><rect x="410" y="80" width="110" height="66" rx="9" class="cell"/><text x="465" y="120" text-anchor="middle" class="t body muted">s₂₄</text>
        <rect x="50" y="160" width="110" height="66" rx="9" class="cell"/><text x="105" y="200" text-anchor="middle" class="t body muted">s₃₁</text><rect x="170" y="160" width="110" height="66" rx="9" class="cell"/><text x="225" y="200" text-anchor="middle" class="t body muted">s₃₂</text><rect x="290" y="160" width="110" height="66" rx="9" class="pos"/><text x="345" y="188" text-anchor="middle" class="t body">s₃₃</text><text x="345" y="211" text-anchor="middle" class="t tiny" fill="#67e8f9">positive</text><rect x="410" y="160" width="110" height="66" rx="9" class="cell"/><text x="465" y="200" text-anchor="middle" class="t body muted">s₃₄</text>
        <rect x="50" y="240" width="110" height="66" rx="9" class="cell"/><text x="105" y="280" text-anchor="middle" class="t body muted">s₄₁</text><rect x="170" y="240" width="110" height="66" rx="9" class="cell"/><text x="225" y="280" text-anchor="middle" class="t body muted">s₄₂</text><rect x="290" y="240" width="110" height="66" rx="9" class="cell"/><text x="345" y="280" text-anchor="middle" class="t body muted">s₄₃</text><rect x="410" y="240" width="110" height="66" rx="9" class="pos"/><text x="465" y="268" text-anchor="middle" class="t body">s₄₄</text><text x="465" y="291" text-anchor="middle" class="t tiny" fill="#67e8f9">positive</text>
      </g>
      <text x="285" y="342" text-anchor="middle" class="t formula">S = QPᵀ ∈ Rᴮˣᴮ</text>
      <text x="285" y="375" text-anchor="middle" class="t small muted">B 个正例 + B(B−1) 个负配对</text>
    </g>
    <rect x="78" y="490" width="544" height="48" rx="13" fill="#101f35" stroke="#375071"/>
    <text x="350" y="520" text-anchor="middle" class="t formula" fill="#67e8f9">Lᵢ = −log exp(sᵢᵢ) / Σⱼ exp(sᵢⱼ)</text>
  </g>

  <g transform="translate(764 126)">
    <rect width="398" height="560" rx="22" class="card"/>
    <text x="22" y="43" class="t h2">再加入 BM25 hard negatives</text>
    <text x="22" y="70" class="t small muted">高词面相关但不含答案，更难区分</text>
    <g transform="translate(24 102)">
      <rect width="160" height="62" rx="12" class="pos"/><text x="80" y="28" text-anchor="middle" class="t body">B 个 p⁺</text><text x="80" y="50" text-anchor="middle" class="t tiny muted">对角线正例</text>
      <text x="182" y="38" class="t h2">+</text>
      <rect x="210" width="140" height="62" rx="12" class="hard"/><text x="280" y="28" text-anchor="middle" class="t body">B 个 pᴴ</text><text x="280" y="50" text-anchor="middle" class="t tiny" fill="#fbbf24">BM25 hard</text>
      <rect x="0" y="92" width="350" height="78" rx="14" fill="#111f35" stroke="#3f5677"/>
      <text x="175" y="124" text-anchor="middle" class="t formula">S ∈ Rᴮˣ²ᴮ</text><text x="175" y="151" text-anchor="middle" class="t small muted">每题有 2B−1 个 negatives</text>
    </g>
    <g transform="translate(22 311)">
      <rect width="354" height="190" rx="16" fill="#0f1c31" stroke="#344b6b"/>
      <text x="20" y="35" class="t small muted">论文主配置</text>
      <text x="20" y="72" class="t h2">B = 128</text>
      <path d="M20 91H334" stroke="#30445f"/>
      <text x="20" y="121" class="t small">候选 passages</text><text x="330" y="121" text-anchor="end" class="t formula" fill="#fbbf24">256</text>
      <text x="20" y="151" class="t small">矩阵分数</text><text x="330" y="151" text-anchor="end" class="t formula">32,768</text>
      <text x="20" y="181" class="t small">负配对</text><text x="330" y="181" text-anchor="end" class="t formula" fill="#67e8f9">32,640</text>
    </g>
    <text x="199" y="522" text-anchor="middle" class="t small muted">负例越多不等于越好</text>
    <text x="199" y="545" text-anchor="middle" class="t small" fill="#fbbf24">一个 BM25 negative 有益；两个未再提升</text>
  </g>
  <text x="600" y="727" text-anchor="middle" class="t small muted">前提：batch 内其他“正段落”对当前问题确实可当负例；多答案或重复段落会产生 false negatives</text>
</svg>
