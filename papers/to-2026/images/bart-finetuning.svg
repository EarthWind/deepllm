<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">BART 面向分类、序列生成和机器翻译的微调接口</title>
  <desc id="desc">左上为序列分类，右上为 token 分类，左下为标准条件生成，右下为加新源语言编码器的机器翻译。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><style>.title{font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.panel{font:700 19px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 14px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.tiny{font:500 11.5px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}.mono{font:700 13px "JetBrains Mono",Consolas,monospace;fill:#1d4ed8}.box{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.dec{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}.head{fill:#ecfdf5;stroke:#34d399;stroke-width:1.5}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1400" height="900" fill="#f8fafc"/><text x="70" y="58" class="title">同一个预训练骨架，按任务改变“输入给谁、读哪一层”</text><text x="70" y="90" class="subtitle">前三类任务直接微调整个 BART；论文的翻译实验额外学习一个罗马尼亚语源编码器，把 BART 当作预训练的英语生成器。</text>
  <g filter="url(#shadow)"><rect x="55" y="125" width="625" height="320" rx="18" fill="#fff" stroke="#93c5fd"/></g><text x="85" y="164" class="panel">A. 序列分类：最后一个 Decoder 状态</text><text x="85" y="190" class="small">同一无噪声文本同时送给 Encoder 和 Decoder；末尾再加 token</text><rect x="95" y="235" width="150" height="75" rx="12" class="box"/><text x="170" y="265" text-anchor="middle" class="label">Encoder</text><text x="170" y="288" text-anchor="middle" class="tiny">双向全文</text><path d="M245 272 L305 272" class="arrow"/><rect x="310" y="235" width="150" height="75" rx="12" class="dec"/><text x="385" y="265" text-anchor="middle" class="label">Decoder</text><text x="385" y="288" text-anchor="middle" class="tiny">末 token 可看完前文</text><path d="M460 272 L520 272" class="arrow"/><rect x="525" y="235" width="110" height="75" rx="12" class="head"/><text x="580" y="265" text-anchor="middle" class="label">Linear</text><text x="580" y="288" text-anchor="middle" class="mono">label</text><rect x="95" y="340" width="540" height="62" rx="11" fill="#f8fafc" stroke="#cbd5e1"/><text x="365" y="365" text-anchor="middle" class="mono">x → Encoder　且　x → Decoder</text><text x="365" y="388" text-anchor="middle" class="tiny">取 decoder 最后位置 hₜ；不是只取 encoder 首 token</text>
  <g filter="url(#shadow)"><rect x="720" y="125" width="625" height="320" rx="18" fill="#fff" stroke="#86efac"/></g><text x="750" y="164" class="panel">B. Token 分类：每个 Decoder 顶层状态</text><text x="750" y="190" class="small">SQuAD 中为每个词分别预测答案起点与终点</text><rect x="760" y="235" width="150" height="75" rx="12" class="box"/><text x="835" y="265" text-anchor="middle" class="label">Encoder</text><text x="835" y="288" text-anchor="middle" class="tiny">question + context</text><path d="M910 272 L970 272" class="arrow"/><rect x="975" y="235" width="150" height="75" rx="12" class="dec"/><text x="1050" y="265" text-anchor="middle" class="label">Decoder</text><text x="1050" y="288" text-anchor="middle" class="tiny">h₁ … hₜ</text><path d="M1125 272 L1185 272" class="arrow"/><rect x="1190" y="235" width="110" height="75" rx="12" class="head"/><text x="1245" y="265" text-anchor="middle" class="label">2 Heads</text><text x="1245" y="288" text-anchor="middle" class="mono">start/end</text><rect x="760" y="340" width="540" height="62" rx="11" fill="#f8fafc" stroke="#cbd5e1"/><text x="1030" y="365" text-anchor="middle" class="mono">p(start=i), p(end=j)</text><text x="1030" y="388" text-anchor="middle" class="tiny">论文接口让完整文档同时经过 Encoder 与 Decoder</text>
  <g filter="url(#shadow)"><rect x="55" y="480" width="625" height="330" rx="18" fill="#fff" stroke="#fbbf24"/></g><text x="85" y="519" class="panel">C. 条件生成：最自然的下游形态</text><text x="85" y="545" class="small">摘要、对话和长答案都直接做 input → output 的 seq2seq 微调</text><rect x="95" y="590" width="150" height="80" rx="12" class="box"/><text x="170" y="620" text-anchor="middle" class="label">输入文本</text><text x="170" y="644" text-anchor="middle" class="tiny">文章 / 上下文 / 问题</text><path d="M245 630 L305 630" class="arrow"/><rect x="310" y="590" width="150" height="80" rx="12" class="box"/><text x="385" y="620" text-anchor="middle" class="label">BART Encoder</text><text x="385" y="644" text-anchor="middle" class="tiny">完整条件</text><path d="M460 630 L520 630" class="arrow"/><rect x="525" y="590" width="110" height="80" rx="12" class="dec"/><text x="580" y="620" text-anchor="middle" class="label">Decoder</text><text x="580" y="644" text-anchor="middle" class="tiny">y₁ → y₂ → …</text><rect x="95" y="702" width="540" height="70" rx="11" fill="#fffbeb" stroke="#fbbf24"/><text x="365" y="729" text-anchor="middle" class="mono">−Σₜ log p(yₜ | y&lt;ₜ, x)</text><text x="365" y="753" text-anchor="middle" class="tiny">与预训练同为“条件化的左到右重建”，接口错配最小</text>
  <g filter="url(#shadow)"><rect x="720" y="480" width="625" height="330" rx="18" fill="#fff" stroke="#c4b5fd"/></g><text x="750" y="519" class="panel">D. 翻译到英语：加一个新的源语言 Encoder</text><text x="750" y="545" class="small">论文实验不是通用 mBART；预训练语料仍只有英语目标侧</text><rect x="750" y="590" width="125" height="80" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><text x="812" y="620" text-anchor="middle" class="label">罗马尼亚语</text><text x="812" y="644" text-anchor="middle" class="tiny">独立词表</text><path d="M875 630 L920 630" class="arrow"/><rect x="925" y="590" width="125" height="80" rx="12" fill="#ede9fe" stroke="#8b5cf6"/><text x="987" y="620" text-anchor="middle" class="label">新 6 层</text><text x="987" y="644" text-anchor="middle" class="tiny">随机初始化</text><path d="M1050 630 L1095 630" class="arrow"/><rect x="1100" y="590" width="95" height="80" rx="12" class="box"/><text x="1147" y="620" text-anchor="middle" class="label">BART</text><text x="1147" y="644" text-anchor="middle" class="tiny">Encoder</text><path d="M1195 630 L1230 630" class="arrow"/><rect x="1235" y="590" width="80" height="80" rx="12" class="dec"/><text x="1275" y="620" text-anchor="middle" class="label">BART</text><text x="1275" y="644" text-anchor="middle" class="tiny">Decoder</text><rect x="750" y="702" width="565" height="70" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1032" y="728" text-anchor="middle" class="label">阶段 1：冻结大部分 BART，只学接口 → 阶段 2：短暂全量微调</text><text x="1032" y="753" text-anchor="middle" class="tiny">WMT16 Ro–En + back-translation：36.80 → 37.96 BLEU</text>
  <text x="55" y="870" class="tiny">分类与 token 分类接口来自论文 Figure 3 / §3；生成任务采用论文 §3.3；翻译两阶段训练来自 §3.4，不能与后来的多语言 BART 预训练混为一谈。</text>
</svg>
