<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Absolute Zero Reasoner 自博弈训练闭环</title>
  <desc id="desc">同一个模型提出任务和求解任务，Python 执行环境负责验证，经验缓冲区形成不断演化的课程，六类任务角色奖励通过 TRR++ 更新模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#130b2a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker>
    <style>
      .h{font:700 31px system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#f8fafc}.s{font:500 16px system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#94a3b8}.t{font:700 19px system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#f8fafc}.b{font:500 15px system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;fill:#cbd5e1}.k{font:700 14px ui-monospace,SFMono-Regular,monospace;fill:#67e8f9}.v{font:700 14px ui-monospace,SFMono-Regular,monospace;fill:#c4b5fd}.box{fill:#0f1b2d;stroke:#334155;stroke-width:1.5}.cbox{fill:#09253a;stroke:#22d3ee;stroke-width:1.8}.vbox{fill:#21133f;stroke:#8b5cf6;stroke-width:1.8}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <g opacity=".17" stroke="#64748b"><path d="M0 116H1200M0 596H1200"/><path d="M102 0V720M1098 0V720"/></g>
  <text class="h" x="600" y="56" text-anchor="middle">Absolute Zero：同一个模型，自己出题、自己解题、环境验题</text>
  <text class="s" x="600" y="86" text-anchor="middle">没有外部推理题库；课程由在线 self-play 持续生长</text>

  <rect class="box" x="48" y="158" width="208" height="154" rx="20"/>
  <text class="t" x="152" y="194" text-anchor="middle">经验缓冲区</text>
  <text class="b" x="74" y="228">• 历史 (p, i, o) 三元组</text>
  <text class="b" x="74" y="255">• 每次采样 K=6 个参考</text>
  <text class="b" x="74" y="282">• 有效提案持续写回</text>

  <rect class="cbox" x="340" y="127" width="242" height="216" rx="24"/>
  <text class="t" x="461" y="168" text-anchor="middle">统一 LLM · PROPOSE</text>
  <text class="k" x="461" y="199" text-anchor="middle">πθpropose(τ | type, K refs)</text>
  <rect x="370" y="220" width="182" height="32" rx="16" fill="#083b52"/><text class="b" x="461" y="242" text-anchor="middle">演绎 · Deduction</text>
  <rect x="370" y="262" width="182" height="32" rx="16" fill="#083b52"/><text class="b" x="461" y="284" text-anchor="middle">溯因 · Abduction</text>
  <rect x="370" y="304" width="182" height="32" rx="16" fill="#083b52"/><text class="b" x="461" y="326" text-anchor="middle">归纳 · Induction</text>

  <rect class="box" x="666" y="142" width="220" height="186" rx="22"/>
  <text class="t" x="776" y="180" text-anchor="middle">Python 环境</text>
  <text class="b" x="692" y="216">① 语法 / 可执行性</text>
  <text class="b" x="692" y="244">② 敏感模块过滤</text>
  <text class="b" x="692" y="272">③ 两次执行近似确定性</text>
  <text class="k" x="776" y="305" text-anchor="middle">τ → (x, y★)</text>

  <rect class="vbox" x="970" y="127" width="182" height="216" rx="24"/>
  <text class="t" x="1061" y="168" text-anchor="middle">统一 LLM · SOLVE</text>
  <text class="v" x="1061" y="199" text-anchor="middle">y ~ πθsolve(· | x)</text>
  <text class="b" x="994" y="235">G=8 次 rollout</text>
  <text class="b" x="994" y="265">执行器验证答案</text>
  <text class="b" x="994" y="295">得到二值准确率</text>

  <path d="M256 224H332" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowC)"/>
  <path d="M582 224H658" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowC)"/>
  <path d="M886 224H962" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowV)"/>

  <rect class="box" x="158" y="444" width="884" height="178" rx="28"/>
  <text class="t" x="600" y="480" text-anchor="middle">可验证奖励与 Task-Relative REINFORCE++</text>
  <rect x="198" y="508" width="242" height="78" rx="16" fill="#0b3345" stroke="#22d3ee"/>
  <text class="k" x="319" y="537" text-anchor="middle">rsolve = 𝟙[y ≡ y★]</text>
  <text class="b" x="319" y="566" text-anchor="middle">答对得 1，答错得 0</text>
  <rect x="479" y="508" width="242" height="78" rx="16" fill="#2a1745" stroke="#8b5cf6"/>
  <text class="v" x="600" y="537" text-anchor="middle">rpropose = 1 − r̄solve</text>
  <text class="b" x="600" y="566" text-anchor="middle">但 r̄=0 时奖励也为 0</text>
  <rect x="760" y="508" width="242" height="78" rx="16" fill="#18243a" stroke="#64748b"/>
  <text class="t" x="881" y="537" text-anchor="middle">六组独立 baseline</text>
  <text class="b" x="881" y="566" text-anchor="middle">3 task × 2 role</text>

  <path d="M1061 343V398Q1061 420 1039 420H892V436" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowV)"/>
  <path d="M461 343V420H350V436" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowC)"/>
  <path d="M600 622V661H152V320" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowC)"/>
  <path d="M600 622V670H1061V351" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowV)"/>
  <text class="s" x="600" y="698" text-anchor="middle">共享参数 θ 被两种角色共同更新；buffer 改变下一轮任务分布，形成自演化课程</text>
</svg>
