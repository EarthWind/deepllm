<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MuZero 在棋类与Atari的主要结果</title><desc id="desc">MuZero在三种棋类匹配AlphaZero，在20B帧Atari设置取得2041.1%中位和4999.2%均值，MuZero Reanalyze在200M帧取得731.1%中位和2168.9%均值。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#111d38"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.m{font-size:21px;font-weight:650}.big{font-size:34px;font-weight:750}.s{font-size:17px}.xs{font-size:14px;fill:#aebfd9}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><text class="t h" x="60" y="62">MuZero：在已知规则的强规划域追平，在未知视觉动力学域突破</text><text class="t xs" x="60" y="93">每个棋种、每个 Atari 游戏分别训练实例；以下两种 Atari 数据预算必须分开比较</text>
  <g filter="url(#shadow)"><rect x="55" y="135" width="340" height="365" rx="22" fill="#132440" stroke="#38bdf8" stroke-width="2"/><text class="t m" x="85" y="176">Go · Chess · Shogi</text><text class="t big" x="85" y="232">≈ AlphaZero</text><text class="t s" x="85" y="275">不知道树内游戏规则</text><text class="t xs" x="85" y="309">800 simulations / move</text><text class="t xs" x="85" y="337">训练 / 评测均与 AlphaZero 对弈定标</text><text class="t xs" x="85" y="365">Go 曲线略高于 AlphaZero</text><g transform="translate(90 405)"><circle cx="0" cy="0" r="21" fill="#155e75"/><circle cx="70" cy="0" r="21" fill="#3b3a8f"/><circle cx="140" cy="0" r="21" fill="#14735e"/><path d="M22 0h25M92 0h25" stroke="#7dd3fc" stroke-width="4"/><text class="t xs" x="0" y="51">learned latent dynamics</text></g></g>
  <g filter="url(#shadow)"><rect x="430" y="135" width="340" height="365" rx="22" fill="#211f46" stroke="#a78bfa" stroke-width="2"/><text class="t m" x="460" y="176">Atari · large-data</text><text class="t big" x="460" y="232">20.0B frames</text><text class="t s" x="460" y="277">MuZero</text><text class="t big" x="460" y="327">2041.1% median</text><text class="t s" x="460" y="361">4999.2% mean</text><rect x="460" y="396" width="280" height="22" rx="11" fill="#352d65"/><rect x="460" y="396" width="238" height="22" rx="11" fill="#8b5cf6"/><text class="t xs" x="460" y="452">R2D2：37.5B frames</text><text class="t xs" x="460" y="477">1920.6% median · 4024.9% mean</text></g>
  <g filter="url(#shadow)"><rect x="805" y="135" width="340" height="365" rx="22" fill="#103239" stroke="#34d399" stroke-width="2"/><text class="t m" x="835" y="176">Atari · sample-efficient</text><text class="t big" x="835" y="232">200M frames</text><text class="t s" x="835" y="277">MuZero Reanalyze</text><text class="t big" x="835" y="327">731.1% median</text><text class="t s" x="835" y="361">2168.9% mean</text><rect x="835" y="396" width="280" height="22" rx="11" fill="#174a46"/><rect x="835" y="396" width="205" height="22" rx="11" fill="#22c58b"/><text class="t xs" x="835" y="452">LASER：431% median</text><text class="t xs" x="835" y="477">旧轨迹 80% policy target 重新搜索</text></g>
  <g transform="translate(55 540)"><rect width="1090" height="126" rx="22" fill="#0b1930" stroke="#29496e"/><text class="t m" x="28" y="39">怎样证明“规划”确实在起作用</text><text class="t s" x="28" y="75">Go：思考时间从约 0.1s 增至 50s，棋力提升超过 1000 Elo，趋势接近使用完美模拟器的 AlphaZero。</text><text class="t s" x="28" y="104">Atari：随 simulations 增至约 100 略有提升后趋于平台；Ms. Pac-Man 即使训练时只有 6 次模拟也能学习。</text></g>
  <text class="t xs" x="60" y="696">Human-normalized score = (agent − random) / (human − random) × 100%；均值会被少数超高分游戏显著放大。</text>
</svg>
