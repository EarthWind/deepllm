<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">AlphaFold2 在 CASP14 的误差对比</title>
  <desc id="desc">比较 AlphaFold2 与最佳其他方法在 CASP14 上的主链和全原子 RMSD95，中位误差越低越好，并给出近期 PDB 全链测试的中位误差。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171538"/></linearGradient><style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:18px;font-weight:650;fill:#e2e8f0}.small{font-size:14px;fill:#cbd5e1}.tiny{font-size:12px;fill:#94a3b8}.grid{stroke:#334155;stroke-width:1}</style></defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" class="sans title">CASP14：AlphaFold2 把中位误差推进到接近原子尺度</text>
  <text x="52" y="94" class="sans sub">指标为 RMSD₉₅（覆盖最佳 95% 残基），越低越好；误差条为论文报告的中位数 95% 置信区间</text>

  <g transform="translate(300 155)">
    <path d="M0 0V400M200 0V400M400 0V400M600 0V400M800 0V400" class="grid"/>
    <text x="0" y="430" text-anchor="middle" class="sans tiny">0 Å</text><text x="200" y="430" text-anchor="middle" class="sans tiny">1 Å</text><text x="400" y="430" text-anchor="middle" class="sans tiny">2 Å</text><text x="600" y="430" text-anchor="middle" class="sans tiny">3 Å</text><text x="800" y="430" text-anchor="middle" class="sans tiny">4 Å</text>
    <text x="-28" y="64" text-anchor="end" class="sans label">主链 Cα</text>
    <rect y="82" width="192" height="48" rx="12" fill="#22d3ee"/><text x="204" y="112" class="sans small" fill="#a5f3fc">AlphaFold2  0.96 Å  [0.85, 1.16]</text>
    <rect y="146" width="560" height="48" rx="12" fill="#64748b"/><text x="572" y="176" class="sans small">最佳其他方法  2.8 Å  [2.7, 4.0]</text>
    <text x="-28" y="274" text-anchor="end" class="sans label">全原子</text>
    <rect y="292" width="300" height="48" rx="12" fill="#a78bfa"/><text x="312" y="322" class="sans small" fill="#ddd6fe">AlphaFold2  1.5 Å  [1.2, 1.6]</text>
    <rect y="356" width="700" height="48" rx="12" fill="#64748b"/><text x="712" y="386" class="sans small">最佳其他方法  3.5 Å  [3.1, 4.2]</text>
  </g>
  <rect x="70" y="606" width="1260" height="70" rx="16" fill="#10233a" stroke="#35506e"/>
  <text x="700" y="634" text-anchor="middle" class="sans small">时间外近期 PDB 测试：3,144 条无高相似训练模板的完整链，中位主链 RMSD₉₅ = 1.46 Å [1.40, 1.56]</text>
  <text x="700" y="659" text-anchor="middle" class="sans tiny">不要把“近实验精度”理解为每个目标、每个残基或每种构象都达到 1 Å；RMSD₉₅ 会忽略最差的 5% 残基。</text>
</svg>
