<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ULMFiT 的三阶段迁移学习流程</title>
  <desc id="desc">通用领域 WikiText-103 先训练 AWD-LSTM 语言模型，目标任务文本再适配语言模型，最后替换为 concat pooling 分类器并渐进解冻。第二、三阶段分别使用判别式微调与倾斜三角学习率。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .stage { font: 700 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .heading { font: 700 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 600 13px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .white-small { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #e0f2fe; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .checkpoint { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="60" class="title">ULMFiT：同一套语言模型参数，经历三次角色转换</text>
  <text x="70" y="92" class="subtitle">通用语料学语言 → 目标文本学领域分布 → 少量标签学决策边界；迁移的是整个多层语言模型，不只是词向量。</text>

  <text x="70" y="142" class="heading">数据与目标</text>
  <text x="514" y="142" class="heading">共享主干与参数流</text>
  <text x="1015" y="142" class="heading">得到什么</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="1260" height="170" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <rect x="70" y="165" width="165" height="170" rx="18" fill="#2563eb"/>
  <path d="M217 165 H235 V335 H217 Q235 317 235 299 V201 Q235 183 217 165" fill="#2563eb"/>
  <text x="152" y="215" text-anchor="middle" class="stage">阶段 1</text>
  <text x="152" y="248" text-anchor="middle" class="stage">通用 LM 预训练</text>
  <text x="152" y="283" text-anchor="middle" class="white-small">昂贵，但只做一次</text>

  <rect x="265" y="194" width="205" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="367" y="224" text-anchor="middle" class="label">WikiText-103</text>
  <text x="367" y="250" text-anchor="middle" class="small">28,595 篇文章</text>
  <text x="367" y="273" text-anchor="middle" class="small">1.03 亿词；无需人工标签</text>
  <text x="367" y="295" text-anchor="middle" class="mono">x₁ … xₜ → xₜ₊₁</text>
  <path d="M470 250 L530 250" class="arrow"/>

  <rect x="530" y="187" width="430" height="126" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="745" y="218" text-anchor="middle" class="label">AWD-LSTM 语言模型</text>
  <g>
    <rect x="565" y="238" width="95" height="48" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="680" y="238" width="95" height="48" rx="9" fill="#c7d2fe" stroke="#818cf8"/>
    <rect x="795" y="238" width="95" height="48" rx="9" fill="#ddd6fe" stroke="#a78bfa"/>
    <text x="612" y="267" text-anchor="middle" class="small">LSTM 1</text>
    <text x="727" y="267" text-anchor="middle" class="small">LSTM 2</text>
    <text x="842" y="267" text-anchor="middle" class="small">LSTM 3</text>
    <path d="M660 262 L680 262" class="arrow"/>
    <path d="M775 262 L795 262" class="arrow"/>
    <path d="M890 262 L929 262" class="arrow"/>
    <text x="936" y="267" class="mono">softmax</text>
  </g>

  <path d="M960 250 L1018 250" class="arrow"/>
  <rect x="1018" y="194" width="280" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1158" y="226" text-anchor="middle" class="label">通用语言参数 θ⁽⁰⁾</text>
  <text x="1158" y="253" text-anchor="middle" class="small">词法、句法、语义与长程依赖</text>
  <text x="1158" y="279" text-anchor="middle" class="small">作为后续任务的初始化</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="70" y="365" width="1260" height="170" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  </g>
  <rect x="70" y="365" width="165" height="170" rx="18" fill="#7c3aed"/>
  <path d="M217 365 H235 V535 H217 Q235 517 235 499 V401 Q235 383 217 365" fill="#7c3aed"/>
  <text x="152" y="415" text-anchor="middle" class="stage">阶段 2</text>
  <text x="152" y="448" text-anchor="middle" class="stage">目标任务 LM 微调</text>
  <text x="152" y="483" text-anchor="middle" class="white-small">先不使用类别标签</text>

  <rect x="265" y="394" width="205" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="367" y="424" text-anchor="middle" class="label">目标领域文本</text>
  <text x="367" y="450" text-anchor="middle" class="small">评论 / 新闻 / 问题</text>
  <text x="367" y="473" text-anchor="middle" class="small">可含未标注文本</text>
  <text x="367" y="495" text-anchor="middle" class="mono">仍预测下一个词</text>
  <path d="M470 450 L530 450" class="arrow"/>

  <rect x="530" y="387" width="430" height="126" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="745" y="418" text-anchor="middle" class="label">完整 LM 继续训练</text>
  <rect x="558" y="438" width="166" height="49" rx="9" fill="#ede9fe" stroke="#c4b5fd"/>
  <rect x="744" y="438" width="188" height="49" rx="9" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="641" y="468" text-anchor="middle" class="small">判别式学习率</text>
  <text x="838" y="468" text-anchor="middle" class="small">STLR：短升 + 长降</text>

  <path d="M960 450 L1018 450" class="arrow"/>
  <rect x="1018" y="394" width="280" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1158" y="426" text-anchor="middle" class="label">领域适配参数 θ⁽ᵗ⁾</text>
  <text x="1158" y="453" text-anchor="middle" class="small">适应词汇、文体和主题分布</text>
  <text x="1158" y="479" text-anchor="middle" class="small">仍然是一个语言模型</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="70" y="565" width="1260" height="170" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  </g>
  <rect x="70" y="565" width="165" height="170" rx="18" fill="#c2410c"/>
  <path d="M217 565 H235 V735 H217 Q235 717 235 699 V601 Q235 583 217 565" fill="#c2410c"/>
  <text x="152" y="615" text-anchor="middle" class="stage">阶段 3</text>
  <text x="152" y="648" text-anchor="middle" class="stage">分类器微调</text>
  <text x="152" y="683" text-anchor="middle" class="white-small">此时才读取类别标签</text>

  <rect x="265" y="594" width="205" height="112" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="367" y="624" text-anchor="middle" class="label">带标签目标文本</text>
  <text x="367" y="650" text-anchor="middle" class="small">同一份文本 + y</text>
  <text x="367" y="675" text-anchor="middle" class="small">长文档按 BPT3C 分块</text>
  <text x="367" y="697" text-anchor="middle" class="mono">document → class</text>
  <path d="M470 650 L530 650" class="arrow"/>

  <rect x="530" y="587" width="430" height="126" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="745" y="618" text-anchor="middle" class="label">LM Head 换成文档分类头</text>
  <rect x="558" y="638" width="160" height="49" rx="9" fill="#ffedd5" stroke="#fdba74"/>
  <rect x="738" y="638" width="194" height="49" rx="9" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="638" y="668" text-anchor="middle" class="small">Concat Pooling</text>
  <text x="835" y="668" text-anchor="middle" class="small">渐进解冻 + Discr + STLR</text>

  <path d="M960 650 L1018 650" class="arrow"/>
  <rect x="1018" y="594" width="280" height="112" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1158" y="626" text-anchor="middle" class="label">任务分类器</text>
  <text x="1158" y="653" text-anchor="middle" class="small">情感 / 问题 / 主题标签</text>
  <text x="1158" y="679" text-anchor="middle" class="small">论文再平均正向、反向模型</text>

  <!-- checkpoint flow -->
  <path d="M1160 306 L1160 389" class="checkpoint"/>
  <path d="M1160 506 L1160 589" class="checkpoint"/>
  <text x="1180" y="354" class="small">加载全部 LM 权重</text>
  <text x="1180" y="554" class="small">移除词表 softmax</text>

  <rect x="70" y="765" width="1260" height="34" rx="10" fill="#e2e8f0"/>
  <text x="700" y="787" text-anchor="middle" class="label">关键分工：阶段 2 解决“领域分布偏移”，阶段 3 才解决“决策边界”；跳过中间 LM 适配会损失性能。</text>
</svg>
