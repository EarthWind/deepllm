<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Mamba-1 Block 数据流</title><desc id="desc">输入经过归一化和扩展投影后分成内容与门控分支，内容分支经过因果卷积、选择性 SSM，再与 SiLU 门相乘并投影回模型宽度。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#142039"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#0f766e"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:20px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d3deec}.small{font-size:14px;fill:#9fb2cc}.formula{font-size:17px;font-family:"JetBrains Mono",monospace;fill:#e8f1ff}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#a)}.box{fill:#13283f;stroke:#3c5874;stroke-width:1.5}</style></defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/><text x="64" y="72" class="title">Mamba Block：把 SSM 分支与门控 MLP 合成一个块</text><text x="64" y="107" class="sub">对齐论文 Figure 3 与公开 Mamba-1 实现；Norm / Residual 画在块外，省略 batch 维</text>
  <g transform="translate(64 174)"><rect width="132" height="74" rx="17" class="box"/><text x="66" y="45" class="h" text-anchor="middle">输入 x</text></g><path d="M198 211h72" class="line"/><g transform="translate(282 174)"><rect width="148" height="74" rx="17" class="box"/><text x="74" y="33" class="h" text-anchor="middle">Norm</text><text x="74" y="57" class="small" text-anchor="middle">Pre-Norm</text></g><path d="M442 211h72" class="line"/><g transform="translate(526 158)"><rect width="202" height="106" rx="20" fill="#202650" stroke="#818cf8"/><text x="101" y="40" class="h" text-anchor="middle">输入投影</text><text x="101" y="69" class="formula" text-anchor="middle">D → 2ED</text><text x="101" y="92" class="small" text-anchor="middle">论文实验 E = 2</text></g>
  <path d="M728 211 C775 211 775 325 822 325" class="line"/><path d="M728 211 C770 211 690 676 744 676" class="line"/>
  <g transform="translate(822 289)"><rect width="122" height="72" rx="17" fill="#15334a" stroke="#38bdf8"/><text x="61" y="44" class="h" text-anchor="middle">x 分支</text></g><path d="M956 325h55" class="line"/><g transform="translate(1023 284)"><rect width="166" height="82" rx="17" class="box"/><text x="83" y="34" class="h" text-anchor="middle">因果 Conv1d</text><text x="83" y="61" class="small" text-anchor="middle">短程局部混合</text></g><path d="M1199 325h55" class="line"/><g transform="translate(1266 289)"><rect width="110" height="72" rx="17" fill="#26314e" stroke="#8b9bb3"/><text x="55" y="44" class="h" text-anchor="middle">SiLU</text></g>
  <path d="M1321 373 C1321 423 1068 423 1068 474" class="line"/>
  <g transform="translate(842 466)"><rect width="452" height="154" rx="24" fill="url(#core)" stroke="#6ee7b7" stroke-width="2"/><text x="226" y="38" class="h" text-anchor="middle">Selective SSM / Scan</text><text x="24" y="78" class="body">由当前内容生成：Δₜ、Bₜ、Cₜ</text><text x="24" y="109" class="body">学习并固定：结构化 A；另有直接跳连 D</text><text x="24" y="137" class="small">训练：并行扫描　·　推理：一步更新固定大小状态</text></g>
  <g transform="translate(744 640)"><rect width="122" height="72" rx="17" fill="#32264f" stroke="#c084fc"/><text x="61" y="44" class="h" text-anchor="middle">z 分支</text></g><path d="M866 676h12" class="line"/><g transform="translate(890 640)"><rect width="110" height="72" rx="17" fill="#392759" stroke="#c084fc"/><text x="55" y="44" class="h" text-anchor="middle">SiLU</text></g><path d="M1000 676h31" class="line"/>
  <g transform="translate(1043 640)"><circle cx="36" cy="36" r="34" fill="#123a34" stroke="#34d399" stroke-width="2"/><text x="36" y="44" class="h" text-anchor="middle">×</text></g><path d="M1068 620v16" class="line"/><path d="M1115 676h35" class="line"/><g transform="translate(1162 638)"><rect width="160" height="76" rx="17" fill="#19304a" stroke="#38bdf8"/><text x="80" y="32" class="h" text-anchor="middle">输出投影</text><text x="80" y="59" class="small" text-anchor="middle">ED → D</text></g>
  <path d="M1322 716 C1322 786 228 786 228 249" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="694" y="815" class="body" text-anchor="middle" fill="#fbbf24">Residual：块输出与原输入相加</text>
  <g transform="translate(64 694)"><rect width="430" height="94" rx="18" fill="#2d2112" stroke="#f59e0b"/><text x="20" y="35" class="h">不是 Transformer Block</text><text x="20" y="66" class="body">没有 self-attention，也没有独立 MLP 子块</text></g>
  <text x="64" y="865" class="small">参数主要在输入/输出线性投影，约 3ED²；内层 SSM 参数相对较少。官方实现可融合 Conv、参数投影、scan 与 z 门以减少内存往返。</text>
</svg>
