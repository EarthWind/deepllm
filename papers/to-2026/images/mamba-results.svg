<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Mamba 2023 论文关键实验结果</title><desc id="desc">展示语言模型零样本平均分、选择参数消融，以及百万长度实验的适用范围。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#142039"/></linearGradient><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:20px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d3deec}.small{font-size:14px;fill:#9fb2cc}.score{font-size:17px;font-weight:800;fill:#fff}.big{font-size:35px;font-weight:800;fill:#fff}.grid{stroke:#2d425a;stroke-width:1}</style></defs>
  <rect width="1440" height="980" rx="28" fill="url(#bg)"/><text x="64" y="72" class="title">结果要点：语言追平强 Transformer，选择性来自可消融证据</text><text x="64" y="107" class="sub">数据来自 2023 v1；语言模型使用 Pile、GPT-NeoX tokenizer、最多 300B token，训练上下文 2048</text>
  <g transform="translate(64 151)"><rect width="782" height="410" rx="24" fill="#0d1a2c" stroke="#354961"/><text x="28" y="45" class="h">零样本下游任务平均分（论文 Table 3）</text><text x="28" y="76" class="small">LAMBADA、HellaSwag、PIQA、ARC、WinoGrande 等；不同 tokenizer 的模型也列入比较</text><g transform="translate(210 112)"><line x1="0" y1="0" x2="0" y2="250" class="grid"/><line x1="132" y1="0" x2="132" y2="250" class="grid"/><line x1="264" y1="0" x2="264" y2="250" class="grid"/><line x1="396" y1="0" x2="396" y2="250" class="grid"/><line x1="528" y1="0" x2="528" y2="250" class="grid"/><text x="0" y="-12" class="small">50</text><text x="132" y="-12" class="small">54</text><text x="264" y="-12" class="small">58</text><text x="396" y="-12" class="small">62</text><text x="528" y="-12" class="small">66</text></g><g transform="translate(28 126)"><text y="21" class="body">Pythia-1.4B</text><rect x="182" width="172" height="29" rx="7" fill="#475569"/><text x="364" y="21" class="score">55.2</text><text y="67" class="body">RWKV-1.5B</text><rect x="182" y="46" width="142" height="29" rx="7" fill="#64748b"/><text x="334" y="67" class="score">54.3</text><text y="113" class="body">Mamba-1.4B</text><rect x="182" y="92" width="320" height="29" rx="7" fill="#10b981"/><text x="512" y="113" class="score">59.7</text><text y="159" class="body">Pythia-2.8B</text><rect x="182" y="138" width="300" height="29" rx="7" fill="#475569"/><text x="492" y="159" class="score">59.1</text><text y="205" class="body">Mamba-2.8B</text><rect x="182" y="184" width="439" height="29" rx="7" fill="#34d399"/><text x="631" y="205" class="score">63.3</text><text y="251" class="body">GPT-J-6B</text><rect x="182" y="230" width="429" height="29" rx="7" fill="#2563eb"/><text x="621" y="251" class="score">63.0</text></g></g>
  <g transform="translate(882 151)"><rect width="494" height="410" rx="24" fill="#15233a" stroke="#4a5c75"/><text x="26" y="45" class="h">“3B 匹配 6B”该怎样说</text><g transform="translate(26 85)"><rect width="442" height="86" rx="17" fill="#14382f"/><text x="20" y="36" class="big" fill="#6ee7b7">63.3 vs 63.0</text><text x="20" y="67" class="small">Mamba-2.8B vs GPT-J-6B 平均分</text></g><text x="26" y="218" class="body">成立范围</text><text x="26" y="251" class="small">同一篇论文选取的零样本任务与训练设置</text><text x="26" y="292" class="body">不能外推</text><text x="26" y="325" class="small">指令遵循、聊天、工具调用或 7B+ scaling</text><text x="26" y="367" class="small">论文明确说大规模实验仍待验证</text></g>
  <g transform="translate(64 604)"><rect width="782" height="294" rx="24" fill="#0d1a2c" stroke="#354961"/><text x="28" y="45" class="h">选择参数消融：perplexity 越低越好</text><g transform="translate(28 72)"><text y="19" class="body">全部固定</text><rect x="170" width="481" height="26" rx="7" fill="#64748b"/><text x="660" y="20" class="score">10.93</text><text y="56" class="body">仅 B 选择</text><rect x="170" y="37" width="403" height="26" rx="7" fill="#6366f1"/><text x="582" y="57" class="score">10.15</text><text y="93" class="body">仅 C 选择</text><rect x="170" y="74" width="386" height="26" rx="7" fill="#8b5cf6"/><text x="565" y="94" class="score">9.98</text><text y="130" class="body">仅 Δ 选择</text><rect x="170" y="111" width="369" height="26" rx="7" fill="#0ea5e9"/><text x="548" y="131" class="score">9.81</text><text y="167" class="body">Δ + B + C</text><rect x="170" y="148" width="259" height="26" rx="7" fill="#10b981"/><text x="438" y="168" class="score">8.71</text></g><text x="28" y="270" class="small">Δ 单独贡献最大，三者组合存在协同；A 在论文主配置中不随 token 变化。</text></g>
  <g transform="translate(882 604)"><rect width="494" height="294" rx="24" fill="#1f273e" stroke="#52627a"/><text x="26" y="45" class="h">“百万长度”有两个不同证据</text><g transform="translate(26 78)"><rect width="442" height="78" rx="16" fill="#202a4e"/><text x="20" y="31" class="body">合成 Induction Heads</text><text x="20" y="59" class="small">训练 L=256，测试到 1,048,576，机制外推 4000×</text><rect y="96" width="442" height="78" rx="16" fill="#14382f"/><text x="20" y="127" class="body">真实 HG38 DNA</text><text x="20" y="155" class="small">上下文扩到 1,048,576，困惑度继续改善</text></g><text x="26" y="270" class="small">不是“3B 语言模型在百万 token 文本上完成通用问答”。</text></g>
  <text x="64" y="944" class="small">论文还在 16 kHz 原始音频和 DNA 上评估通用性；不同模态的模型、参数化和任务协议不同，不能把它们合成一个统一准确率。</text>
</svg>
