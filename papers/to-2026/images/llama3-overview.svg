<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Llama 3.1 模型家族与训练主线</title>
  <desc id="desc">解释论文中的 Llama 3 实验实际指 Llama 3.1，展示 8B、70B、405B 三个稠密模型从数据、8K 预训练、128K 长上下文扩展到六轮后训练和能力输出的流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#1b123b"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#5eead4"/></marker>
    <style>
      .zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:40px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a5b4fc}.h{font-size:24px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#cbd5e1}.small{font-size:15px;fill:#94a3b8}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:17px;fill:#e0f2fe}.box{fill:#0d2542;stroke:#355170;stroke-width:2}.tag{font-size:15px;font-weight:800;fill:#071326}
    </style>
  </defs>
  <rect width="1440" height="900" rx="30" fill="url(#bg)"/>
  <text x="70" y="72" class="zh title">Llama 3 不是一个模型，而是一条“数据 × 规模 × 简洁性”的家族路线</text>
  <text x="70" y="108" class="zh sub">论文统一把 2024 年 7 月的 Llama 3.1 简称为 Llama 3；正文结果均对应 128K 上下文版本</text>

  <rect x="70" y="148" width="1300" height="124" rx="22" class="box"/>
  <rect x="94" y="173" width="190" height="34" rx="17" fill="#fbbf24"/><text x="189" y="196" text-anchor="middle" class="zh tag">版本辨析</text>
  <text x="316" y="195" class="zh h">2024-04 · Llama 3</text><text x="316" y="232" class="zh b">8B / 70B · 8K · 主要面向英文</text>
  <path d="M625 210H708" stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="752" y="195" class="zh h">2024-07 · Llama 3.1</text><text x="752" y="232" class="zh b">8B / 70B / 405B · 128K · 多语言 · Instruct 支持工具调用</text>

  <text x="70" y="325" class="zh h">语言模型训练主线</text>
  <g class="zh">
    <rect x="70" y="356" width="220" height="260" rx="24" class="box"/>
    <rect x="94" y="379" width="106" height="32" rx="16" fill="#22d3ee"/><text x="147" y="401" text-anchor="middle" class="tag">DATA</text>
    <text x="94" y="451" class="h">约 15T 多语言 token</text>
    <text x="94" y="491" class="b">清洗 / 三层去重</text><text x="94" y="525" class="b">质量与领域分类器</text><text x="94" y="559" class="b">数据混合 scaling law</text><text x="94" y="594" class="mono">知识截止：2023-12</text>

    <rect x="340" y="356" width="230" height="260" rx="24" class="box"/>
    <rect x="364" y="379" width="140" height="32" rx="16" fill="#38bdf8"/><text x="434" y="401" text-anchor="middle" class="tag">PRE-TRAIN</text>
    <text x="364" y="451" class="h">15.6T token · 8K</text>
    <text x="364" y="491" class="b">标准稠密 Transformer</text><text x="364" y="525" class="b">405B · 126 层</text><text x="364" y="559" class="b">GQA · 8 个 KV heads</text><text x="364" y="594" class="mono">3.8 × 10²⁵ FLOPs</text>

    <rect x="620" y="356" width="230" height="260" rx="24" class="box"/>
    <rect x="644" y="379" width="164" height="32" rx="16" fill="#a78bfa"/><text x="726" y="401" text-anchor="middle" class="tag">LONG CONTEXT</text>
    <text x="644" y="451" class="h">8K → 128K</text>
    <text x="644" y="491" class="b">六个渐进长度阶段</text><text x="644" y="525" class="b">约 800B 训练 token</text><text x="644" y="559" class="b">短任务恢复 + needle 验证</text><text x="644" y="594" class="mono">RoPE θ = 500,000</text>

    <rect x="900" y="356" width="230" height="260" rx="24" class="box"/>
    <rect x="924" y="379" width="164" height="32" rx="16" fill="#c084fc"/><text x="1006" y="401" text-anchor="middle" class="tag">POST-TRAIN</text>
    <text x="924" y="451" class="h">六轮迭代对齐</text>
    <text x="924" y="491" class="b">RM rejection sampling</text><text x="924" y="525" class="b">SFT + DPO</text><text x="924" y="559" class="b">合成数据 + 人类偏好</text><text x="924" y="594" class="mono">能力专家辅助数据</text>

    <rect x="1180" y="356" width="190" height="260" rx="24" class="box"/>
    <rect x="1204" y="379" width="118" height="32" rx="16" fill="#fbbf24"/><text x="1263" y="401" text-anchor="middle" class="tag">CAPABILITY</text>
    <text x="1204" y="451" class="h">能力集合</text>
    <text x="1204" y="491" class="b">代码与推理</text><text x="1204" y="525" class="b">八种语言</text><text x="1204" y="559" class="b">长上下文</text><text x="1204" y="593" class="b">工具 / 可控性 / 事实性</text>
  </g>
  <g stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)"><line x1="290" y1="486" x2="329" y2="486"/><line x1="570" y1="486" x2="609" y2="486"/><line x1="850" y1="486" x2="889" y2="486"/><line x1="1130" y1="486" x2="1169" y2="486"/></g>

  <rect x="70" y="666" width="1300" height="136" rx="24" fill="#102f4d" stroke="#2dd4bf" stroke-width="2"/>
  <text x="98" y="707" class="zh h">“Herd”的含义：一条 405B flagship + 两个更易部署的小模型，而不是 MoE experts</text>
  <g class="zh">
    <rect x="99" y="732" width="278" height="44" rx="14" fill="#143a54"/><text x="238" y="761" text-anchor="middle" class="b">8B · 32 层 · 32 Q heads</text>
    <rect x="402" y="732" width="278" height="44" rx="14" fill="#21365a"/><text x="541" y="761" text-anchor="middle" class="b">70B · 80 层 · 64 Q heads</text>
    <rect x="705" y="732" width="310" height="44" rx="14" fill="#30265b"/><text x="860" y="761" text-anchor="middle" class="b">405B · 126 层 · 128 Q heads</text>
    <text x="1052" y="759" class="mono">KV heads 均为 8</text>
  </g>
  <text x="720" y="860" text-anchor="middle" class="zh sub">论文的核心经验不是“必须复杂”，而是在数据、系统与评测足够强时，简单稠密架构仍可持续扩展</text>
</svg>
