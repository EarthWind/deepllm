<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">ELMo 从字符输入到任务特定上下文表示的完整流程</title>
  <desc id="desc">每个词先经过字符卷积、高速公路网络和投影形成上下文无关表示，再由两层正向和反向语言模型编码。字符层与两层双向状态构成三层表示栈，冻结后由下游任务学习标量混合。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="violet-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel-title { font: 700 19px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .heading { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 500 11.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .tiny-light { font: 500 10.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffedd5; }
      .mono { font: 600 12.5px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .white { font: 700 15px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .blue-arrow { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#blue-arrow); }
      .violet-arrow { fill: none; stroke: #7c3aed; stroke-width: 2.4; marker-end: url(#violet-arrow); }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="70" y="58" class="title">ELMo：预训练 biLM 不直接给出一个答案，而是给下游任务一组可选择的语言层</text>
  <text x="70" y="91" class="subtitle">字符形态 → 局部句法 → 上下文语义；每个任务只学习少量混合参数，就能按需要组合冻结模型的内部状态。</text>

  <!-- stage headings -->
  <g>
    <circle cx="94" cy="141" r="18" fill="#0f766e"/>
    <text x="94" y="147" text-anchor="middle" class="white">1</text>
    <text x="123" y="147" class="panel-title">字符级词形表示</text>

    <circle cx="391" cy="141" r="18" fill="#2563eb"/>
    <text x="391" y="147" text-anchor="middle" class="white">2</text>
    <text x="420" y="147" class="panel-title">两层双向语言模型</text>

    <circle cx="889" cy="141" r="18" fill="#7c3aed"/>
    <text x="889" y="147" text-anchor="middle" class="white">3</text>
    <text x="918" y="147" class="panel-title">导出全部内部层</text>

    <circle cx="1168" cy="141" r="18" fill="#c2410c"/>
    <text x="1168" y="147" text-anchor="middle" class="white">4</text>
    <text x="1197" y="147" class="panel-title">注入任务模型</text>
  </g>

  <!-- stage 1 -->
  <g filter="url(#shadow)">
    <rect x="55" y="170" width="280" height="570" rx="18" fill="#ffffff" stroke="#99f6e4"/>
  </g>
  <rect x="82" y="205" width="226" height="62" rx="12" fill="#ecfeff" stroke="#2dd4bf"/>
  <text x="195" y="229" text-anchor="middle" class="label">输入 token：unhelpful</text>
  <text x="195" y="251" text-anchor="middle" class="mono">&lt;BOW&gt; u n h e l p f u l &lt;EOW&gt;</text>

  <path d="M195 267 L195 302" class="arrow"/>
  <rect x="82" y="302" width="226" height="66" rx="12" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="195" y="328" text-anchor="middle" class="label">字符 embedding</text>
  <text x="195" y="351" text-anchor="middle" class="small">每个字符映射为稠密向量</text>

  <path d="M195 368 L195 403" class="arrow"/>
  <rect x="82" y="403" width="226" height="116" rx="12" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="195" y="430" text-anchor="middle" class="label">多宽度 1-D CNN</text>
  <g fill="#0f766e">
    <rect x="107" y="448" width="36" height="14" rx="3"/>
    <rect x="151" y="448" width="56" height="14" rx="3" opacity="0.8"/>
    <rect x="215" y="448" width="68" height="14" rx="3" opacity="0.6"/>
  </g>
  <text x="195" y="490" text-anchor="middle" class="small">2048 个字符 n-gram filters</text>
  <text x="195" y="510" text-anchor="middle" class="tiny">卷积后按时间 max pooling</text>

  <path d="M195 519 L195 554" class="arrow"/>
  <rect x="82" y="554" width="226" height="76" rx="12" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="195" y="581" text-anchor="middle" class="label">2 × Highway</text>
  <text x="195" y="604" text-anchor="middle" class="small">变换路径与保留路径门控融合</text>

  <path d="M195 630 L195 665" class="arrow"/>
  <rect x="82" y="665" width="226" height="48" rx="12" fill="#0f766e"/>
  <text x="195" y="695" text-anchor="middle" class="white">线性投影 xₖᴸᴹ ∈ ℝ⁵¹²</text>

  <!-- arrow to biLM -->
  <path d="M335 455 L373 455" class="arrow"/>

  <!-- stage 2 -->
  <g filter="url(#shadow)">
    <rect x="373" y="170" width="470" height="570" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  </g>
  <text x="608" y="207" text-anchor="middle" class="heading">同一串 token，两条方向相反但目标互补的 LM</text>

  <rect x="404" y="232" width="408" height="74" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="428" y="259" class="label">原始位置</text>
  <g>
    <rect x="516" y="245" width="56" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="584" y="245" width="56" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="652" y="245" width="56" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="720" y="245" width="56" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="544" y="268" text-anchor="middle" class="mono">t₁</text>
    <text x="612" y="268" text-anchor="middle" class="mono">t₂</text>
    <text x="680" y="268" text-anchor="middle" class="mono">t₃</text>
    <text x="748" y="268" text-anchor="middle" class="mono">t₄</text>
  </g>

  <text x="404" y="346" class="label" fill="#1d4ed8">正向 LM：只利用左侧历史</text>
  <path d="M436 375 L772 375" class="blue-arrow"/>
  <g>
    <rect x="428" y="392" width="344" height="68" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="600" y="419" text-anchor="middle" class="heading">Forward LSTM · layer 1</text>
    <text x="600" y="444" text-anchor="middle" class="mono">h_fwd(k,1) = f(t₁,…,tₖ)</text>
    <rect x="428" y="475" width="344" height="68" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="600" y="502" text-anchor="middle" class="heading">Forward LSTM · layer 2</text>
    <text x="600" y="527" text-anchor="middle" class="mono">预测 p(tₖ₊₁ | t₁,…,tₖ)</text>
  </g>

  <text x="404" y="584" class="label" fill="#6d28d9">反向 LM：只利用右侧未来</text>
  <path d="M772 613 L436 613" class="violet-arrow"/>
  <g>
    <rect x="428" y="630" width="164" height="68" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="510" y="657" text-anchor="middle" class="heading">Backward · L1</text>
    <text x="510" y="682" text-anchor="middle" class="mono">h_bwd(k,1)</text>
    <rect x="608" y="630" width="164" height="68" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="690" y="657" text-anchor="middle" class="heading">Backward · L2</text>
    <text x="690" y="682" text-anchor="middle" class="mono">p(tₖ₋₁ | tₖ,…,tₙ)</text>
  </g>
  <text x="608" y="725" text-anchor="middle" class="tiny">两个方向共享字符编码器与词表 softmax；两套 LSTM 参数彼此独立。</text>

  <!-- stage 3 -->
  <path d="M843 455 L870 455" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="870" y="170" width="260" height="570" rx="18" fill="#ffffff" stroke="#c4b5fd"/>
  </g>
  <text x="1000" y="207" text-anchor="middle" class="heading">对每个位置 k 导出 3 层</text>

  <rect x="899" y="247" width="202" height="94" rx="14" fill="#f0fdfa" stroke="#14b8a6"/>
  <circle cx="929" cy="276" r="17" fill="#0f766e"/>
  <text x="929" y="282" text-anchor="middle" class="white">0</text>
  <text x="956" y="273" class="label">Token layer</text>
  <text x="956" y="295" class="mono">hₖ,₀=[xₖ;xₖ]</text>
  <text x="1000" y="326" text-anchor="middle" class="tiny">词形；尚未读取句子上下文</text>

  <rect x="899" y="371" width="202" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <circle cx="929" cy="402" r="17" fill="#2563eb"/>
  <text x="929" y="408" text-anchor="middle" class="white">1</text>
  <text x="956" y="399" class="label">biLSTM layer 1</text>
  <text x="956" y="422" class="mono">[fwd₁ ; bwd₁]</text>
  <text x="1000" y="452" text-anchor="middle" class="small">更偏句法与局部关系</text>
  <text x="1000" y="472" text-anchor="middle" class="tiny">1024 = 512 + 512</text>

  <rect x="899" y="511" width="202" height="110" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <circle cx="929" cy="542" r="17" fill="#7c3aed"/>
  <text x="929" y="548" text-anchor="middle" class="white">2</text>
  <text x="956" y="539" class="label">biLSTM layer 2</text>
  <text x="956" y="562" class="mono">[fwd₂ ; bwd₂]</text>
  <text x="1000" y="592" text-anchor="middle" class="small">更偏词义与长程上下文</text>
  <text x="1000" y="612" text-anchor="middle" class="tiny">并非“高层永远更好”</text>

  <rect x="899" y="657" width="202" height="56" rx="12" fill="#111827"/>
  <text x="1000" y="681" text-anchor="middle" class="white">Rₖ = {hₖ,₀,hₖ,₁,hₖ,₂}</text>
  <text x="1000" y="701" text-anchor="middle" class="tiny" fill="#cbd5e1">整套表示随当前句子变化</text>

  <!-- stage 4 -->
  <path d="M1130 455 L1153 455" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1153" y="170" width="192" height="570" rx="18" fill="#ffffff" stroke="#fdba74"/>
  </g>
  <rect x="1178" y="240" width="142" height="80" rx="13" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1249" y="269" text-anchor="middle" class="label">Scalar Mix</text>
  <text x="1249" y="293" text-anchor="middle" class="mono">softmax(s₀,s₁,s₂)</text>

  <path d="M1249 320 L1249 365" class="arrow"/>
  <rect x="1178" y="365" width="142" height="100" rx="13" fill="#ffedd5" stroke="#f97316"/>
  <text x="1249" y="394" text-anchor="middle" class="label">ELMoₖᵗᵃˢᵏ</text>
  <text x="1249" y="420" text-anchor="middle" class="mono">γ Σ sⱼhₖ,ⱼ</text>
  <text x="1249" y="445" text-anchor="middle" class="tiny">任务特定的 1024 维向量</text>

  <path d="M1249 465 L1249 510" class="arrow"/>
  <rect x="1178" y="510" width="142" height="118" rx="13" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1249" y="540" text-anchor="middle" class="label">已有任务网络</text>
  <text x="1249" y="565" text-anchor="middle" class="small">BiDAF / ESIM</text>
  <text x="1249" y="587" text-anchor="middle" class="small">BiLSTM-CRF</text>
  <text x="1249" y="609" text-anchor="middle" class="small">Span coreference</text>

  <rect x="1178" y="645" width="142" height="78" rx="12" fill="#c2410c"/>
  <text x="1249" y="671" text-anchor="middle" class="white">冻结 biLM</text>
  <text x="1249" y="698" text-anchor="middle" class="tiny-light">论文默认只训练任务网络</text>
  <text x="1249" y="714" text-anchor="middle" class="tiny-light">与混合权重</text>

  <rect x="55" y="775" width="1290" height="52" rx="13" fill="#e2e8f0"/>
  <text x="700" y="799" text-anchor="middle" class="label">关键边界：ELMo 的“深层双向”来自两套独立方向的语言模型；方向只在同层输出处拼接，不像 BERT 那样在每层内联合注意左右上下文。</text>
  <text x="700" y="818" text-anchor="middle" class="small">预训练成本由 biLM 承担；下游迁移主要新增 3 个标量 logits、1 个 γ 和原任务网络参数。</text>
</svg>
