<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#24153f"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#adc0e4"/></marker></defs><rect width="1400" height="820" rx="30" fill="url(#bg)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="64" fill="#fff" font-size="32" font-weight="700">Superposition：用共享几何空间存储更多稀疏特征</text><text x="52" y="98" fill="#a7bce1" font-size="18">当特征数 n 超过表示维度 d，模型可以用近似正交、重叠的方向换取容量</text><rect x="55" y="170" width="300" height="470" rx="22" fill="#102c46" stroke="#2fc6de" stroke-width="2"/><text x="92" y="225" fill="#fff" font-size="25" font-weight="700">输入特征</text><text x="92" y="270" fill="#a8dce5" font-size="17">sparse x ∈ Rⁿ</text><g fill="#35c6dc"><rect x="98" y="330" width="34" height="34" rx="5"/><rect x="148" y="330" width="34" height="34" rx="5"/><rect x="198" y="330" width="34" height="34" rx="5"/><rect x="248" y="330" width="34" height="34" rx="5"/></g><g fill="#31516b"><rect x="98" y="380" width="34" height="34" rx="5"/><rect x="148" y="380" width="34" height="34" rx="5"/><rect x="198" y="380" width="34" height="34" rx="5"/><rect x="248" y="380" width="34" height="34" rx="5"/></g><text x="92" y="475" fill="#f1c879" font-size="17">大多数坐标为 0</text><text x="92" y="515" fill="#b4cce6" font-size="17">一次只激活少数 feature</text><line x1="370" y1="405" x2="455" y2="405" stroke="#adc0e4" stroke-width="4" marker-end="url(#a)"/><rect x="475" y="170" width="450" height="470" rx="22" fill="#172448" stroke="#9c76ec" stroke-width="2"/><text x="512" y="225" fill="#fff" font-size="25" font-weight="700">隐藏表示</text><text x="512" y="268" fill="#c6b8fa" font-size="17">h = W x，维度 d</text><circle cx="700" cy="420" r="145" fill="#322864" stroke="#a17cf0" stroke-width="2"/><path d="M700 420L700 267M700 420L838 372M700 420L625 544M700 420L570 355M700 420L780 520" stroke="#45d2df" stroke-width="7" stroke-linecap="round"/><g fill="#f2b747"><circle cx="700" cy="267" r="9"/><circle cx="838" cy="372" r="9"/><circle cx="625" cy="544" r="9"/><circle cx="570" cy="355" r="9"/><circle cx="780" cy="520" r="9"/></g><text x="565" y="610" fill="#f2c878" font-size="17">多个 feature 共享 d 个方向</text><line x1="945" y1="405" x2="1030" y2="405" stroke="#adc0e4" stroke-width="4" marker-end="url(#a)"/><rect x="1050" y="170" width="300" height="470" rx="22" fill="#29203f" stroke="#efad3d" stroke-width="2"/><text x="1085" y="225" fill="#fff" font-size="25" font-weight="700">代价与收益</text><text x="1085" y="280" fill="#f3ca7b" font-size="17">容量 ↑</text><text x="1085" y="320" fill="#f3ca7b" font-size="17">每个神经元的语义变混合</text><text x="1085" y="360" fill="#f3ca7b" font-size="17">feature 间有干扰</text><path d="M1110 450h180M1110 500h130M1110 550h95" stroke="#efb543" stroke-width="12" stroke-linecap="round"/><text x="1085" y="605" fill="#fff" font-size="17">polysemanticity</text><path d="M620 700h220" stroke="#f2d246" stroke-width="3" stroke-dasharray="10 10"/><text x="514" y="750" fill="#f3d95b" font-size="18">稀疏性越强，重叠方向越可能成为可行解</text></g></svg>
