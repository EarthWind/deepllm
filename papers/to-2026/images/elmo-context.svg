<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">静态词向量与 ELMo 上下文词表示的差异</title>
  <desc id="desc">同一个 play 在体育和戏剧句子中，静态词向量查同一行参数，而 ELMo 根据左右上下文分别生成不同表示。正向状态总结左侧，反向状态总结右侧，同位置拼接后再做层混合。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="violet-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel-title { font: 700 20px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .heading { font: 700 17px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 500 11.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 600 13px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .white { font: 700 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .blue-arrow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue-arrow); }
      .violet-arrow { fill: none; stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#violet-arrow); }
    </style>
  </defs>

  <rect width="1400" height="790" fill="#f8fafc"/>
  <text x="70" y="59" class="title">从“一词一向量”到“一次出现一个向量”</text>
  <text x="70" y="92" class="subtitle">ELMo 不预先枚举词义类别；它把整句作为函数输入，让同一词形在每次出现时获得不同表示。</text>

  <!-- static side -->
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="430" height="570" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="85" y="178" class="panel-title">静态 embedding：按词形查表</text>
  <text x="85" y="206" class="small">无论上下文如何，play 都读取同一行参数。</text>

  <rect x="87" y="250" width="366" height="72" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="108" y="280" class="label">The shortstop made a brilliant</text>
  <rect x="361" y="261" width="64" height="34" rx="8" fill="#2563eb"/>
  <text x="393" y="283" text-anchor="middle" class="white">play</text>

  <rect x="87" y="350" width="366" height="72" rx="13" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="108" y="380" class="label">They watched a Shakespeare</text>
  <rect x="361" y="361" width="64" height="34" rx="8" fill="#7c3aed"/>
  <text x="393" y="383" text-anchor="middle" class="white">play</text>

  <path d="M270 322 L270 456" class="arrow"/>
  <path d="M270 422 L270 456" class="arrow"/>
  <rect x="147" y="456" width="246" height="102" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="270" y="487" text-anchor="middle" class="heading">同一个 v(play)</text>
  <text x="270" y="516" text-anchor="middle" class="mono">embedding_table[id("play")]</text>
  <text x="270" y="542" text-anchor="middle" class="small">体育、表演、动词用法被压在一起</text>

  <rect x="87" y="599" width="366" height="75" rx="13" fill="#fff7ed" stroke="#fdba74"/>
  <text x="108" y="629" class="label">GloVe 最近邻（论文示例）</text>
  <text x="108" y="654" class="small">playing、game、played、player… 词形与词义混合</text>

  <!-- bridge -->
  <path d="M485 420 L536 420" class="arrow"/>
  <circle cx="510" cy="393" r="19" fill="#ffffff" stroke="#64748b"/>
  <text x="510" y="399" text-anchor="middle" class="heading">vs.</text>

  <!-- contextual side -->
  <g filter="url(#shadow)">
    <rect x="536" y="135" width="809" height="570" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  </g>
  <text x="566" y="178" class="panel-title">ELMo：表示是整句与位置的函数</text>
  <text x="566" y="206" class="small">正反向状态分别总结左右上下文，再在目标位置对齐；两句话因此走向不同的表示。</text>

  <!-- sports lane -->
  <rect x="566" y="240" width="747" height="184" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="590" y="271" class="heading">上下文 A · 体育动作</text>
  <g>
    <rect x="592" y="295" width="67" height="38" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="671" y="295" width="67" height="38" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="750" y="295" width="67" height="38" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="829" y="295" width="67" height="38" rx="8" fill="#2563eb"/>
    <rect x="908" y="295" width="67" height="38" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="625" y="319" text-anchor="middle" class="mono">made</text>
    <text x="704" y="319" text-anchor="middle" class="mono">a</text>
    <text x="783" y="319" text-anchor="middle" class="mono">brilliant</text>
    <text x="862" y="319" text-anchor="middle" class="white">play</text>
    <text x="941" y="319" text-anchor="middle" class="mono">today</text>
  </g>
  <path d="M600 357 L852 357" class="blue-arrow"/>
  <text x="600" y="382" class="small">h_fwd(play)：左侧摘要 “made a brilliant”</text>
  <path d="M970 395 L872 395" class="violet-arrow"/>
  <text x="982" y="401" class="small">h_bwd(play)：右侧摘要 “today”</text>
  <rect x="1094" y="286" width="188" height="100" rx="13" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1188" y="316" text-anchor="middle" class="label">ELMo(play | A)</text>
  <text x="1188" y="345" text-anchor="middle" class="mono">[体育 / 动作语境]</text>
  <text x="1188" y="370" text-anchor="middle" class="tiny">邻近同义用法，而非只邻近词形</text>

  <!-- theater lane -->
  <rect x="566" y="449" width="747" height="184" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="590" y="480" class="heading">上下文 B · 舞台作品</text>
  <g>
    <rect x="592" y="504" width="67" height="38" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <rect x="671" y="504" width="67" height="38" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <rect x="750" y="504" width="86" height="38" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <rect x="848" y="504" width="67" height="38" rx="8" fill="#7c3aed"/>
    <rect x="927" y="504" width="67" height="38" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="625" y="528" text-anchor="middle" class="mono">watched</text>
    <text x="704" y="528" text-anchor="middle" class="mono">a</text>
    <text x="793" y="528" text-anchor="middle" class="mono">Shakespeare</text>
    <text x="881" y="528" text-anchor="middle" class="white">play</text>
    <text x="960" y="528" text-anchor="middle" class="mono">inside</text>
  </g>
  <path d="M600 566 L871 566" class="blue-arrow"/>
  <text x="600" y="591" class="small">h_fwd(play)：左侧摘要 “watched a Shakespeare”</text>
  <path d="M994 604 L891 604" class="violet-arrow"/>
  <text x="1004" y="610" class="small">h_bwd(play)：右侧摘要 “inside”</text>
  <rect x="1094" y="495" width="188" height="100" rx="13" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1188" y="525" text-anchor="middle" class="label">ELMo(play | B)</text>
  <text x="1188" y="554" text-anchor="middle" class="mono">[戏剧 / 作品语境]</text>
  <text x="1188" y="579" text-anchor="middle" class="tiny">同一 token id，向量已不同</text>

  <rect x="566" y="651" width="747" height="30" rx="8" fill="#e2e8f0"/>
  <text x="939" y="671" text-anchor="middle" class="small">ELMo(play | A) ≠ ELMo(play | B)，但模型没有显式创建“play#sports / play#theater”词义 ID。</text>

  <rect x="55" y="735" width="1290" height="34" rx="10" fill="#0f172a"/>
  <text x="700" y="758" text-anchor="middle" class="white">上下文化发生在 token 级：同一句中的每个位置都有自己的双向状态和层混合结果；平均整句只是一种额外池化策略，不是 ELMo 的定义。</text>
</svg>
