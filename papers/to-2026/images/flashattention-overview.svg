<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">标准 Attention 与 FlashAttention 的数据流对比</title>
  <desc id="desc">标准实现把 N 乘 N 的分数和概率矩阵写入显存；FlashAttention 把小块搬入片上 SRAM，在一个融合内核中计算局部分数、在线 softmax 和输出归约，只把线性大小的输出与统计量写回显存。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#18264a"/></linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5a5"/><stop offset="1" stop-color="#38d7a6"/></linearGradient>
    <linearGradient id="slow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a94765"/><stop offset="1" stop-color="#e27267"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#a9bddb"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#a9bddb}.head{font-size:23px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#dce9fa}.small{font-size:14px;fill:#a9bddb}.dark{font-size:16px;font-weight:650;fill:#10243a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#eaf5ff}.big{font-size:27px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1188" cy="55" r="180" fill="#20d4a6" opacity=".06"/><circle cx="55" cy="705" r="210" fill="#e45f71" opacity=".06"/>
  <text x="54" y="62" class="sans title">同一个精确 Attention，为什么 FlashAttention 更快？</text>
  <text x="54" y="94" class="sans sub">改变的不是数学函数，而是 N×N 中间量在哪里产生、是否写回 HBM</text>

  <g filter="url(#shadow)">
    <rect x="52" y="130" width="557" height="438" rx="25" fill="#101f38" stroke="#7c4155" stroke-width="2"/>
    <rect x="671" y="130" width="557" height="438" rx="25" fill="#0c2633" stroke="#1bb899" stroke-width="2"/>
  </g>
  <text x="82" y="171" class="sans head">标准 Attention：算子之间往返 HBM</text>
  <text x="701" y="171" class="sans head">FlashAttention：分块 + 在线归约 + 融合</text>

  <g>
    <rect x="82" y="200" width="496" height="52" rx="13" fill="#20314d" stroke="#4c6486"/>
    <text x="330" y="232" text-anchor="middle" class="sans mono">HBM：Q, K, V</text>
    <path d="M330 253V278" stroke="#a9bddb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="91" y="286" width="118" height="62" rx="13" fill="#31435f"/><text x="150" y="312" text-anchor="middle" class="sans body">MatMul</text><text x="150" y="334" text-anchor="middle" class="sans small">QKᵀ</text>
    <path d="M210 317H238" stroke="#a9bddb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="247" y="278" width="166" height="78" rx="14" fill="url(#slow)"/><text x="330" y="309" text-anchor="middle" class="sans head">S : N × N</text><text x="330" y="335" text-anchor="middle" class="sans body">写回 / 再读 HBM</text>
    <path d="M414 317H442" stroke="#a9bddb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="451" y="286" width="118" height="62" rx="13" fill="#31435f"/><text x="510" y="312" text-anchor="middle" class="sans body">Mask</text><text x="510" y="334" text-anchor="middle" class="sans small">+ Softmax</text>
    <path d="M510 349V376H414" fill="none" stroke="#a9bddb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="247" y="366" width="166" height="78" rx="14" fill="url(#slow)"/><text x="330" y="397" text-anchor="middle" class="sans head">P : N × N</text><text x="330" y="423" text-anchor="middle" class="sans body">写回 / 再读 HBM</text>
    <path d="M246 405H210" stroke="#a9bddb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="91" y="374" width="118" height="62" rx="13" fill="#31435f"/><text x="150" y="400" text-anchor="middle" class="sans body">MatMul</text><text x="150" y="422" text-anchor="middle" class="sans small">PV</text>
    <path d="M150 437V469" stroke="#a9bddb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="82" y="478" width="496" height="58" rx="13" fill="#20314d" stroke="#4c6486"/><text x="330" y="504" text-anchor="middle" class="sans mono">HBM：O</text><text x="330" y="526" text-anchor="middle" class="sans small">训练时还常需为反向保存大矩阵</text>
  </g>

  <g>
    <rect x="701" y="200" width="226" height="115" rx="17" fill="#20314d" stroke="#4c6486"/>
    <text x="814" y="230" text-anchor="middle" class="sans mono">HBM（大、较慢）</text>
    <text x="814" y="260" text-anchor="middle" class="sans body">Qᵢ · Kⱼ · Vⱼ</text>
    <text x="814" y="287" text-anchor="middle" class="sans small">只搬当前需要的数据块</text>
    <path d="M928 257H971" stroke="#a9bddb" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="980" y="192" width="218" height="131" rx="18" fill="url(#flash)"/>
    <text x="1089" y="224" text-anchor="middle" class="sans dark">SRAM（小、快）</text>
    <text x="1089" y="253" text-anchor="middle" class="sans dark">Sᵢⱼ = QᵢKⱼᵀ</text>
    <text x="1089" y="278" text-anchor="middle" class="sans dark">online softmax</text>
    <text x="1089" y="303" text-anchor="middle" class="sans dark">局部 PᵢⱼVⱼ</text>

    <path d="M1089 324V361" stroke="#a9bddb" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="701" y="371" width="497" height="100" rx="18" fill="#173d42" stroke="#2dd4bf"/>
    <text x="949" y="402" text-anchor="middle" class="sans head">只保留每行状态</text>
    <text x="949" y="432" text-anchor="middle" class="sans mono">running max m · running sum ℓ · output O</text>
    <text x="949" y="456" text-anchor="middle" class="sans small">当前 Sᵢⱼ / Pᵢⱼ tile 用完即丢，不物化完整矩阵</text>
    <path d="M949 472V492" stroke="#a9bddb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="701" y="500" width="497" height="38" rx="12" fill="#22405b"/><text x="949" y="525" text-anchor="middle" class="sans mono">HBM：O 与 O(N) 归一化统计量</text>
  </g>

  <rect x="182" y="608" width="916" height="70" rx="20" fill="#142842" stroke="#456486"/>
  <text x="640" y="638" text-anchor="middle" class="sans big">数学仍是  O = softmax(QKᵀ / √d) V</text>
  <text x="640" y="663" text-anchor="middle" class="sans sub">FLOPs 仍为二次；额外内存从 O(N²) 降到 O(N)，关键收益是显著减少 HBM 读写</text>
</svg>
