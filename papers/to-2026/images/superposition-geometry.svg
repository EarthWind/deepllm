<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#07152e"/><stop offset="1" stop-color="#24153e"/></linearGradient></defs><rect width="1400" height="760" rx="30" fill="url(#c)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">几何图像：不是“挤在一起”，而是寻找低干扰的多面体方向</text><text x="52" y="96" fill="#a8bddf" font-size="18">当 n>d，最优 feature vectors 往往形成有规则的角度结构，而非随机重叠</text><rect x="60" y="160" width="570" height="500" rx="22" fill="#102c46" stroke="#2ec6de" stroke-width="2"/><text x="100" y="215" fill="#fff" font-size="25" font-weight="700">二维隐藏空间 d=2</text><line x1="145" y1="520" x2="525" y2="520" stroke="#8aa3c9" stroke-width="2"/><line x1="335" y1="590" x2="335" y2="255" stroke="#8aa3c9" stroke-width="2"/><circle cx="335" cy="420" r="155" fill="#183d57" stroke="#315d77"/><g stroke="#40d3df" stroke-width="7" stroke-linecap="round"><path d="M335 420L335 275"/><path d="M335 420L472 365"/><path d="M335 420L420 540"/><path d="M335 420L250 540"/><path d="M335 420L198 365"/></g><g fill="#f3b644"><circle cx="335" cy="275" r="9"/><circle cx="472" cy="365" r="9"/><circle cx="420" cy="540" r="9"/><circle cx="250" cy="540" r="9"/><circle cx="198" cy="365" r="9"/></g><text x="145" y="620" fill="#f2ca7c" font-size="17">五个 feature 共享二维平面</text><rect x="710" y="160" width="630" height="500" rx="22" fill="#29203f" stroke="#9d77ec" stroke-width="2"/><text x="750" y="215" fill="#fff" font-size="25" font-weight="700">多面体 / spherical code 直觉</text><text x="750" y="265" fill="#c9bafa" font-size="17">方向尽量均匀分散，降低最坏角度干扰</text><path d="M1030 320l110 80-42 140h-136l-42-140z" fill="#38295f" stroke="#a17cef" stroke-width="3"/><g fill="#41d2df"><circle cx="1030" cy="320" r="10"/><circle cx="1140" cy="400" r="10"/><circle cx="1098" cy="540" r="10"/><circle cx="962" cy="540" r="10"/><circle cx="920" cy="400" r="10"/></g><g stroke="#f0b441" stroke-width="3"><path d="M1030 320l114 80M1030 320l-110 80M1140 400l-42 140M920 400l42 140"/></g><text x="760" y="610" fill="#f2ca7c" font-size="17">论文把这种几何与 uniform polytopes 联系起来</text></g></svg>
