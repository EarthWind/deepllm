<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MuZero 潜空间 MCTS 与含奖励回传</title><desc id="desc">搜索通过PUCT选择潜状态动作，动力学函数扩展一个隐藏状态和即时奖励，预测函数输出策略价值，回传累计折扣奖励与叶节点价值。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset="1" stop-color="#14203c"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7dd3fc"/></marker><style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.m{font-size:20px;font-weight:650}.s{font-size:17px}.xs{font-size:15px;fill:#aebfd9}.card{fill:#132440;stroke:#31517a;stroke-width:2}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><text class="t h" x="60" y="62">MuZero MCTS：Q 不再只有叶节点价值，还要累计预测奖励</text><text class="t xs" x="60" y="93">每次 simulation 至多新增一次 gθ 与一次 fθ 调用，计算阶数与 AlphaZero 相近</text>
  <g filter="url(#shadow)"><rect class="card" x="55" y="140" width="275" height="390" rx="22"/><text class="t m" x="82" y="180">① Selection</text><circle cx="192" cy="233" r="20" fill="#125477" stroke="#67d7f3" stroke-width="3"/><g fill="#183c58" stroke="#67d7f3" stroke-width="2"><circle cx="120" cy="307" r="14"/><circle cx="192" cy="307" r="14"/><circle cx="264" cy="307" r="14"/><circle cx="164" cy="385" r="11"/><circle cx="220" cy="385" r="11"/></g><g stroke="#67d7f3" stroke-width="3"><path d="M177 247l-47 48M192 253v39M207 247l47 48M188 321l-20 52M198 321l18 52"/></g><path d="M192 253v39M192 321l24 52" stroke="#fbbf24" stroke-width="7"/><text class="t s" x="82" y="435">argmax [Q̄(s,a) + U(s,a)]</text><text class="t xs" x="82" y="468">P 高、访问少、累计回报高</text><text class="t xs" x="82" y="495">Atari 用树内 min–max 归一化 Q</text></g>
  <path class="line" d="M330 335H370"/>
  <g filter="url(#shadow)"><rect class="card" x="375" y="140" width="265" height="390" rx="22"/><text class="t m" x="402" y="180">② Expand in latent space</text><circle cx="508" cy="245" r="22" fill="#4d3a9c" stroke="#b6a3ff" stroke-width="3"/><path d="M508 267v62" stroke="#b6a3ff" stroke-width="4" marker-end="url(#arrow)"/><rect x="535" y="276" width="66" height="28" rx="14" fill="#5b3c55"/><text class="t xs" text-anchor="middle" x="568" y="296">rˡ = 0.8</text><circle cx="508" cy="355" r="22" fill="#6d4bc0" stroke="#b6a3ff" stroke-width="3"/><text class="t s" text-anchor="middle" x="508" y="252">sˡ⁻¹</text><text class="t s" text-anchor="middle" x="508" y="362">sˡ</text><text class="t s" x="402" y="421">(rˡ, sˡ) = gθ(sˡ⁻¹, aˡ)</text><text class="t s" x="402" y="453">(pˡ, vˡ) = fθ(sˡ)</text><text class="t xs" x="402" y="486">不调用真实环境，不重建 oₜ₊ₗ</text></g>
  <path class="line" d="M640 335H680"/>
  <g filter="url(#shadow)"><rect x="685" y="140" width="460" height="390" rx="22" fill="#103239" stroke="#34d399" stroke-width="2"/><text class="t m" x="715" y="180">③ Backup discounted return</text><g transform="translate(735 219)"><circle cx="50" cy="0" r="15" fill="#166054" stroke="#34d399" stroke-width="3"/><circle cx="50" cy="72" r="15" fill="#166054" stroke="#34d399" stroke-width="3"/><circle cx="50" cy="144" r="15" fill="#166054" stroke="#34d399" stroke-width="3"/><path d="M50 129V89M50 57V17" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/><text class="t xs" x="85" y="6">r³ + γvˡ</text><text class="t xs" x="85" y="78">r² + γr³ + γ²vˡ</text><text class="t xs" x="85" y="150">r¹ + γr² + γ²r³ + γ³vˡ</text></g><text class="t s" x="715" y="417">Gᵏ = Σ γᵗ rᵏ⁺¹⁺ᵗ + γˡ⁻ᵏ vˡ</text><text class="t xs" x="715" y="454">Q ← (N·Q + Gᵏ)/(N+1)；N ← N+1</text><text class="t xs" x="715" y="485">双人零和棋类还需按执子方转换价值视角</text></g>
  <g transform="translate(55 572)"><rect width="1090" height="94" rx="18" fill="#0b1930" stroke="#29496e"/><text class="t m" x="28" y="36">PUCT</text><text class="t s" x="105" y="36">U = P(s,a) · √ΣN /(1+N) · [c₁ + log((ΣN+c₂+1)/c₂)]</text><text class="t xs" x="28" y="69">论文：c₁=1.25，c₂=19652；board games 800 simulations，Atari 50 simulations。</text></g>
</svg>
