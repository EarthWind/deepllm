<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#07162e"/><stop offset="1" stop-color="#24153f"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#afc1e3"/></marker></defs><rect width="1400" height="760" rx="30" fill="url(#c)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">Proof search：语言模型跳出局部闭包，符号引擎验证新状态</text><text x="52" y="96" fill="#a8bee2" font-size="18">辅助构造是无限分支点；beam search 保留多个候选，避免一次错误提议终止搜索</text><g transform="translate(70,200)"><rect width="250" height="320" rx="20" fill="#102d46" stroke="#2ec6de" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">当前状态</text><path d="M42 120L125 70l85 90-83 100z" fill="none" stroke="#48d3a4" stroke-width="5"/><text x="38" y="285" fill="#a8dce6" font-size="17">facts + unresolved goal</text></g><g transform="translate(380,200)"><rect width="280" height="320" rx="20" fill="#172449" stroke="#9c76ed" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">LM proposals</text><rect x="38" y="105" width="200" height="50" rx="10" fill="#3c2d69"/><text x="64" y="137" fill="#fff" font-size="16">construct D midpoint</text><rect x="38" y="175" width="200" height="50" rx="10" fill="#3c2d69"/><text x="64" y="207" fill="#fff" font-size="16">construct E ⟂ line</text><rect x="38" y="245" width="200" height="50" rx="10" fill="#3c2d69"/><text x="78" y="277" fill="#fff" font-size="16">beam top-k</text></g><g transform="translate(720,200)"><rect width="280" height="320" rx="20" fill="#29203f" stroke="#efad3c" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">DD + AR</text><path d="M42 125h195M42 165h150M42 205h180M42 245h135" stroke="#f2c878" stroke-width="8" stroke-linecap="round"/><text x="38" y="285" fill="#f2ca78" font-size="16">deduction closure / goal check</text></g><g transform="translate(1060,200)"><rect width="270" height="320" rx="20" fill="#103d3a" stroke="#48d6a7" stroke-width="2"/><text x="38" y="58" fill="#fff" font-size="24" font-weight="700">证明输出</text><path d="M42 120h180M42 160h140M42 200h170" stroke="#a8efd2" stroke-width="8" stroke-linecap="round"/><text x="38" y="275" fill="#a8efd2" font-size="17">human-readable proof</text></g><path d="M325 360h50M665 360h45M1005 360h45" stroke="#afc1e3" stroke-width="4" marker-end="url(#a)"/><path d="M1190 580C900 665 460 665 180 580" fill="none" stroke="#f2d34b" stroke-width="3" stroke-dasharray="10 10"/><text x="420" y="700" fill="#f2d554" font-size="18">搜索循环：proposal → deduction closure → new proposal → theorem found</text></g></svg>
