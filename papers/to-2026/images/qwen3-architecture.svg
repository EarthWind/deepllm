<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3 dense 与 MoE 架构、QK-Norm、GQA 和参数激活比例</title>
  <desc id="desc">对比六个稠密模型与两个混合专家模型，展示 128 个专家中每 token 选择 8 个、235B 总参数与 22B 激活参数，以及 QK-Norm 和 GQA。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#18123d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
    <style>.zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:40px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a5b4fc}.h{font-size:24px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#cbd5e1}.small{font-size:15px;fill:#94a3b8}.num{font-size:28px;font-weight:800;fill:#67e8f9}.box{fill:#0d2944;stroke:#345674;stroke-width:2}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:16px;fill:#c4b5fd}</style>
  </defs>
  <rect width="1440" height="900" rx="30" fill="url(#bg)"/>
  <text x="70" y="70" class="zh title">架构变化不激进，但每一处都在服务“稳定训练 + 低激活成本”</text>
  <text x="70" y="108" class="zh sub">共同骨架：decoder-only · pre-RMSNorm · RoPE · SwiGLU · GQA；新增 QK-Norm，移除 QKV bias</text>

  <rect x="70" y="150" width="615" height="330" rx="26" class="box"/>
  <text x="100" y="196" class="zh h">Dense：每个 token 经过同一组 FFN 参数</text>
  <g class="zh">
    <rect x="100" y="235" width="150" height="58" rx="16" fill="#123a4b" stroke="#22d3ee"/><text x="175" y="271" text-anchor="middle" class="b">Pre-RMSNorm</text>
    <line x1="250" y1="264" x2="295" y2="264" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="315" y="220" width="190" height="88" rx="16" fill="#2d245b" stroke="#a78bfa"/>
    <text x="410" y="254" text-anchor="middle" class="b">QK-Norm + RoPE</text><text x="410" y="282" text-anchor="middle" class="small">再计算 attention logits</text>
    <line x1="505" y1="264" x2="545" y2="264" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="565" y="235" width="90" height="58" rx="16" fill="#123a4b" stroke="#22d3ee"/><text x="610" y="271" text-anchor="middle" class="b">FFN</text>
    <text x="100" y="355" class="num">6 个规模：0.6B · 1.7B · 4B · 8B · 14B · 32B</text>
    <text x="100" y="397" class="b">GQA 让多个 query heads 共享较少的 K/V heads</text>
    <text x="100" y="433" class="small">32B：64 Q / 8 KV；参数量不是 KV cache、吞吐或延迟的唯一决定量</text>
  </g>

  <rect x="735" y="150" width="635" height="330" rx="26" fill="#241d48" stroke="#8b5cf6" stroke-width="2"/>
  <text x="765" y="196" class="zh h">MoE：attention 共享，FFN 按 token 稀疏路由</text>
  <g class="zh">
    <rect x="765" y="230" width="130" height="62" rx="16" fill="#123a4b" stroke="#22d3ee"/><text x="830" y="268" text-anchor="middle" class="b">Token h</text>
    <line x1="895" y1="261" x2="940" y2="261" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="960" y="218" width="140" height="86" rx="16" fill="#3a2a18" stroke="#f59e0b"/><text x="1030" y="252" text-anchor="middle" class="b">Router</text><text x="1030" y="280" text-anchor="middle" class="small">Top-8</text>
    <line x1="1100" y1="261" x2="1145" y2="261" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <g fill="#173a59" stroke="#4f7ca0"><rect x="1165" y="218" width="38" height="38" rx="7"/><rect x="1211" y="218" width="38" height="38" rx="7"/><rect x="1257" y="218" width="38" height="38" rx="7"/><rect x="1303" y="218" width="38" height="38" rx="7"/><rect x="1165" y="266" width="38" height="38" rx="7"/><rect x="1211" y="266" width="38" height="38" rx="7"/><rect x="1257" y="266" width="38" height="38" rx="7"/><rect x="1303" y="266" width="38" height="38" rx="7"/></g>
    <g fill="#f59e0b" stroke="#fde68a"><rect x="1211" y="218" width="38" height="38" rx="7"/><rect x="1303" y="266" width="38" height="38" rx="7"/></g>
    <text x="765" y="355" class="num">128 experts / 每 token 激活 8 个</text>
    <text x="765" y="397" class="b">30B-A3B：总 30B，激活约 3B　·　235B-A22B：激活约 22B</text>
    <text x="765" y="433" class="small">没有 shared expert；采用 global-batch load balancing 促进专家分工</text>
  </g>

  <rect x="70" y="526" width="1300" height="250" rx="26" class="box"/>
  <text x="100" y="572" class="zh h">三个比例不要混为一谈</text>
  <g class="zh">
    <rect x="100" y="610" width="365" height="120" rx="20" fill="#123a4b" stroke="#22d3ee"/>
    <text x="128" y="650" class="h">激活参数 / 总参数</text><text x="128" y="692" class="num">22 / 235 = 9.36%</text><text x="128" y="718" class="small">包含 attention 与被选专家等活跃部分</text>
    <rect x="535" y="610" width="365" height="120" rx="20" fill="#30223d" stroke="#f59e0b"/>
    <text x="563" y="650" class="h">激活专家 / 总专家</text><text x="563" y="692" class="num">8 / 128 = 6.25%</text><text x="563" y="718" class="small">不等于激活参数比例</text>
    <rect x="970" y="610" width="365" height="120" rx="20" fill="#103d3a" stroke="#2dd4bf"/>
    <text x="998" y="650" class="h">KV heads / Q heads</text><text x="998" y="692" class="num">4 / 64 = 6.25%</text><text x="998" y="718" class="small">只描述 GQA head 数关系</text>
  </g>
  <rect x="70" y="812" width="1300" height="54" rx="18" fill="#30223d" stroke="#a78bfa"/>
  <text x="720" y="847" text-anchor="middle" class="zh b">“每 token 激活 22B”不等于 235B 权重无需存储，也不等于实际速度恰好提升 235/22 倍</text>
</svg>
