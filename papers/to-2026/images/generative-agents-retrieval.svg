<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Generative Agents 三因素记忆检索</title>
  <desc id="desc">记忆检索将时近性、重要性和与当前查询的语义相关性分别归一化后相加，并返回上下文窗口可容纳的最高分记忆。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#4f46e5"/></marker>
    <style>.title{font:700 31px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 20px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 14px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.mono{font:600 15px "JetBrains Mono",Consolas,monospace;fill:#1e3a8a}.value{font:700 15px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}</style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="55" y="54" class="title">检索不是“最近记忆优先”：它把时间、显著性与当前语境放在同一张表里</text>
  <text x="55" y="84" class="subtitle">论文设置 γ = 0.995，三项权重均为 1；下方示例分数用于解释排序，不是论文 Figure 6 的逐项复算。</text>

  <g transform="translate(55 120)" filter="url(#shadow)">
    <rect width="1290" height="620" rx="28" fill="#fff" stroke="#cbd5e1"/>
    <g transform="translate(36 38)">
      <rect width="1218" height="74" rx="18" fill="#eef2ff" stroke="#a5b4fc"/>
      <text x="28" y="31" class="head">当前查询 q</text>
      <text x="28" y="56" class="body">“我现在最期待什么？” → embedding(q)</text>
      <text x="1190" y="46" text-anchor="end" class="mono">s(m,q)=r̂(m)+î(m)+rel̂(m,q)</text>
    </g>

    <g transform="translate(36 142)">
      <rect width="355" height="182" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="22" y="37" class="head">Recency · 时近性</text>
      <text x="22" y="75" class="mono">r(m) = γ^(t − t_last_access)</text>
      <text x="22" y="108" class="body">按“上次被检索”的时间衰减</text>
      <text x="22" y="137" class="small">不是按创建时间；旧记忆被重新访问后会回到注意区</text>
      <rect x="22" y="151" width="311" height="12" rx="6" fill="#dbeafe"/><rect x="22" y="151" width="231" height="12" rx="6" fill="#2563eb"/>
    </g>
    <g transform="translate(431 142)">
      <rect width="355" height="182" rx="20" fill="#fff7ed" stroke="#fdba74"/>
      <text x="22" y="37" class="head">Importance · 重要性</text>
      <text x="22" y="75" class="mono">i(m) ∈ {1, 2, …, 10}</text>
      <text x="22" y="108" class="body">创建时由 LLM 评价事件的 poignancy</text>
      <text x="22" y="137" class="small">刷牙通常低分；分手、录取、约会等通常高分</text>
      <rect x="22" y="151" width="311" height="12" rx="6" fill="#ffedd5"/><rect x="22" y="151" width="279" height="12" rx="6" fill="#ea580c"/>
    </g>
    <g transform="translate(826 142)">
      <rect width="392" height="182" rx="20" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="22" y="37" class="head">Relevance · 相关性</text>
      <text x="22" y="75" class="mono">rel(m,q)=cos(e(m), e(q))</text>
      <text x="22" y="108" class="body">记忆文本与查询文本的 embedding 相似度</text>
      <text x="22" y="137" class="small">让“派对”查询跳过刚发生但无关的冰箱状态</text>
      <rect x="22" y="151" width="348" height="12" rx="6" fill="#d1fae5"/><rect x="22" y="151" width="320" height="12" rx="6" fill="#059669"/>
    </g>

    <path d="M214 324V367M609 324V367M1022 324V367" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(36 382)">
      <rect width="1218" height="192" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="20" y="34" class="head">示例排序</text>
      <text x="565" y="34" class="small">三列先各自在候选集合中 min–max 到 [0,1]，再相加</text>
      <g transform="translate(20 53)">
        <text x="0" y="18" class="small">记忆</text><text x="692" y="18" class="small">r̂</text><text x="790" y="18" class="small">î</text><text x="888" y="18" class="small">rel̂</text><text x="1000" y="18" class="small">总分</text><text x="1118" y="18" class="small">结果</text>
        <rect y="30" width="1178" height="38" rx="9" fill="#ecfdf5"/>
        <text x="14" y="55" class="body">Isabella 邀请 Klaus 17:00 去 Hobbs Cafe 参加派对</text><text x="690" y="55" class="value">0.71</text><text x="788" y="55" class="value">1.00</text><text x="886" y="55" class="value">1.00</text><text x="998" y="55" class="value">2.71</text><text x="1118" y="55" class="value" fill="#047857">取回</text>
        <rect y="74" width="1178" height="38" rx="9" fill="#eef2ff"/>
        <text x="14" y="99" class="body">我很重视派对，应预留时间并邀请朋友（reflection）</text><text x="690" y="99" class="value">1.00</text><text x="788" y="99" class="value">0.89</text><text x="886" y="99" class="value">0.54</text><text x="998" y="99" class="value">2.43</text><text x="1118" y="99" class="value" fill="#4338ca">取回</text>
        <rect y="118" width="1178" height="38" rx="9" fill="#fff"/>
        <text x="14" y="143" class="body">图书馆的桌子空着</text><text x="690" y="143" class="value">0.93</text><text x="788" y="143" class="value">0.11</text><text x="886" y="143" class="value">0.00</text><text x="998" y="143" class="value">1.04</text><text x="1118" y="143" class="small">跳过</text>
      </g>
    </g>
  </g>

  <g transform="translate(55 766)"><rect width="1290" height="36" rx="14" fill="#fef2f2" stroke="#fca5a5"/><text x="645" y="24" text-anchor="middle" class="small">工程陷阱：last_access 会形成“越常取越常取”的反馈环；LLM 重要性评分也可能把偏见固化成长期注意力。</text></g>
</svg>
