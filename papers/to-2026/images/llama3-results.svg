<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Llama 3.1 三种尺寸的精选后训练评测结果</title>
  <desc id="desc">按 MMLU、HumanEval、GSM8K、MATH、BFCL 和 MGSM 六项指标比较 Llama 3.1 8B、70B 与 405B，强调不同指标不可横向比较且评测协议不同。</desc>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#18113a"/></linearGradient>
    <style>.zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:40px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a5b4fc}.h{font-size:23px;font-weight:750;fill:#f8fafc}.b{font-size:16px;fill:#cbd5e1}.small{font-size:14px;fill:#94a3b8}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:16px;fill:#e0f2fe}.box{fill:#0d2542;stroke:#355170;stroke-width:2}.v8{fill:#22d3ee}.v70{fill:#818cf8}.v405{fill:#c084fc}</style>
  </defs>
  <rect width="1440" height="920" rx="30" fill="url(#bg5)"/>
  <text x="70" y="72" class="zh title">模型规模持续带来收益，但 benchmark 数字必须连同协议一起读</text>
  <text x="70" y="108" class="zh sub">论文 Table 2 的精选结果 · 均为 finetuned Llama 3.1；每一栏的 shots、CoT 与 metric 可能不同</text>

  <g class="zh">
    <circle cx="1020" cy="82" r="9" class="v8"/><text x="1040" y="88" class="b">8B</text>
    <circle cx="1112" cy="82" r="9" class="v70"/><text x="1132" y="88" class="b">70B</text>
    <circle cx="1218" cy="82" r="9" class="v405"/><text x="1238" y="88" class="b">405B</text>
  </g>

  <g class="zh">
    <rect x="70" y="154" width="405" height="205" rx="22" class="box"/>
    <text x="96" y="194" class="h">MMLU · 5-shot · accuracy</text>
    <text x="96" y="230" class="small">通用知识 / 多任务</text>
    <rect x="96" y="258" width="227" height="18" rx="9" class="v8"/><text x="336" y="273" class="mono">69.4</text>
    <rect x="96" y="290" width="274" height="18" rx="9" class="v70"/><text x="383" y="305" class="mono">83.6</text>
    <rect x="96" y="322" width="286" height="18" rx="9" class="v405"/><text x="395" y="337" class="mono">87.3</text>

    <rect x="518" y="154" width="405" height="205" rx="22" class="box"/>
    <text x="544" y="194" class="h">HumanEval · 0-shot · pass@1</text>
    <text x="544" y="230" class="small">Python 函数生成</text>
    <rect x="544" y="258" width="238" height="18" rx="9" class="v8"/><text x="795" y="273" class="mono">72.6</text>
    <rect x="544" y="290" width="264" height="18" rx="9" class="v70"/><text x="821" y="305" class="mono">80.5</text>
    <rect x="544" y="322" width="292" height="18" rx="9" class="v405"/><text x="849" y="337" class="mono">89.0</text>

    <rect x="966" y="154" width="404" height="205" rx="22" class="box"/>
    <text x="992" y="194" class="h">GSM8K · 8-shot CoT · EM</text>
    <text x="992" y="230" class="small">小学数学推理</text>
    <rect x="992" y="258" width="277" height="18" rx="9" class="v8"/><text x="1282" y="273" class="mono">84.5</text>
    <rect x="992" y="290" width="312" height="18" rx="9" class="v70"/><text x="1317" y="305" class="mono">95.1</text>
    <rect x="992" y="322" width="318" height="18" rx="9" class="v405"/><text x="1323" y="337" class="mono">96.8</text>

    <rect x="70" y="400" width="405" height="205" rx="22" class="box"/>
    <text x="96" y="440" class="h">MATH · 0-shot CoT · final EM</text>
    <text x="96" y="476" class="small">竞赛数学</text>
    <rect x="96" y="504" width="170" height="18" rx="9" class="v8"/><text x="279" y="519" class="mono">51.9</text>
    <rect x="96" y="536" width="223" height="18" rx="9" class="v70"/><text x="332" y="551" class="mono">68.0</text>
    <rect x="96" y="568" width="242" height="18" rx="9" class="v405"/><text x="351" y="583" class="mono">73.8</text>

    <rect x="518" y="400" width="405" height="205" rx="22" class="box"/>
    <text x="544" y="440" class="h">BFCL · function-call accuracy</text>
    <text x="544" y="476" class="small">零样本工具调用</text>
    <rect x="544" y="504" width="250" height="18" rx="9" class="v8"/><text x="807" y="519" class="mono">76.1</text>
    <rect x="544" y="536" width="278" height="18" rx="9" class="v70"/><text x="835" y="551" class="mono">84.8</text>
    <rect x="544" y="568" width="290" height="18" rx="9" class="v405"/><text x="847" y="583" class="mono">88.5</text>

    <rect x="966" y="400" width="404" height="205" rx="22" class="box"/>
    <text x="992" y="440" class="h">MGSM · 0-shot CoT · EM</text>
    <text x="992" y="476" class="small">多语言数学，语言平均</text>
    <rect x="992" y="504" width="226" height="18" rx="9" class="v8"/><text x="1231" y="519" class="mono">68.9</text>
    <rect x="992" y="536" width="285" height="18" rx="9" class="v70"/><text x="1290" y="551" class="mono">86.9</text>
    <rect x="992" y="568" width="301" height="18" rx="9" class="v405"/><text x="1306" y="583" class="mono">91.6</text>
  </g>

  <rect x="70" y="656" width="1300" height="170" rx="24" fill="#102f4d" stroke="#2dd4bf" stroke-width="2"/>
  <g class="zh">
    <text x="98" y="699" class="h">怎样避免把这张图读错</text>
    <text x="98" y="738" class="b">• 横向只比较同一 benchmark 的模型规模；不能说 89 HumanEval 与 96.8 GSM8K 谁“更强”</text>
    <text x="98" y="773" class="b">• 论文有时取竞争模型公开值与内部复测值中的较优者；API 模型也未必能取得 log-prob</text>
    <text x="98" y="808" class="b">• HumanEval 仅 164 题，论文给 95% CI；污染分析也显示不同数据集的可测性与影响并不一致</text>
  </g>
  <text x="720" y="879" text-anchor="middle" class="zh sub">最终结论来自自动评测、约 7,000 条独立人评 prompt、鲁棒性与污染分析的组合，而不是某一个排行榜数字</text>
</svg>
