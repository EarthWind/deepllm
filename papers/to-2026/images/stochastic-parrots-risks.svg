<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#08162e"/><stop offset="1" stop-color="#21163d"/></linearGradient></defs><rect width="1400" height="760" rx="28" fill="url(#c)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">风险不是单一模型属性，而是社会技术系统的乘积</text><text x="52" y="96" fill="#a9bde4" font-size="18">模型能力、数据分布、部署场景和权力关系共同决定后果</text><line x1="160" y1="590" x2="1260" y2="590" stroke="#7790b8" stroke-width="3"/><line x1="160" y1="180" x2="160" y2="590" stroke="#7790b8" stroke-width="3"/><text x="90" y="190" fill="#b4c7eb" font-size="18">潜在影响</text><text x="1160" y="635" fill="#b4c7eb" font-size="18">扩展范围</text>
<g><circle cx="360" cy="470" r="95" fill="#29c3dc" opacity=".82"/><text x="294" y="465" fill="#061729" font-size="22" font-weight="700">数据质量</text><text x="302" y="495" fill="#061729" font-size="17">来源/许可</text><circle cx="620" cy="375" r="105" fill="#9b78ed" opacity=".85"/><text x="560" y="370" fill="#130f28" font-size="22" font-weight="700">代表性</text><text x="562" y="400" fill="#130f28" font-size="17">谁被看见</text><circle cx="880" cy="290" r="112" fill="#f0ad3c" opacity=".9"/><text x="815" y="285" fill="#2b1b05" font-size="22" font-weight="700">部署语境</text><text x="823" y="315" fill="#2b1b05" font-size="17">谁来承担</text><circle cx="1120" cy="215" r="120" fill="#47d6a4" opacity=".9"/><text x="1056" y="210" fill="#062d29" font-size="22" font-weight="700">系统性后果</text><text x="1082" y="240" fill="#062d29" font-size="17">环境/权力</text></g><path d="M240 535C470 485 520 430 620 375S790 315 880 290s140-65 240-75" fill="none" stroke="#f5f8ff" stroke-width="4" stroke-dasharray="12 10"/><text x="238" y="665" fill="#d2ddf8" font-size="18">不要把“模型会生成流畅文本”直接等同于“系统适合部署”</text></g></svg>
