<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171a38"/></linearGradient>
    <linearGradient id="q" x1="0" x2="1"><stop stop-color="#357aff"/><stop offset="1" stop-color="#40cbbf"/></linearGradient>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#edf4ff}.h{font-size:34px;font-weight:800}.m{font-size:23px;font-weight:700}.s{font-size:18px}.v{font-size:20px;font-weight:800}.muted{fill:#94a8c8}.code{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="1400" height="870" rx="28" fill="url(#bg)"/>
  <text x="66" y="66" class="h">W4A16-g128 到底存什么：4-bit code 是主体，scale/zero 是不能忽略的元数据</text>
  <text x="66" y="104" class="s muted">示意一行线性层权重；group 沿 input-feature 维连续切分</text>

  <g transform="translate(65 145)">
    <rect width="1270" height="250" rx="24" fill="#0d2038" stroke="#315077"/>
    <text x="28" y="46" class="m">一行 W[out, :] → 多个 128-weight groups</text>
    <g transform="translate(30 87)">
      <g fill="url(#q)"><rect width="34" height="64" rx="8"/><rect x="40" width="34" height="64" rx="8"/><rect x="80" width="34" height="64" rx="8"/><rect x="120" width="34" height="64" rx="8"/><rect x="160" width="34" height="64" rx="8"/><rect x="200" width="34" height="64" rx="8"/></g>
      <text x="255" y="39" class="s muted">… 共 128 codes</text>
      <rect x="420" width="280" height="64" rx="15" fill="#15372f" stroke="#3bd2a6"/>
      <text x="560" y="40" text-anchor="middle" class="m code">scale₀ + zero₀</text>
      <text x="730" y="42" class="m muted">|</text>
      <g transform="translate(770)" fill="#4b7db9"><rect width="34" height="64" rx="8"/><rect x="40" width="34" height="64" rx="8"/><rect x="80" width="34" height="64" rx="8"/><rect x="120" width="34" height="64" rx="8"/></g>
      <text x="950" y="39" class="m muted">… 下一组</text>
      <path d="M0 88H340M0 82V94M340 82V94" stroke="#8098ba" stroke-width="2"/>
      <text x="170" y="122" text-anchor="middle" class="s muted">group size = 128</text>
    </g>
    <text x="30" y="220" class="s">dequant：ŵ = (code − zero) · scale；activation 与累加通常仍为 FP16/BF16。</text>
  </g>

  <g transform="translate(65 430)">
    <rect width="610" height="310" rx="24" fill="#0d2038" stroke="#315077"/>
    <text x="28" y="46" class="m">理想 bit 账本</text>
    <g transform="translate(32 87)">
      <rect width="520" height="67" rx="16" fill="#142e4b"/>
      <text x="24" y="42" class="m code">bits/weight ≈ b + metadata/group</text>
      <text x="24" y="104" class="s">若每组用 FP16 scale + FP16 zero：</text>
      <text x="24" y="143" class="m code" fill="#6ee8bd">W4-g128 ≈ 4 + 32/128 = 4.25 bit</text>
      <text x="24" y="184" class="s muted">7B：codes ≈ 3.26 GiB</text>
      <text x="24" y="217" class="s muted">scale/zero ≈ 0.20 GiB</text>
    </g>
  </g>

  <g transform="translate(705 430)">
    <rect width="630" height="310" rx="24" fill="#10263b" stroke="#3bcfa3"/>
    <text x="28" y="46" class="m">group size 的精度—存储取舍</text>
    <g transform="translate(30 85)">
      <text x="0" y="28" class="m">更小 group</text>
      <text x="200" y="28" class="s muted">更贴合局部动态范围</text>
      <text x="200" y="60" class="s muted">更多 scale/zero 与 kernel 开销</text>
      <line x1="0" y1="85" x2="570" y2="85" stroke="#354e6d"/>
      <text x="0" y="128" class="m">更大 group</text>
      <text x="200" y="128" class="s muted">metadata 少、布局简单</text>
      <text x="200" y="160" class="s muted">极值更容易让网格变粗</text>
      <line x1="0" y1="185" x2="570" y2="185" stroke="#354e6d"/>
      <text x="0" y="215" class="m" fill="#6ee8bd">论文默认 g128</text>
      <text x="200" y="215" class="s">不是 AWQ 定义的一部分，而是实验折中</text>
    </g>
  </g>

  <g transform="translate(65 775)">
    <rect width="1270" height="52" rx="15" fill="#382b20" stroke="#d59645"/>
    <text x="635" y="33" text-anchor="middle" class="s" fill="#ffd080">实际 checkpoint 还包含未量化层、bias、embedding、对齐 padding 与格式头；“4-bit 模型”不等于每参数精确 4.000 bit。</text>
  </g>
</svg>
