<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3 强到弱的 off-policy 与 on-policy 蒸馏</title>
  <desc id="desc">展示先蒸馏旗舰双模式回答，再由学生生成 on-policy 轨迹并匹配教师 logits，并对比 Qwen3-8B 的直接强化学习与 on-policy 蒸馏成本和成绩。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#18123d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
    <style>.zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:40px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a5b4fc}.h{font-size:24px;font-weight:750;fill:#f8fafc}.b{font-size:17px;fill:#cbd5e1}.small{font-size:15px;fill:#94a3b8}.num{font-size:28px;font-weight:800;fill:#67e8f9}.box{fill:#0d2944;stroke:#345674;stroke-width:2}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:16px;fill:#ddd6fe}</style>
  </defs>
  <rect width="1440" height="900" rx="30" fill="url(#bg)"/>
  <text x="70" y="70" class="zh title">小模型不重复旗舰四阶段：先学输出，再在自己的状态分布上学 logits</text>
  <text x="70" y="108" class="zh sub">Teacher = Qwen3-32B 或 235B-A22B；students = 0.6B–14B dense 与 30B-A3B MoE</text>

  <rect x="70" y="150" width="1300" height="290" rx="26" class="box"/>
  <g class="zh">
    <rect x="100" y="198" width="270" height="180" rx="22" fill="#2d245b" stroke="#a78bfa" stroke-width="2"/>
    <text x="128" y="240" class="h">① Off-policy</text><text x="128" y="282" class="b">教师生成 /think 回答</text><text x="128" y="316" class="b">教师生成 /no_think 回答</text><text x="128" y="350" class="small">response-level distillation</text>
    <line x1="370" y1="288" x2="440" y2="288" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="460" y="218" width="230" height="140" rx="22" fill="#103d3a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="575" y="260" text-anchor="middle" class="h">Student 初始化</text><text x="575" y="300" text-anchor="middle" class="b">会推理、会快答</text><text x="575" y="330" text-anchor="middle" class="small">具备基本模式切换</text>
    <line x1="690" y1="288" x2="760" y2="288" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="780" y="198" width="270" height="180" rx="22" fill="#123a4b" stroke="#22d3ee" stroke-width="2"/>
    <text x="808" y="240" class="h">② On-policy</text><text x="808" y="282" class="b">学生自己采样 prompt 与轨迹</text><text x="808" y="316" class="b">thinking / non-thinking 都覆盖</text><text x="808" y="350" class="small">prefix 来自学生当前分布</text>
    <line x1="1050" y1="288" x2="1110" y2="288" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="1130" y="198" width="210" height="180" rx="22" fill="#30223d" stroke="#f59e0b" stroke-width="2"/>
    <text x="1235" y="240" text-anchor="middle" class="h">Teacher logits</text><text x="1235" y="286" text-anchor="middle" class="mono">KL(pT || pS)</text><text x="1235" y="326" text-anchor="middle" class="b">软分布监督</text><text x="1235" y="356" text-anchor="middle" class="small">不只学习 argmax token</text>
  </g>

  <text x="70" y="500" class="zh h">Qwen3-8B：从同一个 off-policy checkpoint 出发（论文 Table 21）</text>
  <rect x="70" y="532" width="1300" height="250" rx="26" class="box"/>
  <g class="zh">
    <text x="100" y="578" class="small">方法</text><text x="410" y="578" class="small">AIME24 pass@1 / pass@64</text><text x="720" y="578" class="small">AIME25 pass@1 / pass@64</text><text x="1030" y="578" class="small">LiveCodeBench</text><text x="1225" y="578" class="small">GPU-hours</text>
    <line x1="100" y1="594" x2="1340" y2="594" stroke="#345674" stroke-width="2"/>
    <text x="100" y="636" class="b">Off-policy only</text><text x="410" y="636" class="b">55.0 / 90.0</text><text x="720" y="636" class="b">42.8 / 83.3</text><text x="1030" y="636" class="b">42.0</text><text x="1260" y="636" class="b">—</text>
    <rect x="92" y="655" width="1250" height="48" rx="12" fill="#30223d"/>
    <text x="100" y="687" class="b">+ Direct RL</text><text x="410" y="687" class="b">67.6 / 90.0</text><text x="720" y="687" class="b">55.5 / 83.3</text><text x="1030" y="687" class="b">52.9</text><text x="1225" y="687" class="b">17,920</text>
    <rect x="92" y="712" width="1250" height="52" rx="12" fill="#104b46"/>
    <text x="100" y="746" class="h">+ On-policy distill</text><text x="410" y="746" class="num">74.4 / 93.3</text><text x="720" y="746" class="num">65.5 / 86.7</text><text x="1030" y="746" class="num">60.3</text><text x="1225" y="746" class="num">1,800</text>
  </g>
  <rect x="70" y="816" width="1300" height="54" rx="18" fill="#30223d" stroke="#f59e0b"/>
  <text x="720" y="851" text-anchor="middle" class="zh b">约 1/10 GPU-hours 是这个 8B、数学/代码查询、共同起点下的实验；不能外推成“蒸馏永远比 RL 强”</text>
</svg>
