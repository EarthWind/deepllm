<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">20 文档问答中的位置性能曲线</title>
  <desc id="desc">GPT-3.5-Turbo 与 Claude-1.3 在相关文档位于上下文首尾时准确率较高，位于中间时下降。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13162d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#edf3ff}.muted{fill:#96a9c8}.body{font-size:20px}.small{font-size:17px}.label{font-size:22px;font-weight:750}.card{fill:#101c32;stroke:#2d4061;stroke-width:2}.grid{stroke:#2e4160;stroke-width:1.5}.axis{stroke:#637695;stroke-width:2}.gpt{stroke:#38bdf8;fill:none;stroke-width:6}.claude{stroke:#a78bfa;fill:none;stroke-width:6}
    </style>
  </defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/>
  <text class="t" x="70" y="70" font-size="38" font-weight="800">20 文档设置：同一答案，换个位置就可能差 22 个点</text>
  <text class="t muted body" x="70" y="108">NaturalQuestions-Open；数据来自论文附录 Table 6；纵轴为答案子串命中率</text>

  <g transform="translate(85 155)">
    <rect class="card" width="930" height="455" rx="22"/>
    <g transform="translate(70 45)">
      <line class="grid" x1="0" y1="20" x2="760" y2="20"/><line class="grid" x1="0" y1="120" x2="760" y2="120"/><line class="grid" x1="0" y1="220" x2="760" y2="220"/><line class="grid" x1="0" y1="320" x2="760" y2="320"/>
      <line class="axis" x1="0" y1="20" x2="0" y2="320"/><line class="axis" x1="0" y1="320" x2="760" y2="320"/>
      <text class="t muted small" x="-18" y="26" text-anchor="end">80%</text><text class="t muted small" x="-18" y="126" text-anchor="end">70%</text><text class="t muted small" x="-18" y="226" text-anchor="end">60%</text><text class="t muted small" x="-18" y="326" text-anchor="end">50%</text>
      <text class="t muted small" x="0" y="354" text-anchor="middle">0</text><text class="t muted small" x="190" y="354" text-anchor="middle">4</text><text class="t muted small" x="380" y="354" text-anchor="middle">9</text><text class="t muted small" x="570" y="354" text-anchor="middle">14</text><text class="t muted small" x="760" y="354" text-anchor="middle">19</text>
      <text class="t body" x="380" y="393" text-anchor="middle">金文档索引（越大越靠近上下文结尾）</text>
      <path class="gpt" d="M0 62 L190 248 L380 282 L570 266 L760 188" filter="url(#glow)"/>
      <path class="claude" d="M0 221 L190 261 L380 252 L570 248 L760 219"/>
      <g fill="#38bdf8"><circle cx="0" cy="62" r="7"/><circle cx="190" cy="248" r="7"/><circle cx="380" cy="282" r="7"/><circle cx="570" cy="266" r="7"/><circle cx="760" cy="188" r="7"/></g>
      <g fill="#a78bfa"><circle cx="0" cy="221" r="7"/><circle cx="190" cy="261" r="7"/><circle cx="380" cy="252" r="7"/><circle cx="570" cy="248" r="7"/><circle cx="760" cy="219" r="7"/></g>
      <text class="t small" x="15" y="52" fill="#38bdf8">75.8</text><text class="t small" x="378" y="307" text-anchor="middle" fill="#38bdf8">53.8</text><text class="t small" x="745" y="176" text-anchor="end" fill="#38bdf8">63.2</text>
      <text class="t small" x="14" y="211" fill="#a78bfa">59.9</text><text class="t small" x="378" y="240" text-anchor="middle" fill="#a78bfa">56.8</text><text class="t small" x="745" y="209" text-anchor="end" fill="#a78bfa">60.1</text>
    </g>
  </g>

  <g transform="translate(1050 155)">
    <rect class="card" width="320" height="455" rx="22"/>
    <text class="t label" x="26" y="45">图例与关键读法</text>
    <line class="gpt" x1="28" y1="86" x2="90" y2="86"/><text class="t body" x="108" y="93">GPT-3.5-Turbo</text>
    <line class="claude" x1="28" y1="132" x2="90" y2="132"/><text class="t body" x="108" y="139">Claude-1.3</text>
    <line x1="26" y1="170" x2="294" y2="170" stroke="#334866" stroke-width="2"/>
    <text class="t" x="26" y="213" font-size="31" font-weight="850" fill="#38bdf8">−22.0 pts</text>
    <text class="t muted small" x="26" y="244">GPT-3.5：index 0 → 9</text>
    <text class="t" x="26" y="291" font-size="27" font-weight="800" fill="#f59e0b">53.8% &lt; 56.1%</text>
    <text class="t muted small" x="26" y="322">最差位置甚至低于 closed-book</text>
    <line x1="26" y1="351" x2="294" y2="351" stroke="#334866" stroke-width="2"/>
    <text class="t body" x="26" y="389">4K 与 16K 版本</text>
    <text class="t muted small" x="26" y="420">在都能容纳输入时，曲线几乎重合</text>
  </g>

  <g transform="translate(70 650)">
    <rect class="card" width="1300" height="205" rx="22"/>
    <text class="t label" x="28" y="42">Closed-book / Oracle：判断问题是在“知识”还是在“上下文利用”</text>
    <g transform="translate(28 68)">
      <rect x="0" width="195" height="100" rx="14" fill="#13253c"/><text class="t body" x="16" y="30">LongChat-13B</text><text class="t small" x="16" y="60" fill="#38bdf8">35.0% closed</text><text class="t small" x="16" y="86" fill="#a78bfa">83.4% oracle</text>
      <rect x="215" width="195" height="100" rx="14" fill="#13253c"/><text class="t body" x="231" y="30">MPT-30B</text><text class="t small" x="231" y="60" fill="#38bdf8">31.5% closed</text><text class="t small" x="231" y="86" fill="#a78bfa">81.9% oracle</text>
      <rect x="430" width="195" height="100" rx="14" fill="#13253c"/><text class="t body" x="446" y="30">GPT-3.5</text><text class="t small" x="446" y="60" fill="#38bdf8">56.1% closed</text><text class="t small" x="446" y="86" fill="#a78bfa">88.3% oracle</text>
      <rect x="645" width="195" height="100" rx="14" fill="#13253c"/><text class="t body" x="661" y="30">GPT-3.5 16K</text><text class="t small" x="661" y="60" fill="#38bdf8">56.0% closed</text><text class="t small" x="661" y="86" fill="#a78bfa">88.6% oracle</text>
      <rect x="860" width="195" height="100" rx="14" fill="#13253c"/><text class="t body" x="876" y="30">Claude-1.3</text><text class="t small" x="876" y="60" fill="#38bdf8">48.3% closed</text><text class="t small" x="876" y="86" fill="#a78bfa">76.1% oracle</text>
      <rect x="1075" width="169" height="100" rx="14" fill="#13253c"/><text class="t body" x="1091" y="30">Claude 100K</text><text class="t small" x="1091" y="60" fill="#38bdf8">48.2% closed</text><text class="t small" x="1091" y="86" fill="#a78bfa">76.4% oracle</text>
    </g>
  </g>
  <text class="t muted small" x="720" y="895" text-anchor="middle">“支持更长输入”是接口容量；“最坏位置仍可靠”才是有效长上下文能力</text>
</svg>
