<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111a38"/></linearGradient>
    <linearGradient id="target" x1="0" x2="1"><stop stop-color="#4f7cff"/><stop offset="1" stop-color="#8c6cff"/></linearGradient>
    <linearGradient id="draft" x1="0" x2="1"><stop stop-color="#20c8b0"/><stop offset="1" stop-color="#39e38d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8da8d8"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#eaf2ff}
      .muted{fill:#91a5c8}.small{font-size:20px}.label{font-size:24px;font-weight:700}.token{font-size:22px;font-weight:700}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" font-size="34" font-weight="800">自回归解码：把“大模型串行 K 次”改造成“先猜一段，再并行验一段”</text>
  <text x="70" y="108" class="muted small">同一目标分布 p；改变的是调度方式，不是要采样的模型</text>

  <rect x="58" y="150" width="1284" height="230" rx="24" fill="#0c1d35" stroke="#29415f"/>
  <text x="88" y="195" class="label">普通自回归：每轮只能提交 1 token</text>
  <g transform="translate(96 235)">
    <rect width="130" height="72" rx="16" fill="url(#target)"/><text x="65" y="45" text-anchor="middle" class="token">Target</text>
    <path d="M140 36H205" stroke="#8da8d8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="216" width="72" height="72" rx="14" fill="#19365f" stroke="#598cff"/><text x="252" y="45" text-anchor="middle" class="token">x₁</text>
    <path d="M298 36H363" stroke="#8da8d8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="374" width="130" height="72" rx="16" fill="url(#target)"/><text x="439" y="45" text-anchor="middle" class="token">Target</text>
    <path d="M514 36H579" stroke="#8da8d8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="590" width="72" height="72" rx="14" fill="#19365f" stroke="#598cff"/><text x="626" y="45" text-anchor="middle" class="token">x₂</text>
    <text x="720" y="47" font-size="35" class="muted">… K 次昂贵串行轮次</text>
  </g>
  <text x="92" y="350" class="muted small">关键路径：Target → 1 token → Target → 1 token → …</text>

  <rect x="58" y="410" width="1284" height="350" rx="24" fill="#0c1d35" stroke="#29415f"/>
  <text x="88" y="457" class="label">Speculative Decoding：Draft 串行起草 γ 个，Target 一次并行验证 γ+1 个位置</text>
  <g transform="translate(92 505)">
    <rect width="118" height="64" rx="16" fill="url(#draft)"/><text x="59" y="41" text-anchor="middle" class="token">Draft</text>
    <path d="M128 32H176" stroke="#54d9bd" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(188)">
      <rect width="62" height="64" rx="13" fill="#143c3b" stroke="#3de2a5"/><text x="31" y="41" text-anchor="middle" class="token">x̃₁</text>
      <rect x="78" width="62" height="64" rx="13" fill="#143c3b" stroke="#3de2a5"/><text x="109" y="41" text-anchor="middle" class="token">x̃₂</text>
      <rect x="156" width="62" height="64" rx="13" fill="#143c3b" stroke="#3de2a5"/><text x="187" y="41" text-anchor="middle" class="token">x̃₃</text>
      <text x="247" y="43" font-size="30" class="muted">…</text>
      <rect x="280" width="62" height="64" rx="13" fill="#143c3b" stroke="#3de2a5"/><text x="311" y="41" text-anchor="middle" class="token">x̃γ</text>
    </g>
    <path d="M548 32H610" stroke="#8da8d8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="622" y="-22" width="230" height="108" rx="20" fill="url(#target)" filter="url(#glow)"/>
    <text x="737" y="22" text-anchor="middle" class="token">Target × 1</text>
    <text x="737" y="55" text-anchor="middle" class="small">并行 logits 1…γ+1</text>
    <path d="M862 32H916" stroke="#8da8d8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="928" width="62" height="64" rx="13" fill="#153d36" stroke="#3de28e"/><text x="959" y="41" text-anchor="middle" class="token">✓</text>
    <rect x="1002" width="62" height="64" rx="13" fill="#153d36" stroke="#3de28e"/><text x="1033" y="41" text-anchor="middle" class="token">✓</text>
    <rect x="1076" width="62" height="64" rx="13" fill="#432233" stroke="#ff6f8e"/><text x="1107" y="41" text-anchor="middle" class="token">×</text>
    <rect x="1150" width="62" height="64" rx="13" fill="#173b5a" stroke="#52c7ff"/><text x="1181" y="41" text-anchor="middle" class="token">↺</text>
  </g>
  <g transform="translate(92 620)">
    <rect width="362" height="88" rx="18" fill="#102d2d" stroke="#2c8f7a"/>
    <text x="24" y="34" class="label" fill="#67e9bf">接受到首个拒绝点之前</text>
    <text x="24" y="65" class="muted small">不能跳过中间拒绝继续接受</text>
    <rect x="386" width="362" height="88" rx="18" fill="#172c4b" stroke="#4f7cff"/>
    <text x="410" y="34" class="label">拒绝：从 (p−q)₊ 修正</text>
    <text x="410" y="65" class="muted small">本轮仍至少提交 1 token</text>
    <rect x="772" width="414" height="88" rx="18" fill="#3c3120" stroke="#e9b64b"/>
    <text x="796" y="34" class="label" fill="#ffd477">全接受：再采 1 个 bonus</text>
    <text x="796" y="65" class="muted small">一轮最多提交 γ+1 个 token</text>
  </g>
</svg>
