<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MuZero 规划、行动与学习总览</title><desc id="desc">观察历史由表示函数编码为根隐藏状态，动力学函数在潜空间递归预测奖励和下一隐藏状态，预测函数输出策略和价值，MCTS 产生行动与训练目标。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061326"/><stop offset="1" stop-color="#111d38"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d5dfc"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7dd3fc"/></marker><marker id="gArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#34d399"/></marker><style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.m{font-size:21px;font-weight:650}.s{font-size:17px}.xs{font-size:15px;fill:#aebfd9}.card{fill:#132440;stroke:#31517a;stroke-width:2}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><g opacity=".08" stroke="#8bb9e8"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/><path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/></g>
  <text class="t h" x="60" y="62">MuZero：不预测下一帧，只学习规划需要的模型</text><text class="t xs" x="60" y="93">真实环境只在行动后返回 observation 与 reward；树搜索始终运行在学习到的 hidden state 中</text>
  <g filter="url(#shadow)"><rect class="card" x="55" y="165" width="225" height="230" rx="22"/><text class="t m" x="83" y="205">观察历史</text><g transform="translate(89 236)"><rect x="24" width="118" height="82" rx="10" fill="#192b49" stroke="#4baee0"/><rect x="12" y="12" width="118" height="82" rx="10" fill="#1b3654" stroke="#4baee0"/><rect y="24" width="118" height="82" rx="10" fill="#214361" stroke="#66d5f2"/><circle cx="34" cy="52" r="10" fill="#f59e0b"/><rect x="58" y="45" width="42" height="14" rx="4" fill="#22c55e"/></g><text class="t xs" x="83" y="367">o₁ … oₜ（Atari 还含历史动作）</text></g>
  <path class="line" d="M280 280H345"/>
  <g filter="url(#shadow)"><rect x="350" y="190" width="180" height="180" rx="22" fill="#17365a" stroke="#38bdf8" stroke-width="2"/><circle cx="440" cy="252" r="35" fill="url(#blue)"/><text class="t m" text-anchor="middle" x="440" y="260">h</text><text class="t s" text-anchor="middle" x="440" y="315">表示函数</text><text class="t xs" text-anchor="middle" x="440" y="342">s⁰ = h(o₁…oₜ)</text></g>
  <path class="line" d="M530 280H595"/>
  <g filter="url(#shadow)"><rect x="600" y="135" width="270" height="290" rx="22" fill="#211f46" stroke="#a78bfa" stroke-width="2"/><text class="t m" x="630" y="178">潜空间递归模型</text><circle cx="660" cy="238" r="24" fill="#4338a4"/><circle cx="735" cy="280" r="24" fill="#5b45b9"/><circle cx="810" cy="238" r="24" fill="#7653c9"/><path d="M681 247l31 18M758 265l30-18" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/><rect x="679" y="202" width="52" height="27" rx="13" fill="#4b326d"/><text class="t xs" text-anchor="middle" x="705" y="221">a¹</text><rect x="755" y="304" width="52" height="27" rx="13" fill="#4b326d"/><text class="t xs" text-anchor="middle" x="781" y="323">a²</text><text class="t s" x="630" y="365">(rᵏ, sᵏ) = g(sᵏ⁻¹, aᵏ)</text><text class="t xs" x="630" y="395">hidden state 无需还原像素或棋盘</text></g>
  <path class="line" d="M870 280H925"/>
  <g filter="url(#shadow)"><rect x="930" y="170" width="215" height="220" rx="22" fill="#123b39" stroke="#34d399" stroke-width="2"/><circle cx="981" cy="231" r="28" fill="url(#green)"/><text class="t m" text-anchor="middle" x="981" y="239">f</text><text class="t m" x="1023" y="224">预测函数</text><text class="t s" x="1023" y="254">(pᵏ, vᵏ)</text><rect x="965" y="292" width="145" height="54" rx="13" fill="#164d46"/><text class="t s" text-anchor="middle" x="1037" y="315">policy + value</text><text class="t xs" text-anchor="middle" x="1037" y="337">引导 MCTS</text></g>
  <g filter="url(#shadow)"><rect x="350" y="485" width="520" height="145" rx="22" fill="#0e2d3c" stroke="#38bdf8" stroke-width="2"/><text class="t m" x="385" y="527">MCTS 输出：改进策略 πₜ 与根价值 νₜ</text><text class="t s" x="385" y="565">aₜ₊₁ ∼ πₜ → 只把选中的动作送入真实环境</text><text class="t xs" x="385" y="601">经验 (o, a, u, π, ν) 写入 replay，再联合训练 h、g、f</text></g>
  <path d="M1037 390C1037 455 870 455 820 485" class="line"/><path d="M350 555H180C118 555 110 480 110 405" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#gArrow)"/><path d="M610 485V425" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#gArrow)"/>
  <g transform="translate(914 510)"><rect width="230" height="116" rx="18" fill="#0b1930" stroke="#29496e"/><text class="t s" x="22" y="34">模型只接受任务损失：</text><text class="t xs" x="22" y="62">reward u · value z</text><text class="t xs" x="22" y="88">search policy π</text></g>
</svg>
