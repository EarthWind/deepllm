<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">ReAct 推理、行动与观察闭环</title>
  <desc id="desc">语言模型根据目标和轨迹生成思考与行动，运行时只执行白名单动作，环境返回观察，观察写回上下文供下一轮重新规划，直到输出最终答案或达到预算。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b45309"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2563eb"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#d97706"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#059669"/></marker>
    <style>
      .title{font:700 32px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 17px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.section{font:700 23px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#fff}.heading{font:700 20px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 14px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.mono{font:600 15px "JetBrains Mono",Consolas,monospace;fill:#1e3a8a}.white{fill:#fff}.blue{fill:#1d4ed8}.amber{fill:#b45309}
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <text x="58" y="54" class="title">ReAct：模型负责决策，运行时负责让决策接触真实世界</text>
  <text x="58" y="86" class="subtitle">Thought 更新文本上下文但不改变环境；Action 触发外部状态转移；Observation 是下一轮决策的新证据。</text>

  <g transform="translate(58 126)" filter="url(#shadow)">
    <rect width="1284" height="540" rx="26" fill="#fff" stroke="#cbd5e1"/>
    <g transform="translate(32 34)">
      <rect width="260" height="122" rx="18" fill="#f1f5f9" stroke="#94a3b8"/>
      <circle cx="52" cy="48" r="25" fill="#334155"/><path d="M39 49h26M52 36v26" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="91" y="44" class="heading">目标 / 问题</text>
      <text x="24" y="88" class="body">用户输入 + 任务约束</text>
      <text x="24" y="110" class="small">定义终止条件，不直接规定路径</text>
    </g>

    <path d="M292 95H390" stroke="#64748b" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <g transform="translate(394 22)">
      <rect width="462" height="255" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <rect width="462" height="58" rx="24" fill="url(#model)"/><rect y="34" width="462" height="24" fill="url(#model)"/>
      <text x="24" y="38" class="section">语言模型策略 π</text>
      <text x="26" y="91" class="body">输入：目标 + 历史 Thought / Action / Observation</text>
      <rect x="25" y="113" width="190" height="92" rx="15" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="120" y="143" text-anchor="middle" class="heading blue">Thought</text>
      <text x="120" y="169" text-anchor="middle" class="body">分解、记忆、修正计划</text>
      <text x="120" y="191" text-anchor="middle" class="small">只更新上下文 c</text>
      <text x="231" y="163" text-anchor="middle" class="heading">或</text>
      <rect x="247" y="113" width="190" height="92" rx="15" fill="#ffedd5" stroke="#fb923c"/>
      <text x="342" y="143" text-anchor="middle" class="heading amber">Action</text>
      <text x="342" y="169" text-anchor="middle" class="body">选择工具并生成参数</text>
      <text x="342" y="191" text-anchor="middle" class="small">请求改变 / 查询环境</text>
      <text x="26" y="236" class="body">扩展动作空间：Â = A ∪ L</text>
    </g>

    <path d="M856 148H953" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrowAmber)"/>
    <text x="904" y="129" text-anchor="middle" class="small amber">Action</text>

    <g transform="translate(958 34)">
      <rect width="294" height="230" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <rect width="294" height="58" rx="22" fill="url(#env)"/><rect y="34" width="294" height="24" fill="url(#env)"/>
      <text x="22" y="38" class="section">运行时 + 环境</text>
      <g transform="translate(22 83)">
        <rect width="118" height="45" rx="12" fill="#ffedd5"/><text x="59" y="29" text-anchor="middle" class="body">搜索 / 浏览</text>
        <rect x="132" width="118" height="45" rx="12" fill="#ffedd5"/><text x="191" y="29" text-anchor="middle" class="body">数据库 / API</text>
        <rect y="59" width="118" height="45" rx="12" fill="#ffedd5"/><text x="59" y="88" text-anchor="middle" class="body">游戏 / 机器人</text>
        <rect x="132" y="59" width="118" height="45" rx="12" fill="#ffedd5"/><text x="191" y="88" text-anchor="middle" class="body">受控副作用</text>
      </g>
      <text x="147" y="207" text-anchor="middle" class="small">校验权限、参数、超时与返回长度</text>
    </g>

    <path d="M1097 264V354Q1097 396 1055 396H684" fill="none" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrowAmber)"/>
    <text x="1097" y="316" text-anchor="middle" class="heading amber">Observation</text>
    <text x="1097" y="343" text-anchor="middle" class="body amber">外部反馈写回轨迹</text>

    <g transform="translate(394 341)">
      <rect width="462" height="137" rx="20" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="24" y="37" class="heading">轨迹 / 文本工作记忆</text>
      <text x="24" y="70" class="mono">Thought₁ → Action₁ → Observation₁ → …</text>
      <text x="24" y="100" class="body">下一轮重新规划，而不是盲目执行最初计划</text>
      <text x="24" y="123" class="small">论文主要靠 few-shot prompt 让冻结模型学会这种格式</text>
    </g>

    <path d="M625 341V292" fill="none" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
    <text x="645" y="319" class="small blue">继续</text>

    <g transform="translate(32 347)">
      <rect width="260" height="130" rx="18" fill="#ecfdf5" stroke="#34d399"/>
      <circle cx="51" cy="50" r="25" fill="#059669"/><path d="m39 50 8 8 17-20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="91" y="47" class="heading">Final / 完成</text>
      <text x="24" y="88" class="body">答案、任务成功或明确失败</text>
      <text x="24" y="112" class="small">也可能因步数 / 成本预算终止</text>
    </g>
    <path d="M394 438H302" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  </g>
</svg>
