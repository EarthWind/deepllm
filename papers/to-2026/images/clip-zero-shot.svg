<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 的 prompt engineering、prompt ensemble 与零样本分类器</title>
  <desc id="desc">多个上下文模板与类别名称组合，经文本编码器后按类别平均并归一化，形成分类器的列向量；新图像与所有类别向量比较相似度得到概率。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111638"/></linearGradient>
    <linearGradient id="purple3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrC3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:20px;font-weight:650;fill:#e2e8f0}.small{font-size:15px;fill:#cbd5e1}.tiny{font-size:13px;fill:#94a3b8}.math{font-family:"Times New Roman",serif;font-size:20px;fill:#a5f3fc}.panel{fill:#0d1c31;stroke:#29415f;stroke-width:1.5}.flowP{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#arr3)}.flowC{fill:none;stroke:#22d3ee;stroke-width:3;marker-end:url(#arrC3)}
    </style>
  </defs>
  <rect width="1400" height="780" rx="28" fill="url(#bg3)"/>
  <text x="58" y="62" class="sans title">文本编码器就是一台“分类器权重生成器”</text>
  <text x="58" y="92" class="sans sub">类别名称不是输出 ID，而是可组合、可解释、可缓存的自然语言接口</text>

  <g transform="translate(55 136)">
    <rect width="360" height="480" rx="22" class="panel"/>
    <text x="180" y="42" text-anchor="middle" class="sans label">1. 类名先放回语言上下文</text>
    <g transform="translate(25 70)">
      <text x="0" y="22" class="sans small" fill="#fda4af">cat</text>
      <rect x="56" width="278" height="38" rx="10" fill="#25133f" stroke="#7c3aed"/><text x="195" y="25" text-anchor="middle" class="sans tiny">“a photo of a cat”</text>
      <rect x="56" y="48" width="278" height="38" rx="10" fill="#25133f" stroke="#7c3aed"/><text x="195" y="73" text-anchor="middle" class="sans tiny">“a blurry photo of a cat”</text>
      <rect x="56" y="96" width="278" height="38" rx="10" fill="#25133f" stroke="#7c3aed"/><text x="195" y="121" text-anchor="middle" class="sans tiny">“a photo of the small cat”</text>
      <text x="0" y="184" class="sans small" fill="#fbbf24">crane</text>
      <rect x="56" y="162" width="278" height="38" rx="10" fill="#332416" stroke="#d97706"/><text x="195" y="187" text-anchor="middle" class="sans tiny">“a photo of a crane, a bird”</text>
      <rect x="56" y="210" width="278" height="38" rx="10" fill="#332416" stroke="#d97706"/><text x="195" y="235" text-anchor="middle" class="sans tiny">“a photo of a construction crane”</text>
      <text x="0" y="300" class="sans small" fill="#67e8f9">food</text>
      <rect x="56" y="278" width="278" height="38" rx="10" fill="#10303d" stroke="#0891b2"/><text x="195" y="303" text-anchor="middle" class="sans tiny">“a photo of {label}, a type of food”</text>
      <rect x="56" y="326" width="278" height="38" rx="10" fill="#10303d" stroke="#0891b2"/><text x="195" y="351" text-anchor="middle" class="sans tiny">“a close-up photo of {label}”</text>
    </g>
    <text x="180" y="458" text-anchor="middle" class="sans tiny">模板补语境、消歧义，并缩小训练文本与裸类名的分布差</text>
  </g>

  <path d="M430 375H510" class="flowP"/>
  <g transform="translate(525 234)">
    <rect width="205" height="282" rx="20" fill="url(#purple3)" opacity=".86"/>
    <text x="102" y="58" text-anchor="middle" class="sans label">文本编码器</text>
    <g transform="translate(41 90)" fill="#ddd6fe"><rect width="123" height="26" rx="8"/><rect y="39" width="123" height="26" rx="8" opacity=".88"/><rect y="78" width="123" height="26" rx="8" opacity=".76"/><rect y="117" width="123" height="26" rx="8" opacity=".64"/></g>
    <text x="102" y="260" text-anchor="middle" class="sans tiny">共享参数 · 只需编码一次</text>
  </g>
  <path d="M745 375H825" class="flowP"/>

  <g transform="translate(840 136)">
    <rect width="505" height="480" rx="22" class="panel"/>
    <text x="252" y="42" text-anchor="middle" class="sans label">2. 在嵌入空间内集成，再缓存为 W</text>
    <g transform="translate(30 77)">
      <g>
        <circle cx="36" cy="30" r="9" fill="#c084fc"/><circle cx="64" cy="16" r="9" fill="#a78bfa"/><circle cx="76" cy="47" r="9" fill="#8b5cf6"/>
        <path d="M91 31H148" class="flowP"/><circle cx="174" cy="31" r="16" fill="#f472b6"/><text x="205" y="37" class="sans small">类别向量 w_cat</text>
      </g>
      <g transform="translate(0 84)">
        <circle cx="36" cy="30" r="9" fill="#f59e0b"/><circle cx="64" cy="16" r="9" fill="#fbbf24"/><circle cx="76" cy="47" r="9" fill="#d97706"/>
        <path d="M91 31H148" class="flowP"/><circle cx="174" cy="31" r="16" fill="#fb923c"/><text x="205" y="37" class="sans small">类别向量 w_crane</text>
      </g>
      <g transform="translate(0 168)">
        <circle cx="36" cy="30" r="9" fill="#22d3ee"/><circle cx="64" cy="16" r="9" fill="#06b6d4"/><circle cx="76" cy="47" r="9" fill="#0891b2"/>
        <path d="M91 31H148" class="flowP"/><circle cx="174" cy="31" r="16" fill="#2dd4bf"/><text x="205" y="37" class="sans small">类别向量 w_food</text>
      </g>
    </g>
    <text x="252" y="328" text-anchor="middle" class="math">wₖ = Normalize(Meanₘ(Normalize(tₖₘ)))</text>
    <rect x="32" y="355" width="441" height="88" rx="15" fill="#111d34" stroke="#475569"/>
    <text x="252" y="386" text-anchor="middle" class="sans small">W = [w₁, w₂, …, w_K] 是一个无偏置线性分类器</text>
    <text x="252" y="416" text-anchor="middle" class="sans tiny">其权重不是用目标数据集拟合，而是由目标类别的语言描述生成</text>
  </g>

  <g transform="translate(55 647)">
    <rect width="1290" height="85" rx="18" fill="#0b2638" stroke="#155e75"/>
    <circle cx="49" cy="42" r="23" fill="#22d3ee"/><path d="M38 43l8 8 16-20" fill="none" stroke="#083344" stroke-width="5"/>
    <text x="88" y="33" class="sans small" fill="#a5f3fc">论文中的 ImageNet 结果：</text>
    <text x="88" y="59" class="sans tiny">默认 “a photo of a {label}” 比裸类名提高 1.3 个点；80 个模板的 embedding ensemble 再提高 3.5 个点，合计接近 5 个点。</text>
  </g>
</svg>
