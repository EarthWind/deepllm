<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">The Pile 的去重与评测去污染边界</title>
  <desc id="desc">Pile-CC 和 OpenWebText2 使用 MinHashLSH 做组件内近重复去重，训练集还删除 held-out 中逐字出现的元素；下游基准的十三元组去污染并非数据集默认步骤。</desc>
  <defs>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e9f0fb}.h1{font-size:30px;font-weight:800}.h2{font-size:21px;font-weight:760}.body{font-size:16px}.small{font-size:14px}.mono{font-family:"JetBrains Mono",Consolas,monospace}.muted{fill:#92a5c4}.card{fill:#0c192b;stroke:#30496d;stroke-width:1.5}.cyan{fill:#113849;stroke:#22d3ee}.amber{fill:#3a2d18;stroke:#f59e0b}.coral{fill:#3a2327;stroke:#fb7185}.arrow{fill:none;stroke:#6685ad;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6685ad"/></marker>
  </defs>
  <rect width="1200" height="780" rx="24" fill="#081321"/>
  <text x="48" y="58" class="t h1">“The Pile 做过去重”只对了一半：范围比算法更重要</text>
  <text x="48" y="90" class="t body muted">论文的近重复去重只覆盖 Pile-CC 与 OpenWebText2；没有执行 Pile-wide deduplication</text>

  <g transform="translate(42 128)">
    <rect width="760" height="372" rx="20" class="card"/>
    <text x="22" y="40" class="t h2">MinHashLSH：把不可能承受的全对比较压成候选比较</text>
    <g transform="translate(24 76)">
      <rect width="134" height="214" rx="15" fill="#102037" stroke="#365274"/>
      <text x="67" y="30" text-anchor="middle" class="t body">documents</text>
      <rect x="20" y="52" width="94" height="36" rx="7" class="cyan"/><path d="M31 65H101M31 76H89" stroke="#67e8f9"/>
      <rect x="20" y="100" width="94" height="36" rx="7" class="cyan"/><path d="M31 113H101M31 124H89" stroke="#67e8f9"/>
      <rect x="20" y="148" width="94" height="36" rx="7" fill="#17253b" stroke="#526886"/><path d="M31 161H101M31 172H75" stroke="#92a5c4"/>
      <path d="M134 107H166" class="arrow"/>

      <g transform="translate(170)">
        <rect width="134" height="214" rx="15" fill="#102037" stroke="#365274"/>
        <text x="67" y="30" text-anchor="middle" class="t body">shingles</text>
        <g fill="#1d4260" stroke="#60a5fa"><rect x="19" y="54" width="47" height="23" rx="5"/><rect x="72" y="54" width="42" height="23" rx="5"/><rect x="30" y="85" width="61" height="23" rx="5"/><rect x="18" y="116" width="42" height="23" rx="5"/><rect x="66" y="116" width="51" height="23" rx="5"/><rect x="37" y="147" width="69" height="23" rx="5"/></g>
        <text x="67" y="192" text-anchor="middle" class="t small muted">Jaccard sets</text>
      </g>
      <path d="M304 107H336" class="arrow"/>

      <g transform="translate(340)">
        <rect width="134" height="214" rx="15" fill="#102037" stroke="#365274"/>
        <text x="67" y="30" text-anchor="middle" class="t body">MinHash</text>
        <g class="t mono small"><text x="20" y="67">[14,  8, 31]</text><text x="20" y="98">[14,  8, 29]</text><text x="20" y="129">[52, 19,  4]</text></g>
        <path d="M18 146H116" stroke="#30496d"/>
        <text x="67" y="172" text-anchor="middle" class="t small muted">论文：10 hashes</text>
        <text x="67" y="194" text-anchor="middle" class="t small muted">近似 J ≈ 0.5</text>
      </g>
      <path d="M474 107H506" class="arrow"/>

      <g transform="translate(510)">
        <rect width="202" height="214" rx="15" fill="#102037" stroke="#365274"/>
        <text x="101" y="30" text-anchor="middle" class="t body">LSH buckets</text>
        <rect x="22" y="52" width="158" height="43" rx="8" class="amber"/><text x="101" y="79" text-anchor="middle" class="t small">doc 1 + doc 2 → candidate</text>
        <rect x="22" y="106" width="158" height="43" rx="8" fill="#17253b" stroke="#526886"/><text x="101" y="133" text-anchor="middle" class="t small muted">doc 3 → separate</text>
        <text x="101" y="177" text-anchor="middle" class="t small">只精查同桶候选</text>
        <text x="101" y="198" text-anchor="middle" class="t small muted">避免 O(N²)</text>
      </g>
    </g>
    <text x="380" y="338" text-anchor="middle" class="t small muted">论文报告：OWT2 近重复率 28% · Pile-CC 近重复率 26% · 大规模实现使用 Python Datasketch</text>
  </g>

  <g transform="translate(828 128)">
    <rect width="330" height="372" rx="20" class="card"/>
    <text x="20" y="40" class="t h2">范围边界</text>
    <rect x="20" y="66" width="290" height="68" rx="13" class="cyan"/><text x="38" y="94" class="t body">OpenWebText2</text><text x="290" y="113" text-anchor="end" class="t h2 mono">28%</text>
    <rect x="20" y="146" width="290" height="68" rx="13" class="cyan"/><text x="38" y="174" class="t body">Pile-CC</text><text x="290" y="193" text-anchor="end" class="t h2 mono">26%</text>
    <rect x="20" y="236" width="290" height="96" rx="13" class="coral"/>
    <text x="165" y="273" text-anchor="middle" class="t h2">不是 Pile-wide</text>
    <text x="165" y="299" text-anchor="middle" class="t body">跨来源重复仍可能存在</text>
    <text x="165" y="321" text-anchor="middle" class="t small muted">train / val / test 之间也可能有重复文档</text>
  </g>

  <g transform="translate(42 532)">
    <rect width="1116" height="190" rx="20" class="card"/>
    <text x="22" y="40" class="t h2">三种“去重 / 去污染”不要混成一个动作</text>
    <g transform="translate(22 64)">
      <rect width="340" height="96" rx="14" fill="#102037" stroke="#22d3ee"/><text x="18" y="29" class="t body" fill="#67e8f9">A. 组件内近重复去重</text><text x="18" y="55" class="t small">MinHashLSH · 只做 OWT2 / Pile-CC</text><text x="18" y="78" class="t small muted">目标：压低 Web 文档重复</text>
      <rect x="366" width="340" height="96" rx="14" fill="#102037" stroke="#84cc70"/><text x="384" y="29" class="t body" fill="#a3e38d">B. Pile held-out 精确移除</text><text x="384" y="55" class="t small">训练集删掉 held-out 中逐字出现的元素</text><text x="384" y="78" class="t small muted">目标：保护自身 validation / test</text>
      <rect x="732" width="340" height="96" rx="14" fill="#102037" stroke="#f59e0b"/><text x="750" y="29" class="t body" fill="#fbbf24">C. 下游 13-gram 去污染</text><text x="750" y="55" class="t small">Table 3 对比实验执行；原始 Pile 默认未执行</text><text x="750" y="78" class="t small muted">目标：按具体 benchmark 重新审计</text>
    </g>
  </g>
  <text x="600" y="756" text-anchor="middle" class="t small muted">结论：算法名称不能替代覆盖范围、阈值、规范化规则与评测基准版本的记录</text>
</svg>
