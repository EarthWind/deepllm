<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Toolformer 推理时的解码与工具执行状态机</title>
  <desc id="desc">模型正常逐词元生成。若没有生成工具调用则继续生成；若生成箭头标记，运行时暂停模型，解析并校验工具名和参数，执行工具，把结果和结束标记注入上下文，然后恢复生成。异常路径进入超时、错误或预算处理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .lane { font: 700 22px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .heading { font: 700 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 500 13px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .white { fill: #fff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .return { fill: none; stroke: #0f766e; stroke-width: 2.6; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .error { fill: none; stroke: #dc2626; stroke-width: 2.2; marker-end: url(#redArrow); }
    </style>
  </defs>

  <rect width="1400" height="720" fill="url(#bg)"/>
  <text x="56" y="52" class="title">推理时 Toolformer 不是“先规划再调用”，而是一个可中断的解码协议</text>
  <text x="56" y="82" class="subtitle">工具调用与普通文本共享一条 token 流；模型负责发起调用，runtime 负责执行、隔离失败并把 observation 写回。</text>

  <g transform="translate(56 115)" filter="url(#shadow)">
    <rect width="210" height="512" rx="24" fill="#fff" stroke="#cbd5e1"/>
    <rect width="210" height="82" rx="24" fill="url(#model)"/>
    <rect y="58" width="210" height="24" fill="url(#model)"/>
    <text x="105" y="35" text-anchor="middle" class="lane">模型侧</text>
    <text x="105" y="61" text-anchor="middle" class="small white">训练写进参数的能力</text>
    <text x="24" y="125" class="body">• 是否需要工具</text>
    <text x="24" y="158" class="body">• 选择哪个 API</text>
    <text x="24" y="191" class="body">• 生成什么参数</text>
    <text x="24" y="224" class="body">• 如何使用返回值</text>
    <rect x="22" y="266" width="166" height="111" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="105" y="295" text-anchor="middle" class="heading">模型不负责</text>
    <text x="105" y="323" text-anchor="middle" class="small">网络权限 / 凭证</text>
    <text x="105" y="346" text-anchor="middle" class="small">超时 / 重试 / 计费</text>
    <text x="105" y="369" text-anchor="middle" class="small">参数安全与审计</text>
    <text x="105" y="427" text-anchor="middle" class="small">论文协议较简洁；</text>
    <text x="105" y="450" text-anchor="middle" class="small">生产系统必须补齐</text>
    <text x="105" y="473" text-anchor="middle" class="small">右侧这些控制。</text>
  </g>

  <g transform="translate(304 115)" filter="url(#shadow)">
    <rect width="1040" height="512" rx="24" fill="#fff" stroke="#a5f3fc"/>
    <rect width="1040" height="82" rx="24" fill="url(#runtime)"/>
    <rect y="58" width="1040" height="24" fill="url(#runtime)"/>
    <text x="28" y="35" class="lane">Runtime 状态机</text>
    <text x="28" y="61" class="small white">边界解析、工具执行、结果注入与失败控制</text>

    <g transform="translate(33 120)">
      <rect width="180" height="92" rx="46" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="90" y="37" text-anchor="middle" class="heading">NORMAL</text>
      <text x="90" y="62" text-anchor="middle" class="body">逐 token 解码</text>
      <text x="90" y="82" text-anchor="middle" class="small">普通文本直接输出</text>
    </g>
    <path d="M213 166 H276" class="arrow"/>
    <text x="244" y="152" text-anchor="middle" class="small">看见 “→”</text>

    <g transform="translate(281 111)">
      <rect width="200" height="110" rx="18" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="100" y="31" text-anchor="middle" class="heading">PAUSE + PARSE</text>
      <text x="100" y="58" text-anchor="middle" class="mono">[Tool(args) →</text>
      <text x="100" y="82" text-anchor="middle" class="small">白名单、schema、长度校验</text>
      <text x="100" y="101" text-anchor="middle" class="small">冻结模型解码</text>
    </g>
    <path d="M481 166 H544" class="arrow"/>

    <g transform="translate(549 111)">
      <rect width="200" height="110" rx="18" fill="#cffafe" stroke="#06b6d4"/>
      <text x="100" y="31" text-anchor="middle" class="heading">EXECUTE</text>
      <text x="100" y="58" text-anchor="middle" class="body">调用隔离的工具适配器</text>
      <text x="100" y="82" text-anchor="middle" class="small">超时 / 限流 / 权限 / 日志</text>
      <text x="100" y="101" text-anchor="middle" class="small">返回单个文本序列 r</text>
    </g>
    <path d="M749 166 H812" class="arrow"/>

    <g transform="translate(817 111)">
      <rect width="190" height="110" rx="18" fill="#d1fae5" stroke="#10b981"/>
      <text x="95" y="31" text-anchor="middle" class="heading">INJECT</text>
      <text x="95" y="58" text-anchor="middle" class="mono">result + ]</text>
      <text x="95" y="82" text-anchor="middle" class="small">写回模型上下文</text>
      <text x="95" y="101" text-anchor="middle" class="small">恢复后续生成</text>
    </g>

    <path d="M912 221 C912 275 123 275 123 214" class="return"/>
    <text x="518" y="292" text-anchor="middle" class="body">Observation 变成普通上下文；模型继续预测接下来的文本</text>

    <path d="M381 221 C381 330 424 330 424 367" class="error"/>
    <path d="M649 221 C649 330 606 330 606 367" class="error"/>
    <g transform="translate(337 367)">
      <rect width="360" height="105" rx="18" fill="#fef2f2" stroke="#f87171"/>
      <text x="180" y="30" text-anchor="middle" class="heading">ERROR / BUDGET</text>
      <text x="180" y="57" text-anchor="middle" class="body">解析失败、未知工具、超时、返回过长、预算耗尽</text>
      <text x="180" y="82" text-anchor="middle" class="small">结构化错误写回 / 安全降级 / 终止；不得执行任意代码</text>
    </g>
    <path d="M337 420 C214 420 123 353 123 214" class="arrow"/>
    <text x="189" y="404" text-anchor="middle" class="small">可恢复时回到 NORMAL</text>

    <g transform="translate(756 347)">
      <rect width="251" height="125" rx="18" fill="#f0fdfa" stroke="#2dd4bf"/>
      <text x="125" y="30" text-anchor="middle" class="heading">论文实验的额外约束</text>
      <text x="125" y="58" text-anchor="middle" class="body">每个输入最多 1 次 API 调用</text>
      <text x="125" y="84" text-anchor="middle" class="body">“[” 进入 top-k 即可触发</text>
      <text x="125" y="108" text-anchor="middle" class="small">主实验 k = 10，提高调用倾向</text>
    </g>
  </g>

  <text x="56" y="671" class="subtitle">安全边界：Toolformer 学到的是文本协议，不会自动获得可靠的参数校验、权限隔离、提示注入防护或调用成本意识；这些必须由 runtime 实现。</text>
  <text x="56" y="699" class="subtitle">能力边界：原论文各工具独立生成训练调用，因此没有工具链轨迹；它也不会浏览多个搜索结果后重写查询。</text>
</svg>
