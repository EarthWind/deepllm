<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">DPO 论文在 TLDR 摘要、人工比较与分布外摘要上的实验结果</title>
  <desc id="desc">TLDR 摘要中 GPT-4 判断 DPO 对人写摘要的胜率约百分之六十一，PPO 最优约百分之五十七；人工直接比较中 DPO 以百分之五十八胜过 PPO；在 CNN DailyMail 分布外输入上，温度零和零点二五时 DPO 胜率分别为三十六和三十一，PPO 为二十六和二十三。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>.title{font:700 31px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 21px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 14px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 12px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.value{font:700 15px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.big{font:700 38px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#4f46e5}</style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <text x="55" y="51" class="title">论文结论不是“DPO 永远胜过 PPO”，而是在三组设置中更简单且达到更好权衡</text>
  <text x="55" y="81" class="sub">主结果由 GPT-4 代理评审与有限人工研究共同支持；模型最大约 6B，不能外推为所有规模和任务的定律。</text>

  <g transform="translate(55 118)" filter="url(#shadow)">
    <rect width="405" height="520" rx="23" fill="#fff" stroke="#cbd5e1"/>
    <text x="25" y="42" class="h">TL;DR 摘要 · GPT-4 胜率</text>
    <text x="25" y="67" class="small">对比测试集 human-written summary</text>
    <g transform="translate(25 105)">
      <text x="0" y="21" class="body">DPO · temp 0</text><rect x="125" y="3" width="219" height="25" rx="7" fill="#4f46e5"/><text x="353" y="22" class="value">≈61%</text>
      <g transform="translate(0 66)"><text x="0" y="21" class="body">PPO · best</text><rect x="125" y="3" width="205" height="25" rx="7" fill="#f59e0b"/><text x="339" y="22" class="value">≈57%</text></g>
      <line x1="0" y1="126" x2="355" y2="126" stroke="#cbd5e1" stroke-dasharray="6 5"/>
      <text x="0" y="157" class="body">DPO 在不同 sampling temperature</text>
      <text x="0" y="180" class="body">下更稳健；PPO 在高温时明显退化。</text>
    </g>
    <rect x="25" y="329" width="355" height="151" rx="17" fill="#eef2ff" stroke="#818cf8"/>
    <text x="46" y="365" class="h">同底座：GPT-J SFT</text>
    <text x="46" y="396" class="body">DPO、PPO、Preferred-FT 从同一</text>
    <text x="46" y="420" class="body">摘要 SFT 模型出发。</text>
    <text x="46" y="452" class="small">约 61/57 来自 Figure 2 曲线，论文使用“approximately”。</text>
  </g>

  <g transform="translate(485 118)" filter="url(#shadow)">
    <rect width="405" height="520" rx="23" fill="#fff" stroke="#cbd5e1"/>
    <text x="25" y="42" class="h">人工直接比较 · DPO vs PPO</text>
    <text x="25" y="67" class="small">TL;DR；DPO temp 0.25，PPO temp 0</text>
    <g transform="translate(25 103)">
      <rect width="355" height="72" rx="15" fill="#e2e8f0"/>
      <rect width="206" height="72" rx="15" fill="#4f46e5"/>
      <path d="M191 0H206V72H191" fill="#4f46e5"/>
      <text x="103" y="31" text-anchor="middle" class="value" fill="#fff">DPO</text><text x="103" y="55" text-anchor="middle" class="value" fill="#fff">58%</text>
      <text x="280" y="31" text-anchor="middle" class="value">PPO</text><text x="280" y="55" text-anchor="middle" class="value">42%</text>
    </g>
    <text x="25" y="221" class="body">这项人工结果验证了主趋势，但样本</text>
    <text x="25" y="245" class="body">有限，且温度不是完全相同。</text>
    <rect x="25" y="283" width="355" height="197" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="46" y="318" class="h">评审敏感性也被量化</text>
    <text x="46" y="350" class="body">Table 2 中，GPT-4 的提示若额外强调</text>
    <text x="46" y="373" class="body">简洁性，DPO 胜率从 47% 变为 54%；</text>
    <text x="46" y="396" class="body">对应人工胜率为 58%。</text>
    <text x="46" y="431" class="small">自动 judge 不是无偏真值；提示词本身</text>
    <text x="46" y="451" class="small">就是评测协议的一部分。</text>
  </g>

  <g transform="translate(915 118)" filter="url(#shadow)">
    <rect width="430" height="520" rx="23" fill="#fff" stroke="#cbd5e1"/>
    <text x="25" y="42" class="h">分布外 CNN/DailyMail</text>
    <text x="25" y="67" class="small">GPT-4 胜率 vs ground-truth summaries</text>
    <g transform="translate(25 103)">
      <text x="0" y="20" class="body">Sampling temp 0</text>
      <g transform="translate(0 34)"><text x="0" y="21" class="body">DPO</text><rect x="70" y="3" width="252" height="25" rx="7" fill="#4f46e5"/><text x="332" y="22" class="value">36%</text></g>
      <g transform="translate(0 74)"><text x="0" y="21" class="body">PPO</text><rect x="70" y="3" width="182" height="25" rx="7" fill="#f59e0b"/><text x="262" y="22" class="value">26%</text></g>
      <text x="0" y="145" class="body">Sampling temp 0.25</text>
      <g transform="translate(0 159)"><text x="0" y="21" class="body">DPO</text><rect x="70" y="3" width="217" height="25" rx="7" fill="#6366f1"/><text x="297" y="22" class="value">31%</text></g>
      <g transform="translate(0 199)"><text x="0" y="21" class="body">PPO</text><rect x="70" y="3" width="161" height="25" rx="7" fill="#fbbf24"/><text x="241" y="22" class="value">23%</text></g>
    </g>
    <rect x="25" y="379" width="380" height="101" rx="17" fill="#ecfdf5" stroke="#34d399"/>
    <text x="46" y="412" class="h">初步 OOD 证据</text>
    <text x="46" y="441" class="body">DPO 36/31，PPO 26/23；论文仍明确</text>
    <text x="46" y="463" class="small">说明需要更全面的分布外研究。</text>
  </g>
  <text x="55" y="692" class="h">Anthropic HH 单轮对话</text>
  <text x="55" y="722" class="body">DPO 是论文比较中唯一能高效超过测试集 chosen responses 的方法，并达到或超过 Best-of-128；后者需要推理时为每个问题生成 128 个候选。</text>
  <text x="55" y="764" class="small">来源：论文 Figure 2、Figure 3、Table 1、Table 2。胜率依赖采样温度、基线、评审模型和提示模板，跨设置不可直接横向拼成单一排行榜。</text>
</svg>
