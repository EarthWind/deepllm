<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GPT-4 后训练带来的收益与代价</title>
  <desc id="desc">SFT、奖励模型、PPO 和规则奖励模型改善指令遵循、事实性与安全行为；考试平均能力基本不变，但 MMLU 子集校准误差从 0.007 增至 0.074，说明对齐不是单向提升。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14172c"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:750;fill:#f8fafc}.sub{font-size:17px;fill:#9fb2cc}.h{font-size:22px;font-weight:700;fill:#f8fafc}.body{font-size:16px;fill:#d5e1ef}.small{font-size:14px;fill:#9fb2cc}.value{font-size:28px;font-weight:750;fill:#f8fafc}.card{fill:#101f34;stroke:#2d4664;stroke-width:1.5}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" class="title">后训练不是“能力总开关”，而是多目标行为塑形</text>
  <text x="64" y="106" class="sub">有些指标改善，有些大致不变，也有指标退化；必须分别测量</text>

  <g transform="translate(64 166)">
    <rect width="338" height="355" rx="22" class="card"/><text x="24" y="46" class="h">基础模型</text>
    <rect x="24" y="75" width="290" height="64" rx="12" fill="#0c2d48"/><text x="169" y="114" class="body" text-anchor="middle">next-token pretraining</text>
    <text x="24" y="181" class="body">✓ 广泛知识与任务能力</text><text x="24" y="218" class="body">✓ 选择题概率较好校准</text><text x="24" y="255" class="body">✕ 不天然遵循用户意图</text><text x="24" y="292" class="body">✕ 可能幻觉或输出伤害</text>
    <rect x="24" y="316" width="290" height="23" rx="8" fill="#083344"/><text x="169" y="333" class="small" text-anchor="middle">能力 ≠ 可直接部署的行为</text>
  </g>
  <path d="M416 344h112" class="line"/>
  <g transform="translate(540 166)">
    <rect width="360" height="355" rx="22" fill="#151d45" stroke="#818cf8" stroke-width="1.6"/><text x="24" y="46" class="h">后训练管线</text>
    <g transform="translate(24 75)"><rect width="312" height="51" rx="11" fill="#1e3a8a"/><text x="156" y="32" text-anchor="middle" class="body">SFT：模仿高质量示范</text><path d="M156 61v30" class="line"/><rect y="101" width="312" height="51" rx="11" fill="#3730a3"/><text x="156" y="133" text-anchor="middle" class="body">RM：学习人工排序偏好</text><path d="M156 162v30" class="line"/><rect y="202" width="312" height="51" rx="11" fill="#5b21b6"/><text x="156" y="234" text-anchor="middle" class="body">PPO：优化策略 + RBRM</text></g>
    <text x="180" y="334" text-anchor="middle" class="small">规则由人写，分类与奖励可由模型辅助</text>
  </g>
  <path d="M914 344h112" class="line"/>
  <g transform="translate(1038 166)">
    <rect width="338" height="355" rx="22" class="card"/><text x="24" y="46" class="h">GPT-4-launch 行为</text>
    <text x="24" y="94" class="body">✓ 更贴近用户意图</text><text x="24" y="131" class="body">✓ TruthfulQA 明显改善</text><text x="24" y="168" class="body">✓ 更常正确拒绝危险请求</text><text x="24" y="205" class="body">✓ 减少安全请求过度拒答</text><text x="24" y="242" class="body">✕ 仍可 jailbreak</text><text x="24" y="279" class="body">✕ 选择题校准显著变差</text><text x="24" y="316" class="body">✕ 多语言安全验证有限</text>
  </g>

  <g transform="translate(64 579)">
    <rect width="402" height="206" rx="20" fill="#0b2f3e" stroke="#22d3ee"/><text x="24" y="43" class="h">考试选择题平均能力</text><text x="24" y="91" class="body">Base</text><rect x="82" y="72" width="235" height="24" rx="12" fill="#2563eb"/><text x="328" y="92" class="value">73.7%</text><text x="24" y="145" class="body">RLHF</text><rect x="82" y="126" width="236" height="24" rx="12" fill="#8b5cf6"/><text x="328" y="146" class="value">74.0%</text><text x="24" y="184" class="small">平均基本不变，不代表每门考试都不变</text>
    <rect x="430" width="402" height="206" rx="20" fill="#2b1723" stroke="#fb7185"/><text x="454" y="43" class="h">MMLU 子集校准 ECE</text><text x="454" y="91" class="body">Base</text><rect x="512" y="72" width="23" height="24" rx="12" fill="#22c55e"/><text x="549" y="92" class="value">0.007</text><text x="454" y="145" class="body">PPO</text><rect x="512" y="126" width="244" height="24" rx="12" fill="#f43f5e"/><text x="770" y="146" class="value">0.074</text><text x="454" y="184" class="small">越低越好；后训练让信心更不可靠</text>
    <rect x="860" width="452" height="206" rx="20" fill="#241b18" stroke="#f59e0b"/><text x="884" y="43" class="h">安全结果（不同量纲）</text><text x="884" y="84" class="body">82% ↓ 回应违规内容的倾向</text><text x="884" y="121" class="body">29% ↑ 敏感请求的合规响应</text><text x="884" y="158" class="body">毒性生成：6.48% → 0.73%</text><text x="884" y="188" class="small">前两项为相对 GPT-3.5 的相对变化</text>
  </g>
  <text x="64" y="838" class="small">数据：Technical Report Appendix B、Figure 8、Section 6。安全数字来自特定内部集与 RealToxicityPrompts，不是所有输入的总体风险率。</text>
</svg>
