<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171a38"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#347aff"/><stop offset="1" stop-color="#42d7aa"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#65cdb3"/></marker>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#edf4ff}.h{font-size:34px;font-weight:800}.m{font-size:23px;font-weight:700}.s{font-size:18px}.muted{fill:#94a8c8}.code{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="1400" height="880" rx="28" fill="url(#bg)"/>
  <text x="66" y="66" class="h">TinyChat：只有把反量化放进主计算循环，W4 的少读内存才会变成真实加速</text>
  <text x="66" y="104" class="s muted">AWQ 决定量化权重；TinyChat 负责 weight packing、on-the-fly dequantization 与 kernel fusion</text>

  <g transform="translate(65 145)">
    <rect width="1270" height="355" rx="24" fill="#0d2038" stroke="#315077"/>
    <text x="28" y="46" class="m">W4A16 线性层的数据路径</text>
    <g transform="translate(35 100)">
      <rect width="245" height="150" rx="20" fill="#142e4a" stroke="#4c73a5"/>
      <text x="122" y="42" text-anchor="middle" class="m">DRAM / 显存</text>
      <text x="122" y="82" text-anchor="middle" class="s code">packed INT4 weights</text>
      <text x="122" y="116" text-anchor="middle" class="s muted">读取量理想为 FP16 的 1/4</text>
      <path d="M260 75H350" stroke="url(#flow)" stroke-width="6" marker-end="url(#arr)"/>
      <rect x="375" width="310" height="150" rx="20" fill="#12372f" stroke="#3bd4a8"/>
      <text x="530" y="40" text-anchor="middle" class="m" fill="#6ee8bd">融合 W4A16 Kernel</text>
      <text x="530" y="79" text-anchor="middle" class="s">unpack → dequant → FMA</text>
      <text x="530" y="113" text-anchor="middle" font-size="16" class="muted">片上反量化，不回写整层 FP16 权重</text>
      <path d="M700 75H790" stroke="url(#flow)" stroke-width="6" marker-end="url(#arr)"/>
      <rect x="815" width="300" height="150" rx="20" fill="#192b47" stroke="#4c73a5"/>
      <text x="965" y="42" text-anchor="middle" class="m">FP16 Activation / Output</text>
      <text x="965" y="82" text-anchor="middle" class="s code">Y = dequant(W₄) · X₁₆</text>
      <text x="965" y="116" text-anchor="middle" class="s muted">weight-only，不是原生 INT4×INT4</text>
    </g>
    <rect x="368" y="286" width="535" height="44" rx="12" fill="#3b282b" stroke="#c96362"/>
    <text x="635" y="315" text-anchor="middle" class="s">错误路径：先把完整 FP16 权重写回 DRAM，再调用普通 GEMM → 带宽收益被抵消</text>
  </g>

  <g transform="translate(65 520)">
    <rect width="600" height="250" rx="24" fill="#0d2038" stroke="#315077"/>
    <text x="28" y="46" class="m">为什么 Decode 更适合 Weight-only</text>
    <text x="28" y="83" class="s">论文 RTX 4090 roofline：batch=1 decode</text>
    <g transform="translate(30 100)">
      <text x="0" y="30" class="s">FP16 算术强度</text><rect x="180" y="5" width="65" height="34" rx="9" fill="#5677a2"/><text x="260" y="30" class="s code">≈1 FLOP/B</text>
      <text x="0" y="88" class="s">W4A16 理想强度</text><rect x="180" y="63" width="260" height="34" rx="9" fill="url(#flow)"/><text x="455" y="88" class="s code">≈4 FLOP/B</text>
      <text x="0" y="143" class="s muted">FLOPs 没少；每个 token 读取的权重 bytes 少了。</text>
    </g>
  </g>

  <g transform="translate(705 520)">
    <rect width="630" height="250" rx="24" fill="#10263b" stroke="#3bcfa3"/>
    <text x="28" y="46" class="m">TinyChat 的另外两项系统工作</text>
    <g transform="translate(30 85)">
      <rect width="260" height="115" rx="17" fill="#142e49"/>
      <text x="130" y="37" text-anchor="middle" class="m">平台感知 Packing</text>
      <text x="130" y="73" text-anchor="middle" class="s muted">GPU / ARM NEON / AVX</text>
      <text x="130" y="99" text-anchor="middle" class="s muted">减少 shift 与 AND 指令</text>
      <rect x="300" width="270" height="115" rx="17" fill="#15372f"/>
      <text x="435" y="37" text-anchor="middle" class="m">Kernel Fusion</text>
      <text x="435" y="73" text-anchor="middle" class="s muted">LayerNorm、QKV、RoPE、Cache</text>
      <text x="435" y="99" text-anchor="middle" class="s muted">减少 launch 与中间 DRAM</text>
    </g>
  </g>
  <text x="700" y="842" text-anchor="middle" class="s muted">论文 3× 级端到端结果属于 AWQ + TinyChat + 特定硬件/实现；不能只凭 checkpoint 位宽推出同样倍率。</text>
</svg>
