<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Megatron-LM 扩展效率与模型效果</title><desc id="desc">左侧显示从 1 到 512 GPU 的弱扩展效率，右侧显示 GPT 模型增大后 WikiText103 perplexity 下降和 LAMBADA accuracy 上升。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172a"/><stop offset="1" stop-color="#123148"/></linearGradient><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{fill:#f5fbff;font-size:30px;font-weight:750}.sub{fill:#9ebdd0;font-size:15px}.h{fill:#ebf9ff;font-size:19px;font-weight:700}.b{fill:#bad3e1;font-size:14px}.v{fill:#f3fbff;font-size:14px;font-weight:700}.tiny{fill:#89aabd;font-size:12px}</style></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><text class="t" x="55" y="64">8.3B 不只“放得下”：512 张 V100 上仍保持约四分之三线性效率</text><text class="sub" x="55" y="94">论文 Figure 5 / Table 3 · scaling 是相对 1.2B 单卡 39 TFLOP/s 强基线</text>
  <g transform="translate(55 137)"><rect width="535" height="480" rx="20" fill="#0b293e" stroke="#315b73"/><text class="h" x="24" y="39">弱扩展效率（%）</text><text class="tiny" x="24" y="62">左：纯 model parallel；右：8-way MP × data parallel</text>
    <g transform="translate(58 100)"><line x1="0" y1="300" x2="420" y2="300" stroke="#688ba1"/><line x1="0" y1="0" x2="0" y2="300" stroke="#688ba1"/><g stroke="#2d4c62" stroke-dasharray="5 6"><line y1="0" x2="420"/><line y1="75" x2="420"/><line y1="150" x2="420"/><line y1="225" x2="420"/></g>
      <path d="M0 0L60 15L120 54L180 69" fill="none" stroke="#35d2c4" stroke-width="4"/><g fill="#35d2c4"><circle r="6"/><circle cx="60" cy="15" r="6"/><circle cx="120" cy="54" r="6"/><circle cx="180" cy="69" r="6"/></g>
      <path d="M240 12L300 51L360 63L420 78" fill="none" stroke="#9a83ef" stroke-width="4"/><g fill="#9a83ef"><circle cx="240" cy="12" r="6"/><circle cx="300" cy="51" r="6"/><circle cx="360" cy="63" r="6"/><circle cx="420" cy="78" r="6"/></g>
      <g class="v" text-anchor="middle"><text x="0" y="-10">100</text><text x="60" y="5">95</text><text x="120" y="44">82</text><text x="180" y="59">77</text><text x="240" y="2">96</text><text x="300" y="41">83</text><text x="360" y="53">79</text><text x="420" y="68">74</text></g>
      <g class="tiny" text-anchor="middle"><text x="0" y="325">1</text><text x="60" y="325">2</text><text x="120" y="325">4</text><text x="180" y="325">8</text><text x="240" y="325">64</text><text x="300" y="325">128</text><text x="360" y="325">256</text><text x="420" y="325">512 GPUs</text></g>
    </g><g transform="translate(62 446)"><circle r="6" fill="#35d2c4"/><text class="tiny" x="14" y="4">model parallel</text><circle cx="155" r="6" fill="#9a83ef"/><text class="tiny" x="169" y="4">model + data parallel</text></g>
  </g>
  <g transform="translate(615 137)"><rect width="530" height="480" rx="20" fill="#0b293e" stroke="#315b73"/><text class="h" x="24" y="39">GPT-2 风格模型：zero-shot 随规模提升</text>
    <g transform="translate(24 82)"><text class="tiny" x="160" y="0" text-anchor="middle">WikiText103 PPL ↓</text><text class="tiny" x="390" y="0" text-anchor="middle">LAMBADA accuracy ↑</text>
      <g transform="translate(0 38)"><text class="b" x="0" y="17">355M</text><rect x="78" width="193" height="25" rx="6" fill="#52718a"/><text class="v" x="283" y="18">19.31</text><rect x="315" width="116" height="25" rx="6" fill="#52718a"/><text class="v" x="443" y="18">45.18%</text></g>
      <g transform="translate(0 101)"><text class="b" x="0" y="17">2.5B</text><rect x="78" width="128" height="25" rx="6" fill="#478da0"/><text class="v" x="218" y="18">12.76</text><rect x="315" width="157" height="25" rx="6" fill="#478da0"/><text class="v" x="443" y="18">61.73%</text></g>
      <g transform="translate(0 164)"><text x="0" y="17" fill="#74ebde" font-size="15" font-weight="800">8.3B</text><rect x="78" width="108" height="25" rx="6" fill="#32c9bd"/><text x="198" y="18" fill="#78ecdf" font-size="14" font-weight="800">10.81</text><rect x="315" width="170" height="25" rx="6" fill="#32c9bd"/><text x="443" y="18" fill="#78ecdf" font-size="14" font-weight="800">66.51%</text></g>
      <line x1="0" y1="222" x2="482" y2="222" stroke="#31566e"/><text class="tiny" x="0" y="249">论文此前 SOTA</text><text class="v" x="198" y="249">15.79</text><text class="v" x="443" y="249">63.24%</text>
    </g>
    <rect x="24" y="386" width="482" height="65" rx="11" fill="#113f4d"/><text x="265" y="411" text-anchor="middle" fill="#84eee2" font-size="14" font-weight="700">512 GPUs · 15.1 PFLOP/s sustained · 约 2.1 天 / epoch</text><text class="tiny" x="265" y="433" text-anchor="middle">8.3B 训练配置：72 layers，hidden 3072，24 heads</text>
  </g><text class="tiny" x="55" y="648">弱扩展不是固定模型强扩展：GPU 增多时模型也增大；512-GPU 点还叠加 64-way data parallel，不能解释成“同一模型 512 卡加速 74%”。</text>
</svg>
