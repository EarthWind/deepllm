<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-Prover-V2 的 miniF2F 测试时扩展、CoT 代价和跨基准结果</title>
  <desc id="desc">671B CoT 在 miniF2F-test 从 pass@1 的 61.9% 提升到 pass@8192 的 88.9%；CoT 输出远长于 non-CoT；ProofNet、PutnamBench、FormalMATH 和 ProverBench 显示跨难度泛化。</desc>
  <defs>
    <linearGradient id="bgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101831"/></linearGradient>
    <filter id="sr" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bgr)"/>
  <text x="50" y="58" fill="#f8fafc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="30" font-weight="700">结果不只说明“模型更大”：CoT 与采样预算同样是扩展轴</text>
  <text x="50" y="88" fill="#94a3b8" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="16">论文 v2；miniF2F-test 共 244 题，以下 pass@k 是每题至少一条 Lean proof 被接受的比例</text>

  <g transform="translate(42 118)" filter="url(#sr)">
    <rect width="650" height="398" rx="22" fill="#0d1930" stroke="#334155"/>
    <text x="22" y="34" fill="#f8fafc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">miniF2F-test：whole-proof generation 的 test-time scaling</text>

    <g transform="translate(70 63)">
      <path d="M0 0V260H530" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <g stroke="#334155" stroke-width="1" stroke-dasharray="4 5">
        <path d="M0 260H530"/><path d="M0 195H530"/><path d="M0 130H530"/><path d="M0 65H530"/><path d="M0 0H530"/>
      </g>
      <g fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="11" text-anchor="end">
        <text x="-10" y="264">50%</text><text x="-10" y="199">60%</text><text x="-10" y="134">70%</text><text x="-10" y="69">80%</text><text x="-10" y="4">90%</text>
      </g>
      <g fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">
        <text x="18" y="283">1</text><text x="184" y="283">32</text><text x="350" y="283">1024</text><text x="516" y="283">8192</text>
      </g>
      <polyline points="18,224 184,143 350,109 516,98" fill="none" stroke="#64748b" stroke-width="3"/>
      <polyline points="18,204 184,94 350,66 516,52" fill="none" stroke="#a78bfa" stroke-width="3.5"/>
      <polyline points="18,198 184,105 350,86 516,76" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <polyline points="18,183 184,49 350,22 516,7" fill="none" stroke="#34d399" stroke-width="4"/>
      <g fill="#64748b"><circle cx="18" cy="224" r="4"/><circle cx="184" cy="143" r="4"/><circle cx="350" cy="109" r="4"/><circle cx="516" cy="98" r="4"/></g>
      <g fill="#a78bfa"><circle cx="18" cy="204" r="4"/><circle cx="184" cy="94" r="4"/><circle cx="350" cy="66" r="4"/><circle cx="516" cy="52" r="4"/></g>
      <g fill="#38bdf8"><circle cx="18" cy="198" r="4"/><circle cx="184" cy="105" r="4"/><circle cx="350" cy="86" r="4"/><circle cx="516" cy="76" r="4"/></g>
      <g fill="#34d399"><circle cx="18" cy="183" r="5"/><circle cx="184" cy="49" r="5"/><circle cx="350" cy="22" r="5"/><circle cx="516" cy="7" r="6"/></g>
      <rect x="438" y="-2" width="78" height="23" rx="11" fill="#065f46"/>
      <text x="477" y="14" text-anchor="middle" fill="#d1fae5" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">88.9%</text>
    </g>

    <g transform="translate(22 360)" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="11">
      <circle cx="8" cy="0" r="5" fill="#64748b"/><text x="19" y="4" fill="#cbd5e1">7B non-CoT</text>
      <circle cx="128" cy="0" r="5" fill="#a78bfa"/><text x="139" y="4" fill="#cbd5e1">7B CoT</text>
      <circle cx="226" cy="0" r="5" fill="#38bdf8"/><text x="237" y="4" fill="#cbd5e1">671B non-CoT</text>
      <circle cx="378" cy="0" r="5" fill="#34d399"/><text x="389" y="4" fill="#cbd5e1">671B CoT</text>
    </g>
  </g>

  <g transform="translate(714 118)" filter="url(#sr)">
    <rect width="444" height="190" rx="22" fill="#12172d" stroke="#8b5cf6"/>
    <text x="20" y="33" fill="#f8fafc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">CoT 精度不是免费的</text>
    <text x="20" y="56" fill="#94a3b8" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12">miniF2F-test 平均输出 token</text>
    <g transform="translate(20 78)">
      <text x="0" y="19" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="12">7B</text>
      <rect x="38" y="5" width="29" height="18" rx="7" fill="#64748b"/>
      <rect x="72" y="5" width="294" height="18" rx="7" fill="#a78bfa"/>
      <text x="374" y="19" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="11">442.6 → 4488.5</text>
      <text x="0" y="62" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="12">671B</text>
      <rect x="38" y="48" width="50" height="18" rx="7" fill="#38bdf8"/>
      <rect x="93" y="48" width="273" height="18" rx="7" fill="#34d399"/>
      <text x="374" y="62" fill="#a7f3d0" font-family="Inter,Arial,sans-serif" font-size="11">761.8 → 6751.9</text>
    </g>
    <text x="20" y="169" fill="#fbbf24" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="12">约 10.1× / 8.9× 更长；应同时报告准确率、延迟与验证成本</text>
  </g>

  <g transform="translate(714 328)" filter="url(#sr)">
    <rect width="444" height="188" rx="22" fill="#0d1d2b" stroke="#22d3ee"/>
    <text x="20" y="32" fill="#f8fafc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">671B CoT 的跨基准结果</text>
    <g transform="translate(20 55)" font-family="Inter,Arial,'PingFang SC',sans-serif">
      <rect width="194" height="48" rx="13" fill="#102a3a"/>
      <text x="14" y="20" fill="#94a3b8" font-size="11">ProofNet-test · pass@1024</text>
      <text x="180" y="34" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="700">37.1%</text>
      <rect x="210" width="194" height="48" rx="13" fill="#102a3a"/>
      <text x="224" y="20" fill="#94a3b8" font-size="11">PutnamBench · pass@1024</text>
      <text x="390" y="34" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="700">47/658</text>
      <rect y="61" width="194" height="48" rx="13" fill="#102a3a"/>
      <text x="14" y="81" fill="#94a3b8" font-size="11">FormalMATH-All · pass@32</text>
      <text x="180" y="95" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="700">28.31%</text>
      <rect x="210" y="61" width="194" height="48" rx="13" fill="#102a3a"/>
      <text x="224" y="81" fill="#94a3b8" font-size="11">ProverBench · pass@512</text>
      <text x="390" y="95" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="700">59.1%</text>
    </g>
    <text x="20" y="176" fill="#fb7185" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="11">v2 已剔除 2 个误形式化 Putnam 题；仓库 README 的“49”是早期口径</text>
  </g>

  <g transform="translate(42 542)">
    <rect width="1116" height="87" rx="22" fill="#172033" stroke="#334155"/>
    <circle cx="42" cy="43" r="22" fill="#713f12"/>
    <text x="42" y="50" text-anchor="middle" fill="#fde68a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">!</text>
    <text x="79" y="34" fill="#f8fafc" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">88.9% 不是“一次就会”，而是每题最多 8192 次 whole-proof 采样后的覆盖率</text>
    <text x="79" y="59" fill="#94a3b8" font-family="Inter,Arial,'PingFang SC',sans-serif" font-size="13">不同方法的 sample budget、单样本长度、树搜索开销与验证环境不同；不能只凭最终百分比做等算力横比。</text>
  </g>
</svg>
