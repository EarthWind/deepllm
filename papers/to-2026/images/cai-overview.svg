<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Constitutional AI 的监督学习与 RLAIF 两阶段流水线</title>
  <desc id="desc">人类编写的宪法原则在监督学习阶段指导批判和修订，在强化学习阶段指导 AI 比较候选回答。修订结果用于监督微调，AI 偏好与人类有用性偏好共同训练偏好模型，最后通过强化学习得到 RL-CAI。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="constitution" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .stage { font: 700 21px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .heading { font: 700 17px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 400 12px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .white { fill: #fff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .guide { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#purpleArrow); }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="58" y="54" class="title">Constitutional AI：同一套原则，生成两种训练信号</text>
  <text x="58" y="84" class="subtitle">监督阶段把原则变成高质量示范；RLAIF 阶段把原则变成概率偏好，再沿用“偏好模型 → 强化学习”的 RLHF 后半程。</text>

  <g transform="translate(58 122)" filter="url(#shadow)">
    <rect width="238" height="650" rx="24" fill="url(#constitution)"/>
    <text x="119" y="48" text-anchor="middle" class="stage">人类提供的监督</text>
    <rect x="24" y="78" width="190" height="168" rx="18" fill="#ffffff" fill-opacity="0.13" stroke="#c4b5fd"/>
    <path d="M72 112 h94 v86 h-94 z M85 131 h66 M85 149 h66 M85 167 h49" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="119" y="222" text-anchor="middle" class="label white">Constitution</text>
    <text x="119" y="274" text-anchor="middle" class="small white">约 16 条研究用原则</text>
    <text x="119" y="298" text-anchor="middle" class="small white">＋少量 few-shot 示例</text>

    <rect x="24" y="336" width="190" height="112" rx="16" fill="#ffffff" fill-opacity="0.13" stroke="#c4b5fd"/>
    <text x="119" y="368" text-anchor="middle" class="label white">原则不是推理时规则引擎</text>
    <text x="119" y="394" text-anchor="middle" class="small white">它在训练数据生成时</text>
    <text x="119" y="416" text-anchor="middle" class="small white">约束 critique 与 judge</text>

    <rect x="24" y="486" width="190" height="124" rx="16" fill="#312e81" stroke="#a5b4fc"/>
    <text x="119" y="520" text-anchor="middle" class="label white">仍然离不开人</text>
    <text x="119" y="548" text-anchor="middle" class="small white">原则由人编写</text>
    <text x="119" y="570" text-anchor="middle" class="small white">有用性标签来自人类</text>
    <text x="119" y="592" text-anchor="middle" class="small white">最终效果由人类评测</text>
  </g>

  <g transform="translate(342 122)" filter="url(#shadow)">
    <rect width="1000" height="286" rx="24" fill="#fff" stroke="#bfdbfe"/>
    <rect width="1000" height="58" rx="24" fill="url(#sl)"/>
    <rect y="36" width="1000" height="22" fill="url(#sl)"/>
    <text x="28" y="38" class="stage">阶段一：Critique → Revision → Supervised Learning</text>

    <g transform="translate(30 92)">
      <rect width="144" height="72" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="72" y="30" text-anchor="middle" class="label">Helpful RLHF</text>
      <text x="72" y="53" text-anchor="middle" class="small">初始助手</text>
    </g>
    <path d="M174 128 H215" class="arrow"/>
    <g transform="translate(220 92)">
      <rect width="142" height="72" rx="14" fill="#fff7ed" stroke="#fb923c"/>
      <text x="71" y="29" text-anchor="middle" class="label">红队 Prompt</text>
      <text x="71" y="52" text-anchor="middle" class="small">→ 初始回答</text>
    </g>
    <path d="M362 128 H403" class="arrow"/>
    <g transform="translate(408 80)">
      <rect width="180" height="96" rx="16" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="90" y="28" text-anchor="middle" class="label">批判 → 修订</text>
      <text x="90" y="53" text-anchor="middle" class="small">每轮随机抽一条原则</text>
      <text x="90" y="76" text-anchor="middle" class="small">论文执行 4 轮</text>
    </g>
    <path d="M588 128 H629" class="arrow"/>
    <g transform="translate(634 92)">
      <rect width="142" height="72" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
      <text x="71" y="29" text-anchor="middle" class="label">全部 revisions</text>
      <text x="71" y="52" text-anchor="middle" class="small">＋有用性 samples</text>
    </g>
    <path d="M776 128 H817" class="arrow"/>
    <g transform="translate(822 92)">
      <rect width="146" height="72" rx="36" fill="#1d4ed8"/>
      <text x="73" y="31" text-anchor="middle" class="stage">SL-CAI</text>
      <text x="73" y="53" text-anchor="middle" class="small white">先移到安全分布</text>
    </g>

    <text x="30" y="226" class="small">输出监督样本：</text>
    <rect x="143" y="205" width="250" height="34" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="268" y="227" text-anchor="middle" class="tiny">(red-team prompt, revised response)</text>
  </g>

  <g transform="translate(342 444)" filter="url(#shadow)">
    <rect width="1000" height="328" rx="24" fill="#fff" stroke="#a7f3d0"/>
    <rect width="1000" height="58" rx="24" fill="url(#rl)"/>
    <rect y="36" width="1000" height="22" fill="url(#rl)"/>
    <text x="28" y="38" class="stage">阶段二：AI Comparison → Preference Model → RL（RLAIF）</text>

    <g transform="translate(28 94)">
      <rect width="132" height="76" rx="38" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="66" y="33" text-anchor="middle" class="label">SL-CAI</text>
      <text x="66" y="56" text-anchor="middle" class="small">生成候选对</text>
    </g>
    <path d="M160 132 H201" class="arrow"/>
    <g transform="translate(206 86)">
      <rect width="146" height="43" rx="11" fill="#f0fdfa" stroke="#5eead4"/>
      <text x="73" y="27" text-anchor="middle" class="label">Response A</text>
      <rect y="54" width="146" height="43" rx="11" fill="#f0fdfa" stroke="#5eead4"/>
      <text x="73" y="81" text-anchor="middle" class="label">Response B</text>
    </g>
    <path d="M352 132 H393" class="arrow"/>
    <g transform="translate(398 82)">
      <rect width="168" height="112" rx="16" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="84" y="29" text-anchor="middle" class="label">Feedback Model</text>
      <text x="84" y="56" text-anchor="middle" class="small">原则 + A/B 多选题</text>
      <text x="84" y="81" text-anchor="middle" class="small">输出软标签</text>
      <text x="84" y="101" text-anchor="middle" class="tiny">q = P(A ≻ B)</text>
    </g>
    <path d="M566 132 H607" class="arrow"/>
    <g transform="translate(612 94)">
      <rect width="142" height="76" rx="14" fill="#ecfdf5" stroke="#34d399"/>
      <text x="71" y="31" text-anchor="middle" class="label">Hybrid PM</text>
      <text x="71" y="55" text-anchor="middle" class="small">AI 安全 + 人类有用</text>
    </g>
    <path d="M754 132 H795" class="arrow"/>
    <g transform="translate(800 86)">
      <rect width="168" height="96" rx="16" fill="#dcfce7" stroke="#22c55e"/>
      <text x="84" y="31" text-anchor="middle" class="label">RL + KL constraint</text>
      <text x="84" y="57" text-anchor="middle" class="small">提高 PM 奖励</text>
      <text x="84" y="79" text-anchor="middle" class="small">不偏离 SL-CAI 太远</text>
    </g>

    <path d="M884 182 V219" class="arrow"/>
    <rect x="800" y="220" width="168" height="58" rx="29" fill="#047857"/>
    <text x="884" y="256" text-anchor="middle" class="stage">RL-CAI</text>

    <rect x="398" y="220" width="356" height="58" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="576" y="244" text-anchor="middle" class="small">AI 只替代“无害性比较标签”</text>
    <text x="576" y="265" text-anchor="middle" class="small">PM 仍混入 135,296 条人类有用性比较</text>
  </g>

  <path d="M296 285 C318 285 318 250 342 250" class="guide"/>
  <path d="M296 515 C318 515 318 572 342 572" class="guide"/>
  <path d="M296 636 C314 636 314 693 342 693" class="guide"/>
  <text x="58" y="824" class="subtitle">关键边界：论文没有使用人类“有害/无害”标签来训练 CAI，但并不等于训练过程没有人类价值判断或人类反馈。</text>
</svg>
