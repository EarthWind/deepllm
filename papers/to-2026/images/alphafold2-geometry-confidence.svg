<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">AlphaFold2 的几何模块、FAPE 与置信度</title>
  <desc id="desc">左侧展示每个残基的局部刚体框架和 invariant point attention；中间展示 FAPE 在局部坐标中比较预测与真值；右侧区分 pLDDT 与 PAE。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061524"/><stop offset="1" stop-color="#1c1636"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.head{font-size:21px;font-weight:650;fill:#f8fafc}.small{font-size:14px;fill:#dbeafe}.tiny{font-size:12px;fill:#94a3b8}.panel{fill:#0c1d31;stroke:#314965;stroke-width:1.5}.axis{stroke-width:4;stroke-linecap:round}</style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" class="sans title">结构模块：让注意力理解三维，但不依赖全局坐标系</text>
  <text x="52" y="94" class="sans sub">IPA 负责“看谁”，frame update 负责“怎么移动”；FAPE 在每个残基自己的观察坐标中监督结果</text>

  <rect x="42" y="124" width="440" height="670" rx="22" class="panel"/>
  <text x="262" y="165" text-anchor="middle" class="sans head">1. Residue gas + IPA</text>
  <text x="262" y="193" text-anchor="middle" class="sans tiny">初始时所有 frame 重合；网络允许每个残基先自由移动</text>
  <g transform="translate(106 250)">
    <circle cx="55" cy="56" r="26" fill="#0e7490"/><path d="M55 56L116 30" class="axis" stroke="#ef4444"/><path d="M55 56L84 117" class="axis" stroke="#22c55e"/><path d="M55 56L20 14" class="axis" stroke="#3b82f6"/><circle cx="116" cy="30" r="7" fill="#fde68a"/>
    <text x="55" y="62" text-anchor="middle" class="sans small">i</text><text x="124" y="24" class="sans tiny">qᵢ point</text>
    <circle cx="242" cy="148" r="26" fill="#7c3aed"/><path d="M242 148L301 178" class="axis" stroke="#ef4444"/><path d="M242 148L206 201" class="axis" stroke="#22c55e"/><path d="M242 148L260 89" class="axis" stroke="#3b82f6"/><circle cx="260" cy="89" r="7" fill="#fde68a"/>
    <text x="242" y="154" text-anchor="middle" class="sans small">j</text><text x="269" y="81" class="sans tiny">kⱼ point</text>
    <path d="M122 34C160 35 205 58 253 86" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="176" y="43" class="sans tiny" fill="#fde68a">‖Tᵢqᵢ − Tⱼkⱼ‖²</text>
  </g>
  <rect x="75" y="493" width="375" height="131" rx="16" fill="#102946" stroke="#38bdf8"/>
  <text x="262" y="525" text-anchor="middle" class="sans small">attention logit（三类证据相加）</text>
  <text x="262" y="555" text-anchor="middle" class="sans tiny">标量 qᵢ·kⱼ + pair bias zᵢⱼ</text>
  <text x="262" y="581" text-anchor="middle" class="sans tiny">− γₕ/2 · Σₚ ‖Tᵢqᵢᵖ − Tⱼkⱼᵖ‖²</text>
  <text x="262" y="607" text-anchor="middle" class="sans tiny">距离越远，注意力越受惩罚</text>
  <text x="262" y="663" text-anchor="middle" class="sans small" fill="#86efac">整体旋转/平移后，权重不变</text>
  <text x="262" y="691" text-anchor="middle" class="sans tiny">因为刚体变换保持点间欧氏距离；输出再投回 i 的局部 frame</text>
  <text x="262" y="736" text-anchor="middle" class="sans tiny">随后预测局部 frame 增量</text>
  <text x="262" y="758" text-anchor="middle" class="sans tiny">在全局坐标中呈 SE(3) 等变更新</text>

  <rect x="500" y="124" width="406" height="670" rx="22" class="panel"/>
  <text x="703" y="165" text-anchor="middle" class="sans head">2. FAPE：局部观察误差</text>
  <text x="703" y="193" text-anchor="middle" class="sans tiny">不是先做一次全局 Kabsch 对齐再算 RMSD</text>
  <g transform="translate(552 244)">
    <rect width="302" height="176" rx="17" fill="#132842" stroke="#475569"/>
    <text x="151" y="29" text-anchor="middle" class="sans small">从 frame k 观察 atom i</text>
    <path d="M70 120L125 83" stroke="#22d3ee" stroke-width="5"/><circle cx="70" cy="120" r="21" fill="#0e7490"/><circle cx="125" cy="83" r="9" fill="#67e8f9"/>
    <path d="M70 120L154 61" stroke="#a78bfa" stroke-width="5"/><circle cx="154" cy="61" r="9" fill="#c4b5fd"/>
    <path d="M125 83L154 61" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="36" y="151" class="sans tiny">frame k</text><text x="161" y="53" class="sans tiny">预测</text><text x="129" y="103" class="sans tiny">真值</text>
    <text x="202" y="112" class="sans tiny" fill="#fde68a">局部差</text>
  </g>
  <text x="703" y="462" text-anchor="middle" class="sans small">eₖᵢ = ‖Tₖ⁻¹xᵢ − Tₖ*⁻¹xᵢ*‖₂</text>
  <text x="703" y="495" text-anchor="middle" class="sans tiny">对所有 frame × atom 求平均；主链项通常截断于 10 Å 并除以 10 Å</text>
  <rect x="538" y="530" width="330" height="151" rx="16" fill="#2e1b52" stroke="#a78bfa"/>
  <text x="703" y="565" text-anchor="middle" class="sans small">FAPE 同时获得三种性质</text>
  <text x="561" y="598" class="sans tiny">✓ 对整体旋转和平移不变</text>
  <text x="561" y="626" class="sans tiny">✓ 强调局部方向与侧链相互作用</text>
  <text x="561" y="654" class="sans tiny">✓ 能区分镜像，从损失中提供手性信号</text>
  <text x="703" y="721" text-anchor="middle" class="sans tiny">结构模块每层都施加辅助 FAPE / torsion loss，</text>
  <text x="703" y="745" text-anchor="middle" class="sans tiny">让中间预测也必须逐步变好。</text>

  <rect x="924" y="124" width="432" height="670" rx="22" class="panel"/>
  <text x="1140" y="165" text-anchor="middle" class="sans head">3. 两种置信度回答不同问题</text>
  <text x="1140" y="193" text-anchor="middle" class="sans tiny">高分不是“所有生物学状态都已确定”</text>
  <text x="955" y="238" class="sans small">pLDDT：每个残基附近是否可信？</text>
  <rect x="956" y="261" width="368" height="43" rx="11" fill="#12304d"/>
  <rect x="956" y="261" width="92" height="43" rx="11" fill="#f97316"/><rect x="1048" y="261" width="74" height="43" fill="#facc15"/><rect x="1122" y="261" width="92" height="43" fill="#38bdf8"/><rect x="1214" y="261" width="110" height="43" rx="11" fill="#1d4ed8"/>
  <text x="1002" y="288" text-anchor="middle" class="sans tiny" fill="#fff">&lt;50</text><text x="1085" y="288" text-anchor="middle" class="sans tiny" fill="#111827">50–70</text><text x="1168" y="288" text-anchor="middle" class="sans tiny" fill="#082f49">70–90</text><text x="1269" y="288" text-anchor="middle" class="sans tiny" fill="#fff">&gt;90</text>
  <text x="956" y="329" class="sans tiny">局部原子环境；低分也可能对应天然无序区。</text>

  <text x="955" y="382" class="sans small">PAE(x,y)：以 y 对齐时，x 预计错多少 Å？</text>
  <g transform="translate(971 408)">
    <rect width="150" height="150" fill="#d9f99d" stroke="#94a3b8"/>
    <rect x="4" y="4" width="65" height="65" fill="#14532d"/><rect x="81" y="81" width="65" height="65" fill="#14532d"/>
    <text x="75" y="176" text-anchor="middle" class="sans tiny">域内低、域间高</text>
    <text x="75" y="196" text-anchor="middle" class="sans tiny">相对域排布不确定</text>
  </g>
  <g transform="translate(1160 408)">
    <rect width="150" height="150" fill="#4d7c0f" stroke="#94a3b8"/>
    <rect x="4" y="4" width="65" height="65" fill="#14532d"/><rect x="81" y="81" width="65" height="65" fill="#14532d"/><rect x="4" y="81" width="65" height="65" fill="#166534"/><rect x="81" y="4" width="65" height="65" fill="#166534"/>
    <text x="75" y="176" text-anchor="middle" class="sans tiny">域内、域间都低</text>
    <text x="75" y="196" text-anchor="middle" class="sans tiny">整体排布较可信</text>
  </g>
  <rect x="956" y="642" width="368" height="103" rx="15" fill="#3f2a18" stroke="#f59e0b"/>
  <text x="1140" y="674" text-anchor="middle" class="sans small">读图原则</text>
  <text x="1140" y="701" text-anchor="middle" class="sans tiny">pLDDT 高：局部折叠可能对</text>
  <text x="1140" y="726" text-anchor="middle" class="sans tiny">还要看跨域 PAE，才能谈相对位置</text>
  <text x="52" y="827" class="sans tiny">pLDDT 阈值采用 AlphaFold DB 的常用解释；PAE 是非对称量，矩阵坐标的“对齐残基/被评估残基”需按具体文件约定读取。</text>
</svg>
