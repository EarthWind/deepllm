<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AlphaZero 2017 预印本初始评测结果</title>
  <desc id="desc">在一分钟每步的100局评测中，AlphaZero对Stockfish取得28胜72和0负，对Elmo取得90胜2和8负，对AlphaGo Zero三日版取得60胜40负。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#111d38"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.m{font-size:21px;font-weight:650}.big{font-size:34px;font-weight:750}.s{font-size:17px}.xs{font-size:15px;fill:#aebfd9}.card{fill:#132440;stroke:#31517a;stroke-width:2}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><text class="t h" x="60" y="62">2017 arXiv 初始评测：100 局 · 每步 1 分钟</text><text class="t xs" x="60" y="93">以下均从 AlphaZero 视角统计；不要与 2018 Science 的长时限 1000 局国际象棋评测混用</text>
  <g filter="url(#shadow)"><rect class="card" x="55" y="140" width="340" height="325" rx="22"/><text class="t m" x="85" y="184">国际象棋 vs Stockfish</text><text class="t big" x="85" y="240">28 胜 · 72 和 · 0 负</text><rect x="85" y="282" width="280" height="38" rx="10" fill="#94a3b8"/><rect x="85" y="282" width="78.4" height="38" rx="10" fill="#22c58b"/><text class="t xs" x="85" y="350">执白：25 胜 25 和 0 负</text><text class="t xs" x="85" y="378">执黑： 3 胜 47 和 0 负</text><text class="t xs" x="85" y="424">完整训练 9 小时；约 4 小时首次超过对手</text></g>
  <g filter="url(#shadow)"><rect class="card" x="430" y="140" width="340" height="325" rx="22"/><text class="t m" x="460" y="184">日本将棋 vs Elmo</text><text class="t big" x="460" y="240">90 胜 · 2 和 · 8 负</text><rect x="460" y="282" width="280" height="38" rx="10" fill="#ef6461"/><rect x="460" y="282" width="252" height="38" rx="10" fill="#22c58b"/><rect x="712" y="282" width="5.6" height="38" fill="#94a3b8"/><text class="t xs" x="460" y="350">先手：43 胜 2 和 5 负</text><text class="t xs" x="460" y="378">后手：47 胜 0 和 3 负</text><text class="t xs" x="460" y="424">完整训练 12 小时；不足 2 小时首次超过对手</text></g>
  <g filter="url(#shadow)"><rect class="card" x="805" y="140" width="340" height="325" rx="22"/><text class="t m" x="835" y="184">围棋 vs AlphaGo Zero 3-day</text><text class="t big" x="835" y="240">60 胜 · 0 和 · 40 负</text><rect x="835" y="282" width="280" height="38" rx="10" fill="#ef6461"/><rect x="835" y="282" width="168" height="38" rx="10" fill="#22c58b"/><text class="t xs" x="835" y="350">执黑：31 胜 0 和 19 负</text><text class="t xs" x="835" y="378">执白：29 胜 0 和 21 负</text><text class="t xs" x="835" y="424">完整训练 34 小时；约 8 小时超过 AlphaGo Lee</text></g>
  <g transform="translate(55 503)"><rect width="1090" height="155" rx="22" fill="#0b1930" stroke="#29496e"/><text class="t m" x="28" y="40">算力口径同样重要</text><text class="t s" x="28" y="76">训练：5,000 个第一代 TPU 生成自我对弈；64 个第二代 TPU 更新网络；700,000 step；batch 4,096。</text><text class="t s" x="28" y="108">初始评测：AlphaZero / AlphaGo Zero 使用 4 个 TPU；Stockfish / Elmo 使用 64 CPU 线程与 1 GB hash。</text><text class="t xs" x="28" y="136">“几小时学会”是巨量并行算力下的墙钟时间，不等于几小时单机计算，也不等于完整训练只用了前述首次超越时间。</text></g>
  <g transform="translate(74 683)"><circle cx="0" cy="0" r="7" fill="#22c58b"/><text class="t xs" x="14" y="5">胜</text><circle cx="71" cy="0" r="7" fill="#94a3b8"/><text class="t xs" x="85" y="5">和</text><circle cx="142" cy="0" r="7" fill="#ef6461"/><text class="t xs" x="156" y="5">负</text></g>
</svg>
