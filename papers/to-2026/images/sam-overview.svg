<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#241540"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#abc0e2"/></marker></defs><rect width="1400" height="820" rx="30" fill="url(#bg)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="64" fill="#fff" font-size="32" font-weight="700">SAM：把“分割什么”变成一个可提示的接口</text><text x="52" y="98" fill="#a9bee2" font-size="18">一次编码图像，多次用点、框或 mask prompt 生成候选分割</text><rect x="55" y="170" width="310" height="470" rx="22" fill="#102d46" stroke="#2ec7de" stroke-width="2"/><text x="92" y="225" fill="#fff" font-size="25" font-weight="700">Image Encoder</text><rect x="93" y="285" width="230" height="160" rx="12" fill="#2b536b"/><circle cx="145" cy="340" r="35" fill="#f0b44c"/><path d="M103 425l70-90 38 42 40-65 58 113z" fill="#4bd3a4"/><text x="92" y="500" fill="#a7dce5" font-size="17">ViT → image embedding</text><text x="92" y="540" fill="#f2ca78" font-size="17">一次计算，多次复用</text><line x1="390" y1="405" x2="470" y2="405" stroke="#abc0e2" stroke-width="4" marker-end="url(#a)"/><rect x="490" y="170" width="310" height="470" rx="22" fill="#172449" stroke="#9b75ed" stroke-width="2"/><text x="527" y="225" fill="#fff" font-size="25" font-weight="700">Prompt Encoder</text><circle cx="548" cy="320" r="12" fill="#edac3c"/><text x="575" y="327" fill="#f3cc7b" font-size="18">positive point</text><circle cx="548" cy="380" r="12" fill="#48d4a7"/><text x="575" y="387" fill="#a8efd1" font-size="18">negative point</text><rect x="530" y="440" width="200" height="80" rx="12" fill="#3b2d68"/><text x="584" y="488" fill="#fff" font-size="22" font-weight="700">box / mask</text><text x="527" y="575" fill="#c8b9fa" font-size="17">稀疏 prompt embedding</text><line x1="825" y1="405" x2="905" y2="405" stroke="#abc0e2" stroke-width="4" marker-end="url(#a)"/><rect x="925" y="170" width="420" height="470" rx="22" fill="#29203f" stroke="#f0ad3c" stroke-width="2"/><text x="962" y="225" fill="#fff" font-size="25" font-weight="700">Mask Decoder</text><rect x="965" y="295" width="340" height="90" rx="12" fill="#4c376b"/><text x="1050" y="332" fill="#fff" font-size="20">cross-attention</text><text x="1025" y="362" fill="#d1c4f9" font-size="16">image embedding × prompt</text><rect x="965" y="430" width="160" height="110" rx="12" fill="#12443e"/><path d="M980 515l38-50 24 25 28-38 32 63z" fill="#45d3a4"/><rect x="1145" y="430" width="160" height="110" rx="12" fill="#12443e"/><path d="M1160 515l38-50 24 25 28-38 32 63z" fill="#49d4a5"/><text x="969" y="585" fill="#f3ca78" font-size="17">多候选 mask + quality score</text><path d="M670 700h260" stroke="#f2d34a" stroke-width="3" stroke-dasharray="10 10"/><text x="435" y="750" fill="#f3d65a" font-size="18">promptable + zero-shot：用户指定对象，模型负责边界</text></g></svg>
