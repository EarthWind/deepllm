<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Megatron-LM 的 BERT LayerNorm 重排</title><desc id="desc">比较原始 BERT 的 post-layer normalization 与论文用于稳定更大 BERT 模型的 pre-layer normalization 残差结构。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172a"/><stop offset="1" stop-color="#123148"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6fdbeb"/></marker><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{fill:#f5fbff;font-size:30px;font-weight:750}.sub{fill:#9ebdd0;font-size:15px}.h{fill:#ebf9ff;font-size:19px;font-weight:700}.b{fill:#bad3e1;font-size:14px}.tiny{fill:#89aabd;font-size:12px}</style></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><text class="t" x="55" y="64">系统论文里还有一个模型结论：大 BERT 的 LayerNorm 位置很关键</text><text class="sub" x="55" y="94">论文 Figure 7：重排 residual 与 normalization 后，752M 模型不再出现原结构的训练退化</text>
  <g transform="translate(55 137)"><rect width="512" height="477" rx="20" fill="#30232c" stroke="#895469"/><text class="h" x="25" y="40" fill="#ffdce7">(a) 原始 BERT 风格：Post-LN</text>
    <g transform="translate(166 78)"><rect width="180" height="46" rx="10" fill="#17465b"/><text class="h" x="90" y="29" text-anchor="middle">输入 x</text><path d="M90 46v34" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><rect y="82" width="180" height="56" rx="11" fill="#164f5c" stroke="#3fc4ba"/><text class="h" x="90" y="116" text-anchor="middle">Attention / MLP</text><path d="M90 138v35" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><circle cx="90" cy="194" r="20" fill="#76503d"/><text x="90" y="201" text-anchor="middle" fill="#fff1d0" font-size="22" font-weight="800">+</text><path d="M-24 23h-34v171h126" fill="none" stroke="#f0b95e" stroke-width="3" marker-end="url(#a)"/><path d="M90 214v34" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><rect y="250" width="180" height="56" rx="11" fill="#59405a" stroke="#b779a3"/><text class="h" x="90" y="284" text-anchor="middle">LayerNorm</text><path d="M90 306v12" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><rect y="320" width="180" height="46" rx="10" fill="#442d38"/><text class="h" x="90" y="349" text-anchor="middle">输出</text></g>
    <text class="tiny" x="256" y="450" text-anchor="middle">梯度的直通残差路径仍要穿过 LayerNorm</text>
  </g>
  <g transform="translate(633 137)"><rect width="512" height="477" rx="20" fill="#0c3540" stroke="#39c4b8"/><text class="h" x="25" y="40" fill="#bafff4">(b) 论文重排：Pre-LN</text>
    <g transform="translate(166 78)"><rect width="180" height="46" rx="10" fill="#17465b"/><text class="h" x="90" y="29" text-anchor="middle">输入 x</text><path d="M90 46v34" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><rect y="82" width="180" height="56" rx="11" fill="#185363" stroke="#45a7bc"/><text class="h" x="90" y="116" text-anchor="middle">LayerNorm</text><path d="M90 138v35" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><rect y="175" width="180" height="56" rx="11" fill="#164f5c" stroke="#3fc4ba"/><text class="h" x="90" y="209" text-anchor="middle">Attention / MLP</text><path d="M90 231v35" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><circle cx="90" cy="287" r="20" fill="#187168"/><text x="90" y="294" text-anchor="middle" fill="#dffff9" font-size="22" font-weight="800">+</text><path d="M-24 23h-34v264h126" fill="none" stroke="#f0b95e" stroke-width="3" marker-end="url(#a)"/><path d="M90 307v11" stroke="#6fdbeb" stroke-width="3" marker-end="url(#a)"/><rect y="320" width="180" height="46" rx="10" fill="#15515a"/><text class="h" x="90" y="349" text-anchor="middle">输出</text></g>
    <text class="tiny" x="256" y="450" text-anchor="middle">残差主路径更直接，论文观测到大模型训练更稳定</text>
  </g><text class="tiny" x="55" y="648">这里是论文的经验结论，不应读成“所有架构、所有规模下 Pre-LN 必然最优”；它解释了该实验中 BERT 扩大后为何不再退化。</text>
</svg>
