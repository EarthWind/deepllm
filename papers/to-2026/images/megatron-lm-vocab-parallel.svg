<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Megatron-LM 词表并行交叉熵</title><desc id="desc">比较先 all-gather 完整词表 logits 的昂贵方案，与只归约每个 token 的最大值、指数和及目标 logit 的融合交叉熵。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172a"/><stop offset="1" stop-color="#123148"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6fdceb"/></marker><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{fill:#f5fbff;font-size:30px;font-weight:750}.sub{fill:#9ebdd0;font-size:15px}.h{fill:#ebf9ff;font-size:18px;font-weight:700}.b{fill:#bdd6e3;font-size:14px}.tiny{fill:#89aabd;font-size:12px}</style></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><text class="t" x="55" y="64">词表也切，但绝不把 [batch × seq × vocab] 全部拼回来</text><text class="sub" x="55" y="94">50,257 → padding 到 51,200；8-way 时每个 vocab shard 都是 128 的整数倍</text>
  <g transform="translate(55 142)"><rect width="515" height="466" rx="20" fill="#30222b" stroke="#855366"/><text class="h" x="24" y="40" fill="#ffdbe6">朴素方案：all-gather logits</text>
    <g transform="translate(25 80)"><rect width="95" height="265" rx="11" fill="#165066"/><rect x="107" width="95" height="265" rx="11" fill="#3b3464"/><rect x="214" width="95" height="265" rx="11" fill="#5b3a61"/><rect x="321" width="95" height="265" rx="11" fill="#81533d"/><g fill="#e9f8ff" font-size="15" font-weight="700"><text x="47" y="138" text-anchor="middle">L₀</text><text x="154" y="138" text-anchor="middle">L₁</text><text x="261" y="138" text-anchor="middle">L₂</text><text x="368" y="138" text-anchor="middle">L₃</text></g><text class="tiny" x="208" y="291" text-anchor="middle">每个 rank 持有 vocab/p 列</text></g>
    <path d="M257 385v37" stroke="#ff9fba" stroke-width="3" marker-end="url(#a)"/><rect x="84" y="419" width="347" height="31" rx="8" fill="#5a2e3d"/><text x="257" y="440" text-anchor="middle" fill="#ffd6e2" font-size="14" font-weight="700">通信 b × s × v 个元素</text>
  </g>
  <g transform="translate(595 142)"><rect width="550" height="466" rx="20" fill="#0c3541" stroke="#35bcb2"/><text class="h" x="24" y="40" fill="#bafff4">融合方案：分布式 log-sum-exp</text>
    <g transform="translate(25 79)"><rect width="112" height="66" rx="11" fill="#175266"/><text class="h" x="56" y="28" text-anchor="middle">local max</text><text class="tiny" x="56" y="50" text-anchor="middle">每 token</text><path d="M126 33h34" stroke="#6fdceb" stroke-width="3" marker-end="url(#a)"/><rect x="174" width="132" height="66" rx="11" fill="#174b59"/><text class="h" x="240" y="28" text-anchor="middle">MAX reduce</text><text class="tiny" x="240" y="50" text-anchor="middle">全局稳定移位</text><path d="M320 33h34" stroke="#6fdceb" stroke-width="3" marker-end="url(#a)"/><rect x="368" width="132" height="66" rx="11" fill="#174b59"/><text class="h" x="434" y="28" text-anchor="middle">SUM exp</text><text class="tiny" x="434" y="50" text-anchor="middle">全局分母</text>
    <rect y="107" width="213" height="67" rx="11" fill="#332d58" stroke="#8874df"/><text class="h" x="106" y="134" text-anchor="middle">owner 取 target logit</text><text class="tiny" x="106" y="157" text-anchor="middle">其他 ranks 置 0</text><path d="M227 140h34" stroke="#6fdceb" stroke-width="3" marker-end="url(#a)"/><rect x="275" y="107" width="225" height="67" rx="11" fill="#174b59"/><text class="h" x="387" y="134" text-anchor="middle">SUM target logit</text><text class="tiny" x="387" y="157" text-anchor="middle">每 token 只有一个 owner</text>
    <path d="M250 194v38" stroke="#f0b95e" stroke-width="3" marker-end="url(#a)"/><rect x="75" y="244" width="350" height="78" rx="13" fill="#3a3023" stroke="#bd8443"/><text x="250" y="274" text-anchor="middle" fill="#ffe2a7" font-size="18" font-weight="750">loss = m + log Σ exp(z−m) − zᵧ</text><text x="250" y="300" text-anchor="middle" fill="#e4c58e" font-size="13">不物化完整 logits</text>
    <rect x="31" y="349" width="438" height="48" rx="10" fill="#124653"/><text x="250" y="379" text-anchor="middle" fill="#8af1e4" font-size="15" font-weight="700">通信主维度从 b×s×v 降到 b×s（常数次 collective）</text></g>
  </g><text class="tiny" x="55" y="642">核心不是近似 softmax：分布式 MAX 与 SUM 保证数值上仍是完整词表交叉熵，只改变计算和通信布局。</text>
</svg>
