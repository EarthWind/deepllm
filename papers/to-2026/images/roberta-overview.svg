<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">RoBERTa 保留 BERT 编码器、重做预训练配方</title>
  <desc id="desc">中央是与 BERT Large 相同的二十四层 Transformer 编码器。左右对比 BERT 与 RoBERTa 的数据量、批量、训练预算、掩码、NSP、序列长度和分词器。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.panel{font:700 21px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.heading{font:700 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 14px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.tiny{font:500 11.5px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}.value{font:700 18px "JetBrains Mono",Consolas,monospace;fill:#1d4ed8}.white{font:700 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#fff}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="70" y="58" class="title">RoBERTa 的主张：先别换架构，把 BERT 的预训练实验做充分</text>
  <text x="70" y="90" class="subtitle">同一类双向 Transformer Encoder 与 MLM 目标，性能差异来自数据、优化预算、输入构造和在线扰动的组合。</text>

  <g filter="url(#shadow)"><rect x="55" y="135" width="375" height="650" rx="18" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="85" y="178" class="panel">原始 BERT 配方</text>
  <text x="85" y="204" class="small">论文复现实验中的参照设置</text>
  <g>
    <rect x="85" y="232" width="315" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="108" y="258" class="label">预训练语料</text><text x="376" y="268" text-anchor="end" class="value" fill="#334155">16 GB</text><text x="108" y="280" class="tiny">BookCorpus + English Wikipedia</text>
    <rect x="85" y="307" width="315" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="108" y="333" class="label">批量 × 更新</text><text x="376" y="343" text-anchor="end" class="value" fill="#334155">256 × 1M</text><text x="108" y="355" class="tiny">约 2.56 亿条序列</text>
    <rect x="85" y="382" width="315" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="108" y="408" class="label">MLM 掩码</text><text x="376" y="418" text-anchor="end" class="value" fill="#334155">静态 × 10</text><text x="108" y="430" class="tiny">预处理生成十份 pattern，再反复复用</text>
    <rect x="85" y="457" width="315" height="62" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="108" y="483" class="label">辅助目标</text><text x="376" y="493" text-anchor="end" class="value" fill="#c2410c">MLM + NSP</text><text x="108" y="505" class="tiny">判断两个 segment 是否连续</text>
    <rect x="85" y="532" width="315" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="108" y="558" class="label">序列长度</text><text x="376" y="568" text-anchor="end" class="value" fill="#334155">128 → 512</text><text x="108" y="580" class="tiny">前 90% 更新使用较短序列</text>
    <rect x="85" y="607" width="315" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="108" y="633" class="label">文本编码</text><text x="376" y="643" text-anchor="end" class="value" fill="#334155">WordPiece 30K</text><text x="108" y="655" class="tiny">启发式预分词后学习词表</text>
  </g>

  <path d="M430 456 L497 456" class="arrow"/>
  <g filter="url(#shadow)"><rect x="500" y="135" width="400" height="650" rx="18" fill="#fff" stroke="#93c5fd"/></g>
  <text x="700" y="178" text-anchor="middle" class="panel">架构与 MLM 目标基本不变</text>
  <text x="700" y="205" text-anchor="middle" class="small">RoBERTa-large 沿用 BERT-large 的 Encoder 尺寸</text>
  <rect x="558" y="239" width="284" height="410" rx="20" fill="#eff6ff" stroke="#60a5fa"/>
  <g fill="#2563eb">
    <rect x="590" y="553" width="220" height="34" rx="8" opacity=".36"/><rect x="590" y="510" width="220" height="34" rx="8" opacity=".44"/><rect x="590" y="467" width="220" height="34" rx="8" opacity=".52"/><rect x="590" y="424" width="220" height="34" rx="8" opacity=".60"/><rect x="590" y="381" width="220" height="34" rx="8" opacity=".68"/><rect x="590" y="338" width="220" height="34" rx="8" opacity=".76"/><rect x="590" y="295" width="220" height="34" rx="8" opacity=".84"/>
  </g>
  <text x="700" y="283" text-anchor="middle" class="white">双向 Transformer Encoder</text>
  <text x="700" y="620" text-anchor="middle" class="value">L=24 · H=1024 · A=16</text>
  <text x="700" y="643" text-anchor="middle" class="tiny">FFN 4096 · 最大长度 512 · MLM 15%</text>
  <rect x="558" y="673" width="284" height="76" rx="13" fill="#dbeafe" stroke="#2563eb"/>
  <text x="700" y="702" text-anchor="middle" class="heading">参数量：340M → 355M</text>
  <text x="700" y="726" text-anchor="middle" class="small">增加主要来自 30K → 50K 的词表 embedding</text>

  <path d="M900 456 L967 456" class="arrow"/>
  <g filter="url(#shadow)"><rect x="970" y="135" width="375" height="650" rx="18" fill="#fff" stroke="#93c5fd"/></g>
  <text x="1000" y="178" class="panel">RoBERTa 组合配方</text>
  <text x="1000" y="204" class="small">最终 large 模型的关键选择</text>
  <g>
    <rect x="1000" y="232" width="315" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1023" y="258" class="label">更多、更杂的数据</text><text x="1291" y="268" text-anchor="end" class="value">160+ GB</text><text x="1023" y="280" class="tiny">五个英文语料，论文标称超过 160GB</text>
    <rect x="1000" y="307" width="315" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1023" y="333" class="label">大批量 × 长训练</text><text x="1291" y="343" text-anchor="end" class="value">8K × 500K</text><text x="1023" y="355" class="tiny">约 40.96 亿条序列，远超等预算消融</text>
    <rect x="1000" y="382" width="315" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1023" y="408" class="label">动态 MLM 掩码</text><text x="1291" y="418" text-anchor="end" class="value">每次重采样</text><text x="1023" y="430" class="tiny">同一文本每次入模可见不同预测位置</text>
    <rect x="1000" y="457" width="315" height="62" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1023" y="483" class="label">移除 NSP</text><text x="1291" y="493" text-anchor="end" class="value" fill="#047857">只保留 MLM</text><text x="1023" y="505" class="tiny">用连续完整句构造长文本块</text>
    <rect x="1000" y="532" width="315" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1023" y="558" class="label">训练长序列</text><text x="1291" y="568" text-anchor="end" class="value">≤ 512</text><text x="1023" y="580" class="tiny">不注入短序列，也不设 128-token 前期</text>
    <rect x="1000" y="607" width="315" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1023" y="633" class="label">通用文本编码</text><text x="1291" y="643" text-anchor="end" class="value">byte-BPE 50K</text><text x="1023" y="655" class="tiny">以 byte 为底层单位，任意输入无需 UNK</text>
  </g>
  <rect x="55" y="810" width="1290" height="32" rx="9" fill="#e2e8f0"/><text x="700" y="831" text-anchor="middle" class="label">关键不是某一个“银弹”：论文逐项消融后，再把这些选择与更多数据、更长训练累积为最终 RoBERTa。</text>
</svg>
