<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Tree of Thoughts 的生成、评估、选择与搜索闭环</title>
  <desc id="desc">问题被表示为根节点，候选 thought 形成分支；评估器给状态打分，搜索器保留绿色路径并剪去红色路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b42"/></linearGradient>
    <linearGradient id="good" x1="0" x2="1"><stop stop-color="#13b8a6"/><stop offset="1" stop-color="#78e3a4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#50d7c6"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:38px;font-weight:700;fill:#f5fbff}.sub{font-size:18px;fill:#a9bed1}.label{font-size:20px;font-weight:650;fill:#ecf7ff}.small{font-size:16px;fill:#b9cddd}.score{font-size:15px;font-weight:700}.step{font-size:18px;font-weight:700;fill:#06231f}.step2{font-size:15px;fill:#315269}.line{fill:none;stroke:#6f91aa;stroke-width:3}.best{fill:none;stroke:url(#good);stroke-width:7}.bad{fill:none;stroke:#ef7d73;stroke-width:3;stroke-dasharray:9 9}.node{fill:#173d5a;stroke:#6da1c2;stroke-width:2}.nodegood{fill:#0b5a53;stroke:#78e3a4;stroke-width:3}.nodebad{fill:#4a2b38;stroke:#ef7d73;stroke-width:2}.card{fill:#eef8fb;stroke:#b9d8e5;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="860" rx="28" fill="url(#bg)"/>
  <text class="title" x="70" y="72">Tree of Thoughts：把一次生成改造成显式搜索</text>
  <text class="sub" x="70" y="108">节点是问题与 thought 前缀组成的状态；语言模型可负责生成与评估，搜索器负责预算、剪枝和回溯</text>

  <text class="small" x="105" y="168">初始状态</text><text class="small" x="388" y="168">深度 1</text><text class="small" x="704" y="168">深度 2</text><text class="small" x="1050" y="168">深度 3</text>
  <path class="line" d="M214 346 C285 346 289 231 355 231"/><path class="best" d="M214 346 C285 346 289 346 355 346"/><path class="bad" d="M214 346 C285 346 289 461 355 461"/>
  <path class="line" d="M535 231 C610 231 619 203 676 203"/><path class="bad" d="M535 231 C610 231 619 277 676 277"/>
  <path class="best" d="M535 346 C610 346 619 346 676 346"/><path class="line" d="M535 346 C610 346 619 429 676 429"/>
  <path class="bad" d="M535 461 C610 461 619 511 676 511"/>
  <path class="line" d="M856 203 C932 203 949 225 1012 225"/><path class="best" d="M856 346 C932 346 949 346 1012 346"/><path class="line" d="M856 429 C932 429 949 455 1012 455"/>

  <g filter="url(#shadow)"><rect class="node" x="70" y="300" width="144" height="92" rx="18"/><text class="label" x="142" y="337" text-anchor="middle">问题 x</text><text class="small" x="142" y="367" text-anchor="middle">S₀ = {x}</text></g>
  <g><rect class="node" x="355" y="193" width="180" height="76" rx="15"/><text class="label" x="445" y="223" text-anchor="middle">thought A</text><text class="score" x="445" y="249" text-anchor="middle" fill="#86b8d4">v = 0.54</text></g>
  <g filter="url(#shadow)"><rect class="nodegood" x="355" y="308" width="180" height="76" rx="15"/><text class="label" x="445" y="338" text-anchor="middle">thought B</text><text class="score" x="445" y="364" text-anchor="middle" fill="#9bf1c1">v = 0.91</text></g>
  <g><rect class="nodebad" x="355" y="423" width="180" height="76" rx="15"/><text class="label" x="445" y="453" text-anchor="middle">thought C</text><text class="score" x="445" y="479" text-anchor="middle" fill="#ffaaa2">v = 0.08 · 剪枝</text></g>

  <g><rect class="node" x="676" y="166" width="180" height="74" rx="15"/><text class="label" x="766" y="197" text-anchor="middle">A → A₁</text><text class="score" x="766" y="222" text-anchor="middle" fill="#86b8d4">likely</text></g>
  <g><rect class="nodebad" x="676" y="250" width="180" height="54" rx="15"/><text class="small" x="766" y="283" text-anchor="middle" fill="#ffaaa2">A → A₂ · 淘汰</text></g>
  <g filter="url(#shadow)"><rect class="nodegood" x="676" y="309" width="180" height="74" rx="15"/><text class="label" x="766" y="340" text-anchor="middle">B → B₁</text><text class="score" x="766" y="365" text-anchor="middle" fill="#9bf1c1">sure</text></g>
  <g><rect class="node" x="676" y="400" width="180" height="58" rx="15"/><text class="small" x="766" y="435" text-anchor="middle">B → B₂ · 保留</text></g>
  <g><rect class="nodebad" x="676" y="484" width="180" height="54" rx="15"/><text class="small" x="766" y="517" text-anchor="middle" fill="#ffaaa2">C → C₁ · 淘汰</text></g>

  <g><rect class="node" x="1012" y="187" width="180" height="76" rx="15"/><text class="label" x="1102" y="219" text-anchor="middle">候选解 1</text><text class="score" x="1102" y="245" text-anchor="middle" fill="#86b8d4">未通过验证</text></g>
  <g filter="url(#shadow)"><rect x="1012" y="303" width="180" height="86" rx="18" fill="#0b6f57" stroke="#9df4ba" stroke-width="3"/><text class="label" x="1102" y="337" text-anchor="middle">有效解 ✓</text><text class="score" x="1102" y="365" text-anchor="middle" fill="#bffbce">goal test 通过</text></g>
  <g><rect class="node" x="1012" y="417" width="180" height="76" rx="15"/><text class="label" x="1102" y="449" text-anchor="middle">候选解 3</text><text class="score" x="1102" y="475" text-anchor="middle" fill="#86b8d4">预算内未完成</text></g>

  <path d="M1187 527 C1210 591 1110 612 1019 566" fill="none" stroke="#50d7c6" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text class="small" x="1198" y="576" fill="#65dfcf">DFS 回溯</text>

  <rect x="70" y="650" width="1300" height="145" rx="23" fill="#f4fafc" opacity=".98"/>
  <g><rect x="96" y="680" width="270" height="84" rx="16" fill="#d8f3f1"/><circle cx="128" cy="710" r="18" fill="#13a895"/><text class="step" x="128" y="717" text-anchor="middle" fill="#fff">1</text><text class="step" x="158" y="709">生成 Generate</text><text class="step2" x="158" y="738">每个状态提出 k 个 thought</text></g>
  <g><rect x="383" y="680" width="270" height="84" rx="16" fill="#e3eef8"/><circle cx="415" cy="710" r="18" fill="#3b82b8"/><text class="step" x="415" y="717" text-anchor="middle" fill="#fff">2</text><text class="step" x="445" y="709">评估 Evaluate</text><text class="step2" x="445" y="738">value 独立打分或 vote 比较</text></g>
  <g><rect x="670" y="680" width="270" height="84" rx="16" fill="#e7f4df"/><circle cx="702" cy="710" r="18" fill="#63a640"/><text class="step" x="702" y="717" text-anchor="middle" fill="#fff">3</text><text class="step" x="732" y="709">选择 Select</text><text class="step2" x="732" y="738">保留 top-b 或越过阈值的状态</text></g>
  <g><rect x="957" y="680" width="380" height="84" rx="16" fill="#f8e7e2"/><circle cx="989" cy="710" r="18" fill="#df725f"/><text class="step" x="989" y="717" text-anchor="middle" fill="#fff">4</text><text class="step" x="1019" y="709">搜索 Search</text><text class="step2" x="1019" y="738">BFS 分层推进；DFS 剪枝与回溯</text></g>
</svg>
