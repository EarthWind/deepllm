<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LLaMA 1 的模型、数据与推理预算全景</title>
  <desc id="desc">LLaMA 1 使用公开数据训练 7B 到 65B 的 decoder-only 模型。核心策略是在目标性能下用更多训练 token 换取更小的部署模型，并采用 Pre-RMSNorm、RoPE、SwiGLU 和高效因果注意力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#18274b"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0aa7a0"/><stop offset="1" stop-color="#45d28e"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#675be9"/><stop offset="1" stop-color="#a675f3"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e49b37"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".36"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#a9bddb"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#adbed9}.head{font-size:22px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#dce9fa}.small{font-size:14px;fill:#aebfd9}.dark{font-size:16px;font-weight:680;fill:#10243a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#edf5ff}.big{font-size:32px;font-weight:820;fill:#fff}.bigdark{font-size:32px;font-weight:820;fill:#10243a}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1170" cy="60" r="180" fill="#37d69b" opacity=".06"/><circle cx="80" cy="680" r="190" fill="#8270ef" opacity=".07"/>
  <text x="54" y="61" class="sans title">LLaMA 1：不是追求“训练最省”，而是追求“部署时模型更小”</text>
  <text x="54" y="94" class="sans sub">2023 年的关键转向：在公开数据上把较小模型训练更久，用一次性预训练成本换长期推理成本</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="330" height="260" rx="24" fill="#11253d" stroke="#607693" stroke-width="2"/>
    <rect x="475" y="132" width="330" height="260" rx="24" fill="url(#purple)"/>
    <rect x="896" y="132" width="330" height="260" rx="24" fill="#102b34" stroke="#25bd9a" stroke-width="2"/>
  </g>
  <text x="84" y="173" class="sans head">公开预训练数据</text>
  <text x="84" y="226" class="sans big">1.0T / 1.4T</text>
  <text x="84" y="260" class="sans body">CommonCrawl · C4 · GitHub</text>
  <text x="84" y="289" class="sans body">Wikipedia · Books · ArXiv</text>
  <text x="84" y="318" class="sans body">Stack Exchange</text>
  <rect x="82" y="340" width="274" height="30" rx="10" fill="#203b59"/><text x="219" y="361" text-anchor="middle" class="sans small">大多数据约一次遍历，不是反复刷 epoch</text>

  <text x="505" y="173" class="sans head">模型家族</text>
  <text x="505" y="226" class="sans big">7B → 65B</text>
  <text x="505" y="260" class="sans body">Decoder-only · context 2048</text>
  <text x="505" y="289" class="sans body">MHA · RoPE · RMSNorm</text>
  <text x="505" y="318" class="sans body">SwiGLU · 无 linear bias</text>
  <rect x="503" y="340" width="274" height="30" rx="10" fill="#4c3dab" opacity=".72"/><text x="640" y="361" text-anchor="middle" class="sans small">基础模型，不是 Chat / RLHF 模型</text>

  <text x="926" y="173" class="sans head">目标：推理预算优先</text>
  <text x="926" y="226" class="sans big">smaller model</text>
  <text x="926" y="260" class="sans body">相同性能下参数更少</text>
  <text x="926" y="289" class="sans body">部署显存、延迟、吞吐更友好</text>
  <text x="926" y="318" class="sans body">训练成本只付一次，推理反复发生</text>
  <rect x="924" y="340" width="274" height="30" rx="10" fill="#17484b"/><text x="1061" y="361" text-anchor="middle" class="sans small">7B 在 1T token 后仍继续改善</text>

  <path d="M385 262H464" stroke="#a9bddb" stroke-width="3" marker-end="url(#arrow)"/><path d="M806 262H885" stroke="#a9bddb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="94" y="443" width="1092" height="173" rx="26" fill="#10223b" stroke="#425f80" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="483" text-anchor="middle" class="sans head">同一条自回归主线，靠完整配方把训练 token 转化为能力</text>
  <g>
    <rect x="132" y="514" width="186" height="67" rx="15" fill="url(#green)"/><text x="225" y="542" text-anchor="middle" class="sans dark">稳定训练</text><text x="225" y="565" text-anchor="middle" class="sans dark">Pre-RMSNorm</text>
    <rect x="339" y="514" width="186" height="67" rx="15" fill="#253b62" stroke="#7585f1"/><text x="432" y="542" text-anchor="middle" class="sans body">位置关系</text><text x="432" y="565" text-anchor="middle" class="sans mono">RoPE on Q/K</text>
    <rect x="546" y="514" width="186" height="67" rx="15" fill="url(#purple)"/><text x="639" y="542" text-anchor="middle" class="sans body">门控前馈</text><text x="639" y="565" text-anchor="middle" class="sans mono">SwiGLU</text>
    <rect x="753" y="514" width="186" height="67" rx="15" fill="#23445a" stroke="#2bc7a2"/><text x="846" y="542" text-anchor="middle" class="sans body">高效训练</text><text x="846" y="565" text-anchor="middle" class="sans small">xFormers + checkpoint</text>
    <rect x="960" y="514" width="186" height="67" rx="15" fill="url(#amber)"/><text x="1053" y="542" text-anchor="middle" class="sans dark">高效解码</text><text x="1053" y="565" text-anchor="middle" class="sans dark">KV Cache</text>
  </g>
  <text x="640" y="660" text-anchor="middle" class="sans body">论文结论：LLaMA-13B 在多数报告 benchmark 上超过 GPT-3 175B；LLaMA-65B 与 Chinchilla-70B、PaLM-540B 具有竞争力。</text>
  <text x="640" y="687" text-anchor="middle" class="sans small">这是论文当时的 zero/few-shot 比较，不代表跨 tokenizer、数据污染、评测模板和现代 harness 的永久排行榜。</text>
</svg>
