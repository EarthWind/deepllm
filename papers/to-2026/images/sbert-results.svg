<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Sentence-BERT 论文的语义相似度与效率结果</title>
  <desc id="desc">左图展示无 STS 训练的七个语义相似度数据集平均 Spearman，右图展示监督 STS 的 Cross-Encoder 与 SBERT 分数，底部展示一万句子全配对的计算时间。</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101832"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="barV" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e5eefc}.h1{font-size:30px;font-weight:800}.h2{font-size:22px;font-weight:800}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:12px}.muted{fill:#91a4c6}.num{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;font-weight:700}.card{fill:#0b182c;stroke:#294064;stroke-width:1.5}.grid{stroke:#293a58;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="780" rx="24" fill="url(#bg4)"/>
  <text x="48" y="58" class="t h1">SBERT 的收益：不是“BERT 更大”，而是目标与接口对齐</text>
  <text x="48" y="90" class="t body muted">分数均来自论文；Spearman ρ × 100。时间是论文 V100 / CUDA 9.2 环境的特定测量</text>

  <g transform="translate(38 122)">
    <rect width="706" height="444" rx="20" class="card"/>
    <text x="24" y="40" class="t h2">无 STS 专项训练：7 个数据集平均</text>
    <text x="24" y="67" class="t small muted">STS12–16、STSb、SICK-R；越高越好</text>
    <g transform="translate(148 92)">
      <path d="M0 0V310M111 0V310M222 0V310M333 0V310M444 0V310" class="grid"/>
      <text x="0" y="334" text-anchor="middle" class="t tiny muted">0</text><text x="111" y="334" text-anchor="middle" class="t tiny muted">20</text><text x="222" y="334" text-anchor="middle" class="t tiny muted">40</text><text x="333" y="334" text-anchor="middle" class="t tiny muted">60</text><text x="444" y="334" text-anchor="middle" class="t tiny muted">80</text>
      <g transform="translate(0 8)"><text x="-12" y="18" text-anchor="end" class="t small muted">BERT [CLS]</text><rect width="162" height="26" rx="5" fill="#43516b"/><text x="170" y="18" class="t num">29.19</text></g>
      <g transform="translate(0 48)"><text x="-12" y="18" text-anchor="end" class="t small muted">Avg BERT</text><rect width="304" height="26" rx="5" fill="#52617b"/><text x="312" y="18" class="t num">54.81</text></g>
      <g transform="translate(0 88)"><text x="-12" y="18" text-anchor="end" class="t small muted">Avg GloVe</text><rect width="340" height="26" rx="5" fill="#64748b"/><text x="348" y="18" class="t num">61.32</text></g>
      <g transform="translate(0 128)"><text x="-12" y="18" text-anchor="end" class="t small muted">InferSent</text><rect width="361" height="26" rx="5" fill="#64748b"/><text x="369" y="18" class="t num">65.01</text></g>
      <g transform="translate(0 168)"><text x="-12" y="18" text-anchor="end" class="t small muted">USE</text><rect width="395" height="26" rx="5" fill="#64748b"/><text x="403" y="18" class="t num">71.22</text></g>
      <g transform="translate(0 208)"><text x="-12" y="18" text-anchor="end" class="t small" fill="#67e8f9">SBERT-base</text><rect width="416" height="26" rx="5" fill="url(#bar)"/><text x="424" y="18" class="t num" fill="#67e8f9">74.89</text></g>
      <g transform="translate(0 248)"><text x="-12" y="18" text-anchor="end" class="t small" fill="#67e8f9">SBERT-large</text><rect width="425" height="26" rx="5" fill="url(#bar)"/><text x="433" y="18" class="t num" fill="#67e8f9">76.55</text></g>
      <g transform="translate(0 288)"><text x="-12" y="18" text-anchor="end" class="t small" fill="#c4b5fd">SRoBERTa-large</text><rect width="426" height="26" rx="5" fill="url(#barV)"/><text x="434" y="18" class="t num" fill="#c4b5fd">76.68</text></g>
    </g>
  </g>

  <g transform="translate(766 122)">
    <rect width="396" height="444" rx="20" class="card"/>
    <text x="22" y="40" class="t h2">NLI → STSb 监督微调</text>
    <text x="22" y="67" class="t small muted">STSb test，10 个随机种子均值</text>
    <g transform="translate(27 102)">
      <text x="0" y="18" class="t small">Cross-Encoder BERT-large</text><text x="340" y="18" text-anchor="end" class="t num" fill="#fda4af">88.77</text>
      <rect x="0" y="31" width="340" height="22" rx="5" fill="#fb7185"/>
      <text x="0" y="91" class="t small">SBERT-large</text><text x="340" y="91" text-anchor="end" class="t num" fill="#67e8f9">86.10</text>
      <rect x="0" y="104" width="330" height="22" rx="5" fill="url(#bar)"/>
      <text x="0" y="164" class="t small">SRoBERTa-large</text><text x="340" y="164" text-anchor="end" class="t num" fill="#c4b5fd">86.15</text>
      <rect x="0" y="177" width="330" height="22" rx="5" fill="url(#barV)"/>
    </g>
    <rect x="22" y="338" width="352" height="78" rx="13" fill="#111f36" stroke="#3b4e70"/>
    <text x="198" y="367" text-anchor="middle" class="t body">精度–效率交换，不是单向碾压</text>
    <text x="198" y="394" text-anchor="middle" class="t small muted">联合 token 交互得分更高；双塔向量可复用</text>
  </g>

  <g transform="translate(38 590)">
    <rect width="1124" height="154" rx="20" class="card"/>
    <text x="24" y="39" class="t h2">10,000 句子全部两两比较</text>
    <text x="24" y="67" class="t small muted">同一任务，不同计算接口；论文给出的约数</text>
    <g transform="translate(350 25)">
      <rect width="312" height="103" rx="15" fill="#321929" stroke="#fb7185"/>
      <text x="24" y="31" class="t small" fill="#fda4af">Cross-Encoder</text>
      <text x="24" y="62" class="t h2">49,995,000 次 BERT</text>
      <text x="24" y="88" class="t body muted">约 65 小时</text>
    </g>
    <g transform="translate(686 25)">
      <rect width="404" height="103" rx="15" fill="#102d3d" stroke="#22d3ee"/>
      <text x="24" y="31" class="t small" fill="#67e8f9">SBERT</text>
      <text x="24" y="62" class="t h2">10,000 次编码 + 向量余弦</text>
      <text x="24" y="88" class="t body muted">约 5 秒 + 0.01 秒</text>
    </g>
  </g>
</svg>
