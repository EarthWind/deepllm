<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AlphaZero 完美模拟器与 MuZero 学习模型对比</title><desc id="desc">AlphaZero 在树中使用精确规则更新真实状态、合法动作和终局；MuZero 只在根读取真实观察，然后以隐藏状态、预测奖励、策略和价值规划。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#111e39"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7dd3fc"/></marker><style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.m{font-size:22px;font-weight:650}.s{font-size:17px}.xs{font-size:15px;fill:#aebfd9}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/><text class="t h" x="60" y="62">从 AlphaZero 到 MuZero：把树中的规则模拟器换成学习模型</text><text class="t xs" x="60" y="93">两者都用 policy/value 引导 MCTS；关键差异发生在“执行假想动作后怎样得到下一节点”</text>
  <g filter="url(#shadow)"><rect x="55" y="140" width="515" height="475" rx="24" fill="#122844" stroke="#38bdf8" stroke-width="2"/><rect x="80" y="166" width="165" height="42" rx="21" fill="#145579"/><text class="t m" text-anchor="middle" x="162" y="194">AlphaZero</text><text class="t s" x="85" y="244">树内拥有 perfect simulator</text><g transform="translate(92 279)"><rect width="135" height="135" rx="10" fill="#e5d1a2" stroke="#d5ae56" stroke-width="3"/><g stroke="#84612e"><path d="M0 45h135M0 90h135M45 0v135M90 0v135"/></g><circle cx="22" cy="22" r="12" fill="#17243b"/><circle cx="112" cy="112" r="12" fill="#fff" stroke="#17243b"/></g><path class="line" d="M245 346H320"/><g transform="translate(332 284)"><rect width="190" height="125" rx="17" fill="#163a59" stroke="#60c8eb"/><text class="t s" text-anchor="middle" x="95" y="35">Rules(s, a)</text><text class="t xs" x="22" y="68">✓ 精确 next state</text><text class="t xs" x="22" y="94">✓ legal actions / terminal</text></g><text class="t xs" x="85" y="466">叶节点再调用 fθ(s) → (p, v)</text><text class="t xs" x="85" y="495">树节点保持真实棋盘语义</text><text class="t xs" x="85" y="524">只适用于已知且可调用的动力学</text><rect x="85" y="552" width="440" height="38" rx="12" fill="#0e1e35"/><text class="t s" text-anchor="middle" x="305" y="577">规则正确性：由程序员与环境保证</text></g>
  <g filter="url(#shadow)"><rect x="630" y="140" width="515" height="475" rx="24" fill="#211f46" stroke="#a78bfa" stroke-width="2"/><rect x="655" y="166" width="145" height="42" rx="21" fill="#5542a6"/><text class="t m" text-anchor="middle" x="727" y="194">MuZero</text><text class="t s" x="660" y="244">树内只有 learned latent model</text><circle cx="725" cy="347" r="38" fill="#4338a4" stroke="#c4b5fd" stroke-width="3"/><text class="t s" text-anchor="middle" x="725" y="353">sᵏ⁻¹</text><path class="line" d="M765 347H835"/><rect x="781" y="303" width="46" height="28" rx="14" fill="#4b326d"/><text class="t xs" text-anchor="middle" x="804" y="323">aᵏ</text><g transform="translate(842 284)"><rect width="255" height="125" rx="17" fill="#3a2d68" stroke="#c4b5fd"/><text class="t s" text-anchor="middle" x="127" y="35">gθ(sᵏ⁻¹, aᵏ)</text><text class="t xs" x="28" y="68">→ predicted reward rᵏ</text><text class="t xs" x="28" y="94">→ next hidden state sᵏ</text></g><text class="t xs" x="660" y="466">fθ(sᵏ) → policy pᵏ, value vᵏ</text><text class="t xs" x="660" y="495">隐藏状态不要求对应真实画面</text><text class="t xs" x="660" y="524">内部不查合法动作，也不识别终局</text><rect x="660" y="552" width="440" height="38" rx="12" fill="#17152f"/><text class="t s" text-anchor="middle" x="880" y="577">规划等价性：由 u、z、π 任务损失学习</text></g>
  <g transform="translate(170 650)"><text class="t s" x="0" y="0">现实根节点仍需要：</text><text class="t xs" x="145" y="0">observation · action space · observed reward · episode boundary · 根部合法动作（棋类）</text></g>
</svg>
