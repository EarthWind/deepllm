<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention-2 沿序列维的线程块并行</title>
  <desc id="desc">v1 每个批次和注意力头只有一个线程块；FA-2 前向按注意力矩阵行块分配线程块，反向按列块分配线程块，从而在长序列小批次下提高占用率。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071528"/><stop offset="1" stop-color="#212850"/></linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#20c9bd"/><stop offset="1" stop-color="#6da8ff"/></linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9d7af4"/><stop offset="1" stop-color="#ef7bc6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity=".4"/></filter>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#afbfda}.head{font-size:22px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#dce8f8}.small{font-size:14px;fill:#acbdd7}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#eaf5ff}.big{font-size:34px;font-weight:800;fill:#8ff8e6}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="56" y="61" class="sans title">序列维并行：长序列不再意味着“工作多，工人少”</text>
  <text x="56" y="93" class="sans sub">示例：B=1、H=8、N=4096、Bᵣ=B꜀=128；A100 有 108 个 SM。CTA 数是并行机会，不等于同时驻留数。</text>

  <g filter="url(#shadow)"><rect x="56" y="135" width="332" height="475" rx="24" fill="#111f37" stroke="#5a6f8d" stroke-width="2"/></g>
  <text x="84" y="178" class="sans head">FlashAttention v1</text>
  <text x="84" y="210" class="sans body">grid 只跨 batch 与 heads</text>
  <text x="84" y="250" class="sans mono">CTA = B · H = 8</text>
  <g transform="translate(84 286)">
    <rect width="48" height="48" rx="9" fill="#4d79a5"/><rect x="58" width="48" height="48" rx="9" fill="#4d79a5"/>
    <rect x="116" width="48" height="48" rx="9" fill="#4d79a5"/><rect x="174" width="48" height="48" rx="9" fill="#4d79a5"/>
    <rect y="58" width="48" height="48" rx="9" fill="#59679c"/><rect x="58" y="58" width="48" height="48" rx="9" fill="#59679c"/>
    <rect x="116" y="58" width="48" height="48" rx="9" fill="#59679c"/><rect x="174" y="58" width="48" height="48" rx="9" fill="#59679c"/>
    <g fill="#182a43"><circle cx="245" cy="24" r="7"/><circle cx="269" cy="24" r="7"/><circle cx="293" cy="24" r="7"/>
      <circle cx="245" cy="53" r="7"/><circle cx="269" cy="53" r="7"/><circle cx="293" cy="53" r="7"/>
      <circle cx="245" cy="82" r="7"/><circle cx="269" cy="82" r="7"/><circle cx="293" cy="82" r="7"/></g>
  </g>
  <text x="84" y="430" class="sans body">一个 CTA 顺序扫描整个 head；</text>
  <text x="84" y="458" class="sans body">其余 SM 缺少可调度工作。</text>
  <rect x="84" y="496" width="276" height="78" rx="16" fill="#26344f"/>
  <text x="222" y="528" text-anchor="middle" class="sans small">长序列常伴随较小 batch，</text>
  <text x="222" y="554" text-anchor="middle" class="sans small">B·H 可能远小于 SM 数。</text>

  <g filter="url(#shadow)"><rect x="416" y="135" width="392" height="475" rx="24" fill="#10263d" stroke="#2dd4bf" stroke-width="2"/></g>
  <text x="444" y="178" class="sans head">FA-2 forward：按 Q 行块</text>
  <text x="444" y="210" class="sans mono">CTA = B · H · ⌈N/Bᵣ⌉ = 256</text>
  <g transform="translate(458 250)">
    <rect width="300" height="280" rx="6" fill="#102139" stroke="#7186a5" stroke-width="2"/>
    <g stroke="#3c5575" stroke-width="1"><path d="M0 40H300M0 80H300M0 120H300M0 160H300M0 200H300M0 240H300"/><path d="M50 0V280M100 0V280M150 0V280M200 0V280M250 0V280"/></g>
    <rect x="1" y="1" width="298" height="38" fill="#26c8bd" opacity=".9"/><rect x="1" y="41" width="298" height="38" fill="#39bfc9" opacity=".85"/>
    <rect x="1" y="81" width="298" height="38" fill="#4db4d7" opacity=".8"/><rect x="1" y="121" width="298" height="38" fill="#60a9e4" opacity=".75"/>
    <rect x="1" y="161" width="298" height="38" fill="#739eef" opacity=".7"/><rect x="1" y="201" width="298" height="38" fill="#8792f2" opacity=".65"/>
    <rect x="1" y="241" width="298" height="38" fill="#9a83ee" opacity=".6"/>
    <text x="150" y="25" text-anchor="middle" class="sans mono">CTA₀ owns O rows 0…Bᵣ−1</text>
    <text x="150" y="265" text-anchor="middle" class="sans mono">CTAₖ owns one Q tile</text>
  </g>
  <text x="444" y="561" class="sans small">每个 worker 扫全体合法 K/V，不共享 O，</text>
  <text x="444" y="584" class="sans small">因此不同 row blocks embarrassingly parallel。</text>

  <g filter="url(#shadow)"><rect x="836" y="135" width="388" height="475" rx="24" fill="#202142" stroke="#a879ee" stroke-width="2"/></g>
  <text x="864" y="178" class="sans head">FA-2 backward：按 K/V 列块</text>
  <text x="864" y="210" class="sans mono">CTA = B · H · ⌈N/B꜀⌉ = 256</text>
  <g transform="translate(878 250)">
    <rect width="300" height="280" rx="6" fill="#151c37" stroke="#7186a5" stroke-width="2"/>
    <g stroke="#445175" stroke-width="1"><path d="M0 40H300M0 80H300M0 120H300M0 160H300M0 200H300M0 240H300"/><path d="M50 0V280M100 0V280M150 0V280M200 0V280M250 0V280"/></g>
    <rect x="1" y="1" width="48" height="278" fill="#a07af0" opacity=".92"/><rect x="51" y="1" width="48" height="278" fill="#af78e8" opacity=".86"/>
    <rect x="101" y="1" width="48" height="278" fill="#be77df" opacity=".8"/><rect x="151" y="1" width="48" height="278" fill="#ce78d4" opacity=".74"/>
    <rect x="201" y="1" width="48" height="278" fill="#df79ca" opacity=".68"/><rect x="251" y="1" width="48" height="278" fill="#ed7cc0" opacity=".62"/>
    <text x="25" y="147" text-anchor="middle" transform="rotate(-90 25 147)" class="sans mono">CTA₀ owns dK₀,dV₀</text>
    <text x="275" y="147" text-anchor="middle" transform="rotate(-90 275 147)" class="sans mono">one K/V tile</text>
  </g>
  <text x="864" y="561" class="sans small">dK/dV 可由列 owner 本地归约；多个列 CTA</text>
  <text x="864" y="584" class="sans small">共同贡献 dQ，因此论文实现用 atomic add。</text>

  <rect x="160" y="646" width="960" height="44" rx="22" fill="#102940" stroke="#466986"/>
  <text x="640" y="675" text-anchor="middle" class="sans body">更多 CTA 提供更高 occupancy 的机会；最终并发度仍受寄存器、shared memory、block size 与硬件调度限制。</text>
</svg>
