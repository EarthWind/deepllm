<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Megatron-LM 张量并行与数据并行的正交组合</title><desc id="desc">行方向为同一模型副本的张量并行组，列方向为相同模型分片的数据并行组，论文最大配置为 8 乘 64 等于 512 GPU。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172a"/><stop offset="1" stop-color="#123148"/></linearGradient><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{fill:#f5fbff;font-size:30px;font-weight:750}.sub{fill:#9ebdd0;font-size:15px}.h{fill:#ebf9ff;font-size:18px;font-weight:700}.b{fill:#bad3e1;font-size:14px}.tiny{fill:#89aabd;font-size:12px}</style></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><text class="t" x="55" y="64">同一张 512-GPU 网格里，有两种完全不同的“同伴”</text><text class="sub" x="55" y="94">TP 组共同持有一个模型；DP 组持有相同分片、处理不同数据并同步梯度</text>
  <g transform="translate(58 140)"><rect width="735" height="468" rx="20" fill="#0b293e" stroke="#315b73"/>
    <text class="h" x="25" y="38">16-GPU 缩小示例：TP=4，DP=4</text><text class="tiny" x="25" y="62">论文最大运行把同一结构扩成 TP=8，DP=64</text>
    <g transform="translate(94 91)">
      <g stroke="#37c9bc" stroke-width="4" fill="none"><rect x="-12" y="-12" width="513" height="79" rx="14"/><rect x="-12" y="83" width="513" height="79" rx="14"/><rect x="-12" y="178" width="513" height="79" rx="14"/><rect x="-12" y="273" width="513" height="79" rx="14"/></g>
      <g stroke="#8c77e5" stroke-width="3" stroke-dasharray="7 6"><path d="M45-24v388"/><path d="M185-24v388"/><path d="M325-24v388"/><path d="M465-24v388"/></g>
      <g font-family="Inter,Noto Sans SC,sans-serif" font-size="16" font-weight="750" text-anchor="middle">
        <g fill="#072b34"><rect width="90" height="55" rx="10" fill="#36c9bd"/><text x="45" y="34">GPU 0</text><rect x="140" width="90" height="55" rx="10" fill="#4ba9dc"/><text x="185" y="34">GPU 1</text><rect x="280" width="90" height="55" rx="10" fill="#8e77e3"/><text x="325" y="34">GPU 2</text><rect x="420" width="90" height="55" rx="10" fill="#dc9b50"/><text x="465" y="34">GPU 3</text></g>
        <g transform="translate(0 95)"><rect width="90" height="55" rx="10" fill="#36c9bd"/><text x="45" y="34">GPU 4</text><rect x="140" width="90" height="55" rx="10" fill="#4ba9dc"/><text x="185" y="34">GPU 5</text><rect x="280" width="90" height="55" rx="10" fill="#8e77e3"/><text x="325" y="34">GPU 6</text><rect x="420" width="90" height="55" rx="10" fill="#dc9b50"/><text x="465" y="34">GPU 7</text></g>
        <g transform="translate(0 190)"><rect width="90" height="55" rx="10" fill="#36c9bd"/><text x="45" y="34">GPU 8</text><rect x="140" width="90" height="55" rx="10" fill="#4ba9dc"/><text x="185" y="34">GPU 9</text><rect x="280" width="90" height="55" rx="10" fill="#8e77e3"/><text x="325" y="34">GPU 10</text><rect x="420" width="90" height="55" rx="10" fill="#dc9b50"/><text x="465" y="34">GPU 11</text></g>
        <g transform="translate(0 285)"><rect width="90" height="55" rx="10" fill="#36c9bd"/><text x="45" y="34">GPU 12</text><rect x="140" width="90" height="55" rx="10" fill="#4ba9dc"/><text x="185" y="34">GPU 13</text><rect x="280" width="90" height="55" rx="10" fill="#8e77e3"/><text x="325" y="34">GPU 14</text><rect x="420" width="90" height="55" rx="10" fill="#dc9b50"/><text x="465" y="34">GPU 15</text></g>
      </g>
      <text x="-29" y="30" text-anchor="end" fill="#68e7d8" font-size="13" font-weight="700">TP group 0</text><text x="-29" y="125" text-anchor="end" fill="#68e7d8" font-size="13" font-weight="700">TP group 1</text><text x="-29" y="220" text-anchor="end" fill="#68e7d8" font-size="13" font-weight="700">TP group 2</text><text x="-29" y="315" text-anchor="end" fill="#68e7d8" font-size="13" font-weight="700">TP group 3</text>
      <text x="45" y="390" text-anchor="middle" fill="#bcaeff" font-size="13" font-weight="700">DP group 0</text><text x="185" y="390" text-anchor="middle" fill="#bcaeff" font-size="13" font-weight="700">DP group 1</text><text x="325" y="390" text-anchor="middle" fill="#bcaeff" font-size="13" font-weight="700">DP group 2</text><text x="465" y="390" text-anchor="middle" fill="#bcaeff" font-size="13" font-weight="700">DP group 3</text>
    </g>
  </g>
  <g transform="translate(825 140)"><rect width="320" height="218" rx="20" fill="#0d3540" stroke="#37c9bc"/><text class="h" x="22" y="39" fill="#bafff4">Tensor parallel group</text><text class="b" x="22" y="76">同一 batch</text><text class="b" x="22" y="104">不同参数 shard</text><text class="b" x="22" y="132">层内 activation all-reduce</text><text class="b" x="22" y="160">应尽量放在高速 NVSwitch 内</text><text class="tiny" x="22" y="193">论文：每个模型副本 8 GPUs</text>
    <rect y="242" width="320" height="226" rx="20" fill="#302b51" stroke="#8875df"/><text class="h" x="22" y="281" fill="#d8d0ff">Data parallel group</text><text class="b" x="22" y="318">不同 batch</text><text class="b" x="22" y="346">相同参数 shard</text><text class="b" x="22" y="374">backward 后梯度 all-reduce</text><text class="b" x="22" y="402">跨模型副本、可跨节点</text><text class="tiny" x="22" y="437">论文：64 replicas × 8 shards = 512 GPUs</text></g>
  <text class="tiny" x="58" y="642">总 GPU 数 = tensor-parallel size × data-parallel size；这篇论文明确说它与 pipeline parallel 正交，但没有把 pipeline 作为实验主方法。</text>
</svg>
