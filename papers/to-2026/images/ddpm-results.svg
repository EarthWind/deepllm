<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 1360 760" role="img" aria-labelledby="title desc">
  <title id="title">DDPM 在 CIFAR10 上的样本质量与消融结果</title>
  <desc id="desc">展示原论文噪声预测简化目标的 FID 3.17，以及不同均值参数化、目标函数和固定方差的消融。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#17132c"/></linearGradient><style>.s{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{font-size:32px;font-weight:700;fill:#f8fafc}.h{font-size:21px;font-weight:650;fill:#e2e8f0}.m{font-size:16px;fill:#cbd5e1}.n{font-size:13px;fill:#94a3b8}.big{font-size:32px;font-weight:750;fill:#67e8f9}.card{fill:#0c1d31;stroke:#2a4563;stroke-width:1.5}.grid{stroke:#334155;stroke-width:1}</style></defs>
  <rect width="1360" height="760" rx="27" fill="url(#bg)"/>
  <text x="52" y="61" class="s t">最关键的实验：同一个反向模型，训练目标决定样本质量</text>
  <text x="52" y="92" class="s n">CIFAR10 无条件生成；FID 越低越好。数字来自论文表 1、表 2，FID 以训练集为参照。</text>

  <g transform="translate(50 130)">
    <rect width="770" height="530" rx="20" class="card"/>
    <text x="27" y="42" class="s h">CIFAR10 FID 对比</text>
    <g transform="translate(220 87)">
      <path d="M0 0V354H495" fill="none" stroke="#64748b" stroke-width="2"/>
      <g class="grid"><path d="M82 0V354M165 0V354M247 0V354M330 0V354M412 0V354M495 0V354"/></g>
      <g class="s n"><text x="0" y="378">0</text><text x="82" y="378" text-anchor="middle">5</text><text x="165" y="378" text-anchor="middle">10</text><text x="247" y="378" text-anchor="middle">15</text><text x="330" y="378" text-anchor="middle">20</text><text x="412" y="378" text-anchor="middle">25</text><text x="495" y="378" text-anchor="end">30</text></g>
      <g class="s m" text-anchor="end"><text x="-15" y="34">DDPM ε + Lsimple</text><text x="-15" y="95">DDPM μ̃ + L</text><text x="-15" y="156">DDPM ε + L</text><text x="-15" y="217">SNGAN-DDLS</text><text x="-15" y="278">SNGAN</text><text x="-15" y="339">NCSN</text></g>
      <g><rect y="10" width="52.3" height="34" rx="7" fill="#22d3ee"/><rect y="71" width="218.1" height="34" rx="7" fill="#8b5cf6"/><rect y="132" width="222.9" height="34" rx="7" fill="#a78bfa"/><rect y="193" width="254.4" height="34" rx="7" fill="#fb7185"/><rect y="254" width="358.1" height="34" rx="7" fill="#f97316"/><rect y="315" width="417.8" height="34" rx="7" fill="#ef4444"/></g>
      <g class="s n"><text x="62" y="34" fill="#67e8f9">3.17</text><text x="228" y="95">13.22</text><text x="233" y="156">13.51</text><text x="264" y="217">15.42</text><text x="368" y="278">21.7</text><text x="428" y="339">25.32</text></g>
    </g>
    <text x="27" y="493" class="s n">μ̃ + L：预测真实后验均值并优化完整 VLB；ε + L：预测噪声但仍优化 VLB。</text>
    <text x="27" y="516" class="s n" fill="#67e8f9">去掉理论权重后的 ε-MSE 从约 13.5 大幅降到 3.17，说明“目标怎样加权”不是实现细节。</text>
  </g>

  <g transform="translate(850 130)">
    <rect width="460" height="248" rx="20" class="card"/>
    <text x="24" y="42" class="s h">论文最佳 CIFAR10 结果</text>
    <text x="24" y="91" class="s big">FID 3.17</text><text x="220" y="91" class="s m">IS 9.46 ± 0.11</text>
    <text x="24" y="127" class="s m">NLL ≤ 3.75 bits/dim</text>
    <path d="M24 151H436" stroke="#334155"/>
    <text x="24" y="181" class="s n">测试集作 FID 参照时为 5.24；论文主表沿当时惯例用训练集。</text>
    <text x="24" y="208" class="s n">完整 VLB 模型的 NLL 更好：≤3.70 bits/dim，</text>
    <text x="24" y="229" class="s n">但 FID 只有 13.51——似然与视觉质量不一致。</text>
  </g>
  <g transform="translate(850 404)">
    <rect width="460" height="256" rx="20" class="card"/>
    <text x="24" y="42" class="s h">LSUN 256×256 FID</text>
    <g transform="translate(24 66)">
      <rect width="126" height="128" rx="14" fill="#112d42"/><text x="63" y="31" text-anchor="middle" class="s m">Bedroom</text><text x="63" y="77" text-anchor="middle" class="s big">4.90</text><text x="63" y="104" text-anchor="middle" class="s n">256M large</text>
      <rect x="143" width="126" height="128" rx="14" fill="#292348"/><text x="206" y="31" text-anchor="middle" class="s m">Church</text><text x="206" y="77" text-anchor="middle" class="s big">7.89</text><text x="206" y="104" text-anchor="middle" class="s n">114M</text>
      <rect x="286" width="126" height="128" rx="14" fill="#3b2038"/><text x="349" y="31" text-anchor="middle" class="s m">Cat</text><text x="349" y="77" text-anchor="middle" class="s big">19.75</text><text x="349" y="104" text-anchor="middle" class="s n">114M</text>
    </g>
    <text x="24" y="224" class="s n">论文称 256×256 样本质量与 ProgressiveGAN 相近，</text><text x="24" y="245" class="s n">但表 3 中 StyleGAN/StyleGAN2 在这些 LSUN 指标上更强。</text>
  </g>
  <text x="680" y="711" text-anchor="middle" class="s n">不要跨实现、数据预处理或 FID 参照集直接比较小数点；这里的图只复述原论文同表口径。</text>
</svg>
