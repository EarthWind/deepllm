<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#07162e"/><stop offset="1" stop-color="#24163e"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0l11 4-11 4z" fill="#afc1e3"/></marker></defs><rect width="1400" height="760" rx="30" fill="url(#c)"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="52" y="62" fill="#fff" font-size="32" font-weight="700">Whisper 解码：任务 token、语言 token 与温度回退</text><text x="52" y="96" fill="#a9bee3" font-size="18">同一音频模型通过 prompt-like special tokens 指定转录、翻译、语言识别和时间戳</text><g transform="translate(70,185)"><rect width="260" height="350" rx="20" fill="#102d46" stroke="#2ec7de" stroke-width="2"/><text x="40" y="58" fill="#fff" font-size="24" font-weight="700">音频窗口</text><rect x="40" y="110" width="180" height="90" rx="12" fill="#244c64"/><path d="M52 155q20-55 40 0t40 0 40 0 35 0" fill="none" stroke="#45d2df" stroke-width="4"/><text x="40" y="260" fill="#a8dce6" font-size="17">30 秒窗口 / padding</text><text x="40" y="300" fill="#f3c977" font-size="17">log-Mel → encoder</text></g><g transform="translate(400,185)"><rect width="300" height="350" rx="20" fill="#172449" stroke="#9c76ec" stroke-width="2"/><text x="40" y="58" fill="#fff" font-size="24" font-weight="700">special tokens</text><rect x="40" y="105" width="220" height="55" rx="10" fill="#3b2d68"/><text x="62" y="140" fill="#fff" font-size="17">language = &lt;|en|&gt;</text><rect x="40" y="180" width="220" height="55" rx="10" fill="#3b2d68"/><text x="58" y="215" fill="#fff" font-size="17">task = transcribe</text><rect x="40" y="255" width="220" height="55" rx="10" fill="#3b2d68"/><text x="56" y="290" fill="#fff" font-size="17">timestamps = on/off</text></g><g transform="translate(770,185)"><rect width="300" height="350" rx="20" fill="#29203f" stroke="#f0ad3c" stroke-width="2"/><text x="40" y="58" fill="#fff" font-size="24" font-weight="700">autoregressive decoder</text><path d="M45 125h205M45 175h145M45 225h185M45 275h110" stroke="#f2c877" stroke-width="8" stroke-linecap="round"/><text x="40" y="315" fill="#f2cc7b" font-size="16">beam / greedy / temperature</text></g><g transform="translate(1140,185)"><rect width="190" height="350" rx="20" fill="#103d3a" stroke="#48d6a7" stroke-width="2"/><text x="34" y="58" fill="#fff" font-size="24" font-weight="700">文本输出</text><text x="34" y="135" fill="#a8efd2" font-size="17">transcript</text><text x="34" y="180" fill="#a8efd2" font-size="17">translation</text><text x="34" y="225" fill="#a8efd2" font-size="17">timestamps</text><text x="34" y="300" fill="#f2ca78" font-size="16">quality gates</text></g><path d="M335 355h55M705 355h55M1075 355h55" stroke="#afc1e3" stroke-width="4" marker-end="url(#a)"/><path d="M1270 585C970 665 410 665 190 585" fill="none" stroke="#f2d34b" stroke-width="3" stroke-dasharray="10 10"/><text x="420" y="700" fill="#f2d553" font-size="18">低平均 log-prob 或异常压缩比 → 提高 temperature 重试</text></g></svg>
