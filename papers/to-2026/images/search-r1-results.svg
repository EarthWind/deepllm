<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Search-R1 主要结果与关键消融</title>
  <desc id="desc">Qwen2.5 7B 在七个问答数据集上的平均准确率，以及检索 token mask 和 top-k passage 数的消融结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="best" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="740" rx="28" fill="url(#bg)"/>
  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="58" y="62" fill="#f8fafc" font-size="31" font-weight="700">Search-R1：主结果不是“多搜几次”，而是学会搜索策略</text>
    <text x="58" y="96" fill="#94a3b8" font-size="16">指标为七个 QA 数据集平均 Exact Match；数值来自 arXiv v5 的 Table 2、4、7。</text>

    <rect x="48" y="126" width="690" height="548" rx="22" fill="#0b1b2b" stroke="#334155"/>
    <text x="78" y="168" fill="#e2e8f0" font-size="20" font-weight="700">Qwen2.5-7B：平均 EM（%）</text>
    <text x="78" y="193" fill="#94a3b8" font-size="13">Base / Instruct 按各方法在论文中的设置</text>

    <g font-size="15">
      <text x="78" y="244" fill="#cbd5e1">Direct Inference</text>
      <rect x="235" y="222" width="181" height="30" rx="8" fill="url(#bar)" opacity="0.65"/>
      <text x="428" y="243" fill="#e0f2fe" font-weight="700">18.1</text>

      <text x="78" y="312" fill="#cbd5e1">RAG</text>
      <rect x="235" y="290" width="304" height="30" rx="8" fill="url(#bar)" opacity="0.72"/>
      <text x="551" y="311" fill="#e0f2fe" font-weight="700">30.4</text>

      <text x="78" y="380" fill="#cbd5e1">Rejection Sampling</text>
      <rect x="235" y="358" width="348" height="30" rx="8" fill="url(#bar)" opacity="0.8"/>
      <text x="595" y="379" fill="#e0f2fe" font-weight="700">34.8</text>

      <text x="78" y="448" fill="#cbd5e1">Search-R1 Instruct</text>
      <rect x="235" y="426" width="385" height="30" rx="8" fill="url(#bar)"/>
      <text x="632" y="447" fill="#e0f2fe" font-weight="700">38.5</text>

      <text x="78" y="516" fill="#dcfce7" font-weight="700">Search-R1 Base</text>
      <rect x="235" y="494" width="431" height="30" rx="8" fill="url(#best)"/>
      <text x="678" y="515" fill="#bbf7d0" font-weight="700">43.1</text>
    </g>

    <line x1="235" y1="552" x2="685" y2="552" stroke="#64748b"/>
    <g fill="#94a3b8" font-size="12" text-anchor="middle">
      <text x="235" y="574">0</text>
      <text x="335" y="574">10</text>
      <text x="435" y="574">20</text>
      <text x="535" y="574">30</text>
      <text x="635" y="574">40</text>
    </g>
    <rect x="78" y="608" width="620" height="42" rx="10" fill="#143044"/>
    <text x="388" y="634" fill="#67e8f9" font-size="14" text-anchor="middle">43.1 − 30.4 = +12.7 个绝对 EM 点（相对 RAG 约 +41.8%）</text>

    <rect x="766" y="126" width="386" height="252" rx="22" fill="#0b1b2b" stroke="#334155"/>
    <text x="796" y="168" fill="#e2e8f0" font-size="20" font-weight="700">检索 token loss mask</text>
    <text x="796" y="194" fill="#94a3b8" font-size="13">Qwen2.5-7B Base + PPO</text>
    <text x="796" y="244" fill="#fcd34d" font-size="15">不屏蔽</text>
    <rect x="880" y="224" width="172" height="28" rx="7" fill="#d97706"/>
    <text x="1064" y="244" fill="#fef3c7" font-size="14" font-weight="700">34.3</text>
    <text x="796" y="303" fill="#86efac" font-size="15">屏蔽</text>
    <rect x="880" y="283" width="216" height="28" rx="7" fill="#22c55e"/>
    <text x="1108" y="303" fill="#dcfce7" font-size="14" font-weight="700">43.1</text>
    <text x="796" y="345" fill="#4ade80" font-size="14">+8.8 个绝对 EM 点</text>

    <rect x="766" y="404" width="386" height="270" rx="22" fill="#0b1b2b" stroke="#334155"/>
    <text x="796" y="446" fill="#e2e8f0" font-size="20" font-weight="700">每次检索 passage 数 top-k</text>
    <text x="796" y="472" fill="#94a3b8" font-size="13">召回不足与噪声过多之间存在甜点位</text>

    <g font-size="15">
      <text x="796" y="523" fill="#cbd5e1">k = 1</text>
      <rect x="860" y="504" width="188" height="26" rx="7" fill="#0e7490"/>
      <text x="1060" y="523" fill="#cffafe" font-weight="700">37.5</text>

      <text x="796" y="574" fill="#86efac" font-weight="700">k = 3</text>
      <rect x="860" y="555" width="216" height="26" rx="7" fill="#22c55e"/>
      <text x="1088" y="574" fill="#dcfce7" font-weight="700">43.1</text>

      <text x="796" y="625" fill="#cbd5e1">k = 5</text>
      <rect x="860" y="606" width="200" height="26" rx="7" fill="#0891b2"/>
      <text x="1072" y="625" fill="#cffafe" font-weight="700">40.0</text>
    </g>
    <text x="60" y="712" fill="#64748b" font-size="12">注：论文摘要的“24% / 20% 相对提升”采用作者汇总口径；此图额外给出 7B Base 相对同表 RAG 的直观差值，二者不要混为同一比较。</text>
  </g>
</svg>
