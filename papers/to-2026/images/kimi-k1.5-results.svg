<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Kimi k1.5 长思维链与短思维链代表结果</title>
  <desc id="desc">以卡片和条形图展示 AIME、MATH-500、LiveCodeBench、MathVista 等论文结果，并提示模型、协议、窗口和聚合方法不同。</desc>
  <defs><linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#17113c"/></linearGradient><style>.zh{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:40px;font-weight:750;fill:#f8fafc}.sub{font-size:18px;fill:#a5b4fc}.h{font-size:22px;font-weight:750;fill:#f8fafc}.b{font-size:16px;fill:#cbd5e1}.small{font-size:14px;fill:#94a3b8}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:16px;fill:#cffafe}.box{fill:#0d2944;stroke:#345674;stroke-width:2}.num{font-size:25px;font-weight:800;fill:#f8fafc}</style></defs>
  <rect width="1440" height="920" rx="30" fill="url(#bg6)"/>
  <text x="70" y="72" class="zh title">Long-CoT 追求上限，Short-CoT 追求预算内的强推理</text>
  <text x="70" y="108" class="zh sub">论文 v4 结果；每一列的 metric、test window、采样与聚合方式都必须连同分数一起读</text>
  <text x="70" y="158" class="zh h">Kimi k1.5 long-CoT</text><circle cx="324" cy="151" r="8" fill="#a78bfa"/>

  <g class="zh">
    <rect x="70" y="185" width="300" height="160" rx="22" class="box"/><text x="94" y="222" class="h">AIME 2024 · Pass@1</text><rect x="94" y="255" width="232" height="20" rx="10" fill="#33275f"/><rect x="94" y="255" width="180" height="20" rx="10" fill="#a78bfa"/><text x="94" y="316" class="num">77.5</text>
    <rect x="400" y="185" width="300" height="160" rx="22" class="box"/><text x="424" y="222" class="h">MATH-500 · EM</text><rect x="424" y="255" width="232" height="20" rx="10" fill="#33275f"/><rect x="424" y="255" width="223" height="20" rx="10" fill="#a78bfa"/><text x="424" y="316" class="num">96.2</text>
    <rect x="730" y="185" width="300" height="160" rx="22" class="box"/><text x="754" y="222" class="h">LiveCodeBench v5</text><rect x="754" y="255" width="232" height="20" rx="10" fill="#33275f"/><rect x="754" y="255" width="145" height="20" rx="10" fill="#a78bfa"/><text x="754" y="316" class="num">62.5</text>
    <rect x="1060" y="185" width="310" height="160" rx="22" class="box"/><text x="1084" y="222" class="h">MathVista · Pass@1</text><rect x="1084" y="255" width="238" height="20" rx="10" fill="#33275f"/><rect x="1084" y="255" width="178" height="20" rx="10" fill="#a78bfa"/><text x="1084" y="316" class="num">74.9</text>
  </g>

  <text x="70" y="403" class="zh h">Kimi k1.5 short-CoT</text><circle cx="326" cy="396" r="8" fill="#22d3ee"/>
  <g class="zh">
    <rect x="70" y="430" width="300" height="160" rx="22" class="box"/><text x="94" y="467" class="h">AIME 2024 · Pass@1</text><rect x="94" y="500" width="232" height="20" rx="10" fill="#123a52"/><rect x="94" y="500" width="141" height="20" rx="10" fill="#22d3ee"/><text x="94" y="561" class="num">60.8</text>
    <rect x="400" y="430" width="300" height="160" rx="22" class="box"/><text x="424" y="467" class="h">MATH-500 · EM</text><rect x="424" y="500" width="232" height="20" rx="10" fill="#123a52"/><rect x="424" y="500" width="219" height="20" rx="10" fill="#22d3ee"/><text x="424" y="561" class="num">94.6</text>
    <rect x="730" y="430" width="300" height="160" rx="22" class="box"/><text x="754" y="467" class="h">LiveCodeBench v4</text><rect x="754" y="500" width="232" height="20" rx="10" fill="#123a52"/><rect x="754" y="500" width="110" height="20" rx="10" fill="#22d3ee"/><text x="754" y="561" class="num">47.3</text>
    <rect x="1060" y="430" width="310" height="160" rx="22" class="box"/><text x="1084" y="467" class="h">MathVista · Pass@1</text><rect x="1084" y="500" width="238" height="20" rx="10" fill="#123a52"/><rect x="1084" y="500" width="167" height="20" rx="10" fill="#22d3ee"/><text x="1084" y="561" class="num">70.1</text>
  </g>

  <rect x="70" y="640" width="1300" height="190" rx="24" fill="#102b46" stroke="#f59e0b" stroke-width="2"/>
  <text x="98" y="682" class="zh h">四个容易误读的协议差异</text>
  <text x="98" y="718" class="zh b">① LiveCodeBench：long 用 2024.12–2025.02 v5；</text>
  <text x="118" y="746" class="zh b">short 用 2024.08–11 v4，不能直接消融</text>
  <text x="98" y="792" class="zh b">② Codeforces 94th：majority voting + 模型生成测试，不是单次 pass@1</text>
  <text x="765" y="718" class="zh b">③ AIME short 60.8：8 次运行平均</text>
  <text x="765" y="764" class="zh b">④ IF-Eval：表中来自中间模型，附录称将更新</text>
  <text x="720" y="882" text-anchor="middle" class="zh sub">分数证明了这一整套系统有效，但没有隔离参数规模、预训练、SFT、RL、测试时采样各自贡献</text>
</svg>
