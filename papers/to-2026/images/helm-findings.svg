<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">HELM 论文版实验规模和代表性发现</title><desc id="desc">30个模型、42个场景、4939次运行及若干不能由单一准确率解释的结果。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#181126"/></linearGradient><linearGradient id="num" x2="1"><stop stop-color="#50ddff"/><stop offset="1" stop-color="#bd9cff"/></linearGradient></defs><rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <text x="70" y="76" fill="#f5f7ff" font-family="Inter, PingFang SC, sans-serif" font-size="38" font-weight="700">2022 年历史快照：规模空前，但结论仍然依赖协议与时代</text>
  <g font-family="Inter, PingFang SC, sans-serif">
    <g transform="translate(65 135)" text-anchor="middle"><g><rect width="245" height="145" rx="24" fill="#102c3a" stroke="#41d9fb"/><text x="122" y="63" fill="#59e1ff" font-size="44" font-weight="800">30</text><text x="122" y="104" fill="#dff9ff" font-size="19">模型 · 16 家族</text></g><g transform="translate(268)"><rect width="245" height="145" rx="24" fill="#25203d" stroke="#a68eff"/><text x="122" y="63" fill="#bda9ff" font-size="44" font-weight="800">42</text><text x="122" y="104" fill="#f0ebff" font-size="19">场景</text></g><g transform="translate(536)"><rect width="245" height="145" rx="24" fill="#302414" stroke="#ffb65c"/><text x="122" y="63" fill="#ffc679" font-size="40" font-weight="800">4,939</text><text x="122" y="104" fill="#fff3e3" font-size="19">模型 × 场景运行</text></g><g transform="translate(804)"><rect width="245" height="145" rx="24" fill="#17302b" stroke="#50dfa9"/><text x="122" y="63" fill="#72edc0" font-size="36" font-weight="800">17.43M</text><text x="122" y="104" fill="#e9fff7" font-size="19">查询</text></g><g transform="translate(1072)"><rect width="245" height="145" rx="24" fill="#381a2b" stroke="#ff79ba"/><text x="122" y="63" fill="#ff9dcc" font-size="39" font-weight="800">$38K</text><text x="122" y="104" fill="#fff0f8" font-size="19">商业 API 成本</text></g></g>
    <text x="720" y="323" text-anchor="middle" fill="#91a6bf" font-size="18">另有约 12.17B token 与 19,500 GPU 小时；私有模型成本由提供方承担</text>
    <g transform="translate(70 370)">
      <rect width="620" height="185" rx="27" fill="#0e2634" stroke="#36ccec"/><text x="30" y="48" fill="#54defa" font-size="23" font-weight="700">准确率更高，不保证校准更好</text><text x="30" y="89" fill="#d6edf4" font-size="18">OpenBookQA：准确率与校准改善正相关</text><text x="30" y="123" fill="#d6edf4" font-size="18">HellaSwag：准确率越高，ECE 反而可能越差</text><text x="30" y="158" fill="#80b8c8" font-size="16">关系取决于场景，不能跨任务外推</text>
      <rect y="215" width="620" height="185" rx="27" fill="#251f3b" stroke="#9b84ed"/><text x="30" y="263" fill="#bca8ff" font-size="23" font-weight="700">同一模型，prompt 选择可改写名次</text><text x="30" y="304" fill="#eee9ff" font-size="18">OPT-175B / HellaSwag：</text><text x="30" y="340" fill="#f4ce82" font-size="22">separate zero-shot 79.1% → joint 5-shot 30.2%</text><text x="30" y="374" fill="#aa9bbd" font-size="16">“模型分数”其实也是“适配协议分数”</text>
    </g>
    <g transform="translate(750 370)">
      <rect width="620" height="185" rx="27" fill="#302414" stroke="#ffb55c"/><text x="30" y="48" fill="#ffc679" font-size="23" font-weight="700">平均分会隐藏最坏情况</text><text x="30" y="89" fill="#f5e8d7" font-size="18">NarrativeQA / TNLGv2-530B：</text><text x="30" y="126" fill="#ffcf8d" font-size="22">标准 72.6 → 扰动最坏 38.9</text><text x="30" y="159" fill="#c5a985" font-size="16">局部鲁棒性揭示部署脆弱点</text>
      <rect y="215" width="620" height="185" rx="27" fill="#17302b" stroke="#50dda8"/><text x="30" y="263" fill="#71ebbf" font-size="23" font-weight="700">规模与上游损失不是万能代理</text><text x="30" y="304" fill="#e7fff6" font-size="18">同一家族放大通常提高准确率；跨家族很混乱</text><text x="30" y="340" fill="#e7fff6" font-size="18">The Pile BPB 也难预测所有下游任务</text><text x="30" y="374" fill="#98c9b7" font-size="16">训练方法、数据与适配方式是强混杂因素</text>
    </g>
    <rect x="225" y="812" width="990" height="54" rx="17" fill="#171526" stroke="#554a70"/><text x="720" y="846" text-anchor="middle" fill="#c6bad5" font-size="19">这些数值只描述论文 v0.1.0 的模型与提示协议，不是 2026 年模型排名</text>
  </g>
</svg>
