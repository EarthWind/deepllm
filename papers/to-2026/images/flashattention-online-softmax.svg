<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention 的在线 softmax 更新</title>
  <desc id="desc">一个注意力分数行被拆成多个块。每读入新块，就更新全局最大值，将旧分母与旧加权值按指数差重新缩放，再合并新块，因此无需同时看到整行也能得到完全相同的 softmax 加权和。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08172b"/><stop offset="1" stop-color="#222451"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f64f5"/><stop offset="1" stop-color="#a477f7"/></linearGradient>
    <linearGradient id="new" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09a7b6"/><stop offset="1" stop-color="#35d39f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#a9bddb"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#afbfda}.head{font-size:22px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#dce9fa}.small{font-size:14px;fill:#aebfd9}.dark{font-size:16px;font-weight:680;fill:#10243a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px;fill:#edf5ff}.formula{font-family:"STIX Two Math","Times New Roman",serif;font-size:23px;fill:#fff}.big{font-size:27px;font-weight:800;fill:#fff}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="sans title">在线 Softmax：新最大值出现时，旧结果必须“换标尺”</text>
  <text x="54" y="94" class="sans sub">每一行只携带 (m, ℓ, u)；其中 u 是尚未除以分母的加权 value 和</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="352" height="297" rx="24" fill="#132540" stroke="#665bd7" stroke-width="2"/>
    <rect x="464" y="132" width="352" height="297" rx="24" fill="#132b42" stroke="#18ad9c" stroke-width="2"/>
    <rect x="874" y="132" width="352" height="297" rx="24" fill="#132540" stroke="#665bd7" stroke-width="2"/>
  </g>
  <text x="80" y="172" class="sans head">① 已处理旧分数块</text>
  <rect x="80" y="195" width="300" height="56" rx="14" fill="url(#accent)"/>
  <text x="230" y="230" text-anchor="middle" class="sans mono">x(old) = [1.0, 2.0, …]</text>
  <text x="82" y="286" class="sans body">维护三项状态：</text>
  <text x="82" y="319" class="sans mono">m = max(x_old)</text>
  <text x="82" y="351" class="sans mono">ℓ = Σ exp(x_old − m)</text>
  <text x="82" y="383" class="sans mono">u = Σ exp(x_old − m) · v</text>
  <text x="82" y="411" class="sans small">此时输出暂为 u / ℓ</text>

  <path d="M407 281H454" stroke="#a9bddb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="490" y="172" class="sans head">② 读入一个新分数块</text>
  <rect x="490" y="195" width="300" height="56" rx="14" fill="url(#new)"/>
  <text x="640" y="230" text-anchor="middle" class="sans dark">x(new) = [7.0, 6.0, …]</text>
  <text x="490" y="286" class="sans body">新块可能抬高最大值：</text>
  <text x="490" y="324" class="formula">m′ = max(m, max(x_new))</text>
  <rect x="490" y="348" width="300" height="57" rx="13" fill="#193b43" stroke="#2dd4bf"/>
  <text x="640" y="373" text-anchor="middle" class="sans body">旧标尺 → 新标尺</text>
  <text x="640" y="394" text-anchor="middle" class="sans mono">α = exp(m − m′) ≤ 1</text>

  <path d="M817 281H864" stroke="#a9bddb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="900" y="172" class="sans head">③ 重缩放并合并</text>
  <text x="900" y="218" class="formula">p̃ = exp(x_new − m′)</text>
  <text x="900" y="265" class="formula">ℓ′ = αℓ + Σ p̃</text>
  <text x="900" y="312" class="formula">u′ = αu + Σ p̃v</text>
  <rect x="900" y="347" width="300" height="58" rx="14" fill="url(#accent)"/>
  <text x="1050" y="383" text-anchor="middle" class="sans head">最终输出 O = u′ / ℓ′</text>

  <rect x="55" y="471" width="1170" height="174" rx="24" fill="#10243b" stroke="#496481"/>
  <text x="83" y="512" class="sans head">为什么这仍是精确 softmax？</text>
  <text x="83" y="551" class="formula">exp(x − m) = exp(m − m′) · exp(x − m′)</text>
  <text x="83" y="590" class="sans body">最大值从 m 变成 m′ 后，所有旧指数项统一乘 α，就与“从一开始便用 m′ 归一化”完全一致。</text>
  <text x="83" y="620" class="sans body">因此分块顺序与 tile 大小不会改变数学结果；差别只来自有限精度下的舍入次序，而不是近似 attention。</text>
  <rect x="875" y="503" width="310" height="102" rx="16" fill="#182f4b"/>
  <text x="1030" y="535" text-anchor="middle" class="sans small">等价的单行不变量</text>
  <text x="1030" y="565" text-anchor="middle" class="sans mono">ℓ = Σⱼ exp(sⱼ − m)</text>
  <text x="1030" y="590" text-anchor="middle" class="sans mono">u = Σⱼ exp(sⱼ − m)vⱼ</text>
  <text x="640" y="688" text-anchor="middle" class="sans sub">数值稳定性不是附带技巧：不减最大值时，exp(大分数) 很容易溢出。</text>
</svg>
