<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">175B 模型不同权重位宽的理想载荷</title>
  <desc id="desc">1750 亿参数的 FP16 权重约 326 GiB，理想四比特载荷约 81.5 GiB，理想三比特载荷约 61.1 GiB；实际还需 scales、zero points、packing、激活、KV cache 和工作区。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172448"/></linearGradient>
    <linearGradient id="fp" x2="1"><stop stop-color="#336fa9"/><stop offset="1" stop-color="#61b9e9"/></linearGradient>
    <linearGradient id="q4" x2="1"><stop stop-color="#765ee0"/><stop offset="1" stop-color="#4c9fd0"/></linearGradient>
    <linearGradient id="q3" x2="1"><stop stop-color="#2ebeb5"/><stop offset="1" stop-color="#e0a347"/></linearGradient>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.t{fill:#f6f9ff;font-size:30px;font-weight:750}.sub{fill:#9eb5d4;font-size:15px}.h{fill:#f0f5ff;font-size:18px;font-weight:720}.b{fill:#c4d4e9;font-size:14px}.tiny{fill:#91a9c6;font-size:12px}.v{fill:#fff;font-size:24px;font-weight:800}.formula{fill:#e1edff;font-size:17px;font-weight:650}</style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text class="t" x="55" y="62">175B 的“单卡可放下”首先是一道权重载荷算术题</text>
  <text class="sub" x="55" y="94">下图按 1750 亿参数计算理想 payload；GB 与 GiB 不可混用</text>

  <g transform="translate(55 145)">
    <rect width="1090" height="305" rx="22" fill="#0f2039" stroke="#304b6c"/>
    <text class="h" x="25" y="37">二进制 GiB（1 GiB = 2³⁰ bytes）</text>
    <g transform="translate(25 75)">
      <text class="b" x="0" y="35">FP16</text><rect x="85" width="900" height="54" rx="12" fill="url(#fp)"/><text class="v" x="968" y="36" text-anchor="end">325.96 GiB</text><text class="tiny" x="1000" y="35">16 bit</text>
      <text class="b" x="0" y="112">4-bit</text><rect x="85" y="77" width="225" height="54" rx="12" fill="url(#q4)"/><text class="v" x="294" y="113" text-anchor="end">81.49</text><text class="tiny" x="322" y="112">GiB · 4×</text>
      <text class="b" x="0" y="189">3-bit</text><rect x="85" y="154" width="169" height="54" rx="12" fill="url(#q3)"/><text class="v" x="238" y="190" text-anchor="end">61.12</text><text class="tiny" x="266" y="189">GiB · 5.33×</text>
    </g>
    <path d="M331 59V283" stroke="#ffbf5d" stroke-width="2" stroke-dasharray="7 6"/><rect x="300" y="125" width="63" height="25" rx="12" fill="#4c382c"/><text x="331" y="142" text-anchor="middle" fill="#ffd38c" font-size="12" font-weight="700">80 GiB</text>
  </g>

  <g transform="translate(55 480)">
    <rect width="520" height="115" rx="18" fill="#162243" stroke="#6557bd"/>
    <text class="h" x="24" y="32">理想压缩比</text>
    <text class="formula" x="24" y="67">compression = 16 / b</text>
    <text class="b" x="24" y="95">4-bit = 4×；3-bit ≈ 5.33×</text>
    <text class="tiny" x="493" y="95" text-anchor="end">只算 weight payload</text>
    <rect x="545" width="545" height="115" rx="18" fill="#122c3d" stroke="#2faaa4"/>
    <text class="h" x="570" y="32">实际显存还要加</text>
    <text class="b" x="570" y="62">scale · zero point · group metadata · padding / packing</text>
    <text class="b" x="570" y="87">activation · KV cache · 临时反量化 / kernel workspace</text>
    <text class="tiny" x="1065" y="104" text-anchor="end">因此 4-bit 175B 的 81.49 GiB payload 本身已略高于 80 GiB</text>
  </g>
  <text class="tiny" x="1145" y="628" text-anchor="end">论文“326 GB”按 1024 倍数换算，本图写作 325.96 GiB 以消除单位歧义</text>
</svg>
