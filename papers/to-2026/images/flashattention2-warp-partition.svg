<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention-2 的 split-Q warp 工作划分</title>
  <desc id="desc">FlashAttention v1 把 K 和 V 列分给多个 warp，产生需要共享内存归约的输出部分和；FlashAttention-2 把 Q 行分给 warp，每个 warp 得到互不重叠的输出行，无需跨 warp 汇总前向输出。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071528"/><stop offset="1" stop-color="#22264f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#afc1df"/></marker>
    <style>.sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:760;fill:#f8fbff}.sub{font-size:16px;fill:#afbfda}.head{font-size:23px;font-weight:750;fill:#fff}.body{font-size:16px;fill:#dce8f8}.small{font-size:14px;fill:#adbed8}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#eff7ff}.warp{font-size:14px;font-weight:760;fill:#071426}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="56" y="61" class="sans title">warp 内分工：从 split-K 改为 split-Q</text>
  <text x="56" y="93" class="sans sub">同一个 CTA 通常有 4 或 8 个 warps；分错维度，会把本可独立的矩阵乘变成 shared-memory 通信问题。</text>

  <g filter="url(#shadow)"><rect x="56" y="138" width="558" height="500" rx="24" fill="#111f37" stroke="#6a7894" stroke-width="2"/></g>
  <text x="86" y="181" class="sans head">FlashAttention v1：split-K</text>
  <text x="86" y="211" class="sans small">Q 对所有 warps 可见；K/V 沿列切开。</text>
  <g transform="translate(92 251)">
    <rect width="94" height="188" rx="12" fill="#233d59" stroke="#5d7694"/>
    <text x="47" y="91" text-anchor="middle" class="sans mono">Q</text><text x="47" y="116" text-anchor="middle" class="sans small">shared</text>
    <path d="M105 94H143" stroke="#afc1df" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(156 0)">
      <rect width="66" height="188" rx="8" fill="#2dd4bf"/><rect x="70" width="66" height="188" rx="8" fill="#68aaf4"/>
      <rect x="140" width="66" height="188" rx="8" fill="#9b83ed"/><rect x="210" width="66" height="188" rx="8" fill="#e27bc7"/>
      <text x="33" y="101" text-anchor="middle" class="sans warp">K₀,V₀</text><text x="103" y="101" text-anchor="middle" class="sans warp">K₁,V₁</text>
      <text x="173" y="101" text-anchor="middle" class="sans warp">K₂,V₂</text><text x="243" y="101" text-anchor="middle" class="sans warp">K₃,V₃</text>
    </g>
  </g>
  <text x="86" y="472" class="sans mono">warp w → partial O⁽ʷ⁾ for all Q rows</text>
  <g transform="translate(92 500)">
    <rect width="94" height="46" rx="9" fill="#2dd4bf"/><rect x="104" width="94" height="46" rx="9" fill="#68aaf4"/>
    <rect x="208" width="94" height="46" rx="9" fill="#9b83ed"/><rect x="312" width="94" height="46" rx="9" fill="#e27bc7"/>
    <path d="M48 56V81H203" stroke="#c5d4e9" stroke-width="2"/><path d="M151 56V81H203" stroke="#c5d4e9" stroke-width="2"/>
    <path d="M255 56V81H203" stroke="#c5d4e9" stroke-width="2"/><path d="M359 56V81H203" stroke="#c5d4e9" stroke-width="2"/>
    <rect x="418" y="58" width="75" height="46" rx="10" fill="#5b414a"/><text x="455" y="87" text-anchor="middle" class="sans mono">Σ → O</text>
    <path d="M203 81H407" stroke="#afc1df" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <text x="86" y="620" class="sans small">partial O 写 shared memory → 同步 → 跨 warp 求和</text>

  <g filter="url(#shadow)"><rect x="642" y="138" width="582" height="500" rx="24" fill="#112a40" stroke="#2dd4bf" stroke-width="2"/></g>
  <text x="672" y="181" class="sans head">FlashAttention-2：split-Q</text>
  <text x="672" y="211" class="sans small">K/V 对所有 warps 可见；Q 沿行切开。</text>
  <g transform="translate(680 251)">
    <g>
      <rect width="210" height="44" rx="8" fill="#2dd4bf"/><rect y="48" width="210" height="44" rx="8" fill="#68aaf4"/>
      <rect y="96" width="210" height="44" rx="8" fill="#9b83ed"/><rect y="144" width="210" height="44" rx="8" fill="#e27bc7"/>
      <text x="105" y="28" text-anchor="middle" class="sans warp">Q rows → warp 0</text><text x="105" y="76" text-anchor="middle" class="sans warp">Q rows → warp 1</text>
      <text x="105" y="124" text-anchor="middle" class="sans warp">Q rows → warp 2</text><text x="105" y="172" text-anchor="middle" class="sans warp">Q rows → warp 3</text>
    </g>
    <path d="M222 94H258" stroke="#afc1df" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="271" width="108" height="188" rx="12" fill="#24475d" stroke="#4b7590"/>
    <text x="325" y="90" text-anchor="middle" class="sans mono">K, V</text><text x="325" y="116" text-anchor="middle" class="sans small">shared</text>
    <path d="M391 94H427" stroke="#afc1df" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(1118 251)">
    <rect width="72" height="44" rx="8" fill="#2dd4bf"/><rect y="48" width="72" height="44" rx="8" fill="#68aaf4"/>
    <rect y="96" width="72" height="44" rx="8" fill="#9b83ed"/><rect y="144" width="72" height="44" rx="8" fill="#e27bc7"/>
    <text x="36" y="28" text-anchor="middle" class="sans warp">O₀</text><text x="36" y="76" text-anchor="middle" class="sans warp">O₁</text>
    <text x="36" y="124" text-anchor="middle" class="sans warp">O₂</text><text x="36" y="172" text-anchor="middle" class="sans warp">O₃</text>
  </g>
  <text x="672" y="472" class="sans mono">warp w → final O rows owned by warp w</text>
  <g transform="translate(680 506)">
    <rect width="120" height="64" rx="11" fill="#2dd4bf"/><rect x="130" width="120" height="64" rx="11" fill="#68aaf4"/>
    <rect x="260" width="120" height="64" rx="11" fill="#9b83ed"/><rect x="390" width="120" height="64" rx="11" fill="#e27bc7"/>
    <text x="60" y="27" text-anchor="middle" class="sans warp">warp 0</text><text x="60" y="49" text-anchor="middle" class="sans warp">writes O₀</text>
    <text x="190" y="27" text-anchor="middle" class="sans warp">warp 1</text><text x="190" y="49" text-anchor="middle" class="sans warp">writes O₁</text>
    <text x="320" y="27" text-anchor="middle" class="sans warp">warp 2</text><text x="320" y="49" text-anchor="middle" class="sans warp">writes O₂</text>
    <text x="450" y="27" text-anchor="middle" class="sans warp">warp 3</text><text x="450" y="49" text-anchor="middle" class="sans warp">writes O₃</text>
  </g>
  <text x="672" y="620" class="sans small" fill="#bdfbf2">forward 输出行互不重叠：无需跨 warp 汇总 partial O</text>

  <rect x="170" y="664" width="940" height="36" rx="18" fill="#11283e" stroke="#486783"/>
  <text x="640" y="688" text-anchor="middle" class="sans body">“split-K”里的 K 指矩阵乘归约维；它不是 KV Cache、也不是张量并行里的同名术语。</text>
</svg>
