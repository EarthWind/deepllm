<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Self-RAG 按需检索与逐段自评流程</title>
  <desc id="desc">输入经检索门决定是否检索；需要检索时并行读取多个文档，以相关性、支持度和效用选择答案段，再继续下一段。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071226"/><stop offset="1" stop-color="#101b36"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e88e5"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d5dfc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d9488"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7dd3fc"/></marker>
    <style>
      .t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e8f1ff}.h{font-size:30px;font-weight:700}.s{font-size:18px}.xs{font-size:15px;fill:#aebfd9}.card{fill:#132440;stroke:#31517a;stroke-width:2}.pill{font-size:16px;font-weight:650}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <g opacity=".09" stroke="#8bb9e8"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/><path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/></g>
  <text class="t h" x="60" y="65">Self-RAG：把检索、生成与批评写进同一条 token 流</text>
  <text class="t xs" x="60" y="96">每个 segment 都可重新决定：查不查、信哪篇、这一句是否被证据支持</text>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="270" width="175" height="118" rx="20"/>
    <circle cx="102" cy="329" r="23" fill="url(#blue)"/><path d="M91 329h22M102 318v22" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text class="t s" x="135" y="320">输入 x</text><text class="t xs" x="135" y="348">+ 已生成 y&lt;t</text>
  </g>
  <path class="line" d="M235 329H300"/>

  <g filter="url(#shadow)">
    <path d="M385 233l88 96-88 96-88-96z" fill="#162b4b" stroke="#58bcec" stroke-width="3"/>
    <text class="t s" text-anchor="middle" x="385" y="315">Retrieve?</text>
    <text class="t xs" text-anchor="middle" x="385" y="345">Yes / No / Continue</text>
  </g>

  <path class="line" d="M385 233V163H527"/>
  <rect x="409" y="135" width="70" height="30" rx="15" fill="#5a3b18" stroke="#fbbf24"/><text class="t pill" text-anchor="middle" x="444" y="156">No</text>
  <g filter="url(#shadow)"><rect class="card" x="530" y="112" width="230" height="100" rx="18"/><text class="t s" x="560" y="151">直接生成下一段</text><text class="t xs" x="560" y="181">开放写作不必强塞文档</text></g>

  <path class="line" d="M473 329H535"/>
  <rect x="480" y="290" width="70" height="30" rx="15" fill="#123e4a" stroke="#2dd4bf"/><text class="t pill" text-anchor="middle" x="515" y="311">Yes</text>
  <g filter="url(#shadow)"><rect class="card" x="540" y="263" width="190" height="132" rx="18"/><text class="t s" x="566" y="298">Retriever R</text><g fill="#213d62" stroke="#6ec9ef"><rect x="568" y="318" width="135" height="20" rx="5"/><rect x="568" y="346" width="135" height="20" rx="5"/></g><text class="t xs" x="635" y="384" text-anchor="middle">Top-K passages</text></g>

  <path class="line" d="M730 329H790"/>
  <g filter="url(#shadow)">
    <rect x="795" y="154" width="208" height="118" rx="17" fill="#161f3d" stroke="#8b7cf6" stroke-width="2"/>
    <rect x="795" y="301" width="208" height="118" rx="17" fill="#161f3d" stroke="#8b7cf6" stroke-width="2"/>
    <rect x="795" y="448" width="208" height="118" rx="17" fill="#161f3d" stroke="#8b7cf6" stroke-width="2"/>
    <text class="t s" x="823" y="190">d₁ → segment y₁</text><text class="t xs" x="823" y="220">Relevant · Fully · Use 5</text><rect x="823" y="237" width="150" height="7" rx="4" fill="url(#green)"/>
    <text class="t s" x="823" y="337">d₂ → segment y₂</text><text class="t xs" x="823" y="367">Irrelevant · No support</text><rect x="823" y="384" width="54" height="7" rx="4" fill="#ef6461"/>
    <text class="t s" x="823" y="484">d₃ → segment y₃</text><text class="t xs" x="823" y="514">Relevant · Partially · Use 4</text><rect x="823" y="531" width="105" height="7" rx="4" fill="url(#violet)"/>
  </g>
  <path d="M730 329C760 329 760 213 795 213M730 329C760 329 760 360 795 360M730 329C760 329 760 507 795 507" fill="none" stroke="#7dd3fc" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="1052" y="264" width="105" height="130" rx="20" fill="#103d3e" stroke="#34d399" stroke-width="2"/>
    <circle cx="1104" cy="306" r="22" fill="#1f7a6d"/><path d="M1093 306l8 8 15-19" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t s" text-anchor="middle" x="1104" y="354">保留</text><text class="t xs" text-anchor="middle" x="1104" y="378">Top-B</text>
  </g>
  <path class="line" d="M1003 213C1030 213 1025 329 1052 329"/><path class="line" d="M1003 360H1052"/><path class="line" d="M1003 507C1030 507 1025 329 1052 329"/>

  <path d="M1104 394V640H630C515 640 510 510 510 456" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <text class="t xs" x="760" y="674">下一段：可重新检索、跳过或沿用证据</text>

  <g transform="translate(68 513)"><rect width="550" height="80" rx="16" fill="#0b1830" stroke="#29496e"/><text class="t pill" x="24" y="31">Critique score</text><text class="t xs" x="24" y="58">LM score + wᵣ·ISREL + wₛ·ISSUP + wᵤ·ISUSE</text></g>
</svg>
