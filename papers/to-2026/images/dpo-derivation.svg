<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">DPO 目标函数的四步推导</title>
  <desc id="desc">从带 KL 约束的奖励最大化出发，得到最优策略的闭式解；将奖励写为策略与参考策略的对数概率比；代入 Bradley-Terry 偏好模型后，依赖提示的配分函数相消；最后得到可直接优化策略的 DPO 损失。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6366f1"/></marker>
    <style>.title{font:700 31px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.step{font:700 20px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.eq{font:600 17px "STIX Two Text","Times New Roman",serif;fill:#1e1b4b}.body{font:400 14px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 12px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.badge{font:700 16px Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#fff}</style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <text x="55" y="51" class="title">DPO 的数学捷径：偏好只依赖奖励差，因此未知的 Z(x) 会严格相消</text>
  <text x="55" y="81" class="sub">不是先猜一个 reward 再用 PPO 逼近最优策略，而是把 reward 直接改写成 policy/reference 的 log-ratio。</text>

  <g transform="translate(55 120)" filter="url(#shadow)">
    <rect width="610" height="238" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="35" cy="35" r="20" fill="#2563eb"/><text x="35" y="41" text-anchor="middle" class="badge">1</text>
    <text x="68" y="42" class="step">KL 约束奖励最大化</text>
    <text x="305" y="94" text-anchor="middle" class="eq">max  E<tspan baseline-shift="sub" font-size="12">y∼π</tspan>[r(x,y)] − β D<tspan baseline-shift="sub" font-size="12">KL</tspan>[π(·|x) ‖ π<tspan baseline-shift="sub" font-size="12">ref</tspan>(·|x)]</text>
    <rect x="28" y="127" width="554" height="77" rx="14" fill="#eff6ff"/>
    <text x="47" y="158" class="body">β 是 KL 项系数：固定 reward 时，β 越大，最优策略越靠近 reference。</text>
    <text x="47" y="184" class="small">这里的策略空间先按非参数分布处理，闭式解才可以精确写出。</text>
  </g>
  <path d="M677 239H722" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(735 120)" filter="url(#shadow)">
    <rect width="610" height="238" rx="22" fill="#fff" stroke="#a5b4fc"/>
    <circle cx="35" cy="35" r="20" fill="#4f46e5"/><text x="35" y="41" text-anchor="middle" class="badge">2</text>
    <text x="68" y="42" class="step">最优策略的闭式解</text>
    <text x="305" y="91" text-anchor="middle" class="eq">π<tspan baseline-shift="sub" font-size="12">r</tspan>(y|x) = π<tspan baseline-shift="sub" font-size="12">ref</tspan>(y|x) exp(r(x,y)/β) / Z(x)</text>
    <text x="305" y="132" text-anchor="middle" class="eq">⇓　取对数并整理</text>
    <rect x="40" y="154" width="530" height="53" rx="14" fill="#eef2ff"/>
    <text x="305" y="186" text-anchor="middle" class="eq">r(x,y) = β log [π<tspan baseline-shift="sub" font-size="12">r</tspan>(y|x) / π<tspan baseline-shift="sub" font-size="12">ref</tspan>(y|x)] + β log Z(x)</text>
  </g>
  <path d="M1040 370V411" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(735 424)" filter="url(#shadow)">
    <rect width="610" height="250" rx="22" fill="#fff" stroke="#c4b5fd"/>
    <circle cx="35" cy="35" r="20" fill="#7c3aed"/><text x="35" y="41" text-anchor="middle" class="badge">3</text>
    <text x="68" y="42" class="step">代入 Bradley–Terry 偏好模型</text>
    <text x="305" y="89" text-anchor="middle" class="eq">p(y<tspan baseline-shift="sub" font-size="12">w</tspan> ≻ y<tspan baseline-shift="sub" font-size="12">l</tspan>|x) = σ(r(x,y<tspan baseline-shift="sub" font-size="12">w</tspan>) − r(x,y<tspan baseline-shift="sub" font-size="12">l</tspan>))</text>
    <text x="305" y="132" text-anchor="middle" class="eq">r<tspan baseline-shift="sub" font-size="12">w</tspan> − r<tspan baseline-shift="sub" font-size="12">l</tspan> = β [ log π(y<tspan baseline-shift="sub" font-size="12">w</tspan>)/π<tspan baseline-shift="sub" font-size="12">ref</tspan>(y<tspan baseline-shift="sub" font-size="12">w</tspan>) − log π(y<tspan baseline-shift="sub" font-size="12">l</tspan>)/π<tspan baseline-shift="sub" font-size="12">ref</tspan>(y<tspan baseline-shift="sub" font-size="12">l</tspan>) ]</text>
    <rect x="43" y="160" width="524" height="58" rx="14" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="305" y="185" text-anchor="middle" class="step" fill="#6b21a8">+ β log Z(x) − β log Z(x) = 0</text>
    <text x="305" y="207" text-anchor="middle" class="small">同一个 prompt 的两个回答共享归一化项</text>
  </g>
  <path d="M723 549H678" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(55 424)" filter="url(#shadow)">
    <rect width="610" height="250" rx="22" fill="#fff" stroke="#818cf8"/>
    <circle cx="35" cy="35" r="20" fill="#4338ca"/><text x="35" y="41" text-anchor="middle" class="badge">4</text>
    <text x="68" y="42" class="step">直接对策略做最大似然</text>
    <rect x="28" y="70" width="554" height="97" rx="16" fill="#eef2ff"/>
    <text x="305" y="107" text-anchor="middle" class="eq">L<tspan baseline-shift="sub" font-size="12">DPO</tspan> = −E<tspan baseline-shift="sub" font-size="12">D</tspan> log σ(βh<tspan baseline-shift="sub" font-size="12">θ</tspan>)</text>
    <text x="305" y="141" text-anchor="middle" class="eq">h<tspan baseline-shift="sub" font-size="12">θ</tspan> = (log π<tspan baseline-shift="sub" font-size="12">θ,w</tspan> − log π<tspan baseline-shift="sub" font-size="12">ref,w</tspan>) − (log π<tspan baseline-shift="sub" font-size="12">θ,l</tspan> − log π<tspan baseline-shift="sub" font-size="12">ref,l</tspan>)</text>
    <text x="42" y="198" class="body">π<tspan baseline-shift="sub" font-size="10">θ</tspan> 同时是语言策略，也是隐式 reward 的参数化载体。</text>
    <text x="42" y="224" class="small">等价性依赖偏好模型、KL 正则目标及数据分布等假设，并非任意 RLHF 都能如此消元。</text>
  </g>
  <text x="55" y="735" class="small">隐式奖励可写为 r̂<tspan baseline-shift="sub" font-size="10">θ</tspan>(x,y)=β log[π<tspan baseline-shift="sub" font-size="10">θ</tspan>(y|x)/π<tspan baseline-shift="sub" font-size="10">ref</tspan>(y|x)]；任何只依赖 x 的加性常数都不改变成对偏好。</text>
</svg>
