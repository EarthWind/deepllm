<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">QLoRA 单层前向与反向传播</title>
  <desc id="desc">NF4 冻结权重经双重反量化到 BF16 参与计算，LoRA 的 A、B 矩阵保持 BF16 并接受梯度，量化底座不更新。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081229"/><stop offset="1" stop-color="#111b3d"/></linearGradient>
    <linearGradient id="frozen" x1="0" x2="1"><stop stop-color="#6257e8"/><stop offset="1" stop-color="#238bd1"/></linearGradient>
    <linearGradient id="train" x1="0" x2="1"><stop stop-color="#f1a51f"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90c8ff"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc857"/></marker>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f5f7ff" font-size="30" font-weight="700" font-family="sans-serif">QLoRA：存储是 4-bit，计算与学习不是 4-bit</text>
  <text x="60" y="101" fill="#9dafd3" font-size="17" font-family="sans-serif">以一个线性层为例：Y = X · dequant(W<tspan baseline-shift="sub" font-size="12">NF4</tspan>) + (α/r) · X · A · B</text>

  <g filter="url(#shadow)">
    <rect x="52" y="267" width="128" height="92" rx="18" fill="#15254d" stroke="#4f6b9f"/>
    <text x="116" y="305" text-anchor="middle" fill="#f4f7ff" font-size="22" font-weight="700" font-family="sans-serif">输入 X</text>
    <text x="116" y="334" text-anchor="middle" fill="#9fb1d8" font-size="15" font-family="sans-serif">BF16 激活</text>
  </g>

  <path d="M180 313H250" stroke="#90c8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="252" cy="313" r="10" fill="#cfdbf5"/><text x="252" y="319" text-anchor="middle" fill="#0a1430" font-size="17" font-family="sans-serif">×</text>

  <g filter="url(#shadow)">
    <rect x="280" y="159" width="240" height="205" rx="20" fill="#15254d" stroke="#665fe6" stroke-width="2"/>
    <rect x="300" y="181" width="200" height="78" rx="14" fill="url(#frozen)"/>
    <text x="400" y="214" text-anchor="middle" fill="white" font-size="21" font-weight="700" font-family="sans-serif">冻结底座 W</text>
    <text x="400" y="241" text-anchor="middle" fill="#e6e4ff" font-size="15" font-family="sans-serif">NF4 索引：4 bit / 权重</text>
    <rect x="300" y="277" width="94" height="59" rx="12" fill="#27376d"/>
    <rect x="406" y="277" width="94" height="59" rx="12" fill="#27376d"/>
    <text x="347" y="301" text-anchor="middle" fill="#bfcaf0" font-size="13" font-family="sans-serif">一级常数</text>
    <text x="347" y="322" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">FP8</text>
    <text x="453" y="301" text-anchor="middle" fill="#bfcaf0" font-size="13" font-family="sans-serif">二级常数</text>
    <text x="453" y="322" text-anchor="middle" fill="white" font-size="15" font-family="sans-serif">FP32</text>
  </g>
  <rect x="322" y="135" width="156" height="34" rx="17" fill="#3a316f" stroke="#8178ff"/>
  <text x="400" y="158" text-anchor="middle" fill="#dcd8ff" font-size="14" font-weight="700" font-family="sans-serif">🔒 不创建 ∂L/∂W</text>

  <path d="M520 313H578" stroke="#90c8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="590" y="244" width="192" height="138" rx="20" fill="#15365b" stroke="#4cb7e8" stroke-width="2"/>
    <text x="686" y="283" text-anchor="middle" fill="white" font-size="20" font-weight="700" font-family="sans-serif">doubleDequant</text>
    <text x="686" y="315" text-anchor="middle" fill="#a9daf7" font-size="15" font-family="sans-serif">先还原 scale</text>
    <text x="686" y="340" text-anchor="middle" fill="#a9daf7" font-size="15" font-family="sans-serif">再还原 W → BF16</text>
    <text x="686" y="365" text-anchor="middle" fill="#76e1d4" font-size="13" font-family="sans-serif">按算子/块临时执行</text>
  </g>
  <path d="M782 313H850" stroke="#90c8ff" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M116 359V486H250" fill="none" stroke="#ffc857" stroke-width="4" marker-end="url(#goldArrow)"/>
  <g filter="url(#shadow)">
    <rect x="280" y="433" width="500" height="135" rx="22" fill="#30251f" stroke="#f6b83d" stroke-width="2"/>
    <text x="310" y="466" fill="#ffdf92" font-size="17" font-weight="700" font-family="sans-serif">可训练 LoRA 旁路 · BF16</text>
    <rect x="310" y="488" width="147" height="53" rx="13" fill="url(#train)"/>
    <text x="384" y="521" text-anchor="middle" fill="#31200b" font-size="18" font-weight="700" font-family="sans-serif">A：d → r</text>
    <path d="M457 514H505" stroke="#ffc857" stroke-width="4" marker-end="url(#goldArrow)"/>
    <rect x="516" y="488" width="147" height="53" rx="13" fill="url(#train)"/>
    <text x="590" y="521" text-anchor="middle" fill="#31200b" font-size="18" font-weight="700" font-family="sans-serif">B：r → d'</text>
    <text x="688" y="510" fill="#ffe6aa" font-size="15" font-family="sans-serif">缩放</text>
    <text x="688" y="532" fill="white" font-size="17" font-family="sans-serif">α / r</text>
  </g>
  <path d="M780 514H890V351" fill="none" stroke="#ffc857" stroke-width="4" marker-end="url(#goldArrow)"/>

  <circle cx="887" cy="313" r="17" fill="#e5edff"/><text x="887" y="320" text-anchor="middle" fill="#142345" font-size="22" font-family="sans-serif">+</text>
  <path d="M904 313H960" stroke="#90c8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="974" y="267" width="165" height="92" rx="18" fill="#153653" stroke="#57c9d8"/>
    <text x="1057" y="305" text-anchor="middle" fill="white" font-size="22" font-weight="700" font-family="sans-serif">输出 Y</text>
    <text x="1057" y="334" text-anchor="middle" fill="#9fdfe7" font-size="15" font-family="sans-serif">BF16 计算</text>
  </g>

  <path d="M1057 375C1057 630 685 645 512 574" fill="none" stroke="#ff8f6b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#goldArrow)"/>
  <text x="808" y="626" text-anchor="middle" fill="#ffad91" font-size="16" font-weight="700" font-family="sans-serif">反向：梯度穿过反量化底座传播，但优化器只更新 A、B</text>

  <rect x="52" y="617" width="460" height="43" rx="12" fill="#111d3b" stroke="#334874"/>
  <circle cx="77" cy="638" r="7" fill="#675eea"/><text x="94" y="644" fill="#b5c2df" font-size="14" font-family="sans-serif">存储 dtype：NF4 / FP8 / FP32</text>
  <circle cx="291" cy="638" r="7" fill="#53c8d9"/><text x="308" y="644" fill="#b5c2df" font-size="14" font-family="sans-serif">计算 dtype：BF16</text>
  <circle cx="443" cy="638" r="7" fill="#ffc857"/><text x="460" y="644" fill="#b5c2df" font-size="14" font-family="sans-serif">可训练</text>
</svg>
