<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Constitutional AI 的 RLAIF 软标签、偏好模型与强化学习</title>
  <desc id="desc">SL-CAI 对红队提示生成两个候选回答。反馈模型依据随机抽取的宪法原则计算选择 A 或 B 的概率，形成软偏好标签。AI 无害性偏好和人类有用性偏好共同训练偏好模型，再以偏好模型分数和对 SL-CAI 参考策略的 KL 惩罚训练 RL-CAI。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="judge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 32px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .heading { font: 700 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 400 13px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 400 12px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .mono { font: 500 13px "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; fill: #334155; }
      .white { fill: #fff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .guide { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#purple); }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="58" y="54" class="title">RLAIF：AI 先给出概率偏好，RL 再优化被蒸馏后的 Preference Model</text>
  <text x="58" y="84" class="subtitle">Feedback Model 不直接充当每个 rollout 的在线奖励器；它先批量标注候选对，软标签被蒸馏进一个可重复调用的标量 PM。</text>

  <g transform="translate(58 126)" filter="url(#shadow)">
    <rect width="1284" height="296" rx="24" fill="#fff" stroke="#cbd5e1"/>
    <text x="26" y="40" class="heading">A. 生成一条 AI preference label</text>

    <g transform="translate(26 78)">
      <rect width="154" height="82" rx="16" fill="#fff7ed" stroke="#fb923c"/>
      <text x="77" y="32" text-anchor="middle" class="label">Red-team prompt</text>
      <text x="77" y="57" text-anchor="middle" class="small">x</text>
    </g>
    <path d="M180 119 H219" class="arrow"/>
    <g transform="translate(224 78)">
      <rect width="154" height="82" rx="41" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="77" y="32" text-anchor="middle" class="label">SL-CAI</text>
      <text x="77" y="57" text-anchor="middle" class="small">独立采样两次</text>
    </g>
    <path d="M378 119 H417" class="arrow"/>
    <g transform="translate(422 64)">
      <rect width="168" height="52" rx="13" fill="#ecfeff" stroke="#22d3ee"/>
      <text x="84" y="32" text-anchor="middle" class="label">Response A：yₐ</text>
      <rect y="68" width="168" height="52" rx="13" fill="#ecfeff" stroke="#22d3ee"/>
      <text x="84" y="100" text-anchor="middle" class="label">Response B：yᵦ</text>
    </g>
    <path d="M590 119 H629" class="arrow"/>

    <g transform="translate(634 58)">
      <rect width="260" height="134" rx="18" fill="url(#judge)"/>
      <text x="130" y="32" text-anchor="middle" class="heading white">Feedback Model</text>
      <text x="130" y="60" text-anchor="middle" class="small white">conversation + 随机原则 + A/B</text>
      <line x1="28" y1="76" x2="232" y2="76" stroke="#c4b5fd"/>
      <text x="130" y="100" text-anchor="middle" class="small white">log p("A")，log p("B")</text>
      <text x="130" y="121" text-anchor="middle" class="tiny white">可选：先生成 CoT 判断理由</text>
    </g>
    <path d="M894 119 H933" class="arrow"/>

    <g transform="translate(938 68)">
      <rect width="316" height="114" rx="16" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="158" y="30" text-anchor="middle" class="label">归一化为软标签</text>
      <text x="158" y="58" text-anchor="middle" class="mono">q = exp(ℓₐ) / [exp(ℓₐ)+exp(ℓᵦ)]</text>
      <text x="158" y="84" text-anchor="middle" class="small">保留“更偏向谁、确定到什么程度”</text>
      <text x="158" y="104" text-anchor="middle" class="tiny">CoT 实验主结果将极端概率夹到 0.4–0.6</text>
    </g>

    <rect x="224" y="224" width="1030" height="42" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="739" y="250" text-anchor="middle" class="small">每条比较随机抽一条 principle；论文观察到对 16 条原则做 ensemble 比固定使用单条原则更稳健。</text>
  </g>

  <g transform="translate(58 454)" filter="url(#shadow)">
    <rect width="610" height="310" rx="24" fill="#fff" stroke="#c4b5fd"/>
    <text x="26" y="40" class="heading">B. 把 human + AI preferences 蒸馏进同一个 PM</text>
    <rect x="26" y="70" width="218" height="76" rx="15" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="135" y="100" text-anchor="middle" class="label">135,296 人类比较</text>
    <text x="135" y="125" text-anchor="middle" class="small">helpfulness</text>
    <rect x="366" y="70" width="218" height="76" rx="15" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="475" y="100" text-anchor="middle" class="label">182,831 AI 比较</text>
    <text x="475" y="125" text-anchor="middle" class="small">harmlessness</text>
    <path d="M135 146 C135 180 244 174 268 201" class="arrow"/>
    <path d="M475 146 C475 180 366 174 342 201" class="arrow"/>
    <rect x="210" y="198" width="190" height="72" rx="36" fill="#6d28d9"/>
    <text x="305" y="228" text-anchor="middle" class="heading white">Hybrid PM</text>
    <text x="305" y="251" text-anchor="middle" class="small white">rφ(x, y) → scalar</text>
    <rect x="26" y="164" width="158" height="116" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="105" y="190" text-anchor="middle" class="tiny">软 Bradley–Terry</text>
    <text x="105" y="214" text-anchor="middle" class="tiny">pφ = σ(rₐ-rᵦ)</text>
    <text x="105" y="238" text-anchor="middle" class="tiny">L = CE(q, pφ)</text>
    <text x="105" y="262" text-anchor="middle" class="tiny">不是回归绝对道德分</text>
  </g>

  <g transform="translate(700 454)" filter="url(#shadow)">
    <rect width="642" height="310" rx="24" fill="#fff" stroke="#a7f3d0"/>
    <text x="26" y="40" class="heading">C. 后半程回到标准 RLHF 结构</text>
    <rect x="26" y="74" width="150" height="70" rx="35" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="101" y="103" text-anchor="middle" class="label">SL-CAI</text>
    <text x="101" y="126" text-anchor="middle" class="small">初始化 / ref</text>
    <path d="M176 109 H215" class="arrow"/>
    <rect x="220" y="74" width="164" height="70" rx="15" fill="#ecfdf5" stroke="#34d399"/>
    <text x="302" y="102" text-anchor="middle" class="label">Current policy πθ</text>
    <text x="302" y="126" text-anchor="middle" class="small">rollout response y</text>
    <path d="M384 109 H423" class="arrow"/>
    <rect x="428" y="74" width="188" height="70" rx="15" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="522" y="102" text-anchor="middle" class="label">Hybrid PM score</text>
    <text x="522" y="126" text-anchor="middle" class="small">rφ(x, y)</text>
    <path d="M522 144 V180" class="arrow"/>
    <rect x="112" y="180" width="416" height="62" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="320" y="206" text-anchor="middle" class="mono">J(θ) = E[rφ(x,y) − β KL(πθ || πSL-CAI)]</text>
    <text x="320" y="228" text-anchor="middle" class="small">PM 推动偏好提升，KL 抑制策略漂移与奖励钻空子</text>
    <path d="M320 242 V270" class="arrow"/>
    <rect x="238" y="262" width="164" height="36" rx="18" fill="#047857"/>
    <text x="320" y="286" text-anchor="middle" class="label white">RL-CAI</text>
  </g>

  <path d="M668 610 H700" class="guide"/>
  <text x="58" y="822" class="subtitle">最容易误解的一点：所谓 AI Feedback 是 preference labels 的来源变化，不是把宪法直接写成一个可微奖励函数，也不是让模型在部署时逐条朗读规则。</text>
</svg>
