<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 22px Arial, sans-serif; fill: #111827; }
      .label { font: 600 17px Arial, sans-serif; fill: #111827; }
      .text { font: 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .frame { stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .arrow-a { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#mA); }
      .arrow-b { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#mB); }
    </style>
    <marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Shared KV Follows Attention Type</text>
  <text x="60" y="92" class="subtitle">Gemma4 不是“随便借上一层”，而是按 attention type 分桶后，各自复用最近的未共享锚点层</text>

  <rect x="60" y="130" width="1080" height="560" class="frame" fill="#ffffff"/>

  <text x="100" y="185" class="section">sliding attention 桶</text>
  <rect x="100" y="225" width="170" height="88" rx="16" ry="16" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="126" y="262" class="label">Layer 4</text>
  <text x="126" y="290" class="text">sliding 锚点</text>

  <rect x="340" y="225" width="170" height="88" rx="16" ry="16" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="366" y="262" class="label">Layer 6</text>
  <text x="366" y="290" class="text">shared sliding</text>

  <rect x="580" y="225" width="170" height="88" rx="16" ry="16" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="606" y="262" class="label">Layer 8</text>
  <text x="606" y="290" class="text">shared sliding</text>

  <rect x="820" y="225" width="210" height="88" rx="16" ry="16" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="848" y="262" class="label">复用同一份 KV</text>
  <text x="848" y="290" class="text">K4 / V4</text>

  <path d="M270 269 C320 269, 320 269, 340 269" class="arrow-a"/>
  <path d="M270 269 C450 200, 700 200, 820 269" class="arrow-a"/>
  <path d="M510 269 C620 340, 730 340, 820 269" class="arrow-a"/>
  <path d="M750 269 C780 269, 790 269, 820 269" class="arrow-a"/>

  <text x="100" y="365" class="small">规则：sliding 层只向 sliding 类型中最近的未共享层借 K / V。</text>

  <text x="100" y="455" class="section">full attention 桶</text>
  <rect x="100" y="495" width="170" height="88" rx="16" ry="16" fill="#dcfce7" stroke="#86efac"/>
  <text x="126" y="532" class="label">Layer 5</text>
  <text x="126" y="560" class="text">full 锚点</text>

  <rect x="340" y="495" width="170" height="88" rx="16" ry="16" fill="#ecfccb" stroke="#a3e635"/>
  <text x="366" y="532" class="label">Layer 9</text>
  <text x="366" y="560" class="text">shared full</text>

  <rect x="580" y="495" width="170" height="88" rx="16" ry="16" fill="#ecfccb" stroke="#a3e635"/>
  <text x="606" y="532" class="label">Layer 11</text>
  <text x="606" y="560" class="text">shared full</text>

  <rect x="820" y="495" width="210" height="88" rx="16" ry="16" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="848" y="532" class="label">复用同一份 KV</text>
  <text x="848" y="560" class="text">K5 / V5</text>

  <path d="M270 539 C320 539, 320 539, 340 539" class="arrow-b"/>
  <path d="M270 539 C450 470, 700 470, 820 539" class="arrow-b"/>
  <path d="M510 539 C620 610, 730 610, 820 539" class="arrow-b"/>
  <path d="M750 539 C780 539, 790 539, 820 539" class="arrow-b"/>

  <text x="100" y="635" class="small">规则：full 层只向 full 类型中的锚点层借 K / V，和 sliding 桶彼此独立。</text>
  <text x="760" y="655" class="small">结论：共享是“按类型复用”，不是“所有后层共用一套 KV”。</text>
</svg>
